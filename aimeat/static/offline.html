<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#ff69b4"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml"/>
  <title>Offline — AIMEAT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #f0e6ff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(168, 85, 247, .12) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(236, 72, 153, .1) 0%, transparent 50%);
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      background: rgba(30, 20, 45, .65);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(192, 132, 252, .2);
      border-radius: 28px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 100px rgba(168, 85, 247, .1),
        0 0 40px rgba(236, 72, 153, .06),
        0 4px 32px rgba(0, 0, 0, .2);
      animation: cardIn .8s cubic-bezier(.16, 1, .3, 1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .brand {
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: rgba(216, 180, 254, .6);
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #f0abfc, #f9a8d4, #fda4af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .msg {
      color: #c4b5d4;
      font-size: 1rem;
      margin-bottom: 28px;
      line-height: 1.7;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      text-decoration: none;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(192, 132, 252, .3);
    }
    .btn:active {
      transform: translateY(0);
    }
    .retry-info {
      margin-top: 16px;
      font-size: .8rem;
      color: rgba(167, 139, 250, .5);
    }
    .countdown {
      color: #c084fc;
      font-variant-numeric: tabular-nums;
    }
    .tagline {
      position: relative;
      z-index: 1;
      margin-top: 24px;
      font-size: .75rem;
      color: rgba(216, 180, 254, .3);
      letter-spacing: .08em;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">&#x1F4E1;</div>
  <p class="brand">AIME AT</p>
  <h1>You're Offline</h1>
  <p class="msg">
    It looks like your connection is temporarily unavailable.<br/>
    Don't worry — your queued actions will sync automatically when you're back online.
  </p>
  <button class="btn" onclick="tryAgain()">Try Again</button>
  <p class="retry-info">
    Auto-retry in <span class="countdown" id="countdown">30</span>s
  </p>
</div>

<p class="tagline">AI Memory Exchange &amp; Action Transfer</p>

<script>
  let seconds = 30;
  const countdownEl = document.getElementById('countdown');

  function tryAgain() {
    window.location.reload();
  }

  setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      tryAgain();
    } else {
      countdownEl.textContent = seconds;
    }
  }, 1000);

  // Also retry when the browser comes back online
  window.addEventListener('online', () => {
    setTimeout(tryAgain, 1000);
  });
</script>
</body>
</html>

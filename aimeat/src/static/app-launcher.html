<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <title>My Apps — AIMEAT</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --text: #f0e6ff;
      --accent: #e94560;
      --accent2: #0f3460;
      --surface-glass: rgba(30, 20, 45, .55);
      --border-subtle: rgba(192, 132, 252, .15);
      --border-hover: rgba(192, 132, 252, .35);
      --text-muted: rgba(196, 181, 212, .7);
      --text-dim: rgba(216, 180, 254, .4);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: .25s cubic-bezier(.16, 1, .3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(168, 85, 247, .10) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(233, 69, 96, .07) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(15, 52, 96, .12) 0%, transparent 60%);
      z-index: 0;
      pointer-events: none;
    }

    /* ── Header ─────────────────────────────────────── */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(26, 26, 46, .85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f0abfc, #e94560, #f9a8d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #search-input {
      flex: 1;
      min-width: 160px;
      background: var(--surface-glass);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      color: var(--text);
      font-size: .9rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    #search-input::placeholder {
      color: var(--text-dim);
    }

    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(233, 69, 96, .15);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-glass);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      transition: border-color var(--transition), transform var(--transition),
                  box-shadow var(--transition), background var(--transition);
      user-select: none;
    }

    .icon-btn:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
      background: rgba(30, 20, 45, .8);
    }

    .icon-btn:active {
      transform: translateY(0);
    }

    #add-btn {
      background: linear-gradient(135deg, var(--accent), #c53a50);
      border-color: transparent;
      font-weight: 700;
      font-size: 1.4rem;
    }

    #add-btn:hover {
      box-shadow: 0 4px 20px rgba(233, 69, 96, .35);
      border-color: transparent;
      background: linear-gradient(135deg, #f05575, #e94560);
    }

    /* ── Tag Bar ────────────────────────────────────── */

    #tag-bar {
      position: relative;
      z-index: 1;
      padding: 12px 24px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    #tag-bar::-webkit-scrollbar {
      display: none;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      background: var(--surface-glass);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: .8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition);
      user-select: none;
    }

    .tag:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }

    .tag.active {
      background: linear-gradient(135deg, var(--accent), #c53a50);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }

    /* ── App Grid ───────────────────────────────────── */

    #app-grid {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 8px 24px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      align-content: start;
    }

    .app-card {
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color var(--transition), transform var(--transition),
                  box-shadow var(--transition);
      position: relative;
      text-align: center;
      animation: cardIn .5s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .app-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, .25),
        0 0 48px rgba(168, 85, 247, .06);
    }

    .app-card:active {
      transform: translateY(-1px);
    }

    .app-card .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      background: linear-gradient(135deg, var(--accent2), rgba(15, 52, 96, .6));
      border: 1px solid rgba(192, 132, 252, .1);
      flex-shrink: 0;
    }

    .app-card .app-name {
      font-size: .85rem;
      font-weight: 600;
      line-height: 1.3;
      word-break: break-word;
    }

    .app-card .app-source {
      font-size: .7rem;
      color: var(--text-dim);
    }

    .app-card .fav-star {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: .85rem;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .app-card:hover .fav-star,
    .app-card .fav-star.visible {
      opacity: 1;
    }

    /* ── Empty State ────────────────────────────────── */

    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      text-align: center;
      color: var(--text-dim);
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: .5;
    }

    .empty-state p {
      font-size: .95rem;
      line-height: 1.6;
      max-width: 320px;
    }

    /* ── Footer ─────────────────────────────────────── */

    footer {
      position: relative;
      z-index: 1;
      padding: 14px 24px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #stats {
      font-size: .75rem;
      color: var(--text-dim);
      letter-spacing: .04em;
    }

    .footer-brand {
      font-size: .7rem;
      color: rgba(216, 180, 254, .25);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* ── Modal Overlay ──────────────────────────────── */

    #modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(10, 10, 18, .7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #modal-overlay[hidden] {
      display: none;
    }

    .modal {
      background: rgba(22, 33, 62, .92);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow:
        0 0 80px rgba(168, 85, 247, .08),
        0 4px 40px rgba(0, 0, 0, .3);
      animation: cardIn .4s cubic-bezier(.16, 1, .3, 1);
    }

    .modal h2 {
      font-size: 1.15rem;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #f0abfc, #e94560);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Iframe View ────────────────────────────────── */

    #iframe-view {
      position: fixed;
      inset: 0;
      z-index: 600;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    #iframe-view[hidden] {
      display: none;
    }

    #iframe-view .iframe-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(26, 26, 46, .9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
    }

    #iframe-view .iframe-toolbar .iframe-title {
      flex: 1;
      font-size: .85rem;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #iframe-view iframe {
      flex: 1;
      border: none;
      width: 100%;
    }

    /* ── Responsive ─────────────────────────────────── */

    @media (max-width: 480px) {
      header {
        padding: 12px 16px;
        gap: 10px;
      }

      header h1 {
        font-size: 1.1rem;
      }

      #search-input {
        min-width: 0;
        order: 3;
        flex-basis: 100%;
      }

      #tag-bar {
        padding: 10px 16px;
      }

      #app-grid {
        padding: 8px 16px 20px;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }

      footer {
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>My Apps</h1>
    <input type="text" id="search-input" placeholder="Search apps..." autocomplete="off" spellcheck="false"/>
    <div class="header-actions">
      <button class="icon-btn" id="add-btn" title="Add app">+</button>
      <button class="icon-btn" id="settings-btn" title="Settings">&#x2699;</button>
    </div>
  </header>

  <nav id="tag-bar"></nav>

  <main id="app-grid"></main>

  <footer>
    <span id="stats">0 apps</span>
    <span class="footer-brand">AIMEAT</span>
  </footer>

  <div id="modal-overlay" hidden></div>

  <div id="iframe-view" hidden>
    <div class="iframe-toolbar">
      <button class="icon-btn" onclick="window._launcher.closeIframe()" title="Close">&#x2715;</button>
      <span class="iframe-title" id="iframe-title"></span>
      <button class="icon-btn" onclick="window._launcher.openExternal()" title="Open in new tab">&#x2197;</button>
    </div>
    <iframe id="app-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>

<script>
(function () {
  'use strict';

  // ── IndexedDB wrapper ──────────────────────────────

  const DB_NAME = 'AppLauncherDB';
  const DB_VERSION = 1;
  const STORE_NAME = 'apps';

  function openDB() {
    return new Promise(function (resolve, reject) {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = function (event) {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          store.createIndex('tags', 'tags', { multiEntry: true });
          store.createIndex('source', 'source', { unique: false });
          store.createIndex('favorite', 'favorite', { unique: false });
        }
      };

      request.onsuccess = function (event) {
        resolve(event.target.result);
      };

      request.onerror = function (event) {
        reject(event.target.error);
      };
    });
  }

  function getAllApps() {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();

        request.onsuccess = function () {
          resolve(request.result);
        };
        request.onerror = function () {
          reject(request.error);
        };
      });
    });
  }

  function saveApp(app) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const request = store.put(app);

        request.onsuccess = function () {
          resolve(request.result);
        };
        request.onerror = function () {
          reject(request.error);
        };
      });
    });
  }

  function deleteApp(id) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const request = store.delete(id);

        request.onsuccess = function () {
          resolve();
        };
        request.onerror = function () {
          reject(request.error);
        };
      });
    });
  }

  // ── Config (localStorage) ─────────────────────────

  const DEFAULT_CONFIG = {
    theme: 'dark',
    defaultOpenMode: 'tab',
    aimeatUrl: '',
    language: 'en'
  };

  function loadConfig() {
    try {
      return Object.assign({}, DEFAULT_CONFIG, JSON.parse(localStorage.getItem('appLauncherConfig') || '{}'));
    } catch (e) {
      return Object.assign({}, DEFAULT_CONFIG);
    }
  }

  function saveConfig(config) {
    localStorage.setItem('appLauncherConfig', JSON.stringify(config));
  }

  // ── Rendering (placeholder) ───────────────────────

  function renderApps() {
    // Placeholder — will be implemented in Task 3
  }

  // ── Iframe helpers ────────────────────────────────

  var currentIframeUrl = '';

  function closeIframe() {
    var view = document.getElementById('iframe-view');
    var iframe = document.getElementById('app-iframe');
    view.hidden = true;
    iframe.src = 'about:blank';
    currentIframeUrl = '';
  }

  function openExternal() {
    if (currentIframeUrl) {
      window.open(currentIframeUrl, '_blank');
    }
  }

  // ── Public API ────────────────────────────────────

  window._launcher = {
    openDB: openDB,
    getAllApps: getAllApps,
    saveApp: saveApp,
    deleteApp: deleteApp,
    loadConfig: loadConfig,
    saveConfig: saveConfig,
    renderApps: renderApps,
    closeIframe: closeIframe,
    openExternal: openExternal,
    setCurrentIframeUrl: function (url) { currentIframeUrl = url; }
  };

  // ── Bootstrap ─────────────────────────────────────

  document.addEventListener('DOMContentLoaded', function () {
    renderApps();
  });

})();
</script>
</body>
</html>

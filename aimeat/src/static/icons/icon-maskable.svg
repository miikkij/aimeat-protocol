    <path d="M0 40 C0 40 -80 -25 -80 -55 C-80 -90 -45 -100 -22 -90 C-9 -84 0 -72 0 -72 C0 -72 9 -84 22 -90 C45 -100 80 -90 80 -55 C80 -25 0 40 0 40 Z"
          fill="url(#heart)" opacity="0.9"/>
    <!-- AI circuit dots -->
    <circle cx="-26" cy="-50" r="5" fill="#fff" opacity="0.8"/>
    <circle cx="26" cy="-50" r="5" fill="#fff" opacity="0.8"/>
    <circle cx="0" cy="-27" r="5" fill="#fff" opacity="0.8"/>
    <line x1="-26" y1="-50" x2="0" y2="-27" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <line x1="26" y1="-50" x2="0" y2="-27" stroke="#fff" stroke-width="2" opacity="0.5"/>
  </g>
  <text x="256" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="42" fill="#f0abfc" letter-spacing="5">AIMEAT</text>
</svg>

    <circle cx="30" cy="-55" r="6" fill="#fff" opacity="0.8"/>
    <circle cx="0" cy="-30" r="6" fill="#fff" opacity="0.8"/>
    <line x1="-30" y1="-55" x2="0" y2="-30" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <line x1="30" y1="-55" x2="0" y2="-30" stroke="#fff" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- AIMEAT text -->
  <text x="256" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="48" fill="#f0abfc" letter-spacing="6">AIMEAT</text>

# AIMEAT node on PostgreSQL + Kysely — the primary production backend.
# Schema is created/updated on boot by the node's own SQL migration runner.
#   AIMEAT_ADMIN_PASSWORD=<a password of your own> docker compose up --build
# SQLite variant (no external DB): docker-compose.sqlite.yml
#
# AIMEAT_ADMIN_PASSWORD has no default: the admin password creates the node's first operator, and a
# default every copy of this file shares let anyone who reached the port do that first. Put it in a
# .env file next to this one or in the shell. The node's start log prints a one-time setup code; the
# setup wizard asks for it, because a request from outside the container is not from this machine.
# (secaudit2026oct22)
services:
  aimeat:
    build: .
    ports:
      - "${AIMEAT_PORT:-40050}:40050"
    environment:
      - AIMEAT_PORT=40050
      - AIMEAT_NODE_ID=${AIMEAT_NODE_ID:-aimeat-local-001-dev}
      - AIMEAT_ADMIN_PASSWORD=${AIMEAT_ADMIN_PASSWORD:?Set AIMEAT_ADMIN_PASSWORD to a password of your own, in a .env file next to docker-compose.yml or in the shell}
      - AIMEAT_STORAGE=postgres-kysely
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dbuser}:${POSTGRES_PASSWORD:-dbpassword}@postgres:5432/${POSTGRES_DB:-aimeat}
      - AIMEAT_WELCOME_BONUS=${AIMEAT_WELCOME_BONUS:-100}
      - AIMEAT_DAILY_ALLOWANCE=${AIMEAT_DAILY_ALLOWANCE:-50}
      - AIMEAT_DAILY_ALLOWANCE_CAP=${AIMEAT_DAILY_ALLOWANCE_CAP:-500}
      - AIMEAT_BURN_RATE=${AIMEAT_BURN_RATE:-0.10}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    # The node reaches the database over the compose network and needs no published port. It is
    # published on this machine's loopback address only, so a developer's test runs can use it
    # (scripts/machine-check.ts), and the default account is not open to the network.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword}
      POSTGRES_DB: ${POSTGRES_DB:-aimeat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbuser} -d ${POSTGRES_DB:-aimeat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

services:
  aimeat:
    build: .
    ports:
      - "${AIMEAT_PORT:-40050}:40050"
    environment:
      - AIMEAT_PORT=40050
      - AIMEAT_NODE_ID=${AIMEAT_NODE_ID:-aimeat-local-001-dev}
      - AIMEAT_ADMIN_PASSWORD=${AIMEAT_ADMIN_PASSWORD:-TestAdminPw123!}
      - DATABASE_URL=mongodb://dbuser:dbpassword@mongo:27017/AIMEAT?replicaSet=myReplicaSet&authSource=admin
      - AIMEAT_WELCOME_BONUS=${AIMEAT_WELCOME_BONUS:-100}
      - AIMEAT_DAILY_ALLOWANCE=${AIMEAT_DAILY_ALLOWANCE:-50}
      - AIMEAT_DAILY_ALLOWANCE_CAP=${AIMEAT_DAILY_ALLOWANCE_CAP:-500}
      - AIMEAT_BURN_RATE=${AIMEAT_BURN_RATE:-0.10}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbuser
      MONGO_INITDB_ROOT_PASSWORD: dbpassword
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:

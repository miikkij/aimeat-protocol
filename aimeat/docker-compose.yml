services:
  aimeat:
    build: .
    ports:
      - "${MEAT_PORT:-40050}:40050"
    environment:
      - MEAT_PORT=40050
      - MEAT_NODE_ID=${MEAT_NODE_ID:-meat-local-001-dev}
      - MEAT_ADMIN_PASSWORD=${MEAT_ADMIN_PASSWORD:-TestAdminPw123!}
      - DATABASE_URL=mongodb://dbuser:dbpassword@mongo:27017/AIMEAT?replicaSet=myReplicaSet&authSource=admin
      - MEAT_WELCOME_BONUS=${MEAT_WELCOME_BONUS:-100}
      - MEAT_DAILY_ALLOWANCE=${MEAT_DAILY_ALLOWANCE:-50}
      - MEAT_DAILY_ALLOWANCE_CAP=${MEAT_DAILY_ALLOWANCE_CAP:-500}
      - MEAT_BURN_RATE=${MEAT_BURN_RATE:-0.10}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    command: ["--replSet", "myReplicaSet", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbuser
      MONGO_INITDB_ROOT_PASSWORD: dbpassword
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "dbuser", "-p", "dbpassword", "--authenticationDatabase", "admin", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({ _id: 'myReplicaSet', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data:

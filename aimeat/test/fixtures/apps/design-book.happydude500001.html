      };

      // 22 · BOSS: phases on health, named patterns, the lag bar, the ending once.
      var bossDemo = {
        id: 'boss', title: 'The boss fight', sub: 'phases on health, named patterns (move, dash, telegraph, fire, spawn, slam), a lag bar across the top, the ending once',
        note: 'boss(scene, spec) owns the order and the clock; the game owns its shots and minions through onFire and onSpawn. Two phases here: a sweep with aimed shots, then a barrage, a slam and two minions. Arrows move you; press the button to hit it.',
        code: [
          'const b = AIMEAT.phaser.boss(this, { actor: walker, health: 120, name: "The Walker", patterns, phases, onFire, onSpawn });',
          'patterns.sweep = [{ move: { to: "left", ms: 700 } }, { telegraph: { ms: 350, kind: "line" } }, { fire: { kind: "aimed", speed: 300 } }];',
          'b.target(hero.sprite); b.start(); b.on("defeat", () => AIMEAT.phaser.toast(this, "Down"));',
        ].join('\n'),
        fixed: true,
        boot: function () {
          var b = null; var shots = null;
          var scene = {
            key: 'boss',
            create: function () {
              var sc = this; var w = sc.scale.width, hgt = sc.scale.height;
              var pad = P.controls(sc, { touch: 'auto' });
              var hero = P.actor(sc, { key: P.spriteSheet(sc, { kind: 'hero' }).key, x: w * 0.2, y: hgt * 0.8, mode: 'topdown' });
              var walker = P.actor(sc, { key: P.spriteSheet(sc, { kind: 'walker' }).key, x: w / 2, y: hgt * 0.3, mode: 'topdown', scale: 3, invulnerableMs: 0 });
              P.spriteSheet(sc, { kind: 'slime' });
              shots = sc.physics.add.group();
              P.textures.shapes(sc, [{ key: 'shot', width: 10, height: 10, draw: function (g, look) { g.fillStyle(look.accent, 1).fillCircle(5, 5, 5); } }]);
              b = P.boss(sc, { actor: walker, health: 120, name: 'The Walker',
                patterns: {
                  sweep: [{ move: { to: 'left', ms: 700 } }, { telegraph: { ms: 350, kind: 'line' } }, { fire: { kind: 'aimed', speed: 300 } }, { move: { to: 'right', ms: 700 } }, { telegraph: { ms: 350, kind: 'line' } }, { fire: { kind: 'aimed', speed: 300 } }],
                  barrage: [{ telegraph: { ms: 500, kind: 'ring' } }, { fire: { kind: 'ring', count: 12, speed: 220 } }, { slam: { ms: 700 } }, { spawn: { kind: 'imp', count: 2, at: 'sides' } }, { wait: 400 }],
                },
                phases: [{ at: 1, name: 'Sweep', patterns: ['sweep'] }, { at: 0.5, name: 'Fury', patterns: ['barrage', 'sweep'], speed: 1.3, invulnerableMs: 800, enter: [{ telegraph: { ms: 600, kind: 'flash' } }] }],
                onFire: function (o, angles) {
                  angles.forEach(function (a) { var s = shots.create(o.x, o.y, 'shot'); sc.physics.velocityFromRotation(a, o.speed, s.body.velocity); sc.time.delayedCall(3000, function () { s.destroy(); }); });
                  if (ARCADE.bus) ARCADE.bus.synth('beep');
                },
                onSpawn: function (x, y) { var imp = sc.physics.add.sprite(x, y, 'slime'); imp.play('slime-walk'); sc.physics.moveToObject(imp, hero.sprite, 60); sc.time.delayedCall(6000, function () { imp.destroy(); }); },
              });
              b.target(hero.sprite); b.start();
              b.on('phase', function (name) { P.toast(sc, name); });
              b.on('defeat', function () { P.toast(sc, 'The Walker is down'); if (ARCADE.bus) ARCADE.bus.synth('win'); });
              sc.events.on('update', function () { pad.update(); hero.drive((pad.right ? 200 : 0) - (pad.left ? 200 : 0), (pad.down ? 200 : 0) - (pad.up ? 200 : 0)); });
            },
          };
          return P.game({ parent: stage, width: STAGE_SIZES[ARCADE.size][0], height: STAGE_SIZES[ARCADE.size][1], scale: 'fit', fullscreen: 'button', physics: 'arcade', pixelArt: true, scenes: [scene] }).then(function (h) {
            bus(h);
            side.hidden = false;
            side.appendChild(K.el('div', { class: 'db-arcade__board' }, [K.el('h3', {}, 'Boss'), K.el('p', { class: 'ak-section__hint' }, 'Halfway down it changes phase.'), buttonRow([['Hit the boss', function () { b.damage(12); if (ARCADE.bus) ARCADE.bus.synth('hit'); }]])]));
            return h;
          });
        },
      };

      // 23 · ENEMY AI: behaviours and rules on the actor, A* on the tile grid.
      var aiDemo = {
        id: 'ai', title: 'Enemies that think', sub: 'patrol, wander, guard, chase, flee, shoot, ambush, orbit on the actor; rules by sight, hearing, memory and health; A* and flow fields on a tile grid',
        note: 'brain(scene, actor, "walker") is a state machine on top of the actor: built-in behaviours, rules like { from: "patrol", to: "chase", when: "sees" }, perception with sight, hearing and memory. brain.noise(x, y) wakes guards. Debug draws sight, path and state.',
        code: [
          'const mind = AIMEAT.phaser.brain(this, foe, { archetype: "walker", target: hero, sight: 220, onShoot: fire });',
          'AIMEAT.phaser.brain(this, guard, { start: "guard", rules: [{ from: "guard", to: "chase", when: ["sees", "heard"] }, { from: "chase", to: "guard", when: "lost" }], target: hero });',
          'const path = AIMEAT.phaser.pathfind.findPath(world.grid(), from, to, { diagonal: true });   AIMEAT.phaser.brain.noise(x, y, 300);',
        ].join('\n'),
        fixed: true,
        boot: function () {
          var minds = []; var dbg = false; var hero = null; var sc = null;
          var scene = {
            key: 'minds',
            create: function () {
              sc = this; var w = sc.scale.width, hgt = sc.scale.height;
              ['hero', 'slime', 'bat', 'walker'].forEach(function (kind) { P.spriteSheet(sc, { kind: kind }); });
              P.textures.tiles(sc, { size: 32 });
              P.textures.shapes(sc, [{ key: 'ak-shot', width: 6, height: 6, draw: function (g, look) { g.fillStyle(look.err, 1).fillCircle(3, 3, 3); } }]);
              var ground = sc.physics.add.staticGroup();
              ground.create(w / 2, hgt - 16, 'tile-ground').setDisplaySize(w, 32).refreshBody();
              ground.create(w * 0.72, hgt * 0.55, 'tile-brick').setDisplaySize(w * 0.3, 24).refreshBody();
              var pad = P.controls(sc, { touch: 'auto' });
              hero = P.actor(sc, { key: 'hero', x: 80, y: hgt - 60 });
              var foes = [P.actor(sc, { key: 'slime', x: w * 0.4, y: hgt - 50, speed: 50 }), P.actor(sc, { key: 'bat', x: w * 0.55, y: hgt * 0.25, speed: 90, mode: 'topdown', collideWorldBounds: true }), P.actor(sc, { key: 'walker', x: w * 0.75, y: hgt * 0.5 - 40, speed: 60 })];
              foes[1].sprite.body.setAllowGravity(false);
              sc.physics.add.collider([hero.sprite].concat(foes.map(function (f) { return f.sprite; })), ground);
              var shots = sc.add.group();
              var fire = function (from, angle) {
                var s = sc.physics.add.image(from.x, from.y, 'ak-shot');
                s.body.setAllowGravity(false); s.setVelocity(Math.cos(angle) * 260, Math.sin(angle) * 260); shots.add(s);
                if (ARCADE.bus) ARCADE.bus.synth('beep');

              };
              minds = ['slime', 'bat', 'walker'].map(function (a, i) { return P.brain(sc, foes[i], { archetype: a, target: hero, sight: 220, onShoot: fire }); });
              sc.physics.add.overlap(hero.sprite, foes.map(function (f) { return f.sprite; }), function () { if (hero.hit() && ARCADE.bus) ARCADE.bus.synth('hit'); });
              sc.events.on('update', function () { pad.update(); hero.update(pad); });
            },
          };
          return P.game({ parent: stage, width: STAGE_SIZES[ARCADE.size][0], height: STAGE_SIZES[ARCADE.size][1], scale: 'fit', fullscreen: 'button', physics: 'arcade', gravity: { y: 900 }, pixelArt: true, scenes: [scene] }).then(function (h) {
            bus(h);
            side.hidden = false;
            side.appendChild(K.el('div', { class: 'db-arcade__board' }, [K.el('h3', {}, 'Three minds'), K.el('p', { class: 'ak-section__hint' }, 'The slime patrols, the bat wanders until it sees you, the walker shoots on sight. Walk close.'), buttonRow([
              ['Debug', function () { dbg = !dbg; minds.forEach(function (m) { m.debug(dbg); }); }],
              ['Make a noise', function () { P.brain.noise(hero.sprite.x, hero.sprite.y, 400, sc); if (ARCADE.bus) ARCADE.bus.synth('select'); }],
            ])]));
            return h;
          });
        },
      };

      return [bounce, menus, platform, audioDemo, packsDemo, juiceDemo, assetsDemo, editorDemo, mobileDemo, playtestDemo, fxDemo, parallaxDemo, daynightDemo, designerDemo, spritesDemo, worldmapDemo, chiptuneDemo, tileworldDemo, statusDemo, trophiesDemo, dialogueDemo, bossDemo, aiDemo];
    }

    /** The kit-primitives shelf: the five moves shown bare, then the four parts built on them. */
    function buildPrimitiveDemos(wall) {

      spCard.appendChild(spBtn);

      // inView: a counter that starts the moment its card scrolls into view

    /** The shelf: every visible part under its kind's heading, the open one marked. */
    function refreshShelf(session) {
      var host = ui.shelfBody;
      if (!host) return;
      while (host.firstChild) host.removeChild(host.firstChild);
      var visible = visibleParts();
      var shown = 0;
      GROUPS.forEach(function (group) {
        var mine = visible.filter(function (p) { return p.kind === group.kind; });
        if (!mine.length) return;
        shown += mine.length;
        var head = document.createElement('h2');
        head.className = 'db-group__title';
        head.textContent = dbText(group.label);
        var count = document.createElement('span');
        count.className = 'db-group__count';
        count.textContent = String(mine.length);
        head.appendChild(count);
        host.appendChild(head);
        var hint = document.createElement('p');
        hint.className = 'db-group__hint';
        hint.textContent = dbText(group.hint);
        host.appendChild(hint);
        mine.forEach(function (p) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'db-part';
          b.setAttribute('data-pid', p.id);
          if (state.picked && state.picked.id === p.id) b.setAttribute('aria-current', 'true');
          // The monogram tile: a deterministic mark per part (initial + a wash cycled from the
          // accent spectrum by id), so rows tell apart at a glance without rendering previews.
          var tile = document.createElement('span');
          var hash = 0;
          for (var ci = 0; ci < p.id.length; ci++) hash = (hash * 31 + p.id.charCodeAt(ci)) >>> 0;
          tile.className = 'db-part__tile db-part__tile--' + (hash % 3);
          tile.setAttribute('aria-hidden', 'true');
          tile.textContent = (p.title || '?').charAt(0).toUpperCase();
          b.appendChild(tile);
          var name = document.createElement('span');
          name.className = 'db-part__name';
          name.textContent = p.title;
          b.appendChild(name);
          if (p.status !== 'published') {
            var st = document.createElement('span');
            st.className = 'db-part__status';
            st.textContent = p.status;
            b.appendChild(st);
          }
          b.addEventListener('click', function () { openPart(p.id, session); });
          host.appendChild(b);
        });
      });
      if (!shown) {
        var bareShelf = state.kind === 'component' && !state.q;
        K.emptyState({ target: host, tone: 'quiet',
          title: bareShelf ? dbText('No app has offered a component yet.') : dbText('Nothing matched'),
          hint: bareShelf ? dbText('One appears when an app makes a piece by hand and its owner says the app turned out well.')
            : dbText('Try another word, or clear the search.') });

    // SPA, for real: picking a part touches ONLY the picked-row highlight and the stage.
    // The list DOM (and its scroll position) stays exactly where the hand left it — the
    // full-shelf rebuild on every click was what read as "the whole thing refreshes".
    function markPicked(id) {
      var rows = ui.shelfBody ? ui.shelfBody.querySelectorAll('.db-part') : [];
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].getAttribute('data-pid') === id) rows[i].setAttribute('aria-current', 'true');
        else rows[i].removeAttribute('aria-current');
      }
    }

    function usageLine(part, used) {
      // A component is copied, never written into an app, so "adopted" would contradict the
      // sentence its own use panel carries. Every other kind keeps the word it has always had.
      if (part.kind === 'component') {
        return part.summary + ' · '
          + (used > 0 ? dbText('Taken ') + used + (used === 1 ? dbText(' time') : dbText(' times')) : dbText('Not taken yet'));
      }
      return part.summary + ' · '
        + (used > 0 ? dbText('Adopted ') + used + (used === 1 ? dbText(' time') : dbText(' times')) : dbText('Not adopted yet'));
    }

    var partRequest = 0;
    /**
     * The light the room is in, as the preview route spells it.
     */
    function roomTheme() {
      return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }

    /**
     * A part's preview address. A COMPONENT is markup under the kit's tokens rather than a page
     * with a look of its own, so it is asked for in the light the reader is sitting in: the
     * preview is another document and cannot be reached into. A node that does not read the
     * parameter yet serves the page it always served, so this is safe to send everywhere.
     * Every other kind is asked for exactly as before.
     */
    function previewHref(part) {
      var base = '/v1/designbook/' + encodeURIComponent(part.id) + '/preview';
      return part.kind === 'component' ? base + '?theme=' + roomTheme() : base;
    }

    /**
     * When the room's light changes with a component open, the frame and its full-screen link
     * are asked again at the new address. One watcher for the session.
     */
    function watchRoomLight() {
      if (ui.lightWatch || typeof MutationObserver !== 'function') return;
      ui.lightWatch = new MutationObserver(function () {
        var id = null;
        var frame = document.querySelector('.db-preview-frame[data-db-themed]');
        if (frame) {
          id = frame.getAttribute('data-db-themed');
          var next = previewHref({ id: id, kind: 'component' });
          if (frame.getAttribute('src') !== next) frame.setAttribute('src', next);
        }
        var link = document.querySelector('.db-device-controls a[data-db-themed]');
        if (link) link.setAttribute('href', previewHref({ id: link.getAttribute('data-db-themed'), kind: 'component' }));
      });
      ui.lightWatch.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }

    var galleryScroll = 0;

    function backToShelf() {
      partRequest++;
      state.picked = null;
      if (ui.adopt) { ui.adopt.el.hidden = true; ui.adopt.el.style.display = 'none'; }

      showWelcome();
      a.main.scrollTop = galleryScroll;

    // ── THE COMPONENTS PAGE: every kit part, ALIVE, on one wall. This is the shop window —

    var COMPS = null; // handles, for cleanup when leaving the tab

    // below reads the titles instead of a hand-kept list beside them. The list was hand-kept
    // until 2026-09-05, and by then it had gone stale enough to warn every visitor about seven
    // parts that were already on the wall in front of them.

    // Every card says what a builder may change in that part WITHOUT forking it. The answer

    // module's own JSDoc, so the line on the wall and the line in the source cannot disagree.
    // A card whose part the kit does not describe yet simply has no line, rather than a
    // reassuring blank one.
    function mineLine(ids) {
      if (!K.describe) return null;
      var seen = {};
      var blocks = [];
      ids.forEach(function (id) {
        if (seen[id]) return;
        seen[id] = true;
        var d = K.describe(id);
        if (!d) return;
        blocks.push(d);

        if (d.variants.length) bits.push(['variants', d.variants.join(', ')]);
        if (d.tokens.length) bits.push(['tokens', d.tokens.join(', ')]);

          f.className = 'db-mine__fork';
          f.textContent = dbText('fork it: ') + d.fork;

    function compCard(host, title, sub, wide, shows) {
      var card = document.createElement('section');
      card.className = 'db-comp' + (wide ? ' db-comp--wide' : '');
      card.innerHTML = '<h3 class="db-comp__t"></h3><p class="db-comp__s"></p>';
      card.querySelector('.db-comp__t').textContent = title;
      card.querySelector('.db-comp__s').textContent = sub;
      // A title is one part, several parts separated by "·", or a name with an aside in
      // brackets. Every word of it counts as a part this wall has put on show. A card whose
      // title does not name its parts in the registry's own words says so in `shows`.
      var named = [];
      String(title).split('·').forEach(function (piece) {
        piece.replace(/\(.*?\)/g, ' ').split(/[\s+,]+/).forEach(function (word) {
          if (word) named.push(word);
        });

      (shows || []).forEach(function (id) { named.push(id); });
      if (SHOWN) named.forEach(function (id) { SHOWN[id] = true; });

wall.className = 'db-comps';

COMPS = [];
SHOWN = {};

    function buildAdoptForm(session) {
      var body = ui.adopt.body;
      // Signed out: adopting writes into YOUR app, so it needs you — say so instead of
      // showing a picker with nothing in it.
      if (!session || !session.jwt) {
        ui.adopt.set({ hint: '' });
        var note = document.createElement('p');
        note.className = 'ak-section__hint';
        note.textContent = dbText('Adopting writes a part into one of your own apps. Sign in from the top corner and this panel opens up.');
        body.appendChild(note);
        return;
      }
      ui.adoptPartName = document.createElement('p');
      ui.adoptPartName.className = 'ak-section__hint db-adopt__name';
      ui.adoptPartName.textContent = dbText('No part picked yet.');
      body.appendChild(ui.adoptPartName);

      ui.adoptForm = K.form({
        target: body,
        fields: [ { name: 'filename', label: dbText('Which of your apps'), type: 'select', required: true, options: [] } ],
        submitLabel: dbText('Adopt'),
        onSubmit: function (values) {
          if (!state.picked) throw { field: 'filename', message: dbText('Pick a part from the grid first.') };
          return api('/v1/designbook/' + encodeURIComponent(state.picked.id) + '/adopt', {
            method: 'POST', body: JSON.stringify({ filename: values.filename }),
          }).then(function (r) {
            if (r.status !== 200) {
              throw { field: 'filename', message: (r.body && r.body.error && r.body.error.message) || (dbText('Adopt failed (') + r.status + ')') };
            }
            ui.adopt.set({ hint: dbText('Adopted into ') + values.filename + dbText('. The app renders it on its next open; the replaced layout is archived.') });
            // SPA: the count on screen moves; nothing reloads, nothing loses its place.
            state.pickedUsage = (state.pickedUsage || 0) + 1;
            if (state.picked) ui.detail.set({ title: state.picked.title, hint: usageLine(state.picked, state.pickedUsage) });
          });
        },
      });
      fillAdoptSelect();
    }

    function fillAdoptSelect() {
      if (!ui.adoptForm || !ui.adoptForm.set) return;
      ui.adoptForm.set({ fields: [ { name: 'filename', label: dbText('Which of your apps'), type: 'select', required: true,
        options: state.myApps.map(function (f) { return { value: f, label: f }; }) } ] });
    }

/**

    var appSelect = ui.adopt && ui.adopt.el.querySelector('select');
    var appValue = appSelect && appSelect.value;
    var groups = Array.from(document.querySelectorAll('.db-demo-group'));
    var activeGroup = groups.findIndex(function (group) { return group.open; });
    var using = ui.useActions && ui.useActions.open;
    partRequest++;
    if (state.previewHandle) { state.previewHandle.destroy(); state.previewHandle = null; }
    hidePhaser();
    hideLiving();
    hideReasons();
    hideComponents();
    mountChrome();
    render(state.session);
    ui.nav.set({ value: page });
    if (ui.mobileCategory) ui.mobileCategory.value = page;
    if (searching) ui.navEl.setAttribute('data-search', searching);
    function restore() {
      var select = ui.adopt && ui.adopt.el.querySelector('select');
      if (select && appValue) select.value = appValue;
      if (picked && ui.useActions) ui.useActions.open = using;
      a.main.scrollTop = scroll;
    }
    if (picked) {
      state.picked = picked;
      openPart(picked.id, state.session).then(restore);
    } else {
      ui.pickCategory(page);
      if (page === '_components' && activeGroup >= 0) {
        var group = document.querySelectorAll('.db-demo-group')[activeGroup];
        if (group) group.open = true;
      }
      restore();
    }
  });
});

  </script>
</body>
</html>

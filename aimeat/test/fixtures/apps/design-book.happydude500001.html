<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="aimeat-app" content="design-book.html" />
  <meta name="aimeat-track" content="atelier" />
  <meta name="aimeat-register" content="custom:design-book" />
  <meta name="aimeat-scopes" content="memory:read memory:write ai:use" />
  <meta name="aimeat-locales" content="en fi" />
  <title>Design Book</title>
  <!-- THE THREE FACES THE BAR IS SET IN, FETCHED WITH THE PAGE. They are declared
       font-display: swap, so without this the wordmark, the tabs and the search box are laid
       out in a fallback, measured, and then re-measured when the real face lands — and at 1036
       the navigation row re-wrapped when it did: 0.80 of layout shift, against a criterion of
       0.1. Asking for them beside the stylesheet gets them in before the first layout. -->
  <link rel="preload" href="/lib/fonts/archivo-black-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/lib/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/lib/fonts/jetbrains-mono-var-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link href="/lib/aimeat-atelier.css" rel="stylesheet" type="text/css" />
  <link href="/lib/aimeat-phaser.css" rel="stylesheet" type="text/css" />
  <link href="/lib/aimeat-assets.css" rel="stylesheet" type="text/css" />
  <link href="/lib/aimeat-living.css" rel="stylesheet" type="text/css" />
  <script src="/lib/aimeat-boot.js"></script>
  <style>

    /* The components wall: every part alive, one card each — the shop window. */
    .db-comps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr));
      gap: var(--ak-gap);
      align-items: start;
      padding-bottom: var(--ak-pad);
      /* THE WALL RESTATES THE BOX MODEL, because a <details> breaks the kit's.
         The kit sets `box-sizing: border-box` on `.ak-root` and hands it down with
         `.ak-root * { box-sizing: inherit }`. A <details> renders its children through a UA
         shadow slot, and an inherited value stops at that boundary: inside a demo group the
         inherit resolves against the slot, which is content-box, so every kit row that is
         `width: 100%` with padding stood its padding and border wider than its card. Measured
         on v56 at 1530: health rows 24px past the card, notices 27px, list rows 35px, the
         adopt inputs 27px. Declaring the value here, on the gallery's own box, restores the
         chain for everything below without re-declaring one kit class. */
      box-sizing: border-box;
    }
    .db-comp {
      background: var(--ak-surface);
      border: var(--ak-line-w) solid var(--ak-line);
      border-radius: var(--ak-radius);
      box-shadow: var(--ak-elev-1);
      padding: 14px 16px 16px;
      min-width: 0;
    }
    .db-comp--wide { grid-column: span 2; }
    @media (max-width: 760px) { .db-comp--wide { grid-column: span 1; } }
    .db-compgroup {
      grid-column: 1 / -1;
      margin: 14px 0 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--ak-line);
      font: 600 12px/1 var(--ak-font-mono, monospace);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--ak-ink-dim);
    }
    /* The wall's own guard: if the component registry lists a part with no card here, the wall
     * says so out loud instead of anyone having to remember. */
    .db-guard {
      grid-column: 1 / -1;
      border: 3px dashed var(--ak-accent);
      border-radius: var(--ak-radius);
      background: var(--ak-surface);
      padding: 14px 18px;
      font-size: 14px;
      color: var(--ak-ink);
    }
    .db-guard code { font-family: var(--ak-font-mono, monospace); font-size: 13px; }
    .db-comp__t { margin: 0; font-family: var(--ak-font-mono); font-size: 13px; letter-spacing: .04em; }
    .db-comp__s { margin: 2px 0 10px; font-size: var(--ak-text-fine); color: var(--ak-ink-dim); }
    /* MAKE IT YOURS. What a builder may change in this part without forking it, read from
       AIMEAT.atelier.describe(id) — which is generated from the component's own JSDoc, so this
       line cannot drift from the source the way the wall's guard list once did. */
    .db-mine {
      margin: 0 0 10px;
      padding: 8px 10px;
      border-radius: var(--ak-radius-sm);
      background: var(--ak-surface-2);
      border: var(--ak-line-w) solid var(--ak-line);
      font-family: var(--ak-font-mono);
      font-size: 11px;
      line-height: 1.5;
      color: var(--ak-ink-dim);
      overflow-wrap: anywhere;
    }
    .db-mine__h {
      display: block;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--ak-ink);
      margin-bottom: 3px;
    }
    .db-mine b { color: var(--ak-ink); font-weight: 700; }
    .db-mine__fork { display: block; margin-top: 4px; }
    /* The nearly-right exhibits: the rendered answer above, the code that made it below. */
    .db-nr__code {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: var(--ak-radius-sm);
      background: var(--ak-surface-2);
      border: var(--ak-line-w) solid var(--ak-line);
      font-family: var(--ak-font-mono);
      font-size: 11px;
      line-height: 1.55;
      overflow-x: auto;
      white-space: pre;
      color: var(--ak-ink);
    }
    .db-nr__was { margin: 8px 0 0; font-size: var(--ak-text-fine); color: var(--ak-ink-dim); }
    /* The category pages, up top: pick a shelf, the columns below carry only it. */
    .db-nav { margin-bottom: var(--ak-gap); }
    .db-nav .ak-tabs { flex-wrap: wrap; }
    /* Two columns: the shelf holds still, the stage scrolls with the page. */
    .db-columns {
      display: grid;
      grid-template-columns: minmax(15rem, 20rem) 1fr;
      gap: var(--ak-gap);
      align-items: stretch;
      height: calc(100dvh - 7 * var(--ak-pad) - var(--ak-chrome-bottom) - 3.4rem);
      min-height: 0;
    }
    @media (max-width: 900px) { .db-columns { grid-template-columns: 1fr; height: auto; } }
    .db-left { display: flex; flex-direction: column; gap: var(--ak-gap); height: 100%; min-height: 0; }
    .db-left > .ak-section { flex: 0 0 auto; }
    .db-shelf {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      padding: var(--ak-pad);
      border-radius: var(--ak-radius);
      background: var(--ak-surface);
      border: var(--ak-line-w) solid var(--ak-line);
      box-shadow: var(--ak-elev-1);
    }
    @media (max-width: 900px) { .db-left { height: auto; } .db-shelf { height: auto; max-height: 55dvh; } }
    .db-shelf__groups { display: flex; flex-direction: column; gap: 2px;
      overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: thin; padding-right: 2px; }
    .db-group__title {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      margin: 14px 0 0; font-family: var(--ak-font-display);
      font-size: var(--ak-text-body); font-weight: var(--ak-weight-display);
      /* The heading stays put while its group scrolls under it — the reader always knows
         which shelf they are on. */
      position: sticky; top: -1px; z-index: 1;
      background: var(--ak-surface); padding: 4px 0;
    }
    .db-group__count { font-family: var(--ak-font-mono); font-size: var(--ak-text-fine); color: var(--ak-ink-dim); }
    .db-group__hint { margin: 0 0 6px; font-size: var(--ak-text-fine); color: var(--ak-ink-dim); }
    .db-part {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; min-height: var(--ak-touch);
      padding: 8px 10px; border: 0; border-radius: var(--ak-radius-sm);
      background: none; color: var(--ak-ink); font: inherit; text-align: left; cursor: pointer;
      transition: background var(--ak-motion) var(--ak-ease);
    }
    .db-part:hover { background: var(--ak-surface-2); }
    .db-part__tile {
      flex: none; width: 26px; height: 26px; border-radius: var(--ak-radius-sm);
      display: grid; place-items: center;
      font-family: var(--ak-font-display); font-size: 12px; font-weight: var(--ak-weight-display);
      color: var(--ak-ink);
    }
    .db-part__tile--0 { background: color-mix(in oklab, var(--ak-accent) 26%, var(--ak-surface)); }
    .db-part__tile--1 { background: color-mix(in oklab, var(--ak-spectrum-2) 26%, var(--ak-surface)); }
    .db-part__tile--2 { background: color-mix(in oklab, var(--ak-spectrum-3) 26%, var(--ak-surface)); }
    .db-part__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .db-part[aria-current] {
      background: color-mix(in oklab, var(--ak-accent) 14%, var(--ak-surface));
      color: var(--ak-accent-text); font-weight: 650;
    }
    .db-part__status {
      font-family: var(--ak-font-mono); font-size: var(--ak-text-fine); color: var(--ak-ink-dim);
    }
    .db-stage {
      display: flex; flex-direction: column; gap: var(--ak-gap);
      min-width: 0; min-height: 0; height: 100%;
      overflow-y: auto; scrollbar-width: thin; padding-right: 2px;
    }
    @media (max-width: 900px) { .db-stage { height: auto; overflow: visible; } }
    .db-stage > .ak-section:first-of-type { flex: 1; min-height: 0; }
    .db-stage > .ak-section:first-of-type > .ak-section__body {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    @media (max-width: 900px) {
      .db-stage > .ak-section:first-of-type { flex: none; }
      .db-preview-frame { height: 60dvh; }
    }
    /* The welcome: the Book showing its own goods instead of a grey box. */
    .db-welcome { display: flex; flex-direction: column; gap: var(--ak-gap); flex: 1; min-height: 0; }
    .db-welcome__band {
      position: relative; min-height: 14rem; flex: 1;
      display: flex; align-items: flex-end;
      border-radius: var(--ak-radius); overflow: hidden;
      background-size: cover; background-position: center;
      border: var(--ak-line-w) solid var(--ak-line);
      box-shadow: var(--ak-elev-1);
    }
    .db-welcome__scrim {
      position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(180deg, transparent 30%, color-mix(in oklab, var(--ak-bg) 84%, transparent));
    }
    .db-welcome__words { position: relative; padding: var(--ak-pad); }
    .db-welcome__kicker {
      margin: 0; font-family: var(--ak-font-mono); font-size: var(--ak-text-fine);
      text-transform: uppercase; letter-spacing: .1em; color: var(--ak-accent-text);
    }
    .db-welcome__lead {
      margin: 2px 0 0; font-family: var(--ak-font-display);
      font-weight: var(--ak-weight-display); font-size: clamp(1.6rem, 3.2vw, 2.6rem);
      line-height: 1.02; color: var(--ak-ink);
    }
    .db-welcome__counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: var(--ak-gap); }
    .db-count {
      display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
      padding: 10px var(--ak-pad); border-radius: var(--ak-radius);
      background: var(--ak-surface); border: var(--ak-line-w) solid var(--ak-line);
      box-shadow: var(--ak-elev-1); color: var(--ak-ink); font: inherit; cursor: pointer;
      transition: transform var(--ak-motion) var(--ak-ease), box-shadow var(--ak-motion) var(--ak-ease);
    }
    .db-count:hover { transform: rotate(var(--ak-tilt)) translateY(-3px); box-shadow: var(--ak-elev-2); }
    .db-count__n {
      font-family: var(--ak-font-display); font-weight: var(--ak-weight-display);
      font-size: 1.9rem; line-height: 1; color: var(--ak-accent-text);
    }
    .db-count__l { font-size: var(--ak-text-fine); color: var(--ak-ink-dim); }
    .db-welcome__picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: var(--ak-gap); }
    .db-pick {
      display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left;
      padding: var(--ak-pad); border-radius: var(--ak-radius);
      background: var(--ak-surface); border: var(--ak-line-w) solid var(--ak-line);
      box-shadow: var(--ak-elev-1); color: var(--ak-ink); font: inherit; cursor: pointer;
      transition: transform var(--ak-motion) var(--ak-ease), box-shadow var(--ak-motion) var(--ak-ease);
    }
    .db-pick:hover { transform: rotate(calc(var(--ak-tilt) * -1)) translateY(-3px); box-shadow: var(--ak-elev-2); }
    .db-pick__title { font-weight: 700; }
    .db-pick__sub { font-size: var(--ak-text-fine); color: var(--ak-ink-dim); }
    /* Build with your AI: the door out of browsing. */
    .db-ai {
      display: flex; gap: var(--ak-gap); align-items: center; justify-content: space-between;
      flex-wrap: wrap; padding: var(--ak-pad); border-radius: var(--ak-radius);
      border: var(--ak-line-w) solid var(--ak-line);
      background: color-mix(in oklab, var(--ak-accent) 8%, var(--ak-surface));
      box-shadow: var(--ak-elev-1);
    }
    .db-ai__title { font-family: var(--ak-font-display); font-weight: var(--ak-weight-display); font-size: 1.1rem; }
    .db-ai__sub { font-size: var(--ak-text-fine); color: var(--ak-ink-dim); max-width: 52ch; margin-top: 2px; }
    .db-stage-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 var(--ak-gap); }
    .db-preview-frame {
      width: 100%;
      flex: 1;
      min-height: 26rem;
      border: var(--ak-line-w) solid var(--ak-line);
      border-radius: var(--ak-radius);
      background: var(--ak-surface);
      box-shadow: var(--ak-elev-1);
    }

    /* ── THE BROADCAST FACE (the night gallery the owner accepted on the Atelier Next canvas,
       2026-09-01). The kit's broadcast look supplies the grounds, the depth and the channel
       colours; these rules are the Book's OWN stage dressing on top: the masthead in display type
       that owns the room, the "this week" sticker, exhibits tilted their own way, the signal
       band on the loud action. The classic face (carnival) stays one click away. ── */
    .db-nav { display: flex; align-items: center; gap: var(--ak-gap); flex-wrap: wrap; }
    .db-lookswitch { margin-left: auto; }
    [data-ak-look='broadcast'] .db-welcome__band {
      min-height: 0; flex: 0 0 auto; background-image: none !important;
      border: 0; box-shadow: none; overflow: visible; align-items: flex-start;
    }
    [data-ak-look='broadcast'] .db-welcome__scrim { display: none; }
    [data-ak-look='broadcast'] .db-welcome__words { padding: 6px 0 0; display: flex; flex-direction: column-reverse; gap: 14px; align-items: flex-start; }
    [data-ak-look='broadcast'] .db-welcome__kicker {
      display: inline-block; padding: 8px 12px; transform: rotate(-1.5deg);
      background: var(--ak-crt-ch3); color: #14101f; font-weight: 700; letter-spacing: .08em;
      box-shadow: 5px 5px 0 color-mix(in oklab, var(--ak-accent) 85%, transparent);
    }
    [data-ak-look='broadcast'] .db-welcome__lead {
      font-size: clamp(2.4rem, 5.6vw, 4.6rem); line-height: .92; letter-spacing: -.02em;
      text-transform: uppercase; color: var(--ak-ink); text-shadow: var(--ak-display-shadow);
    }
    [data-ak-look='broadcast'] .db-count,
    [data-ak-look='broadcast'] .db-pick,
    [data-ak-look='broadcast'] .db-ai,
    [data-ak-look='broadcast'] .db-comp,
    [data-ak-look='broadcast'] .db-shelf,
    [data-ak-look='broadcast'] .db-preview-frame { border-radius: 6px; }
    [data-ak-look='broadcast'] .db-count:nth-child(odd),
    [data-ak-look='broadcast'] .db-pick:nth-child(odd) { transform: rotate(-1.2deg); }
    [data-ak-look='broadcast'] .db-count:nth-child(even),
    [data-ak-look='broadcast'] .db-pick:nth-child(even) { transform: rotate(.8deg); }
    [data-ak-look='broadcast'] .db-count:hover,
    [data-ak-look='broadcast'] .db-pick:hover { transform: rotate(0deg) translateY(-5px); }
    [data-ak-look='broadcast'] .db-count:nth-child(4n+1) .db-count__n { color: var(--ak-crt-ch1); }
    [data-ak-look='broadcast'] .db-count:nth-child(4n+2) .db-count__n { color: var(--ak-crt-ch2); }
    [data-ak-look='broadcast'] .db-count:nth-child(4n+3) .db-count__n { color: var(--ak-crt-ch3); }
    [data-ak-look='broadcast'] .db-count:nth-child(4n+4) .db-count__n { color: var(--ak-crt-ch4); }
    [data-ak-look='broadcast'] .db-count__n { font-size: 2.4rem; }
    [data-ak-look='broadcast'] .db-part__tile--0 { background: var(--ak-crt-ch1); color: #14101f; }
    [data-ak-look='broadcast'] .db-part__tile--1 { background: var(--ak-crt-ch2); color: #14101f; }
    [data-ak-look='broadcast'] .db-part__tile--2 { background: var(--ak-crt-ch4); color: #14101f; }
    [data-ak-look='broadcast'] .db-part__tile { border-radius: 3px; }
    [data-ak-look='broadcast'] .db-compgroup { color: var(--ak-crt-ch4); border-bottom-color: color-mix(in oklab, var(--ak-crt-ch4) 40%, var(--ak-line)); }
    [data-ak-look='broadcast'] .db-ai { background: var(--ak-surface); border-color: var(--ak-crt-ch3); }
    /* The signal band: one loud action, yellow with ink words, a hot offset. */
    [data-ak-look='broadcast'] .ak-btn--primary {
      background: var(--ak-crt-ch3); color: #14101f; border-radius: 3px;
      font-weight: 900; text-transform: uppercase; letter-spacing: .03em;
      box-shadow: 5px 5px 0 color-mix(in oklab, var(--ak-accent) 85%, transparent);
    }
    [data-ak-look='broadcast'] .ak-btn--primary:hover { transform: translate(-1px, -1px); box-shadow: 7px 7px 0 color-mix(in oklab, var(--ak-accent) 85%, transparent); }

    /* The materials and motion tiles on the wall: each tile IS the material, full bleed. */
    .db-mat {
      position: relative; display: grid; place-items: center; height: 150px;
      border-radius: var(--ak-radius); border: var(--ak-line-w) solid var(--ak-line);
      font-family: var(--ak-font-display); font-weight: var(--ak-weight-display);
      font-size: var(--ak-text-body); letter-spacing: .02em;
    }
    /* The tile's ink is the page's — EXCEPT where the material carries its own. ak-mat--ink and
       ak-mat--signal set a colour against the ground they paint, and a bare `.db-mat { color }`
       at the same specificity, later in the cascade, beat both: measured at ratio 1.00 and 1.17,
       which is text you cannot read. The material decides on its own tiles. */
    .db-mat:not([class*='ak-mat--']) { color: var(--ak-ink); }
    .db-mat__pane { position: absolute; inset: 22px; display: grid; place-items: center; border-radius: var(--ak-radius-sm); }
    .db-mat__word { font-family: var(--ak-font-display); font-weight: var(--ak-weight-display); font-size: var(--ak-text-body); letter-spacing: .02em; }
    /* A control that plays a moment is a real button, never a hover a touch screen cannot find. */
    .db-mat__play { margin-top: 10px; min-height: 40px; }

    /* GLASS needs hard edges behind it or there is nothing to blur. The bars and the line of type
       are the demo's own ground; the pane is the kit's class and nothing else. */
    .db-scene {
      position: relative; height: 170px; overflow: hidden; border-radius: var(--ak-radius);
      border: var(--ak-line-w) solid var(--ak-line);
    }
    .db-scene__ground { position: absolute; inset: 0; display: flex; }
    .db-scene__bar { flex: 1; }
    .db-scene__bar--a { background: var(--ak-crt-ch1); }
    .db-scene__bar--b { background: var(--ak-crt-ch2); }
    .db-scene__bar--c { background: var(--ak-crt-ch3); }
    .db-scene__bar--d { background: var(--ak-crt-ch4); }
    .db-scene__bar--e { background: var(--ak-ink); }
    .db-scene__bar--f { background: var(--ak-surface); }
    /* The line runs ACROSS the pane's edge on purpose: half of it is read through the glass and
       half beside it, which is the whole demonstration. Centred, it sat under the pane and read
       as a word cut in half. */
    .db-scene__line {
      position: absolute; inset-block-start: 50%; inset-inline: 0; margin: 0; transform: translateY(-50%);
      padding-inline-start: 14px; text-align: start; white-space: nowrap;
      font-family: var(--ak-font-mono); font-size: 12px; font-weight: 700;
      letter-spacing: .02em; color: var(--ak-crt-set);
    }
    /* The pane's own label sits at its top edge: in the middle it covered the line of type the
       demo exists to show through the glass. */
    .db-scene__pane {
      position: absolute; inset-block: 14px; inset-inline-start: 6px; width: 48%;
      display: grid; align-content: start; justify-items: center; padding-top: 8px;
      border-radius: var(--ak-radius-sm);
      font-family: var(--ak-font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      transition: inset-inline-start var(--ak-motion, 240ms) var(--ak-ease, ease);
    }
    .db-scene.is-right .db-scene__pane { inset-inline-start: calc(52% - 6px); }

    /* AURORA is a ground: it is shown carrying a card rather than as a swatch. */
    .db-aur { display: grid; gap: 8px; place-items: center; padding: 0 14px; text-align: center; }
    .db-aur__kicker { margin: 0; font-family: var(--ak-font-mono); font-size: 11px; letter-spacing: .14em; color: var(--ak-ink-dim); }
    .db-aur__tile {
      display: grid; gap: 2px; padding: 10px 16px; background: var(--ak-surface);
      border: var(--ak-line-w) solid var(--ak-line); border-radius: var(--ak-radius-sm);
      box-shadow: var(--ak-elev-1); font-size: var(--ak-text-fine); color: var(--ak-ink);
    }

    /* GRAIN cannot be judged alone at 0.16 opacity: the same surface stands beside it with none. */
    .db-grain { display: grid; grid-template-columns: 1fr 1fr; height: 150px; border: var(--ak-line-w) solid var(--ak-line); border-radius: var(--ak-radius); overflow: hidden; }
    .db-grain__half { position: relative; display: grid; place-items: end center; padding-bottom: 10px; }
    .db-grain__half--plain { background: var(--ak-surface); border-inline-start: var(--ak-line-w) solid var(--ak-line); }
    .db-grain__tag { font-family: var(--ak-font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ak-ink-dim); }

    /* INK inverts, so the light page it inverts against stands above it. */
    .db-ink { display: grid; gap: 0; border: var(--ak-line-w) solid var(--ak-line); border-radius: var(--ak-radius); overflow: hidden; }
    .db-ink__page { display: grid; gap: 6px; padding: 14px 16px; background: var(--ak-surface); }
    .db-ink__row { display: flex; justify-content: space-between; margin: 0; font-size: var(--ak-text-fine); color: var(--ak-ink-dim); }
    .db-ink__row b { color: var(--ak-ink); }
    .db-ink__slab { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-size: 15px; }
    .db-ink__slab b { font-family: var(--ak-font-display); font-weight: var(--ak-weight-display); font-size: 22px; }

    /* SIGNAL is the crawl's ground, so the crawl stands on it. */
    .db-signal { display: grid; align-items: center; min-height: 92px; padding: 14px; border-radius: var(--ak-radius); }

    /* THE STORY BAND, at the top of the front page. It wears the bar's own register: the mono
       kicker in the accent, the ink rule, one loud action. It is one row where there is room and
       stacks on a phone, and it is kept short on purpose: it may not push the first card under
       the fold, which is measured at 1280x800 and 390x844 on every change. */
    .db-story {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px 24px; margin: 0 0 var(--ak-gap); padding: 14px 18px; max-width: 72ch;
      background: var(--ak-surface); border: var(--ak-line-w) solid var(--ak-line);
      border-inline-start: 4px solid var(--ak-accent); border-radius: var(--ak-radius-sm);
    }
    .db-story__words { min-width: 0; flex: 1 1 22rem; }
    .db-story__kicker {
      margin: 0 0 4px; font-family: var(--ak-font-mono); font-size: 11px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase; color: var(--ak-accent);
    }
    .db-story__lead { margin: 0; max-width: 60ch; font-size: var(--ak-text-fine); line-height: 1.5; color: var(--ak-ink); }
    .db-story__go { flex: 0 0 auto; min-height: 44px; }
    .db-mat--card { box-shadow: var(--ak-elev-1); background: var(--ak-surface); }
    .db-mat__center { display: inline-flex; margin: 30px auto; }
    /* Ten pages in the bar: below 1560px the gaps tighten and the on-air line steps aside, but
       the type does not shrink. Squeezing it to 10.5px and the search box to seven characters
       ("SEARC…") bought a single row the bar was not going to keep anyway; the navigation has
       its own line now, so the words keep their size. */
    @media (max-width: 1560px) {
      [data-ak-look='broadcast'] .ak-app__bar .db-nav .ak-tab { margin-left: 14px; }
      [data-ak-look='broadcast'] .ak-app__title .db-onair { display: none; }
    }
    /* THE LIVING PAGE. Three bands under one masthead: the document alive, the vocabulary it is
       written in, and the record you take away. The last two stand side by side where there is
       room, because a person reads the table and copies the record in the same breath. */
    .db-living { display: grid; gap: calc(var(--ak-gap) * 1.5); padding-bottom: var(--ak-pad); }
    .db-living__head { padding: 8px 0 0; }
    .db-living__kicker { margin: 0 0 8px; font: 600 12px/1 var(--ak-font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ak-accent); }
    .db-living__title { margin: 0; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: clamp(34px, 5vw, 72px); line-height: 0.95; text-transform: uppercase; letter-spacing: -0.01em; }
    .db-living__sub { margin: 14px 0 0; max-width: 60em; color: var(--ak-ink-dim); font-size: 16px; line-height: 1.45; }
    .db-living__h { margin: 0 0 6px; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: clamp(20px, 2.4vw, 30px); line-height: 1.05; text-transform: uppercase; letter-spacing: -0.005em; }
    .db-living__note { margin: 0 0 12px; max-width: 62ch; color: var(--ak-ink-dim); font-size: var(--ak-text-fine); line-height: 1.5; }
    .db-living__stage, .db-living__vocab, .db-living__take, .db-living__not {
      border-top: 3px solid var(--ak-ink); padding-top: 16px; min-width: 0;
    }
    /* The frame reserves its height before the sheet lands, so the bands under it do not drop. */
    .db-living__frame {
      display: block; width: 100%; height: min(78vh, 900px); border: var(--ak-line-w) solid var(--ak-line);
      border-radius: var(--ak-radius); background: var(--ak-surface); color-scheme: normal;
    }
    .db-living__copy { align-self: flex-start; margin-bottom: 12px; }
    .db-living__record {
      margin: 0; max-height: 30rem; overflow: auto; padding: 14px 16px;
      background: var(--ak-surface-2); border: var(--ak-line-w) solid var(--ak-line);
      border-radius: var(--ak-radius-sm); font-family: var(--ak-font-mono);
      font-size: 12px; line-height: 1.5; color: var(--ak-ink); white-space: pre;
    }
    .db-living__list { margin: 0; padding-inline-start: 1.4em; display: grid; gap: 10px; max-width: 68ch; }
    .db-living__list li { line-height: 1.5; }
    .db-living__list b { font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); letter-spacing: .01em; }
    .db-living__list span { color: var(--ak-ink-dim); }
    /* The vocabulary table has four columns of prose and needs the whole measure; the record and
       the three refusals are both narrow, so they take the last row two abreast. */
    @media (min-width: 1100px) {
      .db-living { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .db-living__head, .db-living__stage, .db-living__vocab { grid-column: 1 / -1; }
      .db-living__take, .db-living__not { grid-column: span 1; }
    }
    .db-living__vocab .ak-table, .db-living__vocab .ak-table__scroll { overflow-x: auto; }

    /* THE REASONS PAGE. A reading page, not a dashboard: one column of accounts, each one a
       sentence somebody's builder wrote, with the app it came from under it. It keeps the
       living page's masthead and its 3px band rule, so it arrives as another room of the same
       building. The measure is held at 72ch because the whole page is prose. */
    .db-reasons { display: grid; gap: calc(var(--ak-gap) * 1.5); padding-bottom: var(--ak-pad); }
    .db-reasons__head { padding: 8px 0 0; }
    .db-reasons__kicker { margin: 0 0 8px; font: 600 12px/1 var(--ak-font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ak-accent); }
    .db-reasons__title { margin: 0; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: clamp(34px, 5vw, 72px); line-height: 0.95; text-transform: uppercase; letter-spacing: -0.01em; }
    .db-reasons__sub { margin: 14px 0 0; max-width: 60em; color: var(--ak-ink-dim); font-size: 16px; line-height: 1.45; }
    .db-reasons__body { display: grid; gap: calc(var(--ak-gap) * 1.5); min-width: 0; }
    /* The frame the whole page is read through, so it stands above the numbers and in full ink:
       a reader who takes these accounts for measurements draws the wrong conclusion from them. */
    .db-reasons__note {
      margin: 0; max-width: 72ch; padding: 14px 16px; border-inline-start: 4px solid var(--ak-accent);
      background: var(--ak-surface-2); border-radius: var(--ak-radius-sm);
      color: var(--ak-ink); font-size: 15px; line-height: 1.5;
    }
    .db-reasons__band { border-top: 3px solid var(--ak-ink); padding-top: 16px; min-width: 0; display: grid; gap: 14px; }
    .db-reasons__h { margin: 0; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: clamp(20px, 2.4vw, 30px); line-height: 1.05; text-transform: uppercase; letter-spacing: -0.005em; }
    .db-reasons__lede { margin: 0; max-width: 62ch; color: var(--ak-ink-dim); font-size: var(--ak-text-fine); line-height: 1.5; }
    .db-reasons__quiet { margin: 0; color: var(--ak-ink-dim); font-size: var(--ak-text-fine); line-height: 1.5; }
    .db-reasons__item {
      display: grid; gap: 10px; min-width: 0; max-width: 72ch; padding: 14px 16px;
      background: var(--ak-surface); border: var(--ak-line-w) solid var(--ak-line); border-radius: var(--ak-radius);
    }
    .db-reasons__name { margin: 0; font-family: var(--ak-font-mono); font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
    /* The pair of numbers. `kept` is the one that says a person was satisfied, so it is the one
       that is read first: bigger, in the accent, with the count of builders quiet beside it. */
    .db-reasons__stats { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: baseline; min-width: 0; }
    .db-reasons__stat { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .db-reasons__n { font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: 24px; line-height: 1; }
    .db-reasons__stat--lead .db-reasons__n { font-size: clamp(34px, 6vw, 44px); color: var(--ak-accent); }
    .db-reasons__l { color: var(--ak-ink-dim); font-size: var(--ak-text-fine); line-height: 1.35; max-width: 26ch; }
    .db-reasons__stat--lead .db-reasons__l { color: var(--ak-ink); }
    .db-reasons__what { margin: 0; line-height: 1.5; overflow-wrap: anywhere; }
    /* A builder's sentence can run long, and it is never broken across the page edge. */
    .db-reasons__why { border-inline-start: 3px solid var(--ak-line); padding-inline-start: 12px; min-width: 0; }
    .db-reasons__quote { margin: 0; line-height: 1.5; overflow-wrap: anywhere; }
    .db-reasons__src { margin: 4px 0 0; font-family: var(--ak-font-mono); font-size: 12px; color: var(--ak-ink-dim); overflow-wrap: anywhere; }
    .db-reasons__kept {
      margin-inline-start: 8px; padding: 1px 7px; border-radius: 999px;
      background: var(--ak-accent); color: var(--ak-surface); font-size: 12px; letter-spacing: .04em;
    }
    /* The same accounts for the one part on the stage, under its use panel. The stage is wide
       and these are sentences, so the measure is held here as it is on the Reasons page. */
    .db-why { margin-top: 16px; padding-top: 14px; border-top: 3px solid var(--ak-ink); display: grid; gap: 10px; min-width: 0; }
    .db-why .db-reasons__quote, .db-why .db-reasons__src { max-width: 72ch; }
    .db-why__h { margin: 0; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: 20px; line-height: 1.1; text-transform: uppercase; }
    .db-why__sub { margin: 4px 0 0; font: 600 12px/1.2 var(--ak-font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ak-ink-dim); }
    .db-why__stats { gap: 10px 22px; }

    /* MADE BY APPS: the ninth kind. The shelf opens with a sentence about where these came
       from, in the same frame the Reasons page uses for the node's own warning, because both
       say the same kind of thing: read this before you read what is under it. */
    .db-made__lede {
      margin: 0 0 var(--ak-gap); max-width: 72ch; padding: 12px 16px;
      border-inline-start: 4px solid var(--ak-accent);
      background: var(--ak-surface-2); border-radius: var(--ak-radius-sm);
      color: var(--ak-ink); font-size: 15px; line-height: 1.5;
    }
    .db-made { margin-top: 16px; padding-top: 14px; border-top: 3px solid var(--ak-ink); display: grid; gap: 10px; min-width: 0; }
    .db-made__reach { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }
    .db-made__chip {
      padding: 3px 10px; border-radius: 999px; border: var(--ak-line-w) solid var(--ak-line);
      font: 600 12px/1.4 var(--ak-font-mono); letter-spacing: .04em; color: var(--ak-ink-dim);
    }
    .db-made__chip--general { background: var(--ak-accent); border-color: var(--ak-accent); color: var(--ak-surface); }
    .db-made__from { min-width: 0; font-family: var(--ak-font-mono); font-size: 12px; color: var(--ak-ink-dim); overflow-wrap: anywhere; }
    .db-made__h { margin: 6px 0 0; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: 18px; line-height: 1.1; text-transform: uppercase; }
    .db-made__use, .db-made__note { margin: 0; max-width: 72ch; line-height: 1.5; overflow-wrap: anywhere; }
    .db-made__note { font-size: var(--ak-text-fine); color: var(--ak-ink-dim); }
    /* The two texts the piece IS. A long markup line scrolls inside its own box and never
       widens the page, which is why the box carries min-width and the page does not. */
    .db-made__code { display: grid; gap: 8px; margin-top: 14px; min-width: 0; }
    .db-made__codehead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .db-made__text {
      margin: 0; max-width: 100%; min-width: 0; max-height: 22rem; overflow: auto;
      padding: 12px 14px; background: var(--ak-surface-2);
      border: var(--ak-line-w) solid var(--ak-line); border-radius: var(--ak-radius-sm);
      font-family: var(--ak-font-mono); font-size: 12px; line-height: 1.5;
      color: var(--ak-ink); white-space: pre;
    }

    /* THE PHASER PAGE: the arcade cabinet. */
    .db-arcade { display: grid; gap: var(--ak-gap); padding-bottom: var(--ak-pad); }
    .db-arcade__head { padding: 8px 0 0; }
    .db-arcade__kicker { margin: 0 0 8px; font: 600 12px/1 var(--ak-font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ak-accent); }
    .db-arcade__title { margin: 0; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: clamp(34px, 5vw, 72px); line-height: 0.95; text-transform: uppercase; letter-spacing: -0.01em; }
    .db-arcade__sub { margin: 14px 0 0; max-width: 60em; color: var(--ak-ink-dim); font-size: 16px; line-height: 1.45; }
    .db-arcade__body { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: var(--ak-gap); align-items: start; }
    .db-arcade__rail { display: grid; gap: 8px; position: sticky; top: 8px; }
    /* Narrow: the rail becomes a row you scroll sideways above the stage, nothing sticks, and the
       code wraps instead of pushing the page wide. */
    @media (max-width: 900px) {
      .db-arcade__body { grid-template-columns: 1fr; }
      .db-arcade__rail { position: static; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
      .db-arcade__pick { scroll-snap-align: start; }
      .db-arcade__stagewrap { grid-template-columns: 1fr; }
      .db-arcade__side { width: 100%; }
      .db-arcade__code { white-space: pre-wrap; word-break: break-word; }
      .db-arcade__stage { max-width: 100%; }
    }
    .db-arcade__pick { display: grid; gap: 4px; text-align: left; padding: 14px 16px; border-radius: var(--ak-radius); border: var(--ak-line-w) solid var(--ak-line); background: var(--ak-surface); color: var(--ak-ink); cursor: pointer; font: inherit; }
    .db-arcade__pick b { font-family: var(--ak-font-mono); font-size: 13px; letter-spacing: 0.04em; }
    .db-arcade__pick span { color: var(--ak-ink-dim); font-size: var(--ak-text-fine); line-height: 1.35; }
    .db-arcade__pick[aria-current='true'] { border-color: var(--ak-accent); box-shadow: var(--ak-elev-2); }
    /* The side column is a fixed width: an `auto` track takes the full-width code and note
       rows' max-content and squeezed the stage to a third of the wrap. */
    .db-arcade__stagewrap { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--ak-gap); align-items: start; }
    .db-arcade__stagewrap:has(.db-arcade__side[hidden]) { grid-template-columns: minmax(0, 1fr); }
    /* Under 1200px the side panel goes under the stage (beside it the stage fell to 300 px at
       1036 wide); this sits after the base rule on purpose. */
    @media (max-width: 1200px) { .db-arcade__stagewrap { grid-template-columns: minmax(0, 1fr); } .db-arcade__side { width: 100%; } }
    .db-arcade__bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .db-arcade__stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 1280px; border-radius: var(--ak-radius); overflow: hidden; background: var(--ak-bg); border: var(--ak-line-w) solid var(--ak-line); box-shadow: var(--ak-elev-2); }
    .db-arcade__stage--small { max-width: 480px; }
    .db-arcade__stage--medium { max-width: 960px; }
    .db-arcade__stage--large { max-width: 1280px; }
    .db-arcade__stage canvas { display: block; }
    .db-arcade__side { width: min(360px, 100%); display: grid; gap: 12px; }
    .db-arcade__side[hidden] { display: none; }
    .db-arcade__code { grid-column: 1 / -1; margin: 0; padding: 14px 16px; overflow-x: auto; border-radius: var(--ak-radius); background: color-mix(in oklab, var(--ak-ink) 6%, var(--ak-surface)); border: var(--ak-line-w) solid var(--ak-line); font: 500 12.5px/1.55 var(--ak-font-mono); color: var(--ak-ink); }
    .db-arcade__note { grid-column: 1 / -1; margin: 0; }
    .db-arcade__board h3 { margin: 0 0 6px; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: 22px; }
    .db-arcade__rows { margin: 8px 0 0; padding: 0 0 0 20px; display: grid; gap: 4px; }
    .db-arcade__rows li { display: flex; justify-content: space-between; gap: 12px; font-family: var(--ak-font-mono); font-size: 13px; }
    .db-playtest { margin-top: 12px; display: grid; gap: 6px; }
    .db-playtest__row { display: grid; gap: 2px; padding: 8px 10px; border-radius: var(--ak-radius); border: var(--ak-line-w) solid var(--ak-line); font-size: 13px; }
    .db-playtest__row b { font-family: var(--ak-font-mono); font-weight: 600; }
    .db-playtest__row[data-ok='false'] { border-color: var(--ak-err); }
    .db-playtest__row[data-ok='warn'] { border-color: var(--ak-warn); }
    .db-playtest h4 { margin: 10px 0 0; font-size: 14px; }
    .db-arcade__wide { grid-column: 1 / -1; min-width: 0; }
    .db-arcade__wide .ak-leveled { max-width: 100%; }
    .db-arcade__tools { display: grid; gap: var(--ak-gap); grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
    /* The show shelves: the reveal headline, the sequence chips, the transition stages. */
    .db-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    /* The tooltip exhibit: a toolbar of icon buttons, each a square at the touch minimum. */
    .db-tips { justify-content: center; margin: 24px 0 8px; }
    .db-tips__btn { min-width: var(--ak-touch-min, 44px); min-height: var(--ak-touch-min, 44px); padding: 0; font-size: 18px; line-height: 1; }
    .db-reveal { margin: 10px 0 0; max-width: 18em; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: clamp(26px, 3.2vw, 44px); line-height: 1.05; text-transform: uppercase; letter-spacing: -0.01em; }
    .db-draw { margin-top: 10px; }
    .db-seq { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; min-height: 48px; }
    .db-seq__chip { display: inline-flex; align-items: center; padding: 10px 16px; border-radius: 999px; background: color-mix(in oklab, var(--ak-accent) 16%, var(--ak-surface)); border: var(--ak-line-w) solid var(--ak-line); font: 600 13px/1 var(--ak-font-mono); letter-spacing: 0.06em; color: var(--ak-ink); }
    .db-orbit { height: 240px; margin-top: 8px; }
    .db-orbit svg { width: 100%; height: 100%; }
    /* The transition demo's little stage. Its own name: .db-stage is the Book's preview column,
       and sharing it made every opened part a 220 px box (pitfalls 36, inside one app). */
    .db-tstage { position: relative; height: 220px; margin-top: 10px; border-radius: var(--ak-radius); display: grid; place-items: center; border: var(--ak-line-w) solid var(--ak-line); }
    .db-tstage--night { background: var(--ak-bg); color: var(--ak-ink); }
    .db-tstage--day { background: color-mix(in oklab, var(--ak-crt-ch3, var(--ak-accent)) 40%, var(--ak-surface)); color: var(--ak-ink); }
    .db-tstage__word { font-family: var(--ak-font-display); font-size: 64px; letter-spacing: 0.04em; }
    .db-panels { margin-top: 10px; }
    /* The ambient group on the wall: one stage running a preset behind a word, chips to swap
     * the preset, the weather switch and two knobs. The stage is its own stacking context the
     * moment the layer mounts (the kit marks the host), so the layer paints above this ground
     * and under the word. */
    .db-amb__stage { position: relative; height: 320px; margin-top: 10px; border-radius: var(--ak-radius); border: var(--ak-line-w) solid var(--ak-line); background: var(--ak-bg); color: var(--ak-ink); display: grid; place-items: center; overflow: hidden; }
    .db-amb__word { position: relative; font-family: var(--ak-font-display); font-size: 40px; letter-spacing: 0.04em; }
    .db-amb__chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .db-amb__chip[aria-pressed='true'] { outline: 2px solid var(--ak-accent); outline-offset: 2px; }
    .db-amb__knobs { display: grid; gap: 10px; margin-top: 14px; }
    .db-amb__knob { display: grid; grid-template-columns: 5rem 1fr 3rem; align-items: center; gap: 10px; font-size: var(--ak-text-fine); color: var(--ak-ink-dim); }
    .db-amb__knob input { width: 100%; min-height: var(--ak-touch); accent-color: var(--ak-accent); }
    .db-amb__knob output { font-family: var(--ak-font-mono); color: var(--ak-ink); }
    .db-fx__words { margin-top: 12px; padding: 16px 18px; border-radius: var(--ak-radius); background: var(--ak-surface); color: var(--ak-ink); }
    .db-fx__words p { margin: 0 0 6px; }
    .db-fx__sub { color: var(--ak-ink-dim); }
    .db-fx__picture { margin-top: 12px; height: 220px; border-radius: var(--ak-radius); background: radial-gradient(circle at 30% 40%, var(--ak-spectrum-3), transparent 45%), linear-gradient(135deg, var(--ak-accent), var(--ak-spectrum-2) 55%, var(--ak-bg)); }
    .db-panel { position: relative; padding: 18px 20px 18px 64px; border-radius: var(--ak-radius); border: var(--ak-line-w) solid var(--ak-line); background: var(--ak-surface); color: var(--ak-ink); }
    .db-panel--b { background: color-mix(in oklab, var(--ak-accent) 12%, var(--ak-surface)); }
    .db-panel h3 { margin: 0 0 6px; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: 22px; }
    .db-panel p { margin: 0 0 6px; color: var(--ak-ink-dim); }
    .db-panel__badge { position: absolute; left: 16px; top: 16px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--ak-accent); color: var(--ak-on-accent, var(--ak-surface)); font: 700 14px/1 var(--ak-font-mono); }
    .db-story__panel { min-height: 100%; display: grid; align-content: center; padding: 28px; }
    .db-chapter__panel { padding: 28px; }
    .db-chapter__panel h3, .db-story__panel h3 { margin: 0 0 6px; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: 24px; }
    .db-plx { position: relative; height: 280px; }
    .db-plx__layer { position: absolute; inset: 0; display: grid; place-items: center; border-radius: var(--ak-radius); font: 600 12px/1 var(--ak-font-mono); letter-spacing: 0.12em; text-transform: uppercase; }
    .db-plx__layer--far { background: color-mix(in oklab, var(--ak-crt-ch4, var(--ak-accent)) 22%, var(--ak-surface)); inset: 20px 40px; }
    .db-plx__layer--mid { background: color-mix(in oklab, var(--ak-crt-ch1, var(--ak-accent)) 30%, var(--ak-surface)); inset: 70px 100px; }
    .db-plx__layer--near { background: var(--ak-accent); color: var(--ak-on-accent, var(--ak-surface)); inset: 110px 160px; box-shadow: var(--ak-elev-2); }
    .db-plx__air { height: 300px; flex: none; }
    .db-article { padding: 20px 120px 20px 20px; }
    .db-article h2 { font-family: var(--ak-font-display); font-weight: var(--ak-weight-display, 400); font-size: 26px; margin: 24px 0 8px; }
    .db-article__p { min-height: 160px; color: var(--ak-ink-dim); }
    .db-tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 14px; }
    .db-tiles__tile { aspect-ratio: 1; display: grid; place-items: center; border-radius: var(--ak-radius-sm); background: color-mix(in oklab, var(--ak-accent) 16%, var(--ak-surface)); border: var(--ak-line-w) solid var(--ak-line); font: 600 14px/1 var(--ak-font-mono); }
    .db-micro { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .db-micro__card { display: grid; gap: 4px; padding: 18px; border-radius: var(--ak-radius); background: var(--ak-surface); border: var(--ak-line-w) solid var(--ak-line); box-shadow: var(--ak-elev-1); }
    .db-micro__card span { color: var(--ak-ink-dim); font-size: var(--ak-text-fine); }
    .db-morph { display: grid; place-items: center; min-height: 170px; color: var(--ak-accent); }
    .db-morph svg path { fill: currentColor; }
    .db-tug { position: relative; height: 240px; margin-top: 10px; border: var(--ak-line-w) dashed var(--ak-line); border-radius: var(--ak-radius); overflow: hidden; }
    .db-tug__puck { position: absolute; left: 12px; top: 12px; width: 56px; height: 56px; display: grid; place-items: center; border-radius: var(--ak-radius-sm); background: var(--ak-accent); color: var(--ak-on-accent, var(--ak-surface)); font: 700 11px/1 var(--ak-font-mono); letter-spacing: 0.1em; }
    .db-well { height: 320px; margin-top: 10px; overflow-y: auto; border: var(--ak-line-w) solid var(--ak-line); border-radius: var(--ak-radius); }
    .db-well__track { position: relative; height: 1100px; }
    .db-well__stage { position: sticky; top: 0; height: 180px; display: flex; gap: 10px; align-items: center; justify-content: center; }
    /* The primitives shelf: bare props the five moves act on. */
    .db-spring__chip { display: block; width: max-content; margin: 18px 0 0 18px; padding: 10px 16px; border-radius: var(--ak-radius-sm); background: var(--ak-accent); color: var(--ak-on-accent, var(--ak-surface)); font: 700 12px/1 var(--ak-font-mono); letter-spacing: 0.12em; will-change: transform; }
    .db-stagger { display: flex; gap: 8px; margin-top: 16px; }
    .db-stagger__tile { flex: 1; aspect-ratio: 1; display: grid; place-items: center; border-radius: var(--ak-radius-sm); background: color-mix(in oklab, var(--ak-accent) 18%, var(--ak-surface)); border: var(--ak-line-w) solid var(--ak-line); font: 600 14px/1 var(--ak-font-mono); }
    .db-inview__figure { font: 400 56px/1 var(--ak-font-display); letter-spacing: -0.02em; margin: 18px 0 6px; color: var(--ak-ink); }
    .db-scroll__bar { height: 12px; margin: 22px 0 8px; border-radius: 999px; background: color-mix(in oklab, var(--ak-ink) 10%, transparent); overflow: hidden; }
    .db-scroll__fill { height: 100%; background: var(--ak-accent); transform-origin: left center; }
    .db-drag__puck { width: 120px; height: 120px; margin: 16px auto 8px; display: grid; place-items: center; border-radius: 50%; background: var(--ak-accent); color: var(--ak-on-accent, var(--ak-surface)); font: 700 12px/1 var(--ak-font-mono); letter-spacing: 0.12em; box-shadow: var(--ak-elev-2); }
    .db-mat__figure {
      font-family: var(--ak-font-display); font-weight: var(--ak-weight-display);
      font-size: 2.6rem; line-height: 1; color: var(--ak-accent-text); margin: 18px 0 12px;
    }
    /* Three buttons at 6.5rem plus their padding want 404px, and a card on this wall is 337px
       at three cards to a row: the control stood out over its neighbour and covered the
       odometer's numeral. It keeps its size where there is room and folds onto a second line
       where there is not, so every label stays readable and every target stays 38px. */
    .db-seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; gap: 4px; padding: 4px; margin: 26px 0 10px; border-radius: var(--ak-radius-sm); background: var(--ak-surface-2); border: var(--ak-line-w) solid var(--ak-line); }
    .db-seg__b {
      min-width: 6.5rem; min-height: 38px; padding: 0 14px; border: 0; border-radius: var(--ak-radius-sm);
      background: transparent; color: var(--ak-ink); font: inherit; font-family: var(--ak-font-mono);
      font-size: var(--ak-text-fine); font-weight: 700; cursor: pointer;
    }
    .db-seg__b[aria-pressed='true'] { color: var(--ak-crt-set); }
    .db-deal { display: flex; gap: 10px; margin: 26px 0 10px; }
    .db-deal > span { display: block; width: 52px; height: 40px; border-radius: var(--ak-radius-sm); }
    /* ── THE GALLERY FRONT (broadcast face), built to the Atelier Next canvas board by board:
       the broadcast bar, the masthead with the sticker, the exhibits under gallery light, the
       signal strip for the one loud action. ── */
    /* THE FACES, to the canvas: Archivo Black for display, Archivo for reading, JetBrains Mono
       for the machine lines — all three self-hosted by the node. Without this the kit's display
       face on this palette is Space Grotesk, which is not the canvas. */
    [data-ak-look='broadcast'] {
      --ak-font-display: 'Archivo Black', Archivo, system-ui, sans-serif;
      --ak-font: Archivo, system-ui, sans-serif;
      --ak-font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --ak-weight-display: 400;
    }
    /* The bar itself, to the canvas: one row — wordmark, the on-air line, the navigation at the
       right, the search box — a hairline under it and no printed shadow. */
    [data-ak-look='broadcast'] .ak-app__bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px 20px;
      padding: 14px 34px; box-shadow: none;
      border-bottom: 1px solid color-mix(in oklab, var(--ak-ink) 14%, transparent);
      background: transparent;
    }
    /* THE STATUS BAND DOES NOT PUSH THE PAGE. It carries one card — loading, empty, the sign-in
       state, an error — and every one of them appears after the first paint and leaves again,
       which moved the whole page 44px down and 44px back: the last 0.08 of layout shift once
       the bar and the fonts were settled. It floats over the top of the page instead, which is
       where a loading banner belongs, and the page under it never moves. */
    .ak-app { position: relative; }
    .ak-app__status { position: absolute; left: 0; right: 0; z-index: 4; }
    .ak-app__status:empty { display: none; }
    [data-ak-look='broadcast'] .ak-app__title {
      font-family: var(--ak-font-display); font-weight: var(--ak-weight-display);
      font-size: 21px; text-transform: uppercase; letter-spacing: .01em; white-space: nowrap;
    }
    /* THE BAR IS TWO ROWS ON PURPOSE, and always the same two. It used to be one row that
       wrapped whenever the sign-in pill finished mounting or a webfont landed, and the wrap
       threw the pill from the top right to a second row: 0.85 of layout shift at 1440. The
       navigation takes a whole line of its own, the pill stays at the right of the first, and
       nothing that arrives late can change which row anything is on. The line also gives the
       ten tabs and the search box their real size back — they were being squeezed to 10.5px
       and seven characters to keep a row that was never staying on one line anyway. */
    [data-ak-look='broadcast'] .ak-app__bar .db-nav {
      flex: 1 0 100%; order: 1; margin: 0; display: flex; align-items: center; gap: 0;
    }
    [data-ak-look='broadcast'] .ak-app__bar .db-nav .ak-tabs { flex-wrap: wrap; gap: 0; }
    [data-ak-look='broadcast'] .ak-app__bar .ak-app__pill { margin-left: auto; }
    /* The shared auth pill keeps all its controls, including the palette picker. */
    @media (max-width: 1300px) { [data-ak-look='broadcast'] .db-onair { display: none; } }
    [data-ak-look='broadcast'] .db-search {
      display: inline-flex; align-items: center; gap: 8px; margin-left: 18px;
      padding: 9px 12px; border: 1.5px solid color-mix(in oklab, var(--ak-ink) 28%, transparent); border-radius: 3px;
      background: transparent; color: var(--ak-ink-dim);
      font-family: var(--ak-font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
    }
    [data-ak-look='broadcast'] .db-search input {
      width: 18ch; box-sizing: content-box; padding: 0; border: 0;
      background: transparent; color: var(--ak-ink); font: inherit; outline: none; text-transform: none;
    }
    [data-ak-look='broadcast'] .db-search input::placeholder { color: var(--ak-ink-dim); text-transform: uppercase; }
    /* THE OVERFLOW CONTROL. It stands in the row as one more tab and opens the ones that did
       not fit, under itself. It is a native disclosure, so a keyboard reaches it, Enter opens
       it and its open state is announced without a hand-built widget. */
    .db-more { position: relative; flex: 0 0 auto; }
    /* It wears whatever the face wears: a pill beside the classic pills, bare mono type in the
       broadcast bar. A control that does not belong to its row reads as something bolted on. */
    .db-more__btn {
      display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px;
      list-style: none; cursor: pointer; white-space: nowrap; color: var(--ak-ink-dim);
      background: var(--ak-surface); border: var(--ak-line-w) solid var(--ak-line);
      border-radius: 999px; font-size: 14px;
    }
    [data-ak-look='broadcast'] .db-more__btn {
      padding: 0 4px; background: transparent; border: 0; border-radius: 0;
      font-family: var(--ak-font-mono); font-size: 11.5px; font-weight: 500;
      letter-spacing: .07em; text-transform: uppercase;
    }
    .db-more__btn::-webkit-details-marker { display: none; }
    .db-more__btn::after { content: ''; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); }
    .db-more[open] .db-more__btn::after { transform: translateY(1px) rotate(225deg); }
    .db-more__btn:hover, .db-more[open] .db-more__btn { color: var(--ak-ink); }
    .db-more__btn:focus-visible { outline: 2px solid var(--ak-accent); outline-offset: 2px; }
    .db-more__menu {
      position: absolute; top: 100%; inset-inline-end: 0; z-index: 30;
      display: grid; gap: 2px; min-width: 12rem; padding: 6px;
      background: var(--ak-surface); border: var(--ak-line-w) solid var(--ak-line);
      border-radius: var(--ak-radius-sm); box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
    }
    .db-more__item {
      display: block; width: 100%; min-height: 40px; padding: 8px 12px; text-align: start;
      background: transparent; border: 0; border-radius: var(--ak-radius-sm); cursor: pointer;
      color: var(--ak-ink); font-size: 14px; white-space: nowrap;
    }
    [data-ak-look='broadcast'] .db-more__item {
      font-family: var(--ak-font-mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase;
    }
    .db-more__item:hover { background: var(--ak-surface-2); }
    .db-more__item:focus-visible { outline: 2px solid var(--ak-accent); outline-offset: -2px; }
    [data-ak-look='broadcast'] .db-nav .db-more { margin-left: 20px; }

    .db-foot { display: flex; justify-content: flex-end; padding: 18px 0 6px; }
    [data-ak-look='broadcast'] .db-wordmark__star { color: var(--ak-crt-ch2); }
    .db-onair { display: none; }
    [data-ak-look='broadcast'] .db-onair {
      display: inline-block; margin-left: 14px;
      font-family: var(--ak-font-mono); font-size: 11px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ak-crt-ch4);
    }
    [data-ak-look='broadcast'] .db-nav .ak-tab {
      background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
      padding: 12px 2px; margin: 0 0 0 20px; min-height: 0; box-shadow: none;
      font-family: var(--ak-font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .07em;
      text-transform: uppercase; color: color-mix(in oklab, var(--ak-ink) 60%, transparent); white-space: nowrap;
    }
    [data-ak-look='broadcast'] .db-nav .ak-tab:first-child { margin-left: 0; }
    [data-ak-look='broadcast'] .db-nav .ak-tab--active,
    [data-ak-look='broadcast'] .db-nav .ak-tab[aria-selected='true'] { color: var(--ak-crt-ch3); border-bottom-color: var(--ak-crt-ch3); background: transparent; }
    /* THE CURRENT TAB IS THE EASIEST TAB TO READ, and on paper it was the hardest.
       The channel yellow is a GROUND colour: the shelf tiles, the sticker and the on-air chip
       all put ink on it, and on the dark set it is the face's character and measures 12.59:1.
       On paper the same yellow measured 1.02:1 against the bar's own gradient, which is the
       whole of the defect. So on the light ground the current tab is full-strength ink where
       every other tab is that ink at 60 %, and the underline is carried by the accent, which
       the kit already deepens on paper for exactly this kind of reason. The dark set is not
       touched: light is the kit's default, so the rule is written as the exception to dark. */
    :root:not([data-theme='dark']) [data-ak-look='broadcast'] .db-nav .ak-tab--active,
    :root:not([data-theme='dark']) [data-ak-look='broadcast'] .db-nav .ak-tab[aria-selected='true'] {
      color: var(--ak-ink); border-bottom-color: var(--ak-accent);
    }
    [data-ak-look='broadcast'] .db-lookswitch {
      font-family: var(--ak-font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      border: 1.5px solid var(--ak-line); border-radius: 3px; padding: 10px 14px; color: var(--ak-ink-dim);
    }
    /* Welcome in the gallery: one column, the shelf list folded away, the stage is the room. */
    .db-columns--gallery { grid-template-columns: 1fr; height: auto; }
    .db-columns--gallery .db-left { display: none; }
    .db-columns--gallery .db-stage { height: auto; overflow: visible; }
    [data-ak-look='broadcast'] .db-columns--gallery .db-stage > .ak-section:first-of-type {
      background: transparent; border: 0; box-shadow: none; padding: 0;
    }
    [data-ak-look='broadcast'] .db-columns--gallery .db-stage > .ak-section:first-of-type > .ak-section__title,
    [data-ak-look='broadcast'] .db-columns--gallery .db-stage > .ak-section:first-of-type > .ak-section__hint { display: none; }
    .db-mast { position: relative; padding: 26px 0 8px; }
    .db-mast__lead {
      margin: 0; font-family: var(--ak-font-display); font-weight: var(--ak-weight-display);
      font-size: clamp(2.8rem, 6.4vw, 5.8rem); line-height: .92; letter-spacing: -.015em; text-transform: uppercase;
      color: var(--ak-ink);
    }
    .db-mast__lead-2 { display: block; color: var(--ak-crt-ch3); text-shadow: 4px 4px 0 color-mix(in oklab, var(--ak-crt-ch2) 55%, transparent); }
    .db-mast__sub { margin: 16px 0 0; max-width: 60ch; font-size: 15px; line-height: 1.6; color: var(--ak-ink-dim); }
    .db-mast__sticker {
      position: absolute; right: 0; top: 22px; transform: rotate(3deg);
      background: var(--ak-crt-ch3); color: var(--ak-crt-set);
      padding: 14px 18px; font-family: var(--ak-font-mono); font-size: 12px; font-weight: 700; letter-spacing: .04em;
      line-height: 1.35; text-transform: uppercase;
      box-shadow: 6px 6px 0 color-mix(in oklab, var(--ak-crt-ch2) 85%, transparent);
    }
    /* `small` shrank this to 10px, the only text left under eleven on the page. */
    .db-mast__sticker small { display: block; font-size: 11px; font-weight: 500; text-transform: none; }
    @media (max-width: 900px) { .db-mast__sticker { position: static; display: inline-block; margin-top: 14px; } }
    .db-exhibits { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 30px 26px; padding: 34px 0 26px; }
    .db-exhibit {
      display: flex; flex-direction: column; padding: 0; text-align: left; cursor: pointer;
      background: var(--ak-surface); color: var(--ak-ink); font: inherit;
      border: 1.5px solid var(--ak-line); border-radius: 6px; overflow: hidden;
      transition: transform 220ms cubic-bezier(.34, 1.3, .5, 1), box-shadow 220ms;
    }
    .db-exhibit:nth-child(4n+1) { transform: rotate(-1.2deg); box-shadow: 8px 8px 0 color-mix(in oklab, var(--ak-crt-ch1) 42%, transparent); }
    .db-exhibit:nth-child(4n+2) { transform: rotate(.8deg); box-shadow: 8px 8px 0 color-mix(in oklab, var(--ak-crt-ch3) 45%, transparent); }
    .db-exhibit:nth-child(4n+3) { transform: rotate(-.6deg); box-shadow: 8px 8px 0 color-mix(in oklab, var(--ak-crt-ch4) 42%, transparent); }
    .db-exhibit:nth-child(4n+4) { transform: rotate(1deg); box-shadow: 8px 8px 0 color-mix(in oklab, var(--ak-crt-ch2) 55%, transparent); }
    .db-exhibit:hover { transform: rotate(0deg) translateY(-6px); box-shadow: 0 0 0 2px var(--ak-crt-ch3), 0 18px 50px color-mix(in oklab, var(--ak-crt-set) 60%, transparent); }
    .db-exhibit__frame { position: relative; overflow: hidden; background: var(--ak-surface-2); }
    .db-exhibit__frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; }
    .db-exhibit__foot {
      display: flex; align-items: baseline; gap: 8px; padding: 10px 12px;
      background: color-mix(in oklab, var(--ak-ink) 5%, var(--ak-surface));
      border-top: 1px solid var(--ak-line);
    }
    /* The channel yellow is a GROUND colour (the signal sheet paints with it and puts ink on
       top). As text it sat at 1.15 against the exhibit's own pale foot in the light theme, so
       the name is set in ink and the kind beside it stays dim — the pair the foot was built for. */
    .db-exhibit__name { font-family: var(--ak-font-mono); font-size: 12px; font-weight: 700; color: var(--ak-ink); }
    .db-exhibit__kind { font-size: var(--ak-text-fine); color: var(--ak-ink-dim); }
    /* v2026-09-08: use actions live inside a disclosure in both faces. Keep the kit's
       surface/ink pairs; the old yellow strip's dark ink is unreadable on this surface. */
    .db-strip { display: block; color: var(--ak-ink); }
    .db-strip .db-adopt__name { color: var(--ak-ink); }
    .db-strip select, .db-strip option { color: var(--ak-ink); background: var(--ak-surface); }
    .db-strip select { box-sizing: border-box; width: 100%; min-width: 0; }
    .db-strip .ak-field { min-width: 0; }
    .db-strip .ak-form { max-width: 40rem; }
    .db-device-controls > .ak-btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }

    /* The compare demo: two named states, the frame sized for the wall. */
    .db-cmp__frame { height: 170px; }
    .db-cmp {
      width: 100%; height: 100%; display: grid; place-items: center;
      font-family: var(--ak-font-display); font-weight: var(--ak-weight-display); letter-spacing: .04em;
    }
    .db-cmp--before { background: var(--ak-surface-2); color: var(--ak-ink-dim); }
    .db-cmp--after { background: radial-gradient(at 25% 30%, color-mix(in oklab, var(--ak-accent) 40%, var(--ak-crt-set)), var(--ak-crt-set)); color: var(--ak-crt-ch3); }

    /* v2026-09-08: the phone has one category, one detail and one main scroller. */
    .db-mobile-nav, .db-mobile-search { display: none; }
    .db-strip { display: block; }
    .db-strip:empty { display: none; }
    .db-foot { flex-wrap: wrap; gap: 12px; align-items: flex-start; }
    .db-columns { height: auto; align-items: start; }
    .db-stage { height: auto; overflow: visible; }
    .db-stage > .ak-section:first-of-type { flex: none; }
    [data-ak-look='broadcast'] .db-strip { position: static; }
    .db-shelf { max-height: 70dvh; }
    .db-detail-nav, .db-device-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .db-preview-viewport { min-width: 0; width: 100%; overflow: auto; }
    .db-preview-viewport .db-preview-frame { display: block; margin: 0 auto; width: 100%; min-height: 460px; height: 60dvh; border: 0; }
    .db-preview-viewport[data-device='phone'] .db-preview-frame { width: min(390px, 100%); }
    .db-preview-viewport[data-device='desktop'] .db-preview-frame { width: 1100px; max-width: none; }
    .db-detail-actions { margin-top: 12px; }
    .db-detail-actions > summary, .db-demo-group > summary { cursor: pointer; padding: 12px; min-height: 44px; font-weight: 700; }
    .db-view-settings > summary { cursor: pointer; padding: 12px; min-height: 44px; }
    /* v2026-09-08: footer controls share ghost styling and geometry; inline baselines
       and the shell's filled button styles do not belong in this action row. */
    .db-view-controls { display: flex; align-items: center; gap: 8px; padding: 0 12px 12px; }
    [data-ak-look] .db-view-controls > button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-sizing: border-box; height: 44px; min-height: 44px; min-width: 44px;
      margin: 0; padding: 8px 12px; background: transparent; color: var(--ak-ink);
      border: 1px solid var(--ak-line); border-radius: var(--ak-radius-sm);
      box-shadow: none; transform: none;
    }
    [data-ak-look] .db-view-controls > button[aria-pressed='true'] { border-color: var(--ak-accent-text); }
    [data-ak-look] .db-view-controls > button[hidden] { display: none; }

      .db-nav[data-search='open'] .db-mobile-search { display: block; width: 100%; }

      .db-mobile-nav { display: flex; flex: 1 0 100%; gap: 8px; min-width: 0; align-items: center; }

      .db-nav > .ak-tabs { display: none !important; }
      /* The phone has no tab row to overflow: the picker lists every tab, so the control that

      .db-nav > .db-more { display: none !important; }
      .db-nav { width: 100%; min-width: 0; }

      .ak-app__bar .ak-app__title { font-size: 16px; min-width: 0; flex: 0 1 auto; }

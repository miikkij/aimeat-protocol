      try { saved = localStorage.getItem('db.face'); } catch (e) { saved = null; }
      if (saved === 'classic') return 'classic';
      return kitAtLeast(40) ? 'broadcast' : 'classic';
    }
    // The opening curtain: the Book comes up behind it and the halves part once the fonts are in.
    if (kitAtLeast(46) && K.intro) K.intro({ kind: 'halves', colour: 'ink' });
    var a = K.app({
      title: 'Design Book',
      look: LOOKS[prefFace()],
      requireLogin: false,
      onReady: function (session) { boot(session); watchSession(); },
    });

    function watchSession() {
      var last = (AIMEAT.auth.getSession() || {}).jwt || '';
      setInterval(function () {
        var now = (AIMEAT.auth.getSession() || {}).jwt || '';
        if (now !== last) { last = now; boot(AIMEAT.auth.getSession()); }
      }, 3000);
    }

    function boot(session) {
      a.status('loading');
      api('/v1/designbook?limit=200').then(function (r) {
        if (r.status === 404) {
          // A node whose update has not landed yet: say so instead of looking broken.
          a.status('empty', { title: dbText('The Book has not opened here yet'),
            hint: dbText('This node does not carry the Design Book yet. It arrives with the next platform update.') });
          return;
        }
        if (r.status === 401) {
          // A node that still gates the shelf behind a session: the designed sign-in card,
          // never a blank wall or a raw error.
          a.status('signin');
          return;
        }
        if (r.status !== 200) {
          a.status('error', { title: dbText('The Book did not answer'),
            hint: (r.body && r.body.error && r.body.error.message) || ('Status ' + r.status),
            onRetry: function () { boot(session); } });
          return;
        }
        state.session = session;
        // Dead is invisible: the server now drops retired parts from the browse, and this
        // filter keeps them out on a node whose update has not landed yet.
        state.parts = ((r.body.data && r.body.data.parts) || [])
          .filter(function (p) { return p.status !== 'retired'; });
        a.status('none');
        render(session);
        loadMyApps(session);
        loadCatalogue();
      });
    }

    /** The mosaic catalogue, once: the ambient shelf's presets and the look sheets live there. */
    function loadCatalogue() {
      if (state.catalogue) return;
      fetch('/v1/apps/ui/catalogue').then(function (r) { return r.json(); }).then(function (b) {
        state.catalogue = (b && b.data && b.data.catalogue) || null;
      }).catch(function () {});
    }
    /** The first look the registry says a preset fits — where an ambient part that names no
     *  look is previewed, the same choice the server's preview makes. */
    /** The first look the catalogue says an effect fits — the look its seed was proven on. */
    function firstFitEffect(id) {
      var entries = (state.catalogue && state.catalogue.effects && state.catalogue.effects.entries) || [];
      var e = entries.filter(function (x) { return x.id === id; })[0];
      return (e && e.fits_looks && e.fits_looks[0]) || 'vivid';
    }

    function firstFit(preset) {
      var list = (state.catalogue && state.catalogue.ambients && state.catalogue.ambients.presets) || [];
      var hit = list.filter(function (p) { return p.id === preset; })[0];
      return (hit && hit.fits_looks && hit.fits_looks[0]) || 'vivid';
    }

    function loadMyApps(session) {
      var owner = session && (session.owner || session.username);
      if (!owner) return;
      api('/v1/apps?owner=' + encodeURIComponent(owner)).then(function (r) {
        var apps = (r.body && r.body.data && r.body.data.apps) || [];
        state.myApps = apps.map(function (x) { return x.filename; }).filter(Boolean);
        fillAdoptSelect();
      });
    }

    function visibleParts() {
      var q = state.q.toLowerCase();
      return state.parts.filter(function (p) {
        if (state.kind && p.kind !== state.kind) return false;
        if (!q) return true;
        return (p.id + ' ' + p.title + ' ' + p.summary + ' ' + (p.tags || []).join(' ')).toLowerCase().indexOf(q) >= 0;
      });
    }

    // The shelf, grouped: one heading per kind, in the order a builder actually reaches for
    // them. A part's KIND is what a person browses by, so the group IS the navigation.
    var GROUPS = [
      // Genres lead: they are the loudest proof of what this system can do.
      { kind: 'genre', label: 'Genres', hint: 'Whole pages in a committed register — forked, never merged' },
      { kind: 'fill', label: 'Starting shapes', hint: 'A finished shape with slots to fill' },
      { kind: 'layout', label: 'Arrangements', hint: 'A whole screen, filled' },
      { kind: 'look', label: 'Looks', hint: 'A signature: colour, shape, type' },
      { kind: 'motion', label: 'Motion', hint: 'How things arrive' },
      { kind: 'ambient', label: 'Ambient', hint: 'A quiet animation behind the app: the look carries one, a part changes it' },
      { kind: 'effect', label: 'Effects', hint: 'A post-process filter: still on the words, a moment on a cue, living only behind them' },
      { kind: 'illustration', label: 'Illustration', hint: 'Art direction for the pictures' },
      // The ninth kind, and the only one the Book did not make for itself: a piece an app made
      // by hand because the Book had nothing for it, offered to whoever comes next. The label
      // says WHO made it, because "Components" upstairs is the kit's own and these are not.
      { kind: 'component', label: 'Made by apps', hint: 'A piece an app made itself and offered on: markup and a stylesheet, no script' },
    ];

    // The bar, complete, in the same pass that made the frame: nothing in it waits for the
    // shelf, and anything hung there later moves the pill and the page under the reader's eye.
    mountChrome();

    // THE BAR IS BUILT BEFORE THE FIRST PAINT, not after the shelf arrives. Everything in it —
    // the category pages, the search box, the face switch — is static: it needs no session and
    // no fetch. Building it inside render() meant the app bar gained a whole row four hundred
    // milliseconds late, re-wrapped, and threw the sign-in pill from the top right to the second
    // row: 0.85 of layout shift at 1440, measured, against a criterion of 0.1. Called once at
    // boot, and again only when the face switch moves the row between the bar and the page.
    function mountChrome() {
      var old = document.querySelector('.db-nav');
      if (old && old.parentNode) old.parentNode.removeChild(old);

      // THE CATEGORY PAGES, up top where navigation belongs (the developer asked for these
      // by name): one tab per shelf, Genres first, Everything last. Picking a tab IS picking
      // what you are looking at — the left list then carries only that category.
      var nav = document.createElement('nav');
      nav.className = 'db-nav';
      ui.navEl = nav;
      // In the broadcast bar the labels are the canvas's short ones, so the row stays one row.
      // MEASURED, 2026-09-20: the fourteenth tab puts this bar onto a second row at 1280 (nav
      // 43px to 78px against v53) in both languages, and a short name for it does not win the
      // row back. So the tab keeps the name that says what the shelf is, and the bar is a row
      // taller between about 1300 and the point where everything fits again. Nothing overlaps.
      var SHORT = { fill: dbText('Shapes') };
      var tabItems = [{ id: 'genre', label: dbText('Genres') }, { id: '_living', label: dbText('Living') },
        { id: '_components', label: dbText('Components') }, { id: '_phaser', label: 'Phaser' },
        { id: '_reasons', label: dbText('Reasons') }]
        .concat(GROUPS.slice(1).map(function (g) { return { id: g.kind, label: (isBroadcast() && SHORT[g.kind]) || dbText(g.label) }; }))
        .concat([{ id: '', label: dbText('Everything') }]);
      function pickCategory(id) {
        state.page = id;
        partRequest++;
        if (ui.detailNav) ui.detailNav.remove();
        if (ui.adopt) { ui.adopt.el.hidden = true; ui.adopt.el.style.display = "none"; }
        state.picked = null;
        if (ui.mobileCategory) ui.mobileCategory.value = id;
        if (id !== '_phaser') hidePhaser();
        if (id !== '_living') hideLiving();
        if (id !== '_reasons') hideReasons();
        // Each of these four leaves through its own door, so each one re-fits the row on the way
        // out. Measured on v58: without this the row stayed unfolded on every visit that picked
        // a page tab, because the function returned before the fit at the foot.
        if (id === '_phaser') { hideComponents(); showPhaser(); fitRow(); return; }
        if (id === '_living') { hideComponents(); showLiving(); fitRow(); return; }
        if (id === '_reasons') { hideComponents(); showReasons(); fitRow(); return; }
        if (id === '_components') { showComponents(); fitRow(); return; }
        hideComponents();
        state.kind = id || '';
        if (state.picked && state.kind && state.picked.kind !== state.kind) {
          state.picked = null;
          if (ui.adopt) { ui.adopt.el.hidden = true; ui.adopt.el.style.display = 'none'; }
          showWelcome();
        }
        refreshShelf(state.session);
        // In the gallery the category page IS the exhibits grid: a tab change re-hangs the wall.
        if (!state.picked) showWelcome();
        // The row keeps the tab you are on: picking one that was folded away brings it back.
        fitRow();
      }
      ui.nav = K.tabs({ target: nav, items: tabItems, onChange: pickCategory });
      ui.pickCategory = pickCategory;

      // ────────────────────────────────────────────────────────────────────────────────────────
      // THE ROW HOLDS ONE ROW, AT ANY WIDTH AND IN EITHER LANGUAGE.
      //
      // The bar lays the tab list and the search box side by side and drops the search box onto
      // a second line the moment the tabs outgrow the room. Measured at 1280 the day the
      // fourteenth tab arrived: the list wanted 1170px beside a 172px search box in 1212px of
      // room, so the bar went from 110px to 145px in both languages. A shorter name for one tab
      // did not win the row back, and a fifteenth kind is coming.
      //
      // So the row measures itself instead of being guessed at. Whatever does not fit goes under
      // one control, taken from the END so the order people know is never shuffled, and never
      // the tab you are on, so the current tab is always visible as current. Widen the window
      // and the tabs come back. Below 760 the whole row is hidden and the phone picker, which
      // always lists every tab, is the navigation.
      // ────────────────────────────────────────────────────────────────────────────────────────
      var more = document.createElement('details');
      more.className = 'db-more';
      var moreBtn = document.createElement('summary');
      moreBtn.className = 'db-more__btn';
      moreBtn.textContent = dbText('More');
      more.appendChild(moreBtn);
      var moreMenu = document.createElement('div');
      moreMenu.className = 'db-more__menu';
      moreMenu.setAttribute('role', 'group');
      moreMenu.setAttribute('aria-label', dbText('More'));
      more.appendChild(moreMenu);
      more.style.display = 'none';
      nav.appendChild(more);
      ui.more = more;
      more.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && more.open) { more.open = false; moreBtn.focus(); }
      });

      /** One folded-away tab, as the same choice it is in the row. */
      function moreItem(tab) {
        var id = tab.getAttribute('data-ak-id') || '';
        var item = K.el('button', { type: 'button', class: 'db-more__item' }, tab.textContent);
        item.addEventListener('click', function () {
          more.open = false;
          ui.nav.set({ value: id });
          pickCategory(id);
        });
        return item;
      }

      function fitRow() {
        var list = nav.querySelector('.ak-tabs');
        // Below 760 the tabs are display:none and the picker is the navigation: nothing to fit.
        if (!list || !list.offsetParent) { more.style.display = 'none'; return; }
        var tabs = Array.prototype.slice.call(list.children);
        tabs.forEach(function (tab) { tab.style.display = ''; });
        more.style.display = 'none';
        moreMenu.replaceChildren();
        var outer = tabs.map(function (tab) {
          var cs = getComputedStyle(tab);
          return tab.offsetWidth + (parseFloat(cs.marginLeft) || 0) + (parseFloat(cs.marginRight) || 0);
        });
        var total = outer.reduce(function (sum, w) { return sum + w; }, 0);
        var room = nav.clientWidth;
        // The search box shares the row, so it is part of the room the tabs have to leave.
        var search = nav.querySelector('.db-search');
        if (search && search.offsetParent) {
          var scs = getComputedStyle(search);
          room -= search.offsetWidth + (parseFloat(scs.marginLeft) || 0) + (parseFloat(scs.marginRight) || 0);
        }
        if (total <= room) return;
        more.style.display = '';
        var mcs = getComputedStyle(more);
        room -= more.offsetWidth + (parseFloat(mcs.marginLeft) || 0) + (parseFloat(mcs.marginRight) || 0);
        var folded = [];
        for (var i = tabs.length - 1; i >= 0 && total > room; i--) {
          if (tabs[i].getAttribute('aria-selected') === 'true') continue;
          tabs[i].style.display = 'none';
          total -= outer[i];
          folded.unshift(tabs[i]);
        }
        if (!folded.length) { more.style.display = 'none'; return; }
        folded.forEach(function (tab) { moreMenu.appendChild(moreItem(tab)); });
      }
      ui.fitRow = fitRow;
      // The widths are real only once the three faces have landed, and again whenever the window
      // changes. One listener for the session, reading whichever row is mounted now.
      requestAnimationFrame(fitRow);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitRow(); });

      // THE ROW RE-FITS WHEN ITS BOX CHANGES, not only when the window does.
      //
      // Measured on v58, on production, and it is two faults in one symptom. Picking a tab left
      // the row on two lines (nav 43px to 83px, all fourteen tabs shown, the search box on a
      // second line) on every visit. First, the four page tabs return from pickCategory before
      // the fit at its foot. Second, and this is the one a re-read of the code would not find:
      // THE KIT REBUILDS EVERY TAB NODE when the selection changes. Twenty-eight childList
      // mutations, a fresh first child, and a marker attribute gone, which takes the fold's
      // inline display with it. So a fit called on the pick runs BEFORE the rebuild that undoes
      // it, and calling it harder does not help.
      //
      // A ResizeObserver on the nav answers both, because both end in the same fact: the nav's
      // box changed. It also catches a scrollbar appearing, which no window resize event ever
      // reports. The fit is idempotent, so the second pass finds nothing to change and it
      // settles; the flag is there so a fit can never observe itself.
      if (ui.rowObserver) ui.rowObserver.disconnect();
      if (typeof ResizeObserver === 'function') {
        var fitting = false;
        ui.rowObserver = new ResizeObserver(function () {
          if (fitting) return;
          fitting = true;
          try { fitRow(); } finally { fitting = false; }
        });
        ui.rowObserver.observe(nav);
      }
      if (!ui.rowWatch) {
        ui.rowWatch = true;
        var pending = 0;
        addEventListener('resize', function () {
          clearTimeout(pending);
          pending = setTimeout(function () { if (ui.fitRow) ui.fitRow(); }, 120);
        });
        document.addEventListener('click', function (e) {
          if (ui.more && ui.more.open && !ui.more.contains(e.target)) ui.more.open = false;
        });
      }
      var mobile = K.el('div', { class: 'db-mobile-nav' });
      var picker = K.el('select', { 'aria-label': dbText('Category') });
      tabItems.forEach(function (item) { picker.appendChild(K.el('option', { value: item.id }, item.label)); });
      picker.value = state.kind || 'genre';
      picker.addEventListener('change', function () { ui.nav.set({ value: picker.value }); pickCategory(picker.value); });
      ui.mobileCategory = picker;
      mobile.appendChild(picker);
      mobile.appendChild(K.el('button', { type: 'button', class: 'ak-btn ak-btn--ghost', on: { click: function () {
        var open = nav.getAttribute('data-search') !== 'open';
        nav.setAttribute('data-search', open ? 'open' : 'closed');
        var input = nav.querySelector('input[type=search]');
        if (open && input) input.focus();
      } } }, dbText('Search')));
      nav.appendChild(mobile);
      if (state.page === undefined && !state.kind) state.kind = 'genre';

      // The face switch, beside the category pages: broadcast or classic, remembered here.
      if (kitAtLeast(40)) {
        var faceBtn = document.createElement('button');
        faceBtn.type = 'button';
        faceBtn.className = 'ak-btn ak-btn--ghost db-lookswitch';
        var paintFace = function () {
          var f = prefFace();
          faceBtn.textContent = f === 'broadcast' ? dbText('Face: broadcast · switch to classic') : dbText('Face: classic · switch to broadcast');
        };
        faceBtn.addEventListener('click', function () {
          var next = prefFace() === 'broadcast' ? 'classic' : 'broadcast';
          try { localStorage.setItem('db.face', next); } catch (e) { /* the choice just does not persist */ }
          a.set({ look: LOOKS[next] });
          // The two faces hang the navigation row in different places, so the bar is rebuilt
          // with the page. This is a hand's move, not a load: a shift here is not a surprise.
          mountChrome();
          render(state.session);
        });
        paintFace();
        if (isBroadcast()) {
          // The broadcast bar: the navigation rides in the app bar beside the wordmark, with the
          // search box; the face switch goes to the foot of the page, out of the canvas's row.
          var search = document.createElement('label');
          search.className = 'db-search';
          var sIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          sIcon.setAttribute('width', '14'); sIcon.setAttribute('height', '14'); sIcon.setAttribute('viewBox', '0 0 16 16');
          sIcon.innerHTML = '<circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.8"/>';
          var sInput = document.createElement('input');
          sInput.type = 'search';
          sInput.placeholder = dbText('Search the Book');
          sInput.setAttribute('aria-label', dbText('Search the Book'));
          sInput.value = state.q || '';
          sInput.addEventListener('input', function () {
            state.q = sInput.value || '';
            refreshShelf(state.session);
            if (!state.picked) showWelcome();
          });
          document.addEventListener('keydown', function (e) {
            if (e.key === '/' && document.activeElement !== sInput && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); sInput.focus(); }
          });
          search.appendChild(sIcon);
          search.appendChild(sInput);
          nav.appendChild(search);
          var bar = document.querySelector('.ak-app__bar');
          var pill = bar ? bar.querySelector('.ak-app__pill') : null;
          if (bar && pill) bar.insertBefore(nav, pill);
          var foot = document.createElement('div');
          foot.className = 'db-foot';
          foot.appendChild(faceBtn);
          ui.foot = foot;
        } else {
          var foot = document.createElement('div');
          foot.className = 'db-foot'; foot.appendChild(faceBtn); ui.foot = foot;
          var classicSearch = K.el('div', { class: 'db-mobile-search' });
          K.searchBar({ target: classicSearch, placeholder: dbText('Search the Book'), onChange: function(q) { state.q = q || ''; refreshShelf(state.session); if (!state.picked) showWelcome(); } });
          nav.appendChild(classicSearch);
        }
      }
      // The wordmark's own dressing belongs to the bar too, and to the same first paint.
      dressHeader();
      // These are the shell's original controls, including its event handlers. Classic
      // rebuilds detach the old footer before mounting chrome; querying the document then
      // loses both controls. Retain the disclosure and move it into each new footer.
      if (!ui.viewSettings) {
        ui.viewSettings = K.el('details', { class: 'db-view-settings' });
        ui.viewSettings.appendChild(K.el('summary', {}, dbText('Viewing options')));
        var controls = K.el('div', { class: 'db-view-controls' });
        ui.viewSettings.appendChild(controls);
        ['.ak-app__weather', '.ak-app__motion'].forEach(function (selector) {
          var control = document.querySelector(selector);
          if (control) { control.classList.add('ak-btn', 'ak-btn--ghost'); controls.appendChild(control); }
        });
      }
      if (ui.foot) ui.foot.appendChild(ui.viewSettings);
      ui.viewSettings.querySelector('summary').textContent = dbText('Viewing options');
    }

    // TWO COLUMNS, and NO second title: the app frame's bar already says Design Book, so a hero
    // repeating it was the app talking over itself (and eating half the screen to do it). The
    // shelf stands on the left, the stage on the right; on a phone they stack, shelf first.
    function render(session) {
      // A re-boot (sign-in arriving, sign-out) rebuilds the page whole. The BAR is not rebuilt
      // with it: mountChrome() hung it before the first paint and it has not moved since.
      hideComponents();
      while (a.main.firstChild) a.main.removeChild(a.main.firstChild);
      if (!ui.navEl || !ui.navEl.parentNode) mountChrome();
      // In the classic face the navigation row stands at the top of the page, not in the bar.
      if (!isBroadcast() && ui.navEl) a.main.appendChild(ui.navEl);

      // A reboot (sign-in, sign-out) rebuilds the pane: a cabinet from the previous build would
      // stay referenced but detached, and the Phaser tab then showed an empty page.
      hidePhaser();
      hideLiving();
      hideReasons();
      var wrap = document.createElement('div');
      wrap.className = 'db-columns';
      a.main.appendChild(wrap);
      ui.columns = wrap;
      ui.comps = null;

      // The LEFT column holds the shelf AND the adopt form: picking happens on the left, the
      // stage on the right is all preview. The search stays pinned; only the groups scroll.
      var left = document.createElement('div');
      left.className = 'db-left';
      wrap.appendChild(left);

      var shelf = document.createElement('aside');
      shelf.className = 'db-shelf';
      left.appendChild(shelf);

      var stage = document.createElement('div');
      stage.className = 'db-stage';
      wrap.appendChild(stage);

      K.searchBar({ target: shelf, placeholder: dbText('Search the Book'), onChange: function (q) {
        state.q = q || ''; refreshShelf(session);
      }});
      ui.shelfBody = document.createElement('div');
      ui.shelfBody.className = 'db-shelf__groups';
      shelf.appendChild(ui.shelfBody);
      refreshShelf(session);

      ui.detail = K.section({ target: stage, title: dbText('Pick a part'),
        hint: dbText('Explore a part, try its phone layout and open its measured checks.') });
      // Both faces keep the use action beside the selected part.
      ui.strip = document.createElement('div');
      ui.strip.className = 'db-strip';
      stage.appendChild(ui.strip);
      showWelcome();
      ui.adopt = K.section({ target: left, title: dbText('Take it into your app'),
        hint: dbText('An arrangement replaces the app’s stored layout (archived, one restore back); a look, motion, illustration or ambient merges in.') });
      ui.adopt.el.hidden = true; ui.adopt.el.style.display = 'none';
      buildAdoptForm(session);
      // The face switch closes the page in the broadcast face — under everything, never in the bar.
      if (ui.foot) a.main.appendChild(ui.foot);
    }

    /** Whether the page wears the broadcast face right now. */
    function isBroadcast() { return prefFace() === 'broadcast' && kitAtLeast(40); }

    /** The broadcast bar: the wordmark with its star and the on-air line beside it. */
    function dressHeader() {
      var title = document.querySelector('.ak-app__title');
      if (!title) return;
      var onair = title.querySelector('.db-onair');
      if (isBroadcast()) {
        title.textContent = '';
        title.appendChild(document.createTextNode('DESIGN'));
        var star = document.createElement('span');
        star.className = 'db-wordmark__star';
        star.textContent = '*';
        title.appendChild(star);
        title.appendChild(document.createTextNode('BOOK'));
        onair = document.createElement('span');
        onair.className = 'db-onair';
        onair.textContent = state.parts.length + dbText(' PARTS · ON AIR');
        title.appendChild(onair);
      } else {
        title.textContent = 'Design Book';
      }
    }

    /**
     * THE SCROLL-TOLD STORY, as a piece of the page rather than a link in a sentence.
     * The address is the app's own public one, read from the catalogue rather than composed
     * here: an app's subdomain cannot be derived from this origin, and a guessed address is
     * how a front page ends up pointing at nothing.
     */
    var STORY_URL = 'https://aimeat-story.apps.aimeat.io/';
    function storyBand() {
      var band = K.el('aside', { class: 'db-story' });
      band.appendChild(K.el('div', { class: 'db-story__words' }, [
        K.el('p', { class: 'db-story__kicker' }, dbText('TOLD ON SCROLL')),
        K.el('p', { class: 'db-story__lead' },
          dbText('What a person gets from AIMEAT, as one page that moves under the scroll. It is built from the Lenis parts on this shelf.')),
      ]));
      band.appendChild(K.el('a', { class: 'ak-btn ak-btn--primary db-story__go',
        href: STORY_URL, target: '_blank', rel: 'noopener' }, dbText('Open the story')));
      return band;
    }

    /**
     * The band stands under the masthead on the landing shelf, and nowhere else.
     *
     * MEASURED, 2026-09-20, because this band cost a gate before it earned its place: with the
     * house's loud action on it (`ak-btn--primary`, which in this face is the sun slab with its
     * offset shadow) verify.mjs went from green to two green runs in six, failing with
     * "Transition was aborted because of invalid state. Viewport size changed". That is the
     * theme change's View Transition being cut short by the verifier's next resize, and the
     * slab was what made it run long enough to be caught. With the kit's ordinary button the
     * same file passed five runs of five. The action is still an action; it is just not the
     * loudest thing on the page any more.
     */
    function showStoryBand(body) {
      if (state.picked) return;
      if (state.kind === 'genre' || !state.kind) body.appendChild(storyBand());
    }

    /** The gallery front: masthead, sticker, and the category's parts as exhibits. */
    function buildGallery(body) {
      var parts = visibleParts();
      var mast = document.createElement('div');
      mast.className = 'db-mast';
      var lead = document.createElement('h1');
      lead.className = 'db-mast__lead';
      lead.appendChild(document.createTextNode(dbText('Every screen')));
      var line2 = document.createElement('span');
      line2.className = 'db-mast__lead-2';
      line2.textContent = dbText('starts here.');
      lead.appendChild(line2);
      mast.appendChild(lead);
      var sub = document.createElement('p');
      sub.className = 'db-mast__sub';
      sub.textContent = dbText('Proven parts, shown working — never pictures. Open one, see it live, tell your AI its address.');
      mast.appendChild(sub);
      // The sticker: the most-adopted part on the shelf this week, or the first genre.
      var featured = state.parts.slice().sort(function (x, y) { return (y.usage || 0) - (x.usage || 0); })[0];
      if (featured) {
        var st = document.createElement('button');
        st.type = 'button';
        st.className = 'db-mast__sticker';
        st.appendChild(document.createTextNode(dbText('This week:')));
        st.appendChild(document.createElement('br'));
        st.appendChild(document.createTextNode(featured.title));
        var sm = document.createElement('small');
        sm.textContent = featured.usage ? dbText('adopted by ') + featured.usage + dbText(featured.usage === 1 ? ' build' : ' builds') : dbText('fresh on the shelf');
        st.appendChild(sm);
        st.addEventListener('click', function () { openPart(featured.id, state.session); });
        mast.appendChild(st);
      }
      body.appendChild(mast);

      // THE STORY, under the masthead and above the first card: the page says its own name
      // first and then offers the story. Mounted above the masthead it read as a banner over
      // the Book's own title. Only on the landing shelf, because on all fourteen it would be
      // one advertisement repeated fourteen times.
      showStoryBand(body);

      // THE ONE SHELF WHOSE PROVENANCE HAS TO BE SAID OUT LOUD. Every other kind was made for
      // the Book. These were made inside somebody's app, by the AI that built it, and they reach
      // this shelf only because that app's owner said the app turned out well. A reader who does
      // not know that reads them as the Book's own work, which is the wrong thing to trust.
      if (state.kind === 'component') {
        var provenance = document.createElement('p');
        provenance.className = 'db-made__lede';
        provenance.textContent = dbText('No person wrote these by hand. An AI made each one inside an app, and it stands here because that app’s owner said the app turned out well.');
        body.appendChild(provenance);
      }

      var grid = document.createElement('div');
      grid.className = 'db-exhibits';
      var W = innerWidth <= 760 ? 390 : 1100, H = innerWidth <= 760 ? 844 : 700;
      parts.forEach(function (p) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'db-exhibit';
        card.dataset.partId = p.id;
        var frame = document.createElement('div');
        frame.className = 'db-exhibit__frame';
        // Reserve the preview before its document loads, including when restoring shelf scroll.
        frame.style.aspectRatio = W + ' / ' + H;
        var iframe = document.createElement('iframe');
        iframe.setAttribute('loading', 'lazy');
        iframe.setAttribute('sandbox', 'allow-scripts');
        iframe.setAttribute('tabindex', '-1');
        iframe.setAttribute('title', p.title);
        var previewUrl = '/v1/designbook/' + encodeURIComponent(p.id) + '/preview';
        if (typeof IntersectionObserver === 'function') {
          var visibility = new IntersectionObserver(function(entries) {
            if (entries[0].isIntersecting) { if (!iframe.hasAttribute('src')) iframe.src = previewUrl; }
            else iframe.removeAttribute('src');
          }, { root: a.main, rootMargin: '200px' });
          visibility.observe(frame); galleryObservers.push(visibility);
        } else iframe.src = previewUrl;
        iframe.style.width = W + 'px';
        iframe.style.height = H + 'px';
        frame.appendChild(iframe);
        card.appendChild(frame);
        var foot = document.createElement('div');
        foot.className = 'db-exhibit__foot';
        var name = document.createElement('span');
        name.className = 'db-exhibit__name';
        name.textContent = p.title;
        var kind = document.createElement('span');
        kind.className = 'db-exhibit__kind';
        var g = GROUPS.filter(function (x) { return x.kind === p.kind; })[0];
        // "New this week" comes from the record's own published_at, never from a guess.
        var fresh = p.published_at && (Date.now() - Date.parse(p.published_at)) < 7 * 86400000;
        kind.textContent = (g ? dbText(g.label).toLowerCase() : p.kind) + (p.usage ? dbText(' · in ') + p.usage + dbText(' builds') : (fresh ? dbText(' · new this week') : dbText(' · new')));
        foot.appendChild(name);
        foot.appendChild(kind);
        card.appendChild(foot);
        card.addEventListener('click', function () { openPart(p.id, state.session); });
        grid.appendChild(card);
        // The frame renders the part at desktop width and scales it to the card.
        var fit = function () {
          var w = frame.clientWidth || 300;
          var s = w / W;
          iframe.style.transform = 'scale(' + s + ')';
          frame.style.height = Math.round(H * s) + 'px';
        };
        if (typeof ResizeObserver === 'function') { var observer = new ResizeObserver(fit); observer.observe(frame); galleryObservers.push(observer); }
        setTimeout(fit, 0);
      });
      if (!parts.length) {
        // A node that never heard of this kind answers the same empty list as a new node whose
        // shelf nobody has filled, and one true sentence covers both.
        var noOffer = state.kind === 'component' && !state.q;
        K.emptyState({ target: grid, tone: 'quiet',
          title: noOffer ? dbText('No app has offered a component yet.') : dbText('Nothing on this shelf yet'),
          hint: state.q ? dbText('Try another word.')
            : noOffer ? dbText('One appears when an app makes a piece by hand and its owner says the app turned out well.')
            : dbText('The next platform update fills it.') });
      }
      body.appendChild(grid);
    }

    // ══════════════════════════════════════════════════════════════════════════════════════════
    // THE LIVING PAGE: the one page in this Book where the subject is not a part but a KIND of
    // document. A living document is one JSON record whose numbers stand on each other, so the
    // page has to show three things at once and in that order — the document ALIVE (the record
    // sheet running, touchable, in the Book's own frame), the VOCABULARY an AI writes it in, and
    // the RECORD ITSELF, which is what a person or an agent actually takes away.
    //
    // THE VOCABULARY TABLE IS GENERATED, never typed here: AIMEAT.living.describe() reads the
    // node modules' own JSDoc, so this page cannot drift from the library the way a hand-kept
    // list would. If the library grows an eighth node type, this table grows a row.
    //
    // THE RECORD SHOWN IS THE RECORD RUNNING. It is read out of the live frame's own
    // window.LIVING_DOC rather than re-fetched and re-parsed, so what the copy button hands over
    // is provably the thing that is on the screen above it.
    // ══════════════════════════════════════════════════════════════════════════════════════════
    var LIVING = { el: null, frame: null, doc: null };

    function hideLiving() {
      if (LIVING.el) { LIVING.el.remove(); LIVING.el = null; }
      LIVING.frame = null;
      LIVING.doc = null;
      if (ui.columns) ui.columns.hidden = false;
    }

    function showLiving() {
      if (ui.columns) ui.columns.hidden = true;
      if (LIVING.el) return;
      var page = K.el('div', { class: 'db-living' });
      ui.columns.parentNode.insertBefore(page, (ui.foot && ui.foot.parentNode === ui.columns.parentNode) ? ui.foot : null);
      LIVING.el = page;

      var lib = window.AIMEAT && window.AIMEAT.living;

      // ── The masthead: what a living document is, in three sentences. ──
      page.appendChild(K.el('div', { class: 'db-living__head' }, [
        K.el('p', { class: 'scene__kicker db-living__kicker' },
          'aimeat-living' + (lib && lib.version ? ' ' + lib.version : '') + dbText(' · the document that works itself out')),
        K.el('h2', { class: 'db-living__title' }, dbText('One record. One graph.')),
        K.el('p', { class: 'db-living__sub' },
          dbText('A living document is ONE JSON record: an arrangement of blocks, and a graph of values, ')
          + dbText('formulas, controls, sentences and a statechart wired to each other. Move any one thing ')
          + dbText('and everything that stood on it moves with it, in the browser, with no route in between. ')
          + dbText('The AI writes the record and you touch the controls, so there is no app code to maintain ')
          + dbText('between what you meant and what is on the screen.')),
      ]));

      // ── The document, alive. The genre is served as a whole page, so it is framed as a whole
      //    page: the slider inside the frame is the real control, not a picture of one. ──
      var live = K.el('section', { class: 'db-living__stage' });
      live.appendChild(K.el('h3', { class: 'db-living__h' }, dbText('The record sheet, running')));
      live.appendChild(K.el('p', { class: 'db-living__note' },
        dbText('This is the genre-living page as the node serves it. Move either reading: the wall number, ')
        + dbText('the dial, the day’s bars, the printed mathematics, the sentence, the stamp and the ')
        + dbText('chain in the margin all follow the same change.')));
      var frame = K.el('iframe', { class: 'db-living__frame', title: dbText('The record sheet, live'), loading: 'lazy' });
      live.appendChild(frame);
      page.appendChild(live);
      LIVING.frame = frame;

      // ── The vocabulary, read out of the library at run time. ──
      var vocab = K.el('section', { class: 'db-living__vocab' });
      vocab.appendChild(K.el('h3', { class: 'db-living__h' }, dbText('The vocabulary an AI writes it in')));
      vocab.appendChild(K.el('p', { class: 'db-living__note' },
        dbText('Every node type this build knows, read out of the library on this page with ')
        + dbText('AIMEAT.living.describe() — which is generated from the node modules’ own source, ')
        + dbText('so this table cannot go stale behind the code.')));
      page.appendChild(vocab);
      if (lib && typeof lib.describe === 'function') {
        // THREE COLUMNS, and the third is FIELD NAMES. describe() glosses every input and option
        // in a parenthesis — good prose to read one at a time, and four columns of it ran off
        // the right of the page at 1440. The gloss stays where it belongs, in describe(id).
        var names = function (list) {
          return (list || []).map(function (o) { return String(o).replace(/\s*\([^)]*\)\s*$/, ''); });
        };
        var rows = lib.describe().map(function (id) {
          var d = lib.describe(id) || {};
          return {
            id: id, type: id, summary: d.summary || '',
            fields: names(d.inputs).concat(names(d.options)).join(' · '),
          };
        });
        K.table({
          target: vocab, caption: 'AIMEAT.living.describe()',
          columns: [
            { key: 'type', label: dbText('Node'), sortable: true },
            { key: 'summary', label: dbText('What it is') },
            { key: 'fields', label: dbText('The fields it takes') },
          ],
          rows: rows,
        });
      } else {
        K.emptyState({ target: vocab, tone: 'quiet', title: dbText('The living library is not on this node yet'),
          hint: 'It arrives with the next platform update; the table is read from the library itself, never kept here.' });
      }

      // ── The record itself, and the way to take it. ──
      var take = K.el('section', { class: 'db-living__take' });
      take.appendChild(K.el('h3', { class: 'db-living__h' }, dbText('The record itself')));
      take.appendChild(K.el('p', { class: 'db-living__note' },
        dbText('What is running in the frame above, exactly as it is written. Hand it to your AI as a ')
        + dbText('starting point and say what you are keeping a record of.')));
      var copy = K.el('button', { type: 'button', class: 'ak-btn ak-btn--primary db-living__copy' }, dbText('Copy the record'));
      take.appendChild(copy);
      var pre = K.el('pre', { class: 'db-living__record' });
      var code = K.el('code', {}, dbText('Reading the record from the live sheet…'));
      pre.appendChild(code);
      take.appendChild(pre);
      page.appendChild(take);

      copy.addEventListener('click', function () {
        if (!LIVING.doc) return;
        navigator.clipboard.writeText(JSON.stringify(LIVING.doc, null, 2)).then(function () {
          copy.textContent = dbText('Copied ✓');
          K.attention(copy, 'rise');
          setTimeout(function () { copy.textContent = dbText('Copy the record'); }, 2200);
        });
      });

      // ── The three things it must not be. ──
      var not = K.el('section', { class: 'db-living__not' });
      not.appendChild(K.el('h3', { class: 'db-living__h' }, dbText('Three things a living document is not')));
      var list = K.el('ol', { class: 'db-living__list' });
      [[dbText('A page with a script in it.'),
        dbText('If a number on the screen is worked out by code you wrote, it is an app, and the person ')
        + dbText('cannot change it without you. Put the arithmetic in a formula node.')],
       [dbText('A form that posts somewhere.'),
        dbText('It computes in the browser and persists as the record. A document whose numbers wait on a ')
        + dbText('network reads as dead, and a route in the middle is one more thing to keep alive.')],
       [dbText('A block stack in the default look.'),
        dbText('The record carries a register, and the register is a page somebody designed: a sheet, a ')
        + dbText('ledger, a chart wall. Stacked cards with a look applied is the thing the genres exist ')
        + dbText('to escape.')]].forEach(function (pair) {
        list.appendChild(K.el('li', {}, [K.el('b', {}, pair[0]), K.el('span', {}, ' ' + pair[1])]));
      });
      not.appendChild(list);
      page.appendChild(not);

      // The frame is filled last, so nothing above it moves when the page arrives.
      api('/v1/app-templates/genre-living').then(function (r) {
        var t = r.body && r.body.data && r.body.data.template;
        if (!t || !t.content) {
          frame.remove();
          K.emptyState({ target: live, tone: 'quiet', title: dbText('The living genre is not on this node yet'),
            hint: dbText('It arrives with the next platform update.') });
          code.textContent = dbText('The record arrives with the genre.');
          return;
        }
        frame.addEventListener('load', function () {
          // srcdoc inherits this document's origin, so the running record can simply be read.
          try {
            var doc = frame.contentWindow && frame.contentWindow.LIVING_DOC;
            if (doc) { LIVING.doc = doc; code.textContent = JSON.stringify(doc, null, 2); return; }
          } catch (e) { /* fall through to the honest line below */ }
          code.textContent = dbText('The sheet is running, and its record could not be read from here.');
        });
        frame.setAttribute('srcdoc', t.content);
      });
    }

    // ══════════════════════════════════════════════════════════════════════════════════════════
    // THE REASONS PAGE. Every Atelier app carries the builder's own notes: what it took from the
    // Book, what it looked at and left, and what it had to make by hand. NO PERSON WRITES ANY OF
    // THIS. It is written by the AI that built the app, at publish time, and this page only reads.
    //
    // MADE BY HAND IS THE LIST OF WHAT THE BOOK DOES NOT CARRY YET, which is what the page is for.
    // PASSED OVER says why a part that exists was not the right one, in the builder's own sentence.
    //
    // `times` counts builders and `kept` counts the apps among them whose OWNER said the app
    // turned out well. Only `kept` says somebody was satisfied, so `kept` leads every pair of
    // numbers on this page and in a part's detail. A count on its own says an AI liked something.
    // ══════════════════════════════════════════════════════════════════════════════════════════
    var REASONS = { el: null };

    function hideReasons() {
      if (REASONS.el) { REASONS.el.remove(); REASONS.el = null; }
      if (ui.columns) ui.columns.hidden = false;
    }

    /** The date a builder wrote it, to the day: the hour is noise in a list of accounts. */
    function reasonDay(at) { return String(at || '').slice(0, 10); }

    /** Which app said it, and whether its owner was satisfied. The evidence under a sentence. */
    function reasonSource(row) {
      var bits = [row.app || '', row.version ? 'v' + row.version : '', reasonDay(row.at)]
        .filter(function (bit) { return bit; });
      var line = K.el('p', { class: 'db-reasons__src' }, bits.join(' · '));
      if (row.kept) line.appendChild(K.el('span', { class: 'db-reasons__kept' }, dbText('kept')));
      return line;
    }

    /** One builder's sentence, with the app it came from under it. */
    function reasonWhy(row) {
      return K.el('div', { class: 'db-reasons__why' }, [
        K.el('p', { class: 'db-reasons__quote' }, '“' + (row.why || '') + '”'),
        reasonSource(row),
      ]);
    }

    /**
     * A number with its plain label. The leading one is the one that means somebody was happy.
     * One takes its own wording in both languages: English needs the singular noun, and Finnish
     * puts one in the nominative where every other number takes the partitive.
     */
    function reasonStat(value, one, many, lead) {
      var n = value == null ? 0 : value;
      return K.el('div', { class: 'db-reasons__stat' + (lead ? ' db-reasons__stat--lead' : '') }, [
        K.el('span', { class: 'db-reasons__n' }, String(n)),
        K.el('span', { class: 'db-reasons__l' }, dbText(n === 1 ? one : many)),
      ]);
    }

    function showReasons() {
      if (ui.columns) ui.columns.hidden = true;
      if (REASONS.el) return;
      var page = K.el('div', { class: 'db-reasons' });
      ui.columns.parentNode.insertBefore(page, (ui.foot && ui.foot.parentNode === ui.columns.parentNode) ? ui.foot : null);
      REASONS.el = page;

      page.appendChild(K.el('div', { class: 'db-reasons__head' }, [
        K.el('p', { class: 'scene__kicker db-reasons__kicker' }, dbText('written by the builders, at publish time')),
        K.el('h2', { class: 'db-reasons__title' }, dbText('What the builders wrote down.')),
        K.el('p', { class: 'db-reasons__sub' },
          dbText('An AI that builds an app here says what it took from the Book, what it passed over, and ')
          + dbText('what it had to make by hand, with one sentence for each. What they made by hand is the ')
          + dbText('list of what the Book does not carry yet. Nobody fills this in: it arrives with the app.')),
      ]));

      var body = K.el('div', { class: 'db-reasons__body' });
      page.appendChild(body);

      api('/v1/designbook?view=reasons').then(function (r) {
        var data = (r.body && r.body.data) || {};
        if (r.status !== 200) {
          K.emptyState({ target: body, tone: 'quiet', title: dbText('The Book did not answer'),
            hint: dbText('The reasons are read straight from this node; try again in a moment.') });
          return;
        }
        // AN OLDER NODE answers this address with the ordinary shelf listing, which has parts and
        // no `made`. That is not an error and not an empty queue, so it gets its own sentence.
        if (!Array.isArray(data.made)) {
          K.emptyState({ target: body, tone: 'quiet', title: dbText('This node does not record builders’ reasons yet.'),
            hint: dbText('It arrives with the next platform update. Until then the Book shows the parts alone.') });
          return;
        }
        var made = data.made || [];
        var passed = data.passed_over || [];

        // THE HONEST FRAME, before any number: these are accounts, not measurements. The node
        // writes this sentence, so it stays the node's words; the dictionary carries the Finnish.
        if (data.note) {
          body.appendChild(K.el('p', { class: 'db-reasons__note' }, dbText(String(data.note).replace(/`/g, ''))));
        }

        if (!made.length && !passed.length) {
          K.emptyState({ target: body, tone: 'quiet', title: dbText('Nothing is written down yet.'),
            hint: dbText('This fills as apps are built: every app published here brings its builder’s notes with it.') });
          return;
        }

        // ── Made by hand: what a builder needed and the Book had nothing for. ──
        var madeBand = K.el('section', { class: 'db-reasons__band' });
        madeBand.appendChild(K.el('h3', { class: 'db-reasons__h' }, dbText('Made by hand')));
        madeBand.appendChild(K.el('p', { class: 'db-reasons__lede' },
          dbText('A builder needed this and made it itself, because the Book carried nothing for it. ')
          + dbText('The ones kept in an app the owner was satisfied with stand first.')));
        body.appendChild(madeBand);
        if (!made.length) {
          madeBand.appendChild(K.el('p', { class: 'db-reasons__quiet' }, dbText('No builder has had to make a part by hand yet.')));
        }
        made.forEach(function (item) {
          var rows = item.rows || [];
          var what = (rows.filter(function (row) { return row.what; })[0] || {}).what;
          var entry = K.el('article', { class: 'db-reasons__item' });
          entry.appendChild(K.el('h4', { class: 'db-reasons__name' }, item.name || ''));
          entry.appendChild(K.el('div', { class: 'db-reasons__stats' }, [
            reasonStat(item.kept, 'app kept, its owner was satisfied', 'apps kept, their owner was satisfied', true),
            reasonStat(item.times, 'builder made it by hand', 'builders made it by hand', false),
          ]));
          if (what) entry.appendChild(K.el('p', { class: 'db-reasons__what' }, what));
          rows.forEach(function (row) { entry.appendChild(reasonWhy(row)); });
          madeBand.appendChild(entry);
        });

        // ── Passed over: a part that exists, and why it was not the one. ──
        var passedBand = K.el('section', { class: 'db-reasons__band' });
        passedBand.appendChild(K.el('h3', { class: 'db-reasons__h' }, dbText('Passed over')));
        passedBand.appendChild(K.el('p', { class: 'db-reasons__lede' },
          dbText('A builder looked at this part and left it. The sentence is the builder’s own.')));
        body.appendChild(passedBand);
        if (!passed.length) {
          passedBand.appendChild(K.el('p', { class: 'db-reasons__quiet' }, dbText('No builder has written about passing a part over yet.')));
        }
        passed.forEach(function (item) {
          var entry = K.el('article', { class: 'db-reasons__item' });
          entry.appendChild(K.el('h4', { class: 'db-reasons__name' }, item.part || ''));
          entry.appendChild(K.el('div', { class: 'db-reasons__stats' }, [
            reasonStat(item.times, 'builder passed it over', 'builders passed it over', false),
          ]));
          (item.reasons || []).forEach(function (row) { entry.appendChild(reasonWhy(row)); });
          passedBand.appendChild(entry);
        });
      });
    }

    /**
     * The same accounts, for the one part on the stage: the two numbers side by side, and under
     * them the sentences. An older node sends no `reasons` at all, and then this adds nothing:
     * an empty block under every part would be worse than a part detail that never mentions it.
     */
    function showPartReasons(reasons) {
      if (!reasons || !ui.strip) return;
      var section = K.el('section', { class: 'db-why' });
      section.appendChild(K.el('h3', { class: 'db-why__h' }, dbText('What builders wrote down')));
      section.appendChild(K.el('div', { class: 'db-reasons__stats db-why__stats' }, [
        reasonStat(reasons.kept, 'app kept, its owner was satisfied', 'apps kept, their owner was satisfied', true),
        reasonStat(reasons.taken, 'builder took this part', 'builders took this part', false),
      ]));
      var took = reasons.took || [];
      var passed = reasons.passed || [];
      if (took.length) {
        section.appendChild(K.el('h4', { class: 'db-why__sub' }, dbText('Why they took it')));
        took.forEach(function (row) { section.appendChild(reasonWhy(row)); });
      }
      if (passed.length) {
        section.appendChild(K.el('h4', { class: 'db-why__sub' }, dbText('Why they passed it over')));
        passed.forEach(function (row) { section.appendChild(reasonWhy(row)); });
      }
      if (!took.length && !passed.length) {
        section.appendChild(K.el('p', { class: 'db-reasons__quiet' }, dbText('No builder has written about this part yet.')));
      }
      ui.strip.appendChild(section);
    }

    // ══════════════════════════════════════════════════════════════════════════════════════════
    // THE PHASER PAGE: an arcade cabinet, not a wall of cards. One stage runs one demo at a
    // time; the rail on the left picks it; the code that boots it sits under the stage so a
    // builder copies the paved path. Every demo runs on aimeat-phaser and the Atelier kit.
    // ══════════════════════════════════════════════════════════════════════════════════════════
    var ARCADE = { live: null, demo: null, size: 'medium', bus: null, store: null };
    var STAGE_SIZES = { small: [480, 270], medium: [960, 540], large: [1280, 720] };

    function hidePhaser() {
      if (ARCADE.live && ARCADE.live.destroy) { try { ARCADE.live.destroy(); } catch (e) { /* the stage is going anyway */ } }
      ARCADE.live = null;
      if (ui.arcade) { ui.arcade.remove(); ui.arcade = null; }
      if (ui.columns) ui.columns.hidden = false;
    }

    function showPhaser() {
      if (ui.columns) ui.columns.hidden = true;
      if (ui.arcade) return;
      var wall = K.el('div', { class: 'db-arcade' });
      ui.columns.parentNode.insertBefore(wall, (ui.foot && ui.foot.parentNode === ui.columns.parentNode) ? ui.foot : null);
      ui.arcade = wall;
      var P = window.AIMEAT && window.AIMEAT.phaser;
      if (!P) {
        K.emptyState({ target: wall, title: dbText('The Phaser base has not landed here yet'), hint: dbText('This node does not serve aimeat-phaser; it arrives with the next platform update.') });
        return;
      }
      // The masthead of the cabinet
      var head = K.el('div', { class: 'db-arcade__head' }, [
        K.el('p', { class: 'scene__kicker db-arcade__kicker' }, 'Phaser 4 · ' + (P.version ? 'aimeat-phaser ' + P.version : '')),
        K.el('h2', { class: 'db-arcade__title' }, dbText('Every game starts here.')),
        K.el('p', { class: 'db-arcade__sub' }, dbText('Phaser 4.2 on this node, with the base a game otherwise re-guesses: boot and scaling, packs, saves, controls, audio, menus, a level, the feel, the assets, an editor, the phone half, and a bench that plays it on the node. Pick a demo; the code under the stage is the paved path.')),
      ]);
      wall.appendChild(head);
      var body = K.el('div', { class: 'db-arcade__body' });
      wall.appendChild(body);
      // The rail: one button per demo
      var rail = K.el('nav', { class: 'db-arcade__rail', 'aria-label': dbText('Demos') });
      body.appendChild(rail);
      // The stage and its controls
      var stageWrap = K.el('div', { class: 'db-arcade__stagewrap' });
      body.appendChild(stageWrap);
      var bar = K.el('div', { class: 'db-arcade__bar' });
      stageWrap.appendChild(bar);
      var stage = K.el('div', { class: 'db-arcade__stage db-arcade__stage--medium', id: 'db-stage' });
      stageWrap.appendChild(stage);
      var side = K.el('div', { class: 'db-arcade__side' });
      stageWrap.appendChild(side);
      var code = K.el('pre', { class: 'db-arcade__code' });
      var codeEl = K.el('code', {});
      code.appendChild(codeEl);
      stageWrap.appendChild(code);
      var note = K.el('p', { class: 'ak-section__hint db-arcade__note' });
      stageWrap.appendChild(note);

      var sizeBtns = {};
      ['small', 'medium', 'large'].forEach(function (s) {
        var b = K.el('button', { type: 'button', class: 'ak-btn ak-btn--ghost db-arcade__size', on: { click: function () { setStageSize(s); } } }, s);
        sizeBtns[s] = b;
        bar.appendChild(b);
      });
      bar.appendChild(K.el('button', { type: 'button', class: 'ak-btn ak-btn--primary', on: { click: function () { if (ARCADE.live && ARCADE.live.fullscreen) ARCADE.live.fullscreen(); } } }, dbText('Fullscreen')));
      var soundBtn = K.el('button', { type: 'button', class: 'ak-btn ak-btn--ghost', on: { click: function () {
        if (!ARCADE.bus) return;
        ARCADE.bus.unlock();
        ARCADE.bus.mute(!ARCADE.bus.settings().muted);
        soundBtn.textContent = ARCADE.bus.settings().muted ? dbText('Sound: off') : dbText('Sound: on');
      } } }, dbText('Sound: on'));
      bar.appendChild(soundBtn);

      function setStageSize(s) {
        ARCADE.size = s;
        Object.keys(sizeBtns).forEach(function (k) { sizeBtns[k].classList.toggle('ak-btn--primary', k === s); sizeBtns[k].classList.toggle('ak-btn--ghost', k !== s); });
        stage.className = 'db-arcade__stage db-arcade__stage--' + s;
        if (ARCADE.live && ARCADE.live.resize && ARCADE.demo && ARCADE.demo.fixed) ARCADE.live.resize(STAGE_SIZES[s][0], STAGE_SIZES[s][1]);
      }

      var demos = arcadeDemos(P, stage, side);
      var current = null;
      function open(demo) {
        if (ARCADE.live && ARCADE.live.destroy) { try { ARCADE.live.destroy(); } catch (e) { /* replaced */ } }
        ARCADE.live = null;
        while (stage.firstChild) stage.removeChild(stage.firstChild);
        while (side.firstChild) side.removeChild(side.firstChild);
        side.hidden = true;
        ARCADE.demo = demo;
        codeEl.textContent = demo.code;
        note.textContent = demo.note;
        rail.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.demo === demo.id ? 'true' : 'false'); });
        Promise.resolve(demo.boot()).then(function (handle) { ARCADE.live = handle || null; }, function (err) {
          K.emptyState({ target: stage, tone: 'quiet', title: 'This demo could not start', hint: String(err && err.message || err) });
        });
        current = demo;
      }
      demos.forEach(function (d) {
        rail.appendChild(K.el('button', { type: 'button', class: 'db-arcade__pick', 'data-demo': d.id, on: { click: function () { if (current !== d) open(d); } } }, [
          K.el('b', {}, d.title), K.el('span', {}, d.sub),
        ]));
      });
      setStageSize('medium');
      open(demos[0]);
    }

    /** The five demos: each boots into the stage and returns the boot handle. */
    function arcadeDemos(P, stage, side) {
      var app = 'designbook-arcade';
      function bus(handle) { ARCADE.bus = P.audio(handle.game); return ARCADE.bus; }

      // 1 · FULLSCREEN AND RESIZE: a field of balls that keeps its world at the canvas's size.
      var bounce = {
        id: 'resize', title: 'Fullscreen and resize', sub: 'the world follows the canvas; go fullscreen and back',
        note: 'scale: "resize" hands the scene a resize event with the new size; the field re-bounds its world every time. The Fullscreen button above is the frame\'s own; Escape leaves.',
        code: [
          'const h = await AIMEAT.phaser.game({ parent: stage, scale: "resize", fullscreen: "button", scenes: [{',
          '  create() {',
          '    const t = h.theme; this.balls = this.physics.add.group();',
          '    for (let i = 0; i < 40; i++) this.balls.create(x, y, "ball").setVelocity(vx, vy).setBounce(1).setCollideWorldBounds(true);',
          '    this.scale.on("resize", (s) => this.physics.world.setBounds(0, 0, s.width, s.height));',
          '  } }] });',
        ].join('\n'),
        fixed: false,
        boot: function () {
          return P.game({ parent: stage, scale: 'resize', fullscreen: 'button', physics: 'arcade', gravity: { y: 0 }, background: 'bg', scenes: [{
            key: 'field',
            create: function () {
              var scene = this; var t = ARCADE.live ? ARCADE.live.theme : P.theme(stage);
              P.textures.shapes(scene, [
                { key: 'ball-a', width: 28, height: 28, draw: function (g, th) { g.fillStyle(th.accent, 1); g.fillCircle(14, 14, 14); } },
                { key: 'ball-b', width: 20, height: 20, draw: function (g, th) { g.fillStyle(th.ch1, 1); g.fillCircle(10, 10, 10); } },
                { key: 'ball-c', width: 36, height: 36, draw: function (g, th) { g.fillStyle(th.ch3, 1); g.fillCircle(18, 18, 18); } },
              ]);
              var w = scene.scale.width, h = scene.scale.height;
              scene.physics.world.setBounds(0, 0, w, h);
              var keys = ['ball-a', 'ball-b', 'ball-c'];
              for (var i = 0; i < 42; i++) {
                var s = scene.physics.add.image(40 + Math.random() * (w - 80), 40 + Math.random() * (h - 80), keys[i % 3]);
                s.setVelocity((Math.random() - 0.5) * 360, (Math.random() - 0.5) * 360).setBounce(1, 1).setCollideWorldBounds(true);
              }
              var label = scene.add.text(16, 12, '', { fontFamily: t.fontMono, fontSize: '14px', color: P.theme.css(stage).inkDim }).setDepth(10);
              var say = function () { label.setText(Math.round(scene.scale.width) + ' × ' + Math.round(scene.scale.height) + (scene.scale.isFullscreen ? ' · fullscreen' : '')); };
              say();
              scene.scale.on('resize', function (size) { scene.physics.world.setBounds(0, 0, size.width, size.height); say(); });
              scene.input.on('pointerdown', function (p) {
                var s2 = scene.physics.add.image(p.x, p.y, keys[Math.floor(Math.random() * 3)]);
                s2.setVelocity((Math.random() - 0.5) * 420, (Math.random() - 0.5) * 420).setBounce(1, 1).setCollideWorldBounds(true);
              });
            },
          }] });
        },
      };

      // 2 · MENUS: a title scene whose items arrive on a chosen motion, a pause menu, transitions.
      var menus = {
        id: 'menus', title: 'Menus with motions', sub: 'stagger, slide, zoom, typewriter; a pause menu; fade, wipe and iris moves',
        note: 'titleScene() is a scene config the app drops into its list; menuItems() is the same menu inside any scene. Arrow keys and Enter, or the pointer. Press Escape in the play scene for the pause menu.',
        code: [
          'scenes: [AIMEAT.phaser.titleScene({ key: "title", title: "RIDGE RUN", sub: "a night on the ridge",',
          '  items: [{ label: "Play", scene: "play" }, { label: "Options", onPick }, { label: "Credits", locked: true }],',
          '  motion: "stagger", titleMotion: "kinetic", backdrop: "stars" }), play]',
          'AIMEAT.phaser.pauseMenu(this, { onQuit: () => transition(this, "title", { kind: "iris" }) })',
        ].join('\n'),
        fixed: true,
        boot: function () {
          // Four title scenes, one per menu motion; "Next menu motion" starts the next one, so the
          // same config shape carries every motion and nothing is patched at runtime.
          var motions = ['stagger', 'slide', 'zoom', 'typewriter'];
          var titleMotions = ['drop', 'kinetic', 'typewriter', 'drop'];
          var kinds = ['fade', 'wipe', 'iris', 'fade'];
          var at = 0;
          var titles = motions.map(function (m, i) {
            return P.titleScene({ key: 'title-' + m, title: 'RIDGE RUN', sub: 'a night on the ridge · ' + m + ' menu · ' + titleMotions[i] + ' title', motion: m, titleMotion: titleMotions[i], backdrop: i % 2 ? 'grid' : 'stars', version: 'v0.1',
              items: [
                { label: dbText('Play'), onPick: function () { at = i; }, scene: 'play' },
                { label: 'Next menu motion', scene: 'title-' + motions[(i + 1) % motions.length] },
                { label: 'Credits', locked: true, hint: 'locked until the ridge is climbed' },
              ] });
          });
          var play = {
            key: 'play',
            create: function () {
              var scene = this; var css = P.theme.css(stage);
              scene.add.text(scene.scale.width / 2, 120, 'THE PLAY SCENE', { fontFamily: css.fontDisplay, fontSize: '40px', color: css.ink }).setOrigin(0.5);
              scene.add.text(scene.scale.width / 2, 180, 'Escape opens the pause menu · Quit goes back through a ' + kinds[at] + ' transition', { fontFamily: css.fontMono, fontSize: '14px', color: css.inkDim }).setOrigin(0.5);
              var c = P.controls(scene, { touch: false });
              scene.events.on('update', function () { c.update(); });
              c.on('pause', function () {
                P.pauseMenu(scene, { controls: c, onSettings: function () { P.toast(scene, 'Settings live in demo 4'); }, onQuit: function () { P.transition(scene, 'title-' + motions[(at + 1) % motions.length], { kind: kinds[at], colour: 'accent' }); } });
              });
              P.toast(scene, 'Press Escape');
            },
          };
          return P.game({ parent: stage, width: STAGE_SIZES[ARCADE.size][0], height: STAGE_SIZES[ARCADE.size][1], scale: 'fit', fullscreen: 'button', physics: null, scenes: titles.concat([play]) }).then(function (h) { bus(h); return h; });
        },
      };

      // 3 · PLATFORMER: an ASCII map becomes a level; three levels, the store keeps the best.
      var MAPS = [
        ['..........................', '..........................', '.....o....................', '....====..........o.......', '..........o......====.....',
          '.........====.............', '..o.......................', '.===........E.........o...', '..........=====......===..', 'P.....o...........^^....G.', '##########################', '##########################'],
        ['..........................', '.....o....o....o..........', '....===..===..===.........', '..........................', '..o...............o.......',
          '.===.....E......====......', '.........=====............', '......o..............o....', '....====....^^^.....===...', 'P..........======......G..', '#######.......############', '#######.......############'],
        ['..........................', '..o.....o.....o.....o.....', '.===...===...===...===....', '..........................', '.......E.........E........',
          '....=====......=====......', '..........................', '..o....^^....o....^^...o..', '.===..====..====..====.==.', 'P.....................G...', '##########################', '##########################'],
      ];
      var platform = {
        id: 'platformer', title: 'Platformer and a level', sub: 'an ASCII map, arcade physics, coins, spikes, a patrol, the goal; three levels',
        note: 'platformer() turns the rows into a static tile layer, the player, coins, enemies and the goal, and drives them from the controls state. Arrows or WASD, Space jumps. The store remembers the best score per level and unlocks the next.',
        code: [
          'const lvl = AIMEAT.phaser.platformer(this, { map: MAPS[i], tile: 32, controls: c, camera: "follow", parallaxBackdrop: true });',
          'lvl.on("coin", (n) => hud.score(n * 10)); lvl.on("goal", () => { store.levels.best("l" + i, score); store.levels.unlock("l" + (i + 1)); });',
          'update() { c.update(); lvl.update(); }',
        ].join('\n'),
        fixed: true,
        boot: function () {
          var store = P.saves({ app: app, version: 1, defaults: { levels: { l0: { unlocked: true } } } });
          ARCADE.store = store;
          var level = 0;
          var levelSelect = P.titleScene({ key: 'levels', title: 'RIDGE RUN', sub: 'pick a level', motion: 'stagger', titleMotion: 'drop', backdrop: 'stars',
            items: MAPS.map(function (m, i) {
              return { label: 'Level ' + (i + 1), locked: false, onPick: function () { level = i; }, scene: 'play' };
            }) });
          var play = {
            key: 'play',
            create: function () {
              var scene = this;
              P.textures.tiles(scene, { size: 32, prefix: 'tile-', kinds: { ground: true, brick: true, spike: true, coin: true, goal: true, enemy: true } });
              P.textures.character(scene, { key: 'hero' });
              var c = P.controls(scene, { touch: 'auto' });
              var hud = P.hud(scene);
              var score = 0; var coins = 0;
              hud.level('Level ' + (level + 1)); hud.lives(3); hud.score(0);
              var lvl = P.platformer(scene, { map: MAPS[level], tile: 32, controls: c, camera: 'follow', parallaxBackdrop: true, player: { speed: 220, jump: 440 } });
              lvl.on('coin', function (n) { coins = n; score = n * 10; hud.score(score); if (ARCADE.bus) ARCADE.bus.synth('coin'); });
              lvl.on('die', function () { hud.lives(2); if (ARCADE.bus) ARCADE.bus.synth('hit'); });
              lvl.on('goal', function () {
                if (ARCADE.bus) ARCADE.bus.synth('win');
                var improved = store.levels.best('l' + level, score);
                store.levels.unlock('l' + (level + 1));
                store.save();
                P.toast(scene, improved ? 'New best: ' + score : 'Done: ' + score);
                scene.time.delayedCall(900, function () { level = (level + 1) % MAPS.length; P.transition(scene, 'play', { kind: 'wipe' }); });
              });
              c.on('pause', function () { P.pauseMenu(scene, { onQuit: function () { P.transition(scene, 'levels', { kind: 'fade' }); } }); });
              scene.events.on('update', function () { c.update(); lvl.update(); });
            },
          };
          return store.load().then(function () {
            return P.game({ parent: stage, width: STAGE_SIZES[ARCADE.size][0], height: STAGE_SIZES[ARCADE.size][1], scale: 'fit', fullscreen: 'button', physics: 'arcade', gravity: { y: 900 }, pixelArt: true, scenes: [levelSelect, play] });
          }).then(function (h) { bus(h); stage.addEventListener('pointerdown', function () { ARCADE.bus.unlock(); }, { once: true }); return h; });
        },
      };

      // 4 · AUDIO AND SETTINGS: the bus, synth sounds, music, and the settings page beside the stage.
      var audioDemo = {
        id: 'audio', title: 'Audio and settings', sub: 'the bus with master, music and sfx; synth sounds; the settings page on the kit',
        note: 'The first pointer unlocks the browser. Every slider on the right writes through the bus and into the store, so a game reads the same settings back next time.',
        code: [
          'const bus = AIMEAT.phaser.audio(h.game); bus.unlock();   // on the first gesture',
          'bus.synth("coin"); bus.playMusic("theme", { loop: true, fade: 600 }); bus.music(0.5);',
          'AIMEAT.phaser.settingsPanel({ target: side, audio: bus, controls: c, saves: store, game: h });',
        ].join('\n'),
        fixed: true,
        boot: function () {
          var store = ARCADE.store || P.saves({ app: app, version: 1 });
          ARCADE.store = store;
          var scene = {
            key: 'sound',
            create: function () {
              var sc = this; var css = P.theme.css(stage);
              sc.add.text(sc.scale.width / 2, 60, 'PRESS A PAD', { fontFamily: css.fontDisplay, fontSize: '34px', color: css.ink }).setOrigin(0.5);
              var names = ['beep', 'jump', 'coin', 'hit', 'select', 'win'];
              var cols = 3; var padW = 160; var padH = 96; var x0 = sc.scale.width / 2 - (cols * (padW + 16)) / 2 + padW / 2; var y0 = 150;
              names.forEach(function (n, i) {
                var x = x0 + (i % cols) * (padW + 16); var y = y0 + Math.floor(i / cols) * (padH + 16);
                var r = sc.add.rectangle(x, y, padW, padH, ARCADE.live ? ARCADE.live.theme.surface : 0).setStrokeStyle(2, ARCADE.live ? ARCADE.live.theme.line : 0).setInteractive({ useHandCursor: true });
                sc.add.text(x, y, n, { fontFamily: css.fontMono, fontSize: '16px', color: css.ink }).setOrigin(0.5);
                r.on('pointerdown', function () {
                  if (ARCADE.bus) { ARCADE.bus.unlock(); ARCADE.bus.synth(n); }
                  sc.tweens.add({ targets: r, scaleX: 0.94, scaleY: 0.9, duration: 90, yoyo: true });
                });
              });
              var c = P.controls(sc, { touch: false });
              sc.events.on('update', function () { c.update(); });
              sc.time.delayedCall(60, function () {
                side.hidden = false;
                P.settingsPanel({ target: side, audio: ARCADE.bus, controls: c, saves: store, game: ARCADE.live });
              });
            },
          };
          return store.load().then(function () {
            return P.game({ parent: stage, width: STAGE_SIZES[ARCADE.size][0], height: STAGE_SIZES[ARCADE.size][1], scale: 'fit', fullscreen: 'button', physics: null, scenes: [scene] });
          }).then(function (h) { bus(h); ARCADE.bus.apply(store.settings()); return h; });
        },
      };

      // 5 · PACKS, SAVES, LOGIN AND CONTROLS: a real pack loads with the bar, the store keeps the
      //     best and shows the leaderboard, the touch overlay is forced on, the gamepad is read.
      var packsDemo = {
        id: 'packs', title: 'Packs, saves, login, controls', sub: 'a resource pack with its loading bar, one save key per player, the leaderboard, touch and gamepad',
        note: 'Signed out you play as a guest and the save lives in this browser; sign in from the top corner and the same store merges it into your memory under one key. The leaderboard reads everyone\'s public score record.',
        code: [
          'const art = AIMEAT.phaser.pack({ id: "art", images: { aurora: PICS.aurora, festival: PICS.festival } });',
          'preload() { AIMEAT.phaser.preloadPack(this, art, { bar: true }); }',
          'const store = AIMEAT.phaser.saves({ app: "mygame", version: 1 }); await store.load();',
          'store.score(10); store.levels.best("l1", store.get().scores.at(-1)); await store.save(); const top = await store.leaderboard();',
          'const c = AIMEAT.phaser.controls(this, { touch: true, gamepad: true });',
        ].join('\n'),
        fixed: true,
        boot: function () {
          var store = ARCADE.store || P.saves({ app: app, version: 1 });
          ARCADE.store = store;
          var art = P.pack({ id: 'book-art', images: { aurora: PICS.aurora, festival: PICS.festival, papercut: PICS.papercut, monstera: PICS.monstera } });
          var scene = {
            key: 'packs',
            preload: function () { P.preloadPack(this, art, { bar: true }); },
            create: function () {
              var sc = this; var css = P.theme.css(stage);
              var w = sc.scale.width, h = sc.scale.height;
              var keys = ['aurora', 'festival', 'papercut', 'monstera'];
              keys.forEach(function (k, i) {
                if (sc.textures.exists(k)) sc.add.image(80 + i * ((w - 160) / 3), h * 0.42, k).setDisplaySize(160, 100);
              });
              var c = P.controls(sc, { touch: true, gamepad: true });
              var hud = P.hud(sc);
              var best = (store.levels.get('arcade') || {}).best || 0;
              hud.level('best ' + best); hud.score(0);
              var score = 0;
              var puck = sc.add.rectangle(w / 2, h * 0.75, 40, 40, ARCADE.live ? ARCADE.live.theme.accent : 0);
              sc.add.text(w / 2, h - 28, 'move with the pad or a gamepad · action scores · the store saves the best', { fontFamily: css.fontMono, fontSize: '12px', color: css.inkDim }).setOrigin(0.5);
              c.on('action', function () {
                score += 10; hud.score(score); store.score(10);
                if (store.levels.best('arcade', score)) { hud.level('best ' + score); store.save().then(function () { P.toast(sc, store.isGuest() ? 'Saved in this browser (guest)' : 'Saved to your memory'); }); }
                if (ARCADE.bus) { ARCADE.bus.unlock(); ARCADE.bus.synth('coin'); }
              });
              sc.events.on('update', function () { c.update(); puck.x += c.axis.x * 4; puck.y += c.axis.y * 4; });
              side.hidden = false;
              var lb = K.el('div', { class: 'db-arcade__board' }, [K.el('h3', {}, 'Leaderboard'), K.el('p', { class: 'ak-section__hint' }, store.isGuest() ? 'Guest: sign in to appear here.' : 'Signed in: your best is on the board.')]);
              side.appendChild(lb);
              store.leaderboard({ limit: 8 }).then(function (rows) {
                if (!rows.length) { lb.appendChild(K.el('p', { class: 'ak-section__hint' }, 'Nobody on the board yet.')); return; }
                var ol = K.el('ol', { class: 'db-arcade__rows' });
                rows.forEach(function (r) { ol.appendChild(K.el('li', {}, [K.el('b', {}, r.name || r.owner || '?'), K.el('span', {}, String(r.best))])); });
                lb.appendChild(ol);
              });
            },
          };
          return store.load().then(function () {
            return P.game({ parent: stage, width: STAGE_SIZES[ARCADE.size][0], height: STAGE_SIZES[ARCADE.size][1], scale: 'fit', fullscreen: 'button', physics: null, scenes: [scene] });
          }).then(function (h) { bus(h); return h; });
        },
      };

      // 6 · FEEL: the juice kit on one bouncing mark.
      var juiceDemo = {
        id: 'juice', title: 'Feel: the juice kit', sub: 'shake, hit-stop, flash, bursts, numbers, combo, slowmo, pop, trail; every one finite',
        note: 'juice(scene) is nine finite effects on the theme\'s colours. Under the less-motion switch the six moves stand down and flash, number and combo still answer.',
        code: [
          'const j = AIMEAT.phaser.juice(this);',
          'enemy.on("hit", (x, y) => { j.hitStop(90); j.shake(); j.burst(x, y, "hit"); j.number(x, y, "-12", { tone: "err" }); j.pop(enemy); });',
        ].join('\n'),
        fixed: true,
        boot: function () {
          var j = null; var mark = null; var hits = 0; var kindAt = 0;
          var KINDS = ['coin', 'hit', 'dust', 'spark', 'confetti'];

              P.fxDesigner({ target: host, fx: eff, scene: sc, family: 'at', preset: 'sparks', x: sc.scale.width * 0.3, y: sc.scale.height * 0.8 });

            },
          };
          return P.game({ parent: stage, width: STAGE_SIZES[ARCADE.size][0], height: STAGE_SIZES[ARCADE.size][1], scale: 'fit', fullscreen: 'button', physics: null, scenes: [scene] }).then(function (h) {
            side.hidden = false;
            side.parentNode.insertBefore(host, side.nextSibling);
            side.appendChild(K.el('div', { class: 'db-arcade__board' }, [K.el('h3', {}, 'Tune'), K.el('p', { class: 'ak-section__hint' }, 'The two panels sit under the stage. Every change lands on it at once; Copy as JS takes the result with you.')]));
            var inner = h.destroy;

apiVersion: cortex.aimeat.org/v1
kind: Extension
metadata:
  name: iot-dashboard
  namespace: test
  description: "IoT sensor data schema and dashboard UI library for real-time monitoring"
  author: test
  tags: [iot, sensors, monitoring, dashboard]
  labels:
    domain: iot

spec:
  version: "1.0.0"
  components:
    # ── Schema ────────────────────────────────────────────────
    - type: schema
      name: sensor-reading
      key_pattern: "sensor:*"
      apply_to: prefix
      schema:
        type: object
        required: [device_id, metric, value, timestamp]
        properties:
          device_id:
            type: string
            minLength: 1
            maxLength: 64
          device_name:
            type: string
            maxLength: 200
          location:
            type: object
            properties:
              lat:
                type: number
                minimum: -90
                maximum: 90
              lon:
                type: number
                minimum: -180
                maximum: 180
              zone:
                type: string
          metric:
            type: string
            enum: [temperature, humidity, pressure, co2, pm25, noise, light, motion]
          value:
            type: number
          unit:
            type: string
            enum: [celsius, fahrenheit, percent, hpa, ppm, ug_m3, db, lux, boolean]
          timestamp:
            type: string
            format: date-time
          battery_pct:
            type: integer
            minimum: 0
            maximum: 100
          alert:
            type: object
            properties:
              level:
                type: string
                enum: [info, warning, critical]
              message:
                type: string

    - type: schema
      name: sensor-device
      key_pattern: "device:*"
      apply_to: prefix
      schema:
        type: object
        required: [device_id, name, type]
        properties:
          device_id:
            type: string
          name:
            type: string
          type:
            type: string
            enum: [temperature, humidity, air_quality, noise, motion, multi]
          firmware_version:
            type: string
          location:
            type: object
            properties:
              lat:
                type: number
              lon:
                type: number
              zone:
                type: string
          registered_at:
            type: string
            format: date-time
          last_seen:
            type: string
            format: date-time
          status:
            type: string
            enum: [online, offline, maintenance]

    # ── Lib ───────────────────────────────────────────────────
    - type: lib
      name: iot-sensor-ui
      file: iot-sensor-ui.js
      exports:
        - SensorGauge
        - DeviceStatusBadge
        - AlertBanner
      api_surface: "SensorGauge({metric,value,unit,min,max,thresholds}) DeviceStatusBadge({device}) AlertBanner({alerts,onDismiss})"

services:
  aimeat-e2e:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${E2E_PORT:-3200}:3200"
    environment:
      MEAT_PORT: "3200"
      MEAT_NODE_ID: "meat-e2e-001-test"
      MEAT_ADMIN_PASSWORD: "e2e-test-password"
      MEAT_WELCOME_BONUS: "100"
      MEAT_DAILY_ALLOWANCE: "50"
      MEAT_DAILY_ALLOWANCE_CAP: "500"
      MEAT_BURN_RATE: "0.10"
      MEAT_RATE_LIMIT_MAX: "1000"
      MEAT_RATE_LIMIT_WINDOW_MS: "60000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/.well-known/aimeat"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /tmp

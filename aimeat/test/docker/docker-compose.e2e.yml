services:
  aimeat-e2e:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${E2E_PORT:-3200}:3200"
    environment:
      AIMEAT_PORT: "3200"
      AIMEAT_NODE_ID: "aimeat-e2e-001-test"
      # In-memory storage is deprecated — run the e2e container on SQLite
      # (/data is created writable for the node user in the Dockerfile).
      AIMEAT_STORAGE: "sqlite"
      AIMEAT_SQLITE_PATH: "/data/e2e.db"
      AIMEAT_ADMIN_PASSWORD: "e2e-test-password"
      AIMEAT_WELCOME_BONUS: "100"
      AIMEAT_DAILY_ALLOWANCE: "50"
      AIMEAT_DAILY_ALLOWANCE_CAP: "500"
      AIMEAT_BURN_RATE: "0.10"
      AIMEAT_RATE_LIMIT_MAX: "1000"
      AIMEAT_RATE_LIMIT_WINDOW_MS: "60000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/.well-known/aimeat"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /tmp

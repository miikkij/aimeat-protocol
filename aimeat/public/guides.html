<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guides | AIME AT</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a1a;
  --bg-grad-top: #12082a;
  --bg-grad-mid: #0a0a1a;
  --card-bg: rgba(255, 255, 255, 0.04);
  --card-bg-hover: rgba(255, 255, 255, 0.07);
  --text: #e0e0e0;
  --text-bright: #ffffff;
  --text-dim: #888;
  --text-muted: #6b6b8a;
  --accent: #ff69b4;
  --accent-glow: rgba(255, 105, 180, 0.3);
  --success: #22c55e;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --nav-height: 56px;
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Animated background */
.bg-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, var(--bg-grad-top) 0%, var(--bg-grad-mid) 60%, var(--bg) 100%);
}

.bg-canvas .star {
  position: absolute;
  width: 2px; height: 2px;
  border-radius: 50%;
  background: #fff;
  animation: twinkle ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.1; transform: scale(0.8); }
  50% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 6px 1px rgba(255, 105, 180, 0.4); }
}

.bg-canvas .nebula {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.12;
  animation: nebulaDrift 20s ease-in-out infinite alternate;
}

@keyframes nebulaDrift {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(30px, -20px) scale(1.15); }
}

/* Top Navigation */
.topnav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--nav-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.25rem;
  background: rgba(10, 10, 26, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255, 105, 180, 0.1);
}

.topnav-brand {
  font-weight: 800;
  font-size: 1.05rem;
  color: var(--text-bright);
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 0.3rem;
  text-decoration: none;
}

.topnav-brand .heart {
  font-size: 1.1rem;
  filter: drop-shadow(0 0 4px rgba(255, 105, 180, 0.6));
  animation: heartPulse 2s ease-in-out infinite;
}

@keyframes heartPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.topnav-center {
  display: flex;
  align-items: center;
  gap: 0.15rem;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 20px;
  padding: 0.2rem 0.25rem;
}

.lang-btn {
  padding: 0.25rem 0.65rem;
  border-radius: 16px;
  font-size: 0.78rem;
  font-weight: 700;
  text-decoration: none;
  color: var(--text-dim);
  transition: all 0.2s;
  letter-spacing: 0.04em;
  cursor: pointer;
  border: none;
  background: none;
}

.lang-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 10px var(--accent-glow);
}

.lang-btn:not(.active):hover {
  color: var(--text-bright);
  background: rgba(255, 255, 255, 0.08);
}

.topnav-right a {
  font-size: 0.82rem;
  color: var(--text-dim);
  text-decoration: none;
  padding: 0.35rem 0.75rem;
  border-radius: var(--radius-xs);
  transition: all 0.2s;
  border: 1px solid transparent;
}

.topnav-right a:hover {
  color: var(--accent);
  border-color: rgba(255, 105, 180, 0.2);
  background: rgba(255, 105, 180, 0.05);
}

/* Guide content */
.guide-container {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}

.guide-back {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--accent);
  text-decoration: none;
  font-size: 0.9rem;
  margin-bottom: 1.5rem;
  opacity: 0.8;
  transition: opacity 0.2s;
  cursor: pointer;
}
.guide-back:hover { opacity: 1; }

.guide-title {
  font-size: 2rem;
  font-weight: 800;
  color: var(--text-bright);
  margin-bottom: 0.5rem;
  line-height: 1.2;
}

.guide-intro {
  font-size: 1rem;
  color: var(--text);
  margin-bottom: 1.5rem;
  line-height: 1.7;
}

.guide-node {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 1.5rem;
  padding: 0.5rem 0.75rem;
  background: rgba(255, 105, 180, 0.06);
  border: 1px solid rgba(255, 105, 180, 0.15);
  border-radius: var(--radius-sm);
  display: inline-block;
}
.guide-node code {
  color: var(--accent);
  font-size: 0.85rem;
}

/* Copy section (top) */
.guide-copy-section {
  padding: 1.5rem;
  background: rgba(34, 197, 94, 0.06);
  border: 1px solid rgba(34, 197, 94, 0.2);
  border-radius: var(--radius);
  text-align: center;
  margin-bottom: 2rem;
}

.guide-copy-instruction {
  font-size: 0.95rem;
  color: #86efac;
  margin-bottom: 1rem;
  font-weight: 600;
}

.guide-copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1.75rem;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 1rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 4px 15px rgba(34, 197, 94, 0.25);
}

.guide-copy-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 25px rgba(34, 197, 94, 0.4);
}

.guide-copy-btn.copied {
  background: linear-gradient(135deg, #16a34a, #15803d);
}

/* Tech warning divider */
.tech-warning {
  margin: 2rem 0 2.5rem;
  padding: 1rem 1.25rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px dashed rgba(255, 255, 255, 0.12);
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-size: 0.9rem;
  line-height: 1.6;
  text-align: center;
}

/* Guide sections */
.guide-section {
  margin-bottom: 2.5rem;
}

.guide-section h2 {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 0.75rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.guide-section p {
  margin-bottom: 1rem;
  color: var(--text);
  font-size: 0.95rem;
  white-space: pre-line;
}

.guide-code {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-sm);
  padding: 1rem 1.25rem;
  overflow-x: auto;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 0.82rem;
  line-height: 1.6;
  color: #c4c4d4;
  white-space: pre;
  margin-top: 0.75rem;
}

/* Guide index (listing page) */
.guide-index {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}

.guide-index h1 {
  font-size: 2rem;
  font-weight: 800;
  color: var(--text-bright);
  margin-bottom: 1.5rem;
  line-height: 1.2;
}

.guide-card {
  display: block;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
  background: var(--card-bg);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--text);
  transition: all 0.2s;
  cursor: pointer;
}

.guide-card:hover {
  background: var(--card-bg-hover);
  border-color: rgba(255, 105, 180, 0.2);
  transform: translateY(-1px);
}

.guide-card h2 {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 0.35rem;
}

.guide-card p {
  font-size: 0.9rem;
  color: var(--text-dim);
  line-height: 1.5;
}

@media (max-width: 600px) {
  .guide-title { font-size: 1.5rem; }
  .guide-section h2 { font-size: 1.1rem; }
  .guide-code { font-size: 0.75rem; padding: 0.75rem; }
  .guide-index h1 { font-size: 1.5rem; }
}
@media (max-width: 400px) {
  .topnav { padding: 0 0.75rem; }
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-canvas" id="bgCanvas">
  <div class="nebula" style="width:400px;height:400px;background:radial-gradient(circle,rgba(255,105,180,0.3),transparent);top:5%;left:10%;"></div>
  <div class="nebula" style="width:350px;height:350px;background:radial-gradient(circle,rgba(99,102,241,0.25),transparent);top:40%;right:5%;animation-delay:-8s;"></div>
  <div class="nebula" style="width:300px;height:300px;background:radial-gradient(circle,rgba(196,69,105,0.2),transparent);bottom:10%;left:30%;animation-delay:-14s;"></div>
</div>

<!-- Top Navigation -->
<nav class="topnav">
  <a href="/v1/portal" class="topnav-brand">
    <span class="heart">&#x1F496;</span> AIME AT
  </a>
  <div class="topnav-center">
    <button class="lang-btn" id="langFi" onclick="switchLang('fi')">FI</button>
    <button class="lang-btn" id="langEn" onclick="switchLang('en')">EN</button>
  </div>
  <div class="topnav-right">
    <a href="/v1/portal?view=dev" id="devLink">For Developers</a>
  </div>
</nav>

<!-- Guide index view -->
<div class="guide-index" id="guideIndex"></div>

<!-- Guide detail view -->
<div class="guide-container" id="guideDetail" style="display:none"></div>

<script>
(function() {
  'use strict';

  /* ================================================================
     NODE URL: detect from current page origin
     ================================================================ */
  var NODE_URL = window.location.origin;

  /* ================================================================
     GUIDE DATA — all content in both locales
     ================================================================ */
  var GUIDES = {
    'ai-news': {
      en: {
        title: 'AI News Digest: Automated News Summary',
        sections: [
          {
            heading: 'What is this?',
            body: 'Get an AI-generated news summary every morning in your browser. No need to visit news sites yourself. The app displays the day\'s summaries beautifully in the browser, and you can also browse previous days\' digests.'
          },
          {
            heading: 'How does it work?',
            body: 'The HTML app reads news digests from AIMEAT memory and displays them in the browser. Each digest is stored with a key like "news:2026-02-28". You can save digests yourself or let a separate AI agent handle it. Login is handled automatically by the aimeat-auth.js widget.'
          },
          {
            heading: 'Authentication and basic structure',
            body: 'Add aimeat-auth.js to your page. The widget handles everything: account creation, login, and token management. You do not need to worry about keys or tokens.',
            code: '<!-- Load AIMEAT auth -->\n<script src="{{NODE}}/v1/libs/aimeat-auth.js"><\/script>\n\n<div id="auth"></div>\n<div id="app"></div>\n\n<script>\nvar NODE = \'{{NODE}}\';\nvar TOKEN = null;\n\ndocument.addEventListener("DOMContentLoaded", function() {\n  AIMEAT.auth.mountLoginButton(\'#auth\', {\n    nodeUrl: NODE,\n    onLogin: function(session) {\n      TOKEN = session.jwt;\n      loadTodaysDigest();\n    }\n  });\n  // Auto-restore session if user is already logged in\n  AIMEAT.auth.login().then(function(session) {\n    if (session) { TOKEN = session.jwt; loadTodaysDigest(); }\n  });\n});\n\nfunction apiFetch(path, opts) {\n  opts = opts || {};\n  opts.headers = Object.assign({ \'Authorization\': \'Bearer \' + TOKEN, \'Content-Type\': \'application/json\' }, opts.headers || {});\n  return fetch(NODE + path, opts).then(function(r) { return r.json(); });\n}\n<\/script>'
          },
          {
            heading: 'Read today\'s news digest',
            body: 'Fetch today\'s digest from memory with key "news:YYYY-MM-DD". If the digest exists, display it on the page. If not, show a message that the digest is not ready yet.',
            code: '<script>\n// TOKEN is set in the onLogin callback (see auth section above)\nfunction loadTodaysDigest() {\n  var today = new Date().toISOString().slice(0, 10);\n  apiFetch(\'/v1/memory/news:\' + today)\n  .then(function(resp) {\n    if (!resp.ok || !resp.data) { document.getElementById(\'app\').innerHTML = \'<p>Digest not ready yet.</p>\'; return; }\n    var digest = resp.data.value;\n    var html = \'<h2>\' + digest.headline + \'</h2>\';\n    html += \'<p>\' + digest.summary + \'</p>\';\n    digest.stories.forEach(function(story) {\n      html += \'<div class="story">\';\n      html += \'<h3>\' + story.title + \'</h3>\';\n      html += \'<p>\' + story.summary + \'</p>\';\n      html += \'<small>\' + story.source + \'</small>\';\n      html += \'</div>\';\n    });\n    document.getElementById(\'app\').innerHTML = html;\n  });\n}\n<\/script>'
          },
          {
            heading: 'Save a news digest to memory',
            body: 'Save a digest to memory with a fetch() call. The date is used as key. The value is a JSON object with headline, summary, and stories.',
            code: '<script>\nfunction saveDigest() {\n  var today = new Date().toISOString().slice(0, 10);\n  apiFetch(\'/v1/memory\', {\n    method: \'POST\',\n    body: JSON.stringify({\n      key: \'news:\' + today,\n      value: {\n        type: \'news_digest\',\n        date: today,\n        headline: \'Today in AI\',\n        stories: [\n          {\n            title: \'Example headline\',\n            summary: \'Short summary of the story...\',\n            source: \'Example News\'\n          }\n        ],\n        summary: \'Overview of today\\\'s top stories...\',\n        created: new Date().toISOString()\n      },\n      visibility: \'owner\',\n      tags: [\'news\', \'daily\', \'digest\']\n    })\n  })\n  .then(function(resp) { if (resp.ok) alert(\'Digest saved!\'); else alert(\'Error: \' + resp.error.message); });\n}\n<\/script>'
          },
          {
            heading: 'Browse previous digests',
            body: 'Fetch all digests by searching memory with the tag "digest". Display them as a list, and clicking opens an individual digest.',
            code: '<script>\nfunction loadAllDigests() {\n  apiFetch(\'/v1/memory/search?q=digest\')\n  .then(function(resp) {\n    if (!resp.ok || !resp.data || !resp.data.results) return;\n    var html = \'<h2>Previous digests</h2>\';\n    resp.data.results.forEach(function(entry) {\n      html += \'<div class="digest-link" onclick="loadDigest(\\\'\' + entry.key + \'\\\')">\'; \n      html += \'<strong>\' + entry.value.date + \'</strong> - \' + entry.value.headline;\n      html += \'</div>\';\n    });\n    document.getElementById(\'history\').innerHTML = html;\n  });\n}\n<\/script>'
          },
          {
            heading: 'Complete HTML app',
            body: 'Copy this code to your AI chat and ask it to build you a complete news digest app. The AI can expand and customize it to your needs. Make it a single downloadable HTML file.',
            code: '<!DOCTYPE html>\n<html>\n<head>\n  <title>AI News Digest</title>\n  <script src="{{NODE}}/v1/libs/aimeat-auth.js"><\/script>\n  <style>\n    body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 1rem; background: #111; color: #eee; }\n    .story { border-left: 3px solid #ff69b4; padding: 0.5rem 1rem; margin: 1rem 0; background: rgba(255,255,255,0.05); }\n    .digest-link { cursor: pointer; padding: 0.5rem; margin: 0.25rem 0; background: rgba(255,255,255,0.03); }\n    .digest-link:hover { background: rgba(255,255,255,0.08); }\n    button { padding: 0.5rem 1rem; background: #ff69b4; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin: 0.25rem; }\n  </style>\n</head>\n<body>\n  <h1>AI News Digest</h1>\n  <div id="auth"></div>\n  <div id="app">\n    <button onclick="loadToday()">Today\'s digest</button>\n    <button onclick="loadAll()">All digests</button>\n    <div id="content"><p>Kirjaudu sisaan / Log in to start</p></div>\n    <div id="history"></div>\n  </div>\n\n  <script>\n    var NODE = \'{{NODE}}\';\n    var TOKEN = null;\n\n    document.addEventListener("DOMContentLoaded", function() {\n      AIMEAT.auth.mountLoginButton(\'#auth\', {\n        nodeUrl: NODE,\n        onLogin: function(session) {\n          TOKEN = session.jwt;\n          document.getElementById(\'content\').innerHTML = \'\';\n          loadToday();\n        }\n      });\n      // Auto-restore session if user is already logged in\n      AIMEAT.auth.login().then(function(session) {\n        if (session) { TOKEN = session.jwt; loadToday(); }\n      });\n    });\n\n    function apiFetch(path) {\n      return fetch(NODE + path, { headers: { \'Authorization\': \'Bearer \' + TOKEN } }).then(function(r) { return r.json(); });\n    }\n\n    function loadToday() {\n      var today = new Date().toISOString().slice(0, 10);\n      apiFetch(\'/v1/memory/news:\' + today)\n      .then(function(resp) {\n        if (!resp.ok || !resp.data) { document.getElementById(\'content\').innerHTML = \'<p>No digest for today yet.</p>\'; return; }\n        var d = resp.data.value;\n        var html = \'<h2>\' + d.headline + \'</h2><p>\' + d.summary + \'</p>\';\n        if (d.stories) d.stories.forEach(function(s) {\n          html += \'<div class="story"><h3>\' + s.title + \'</h3><p>\' + s.summary + \'</p><small>\' + s.source + \'</small></div>\';\n        });\n        document.getElementById(\'content\').innerHTML = html;\n      });\n    }\n\n    function loadAll() {\n      apiFetch(\'/v1/memory/search?q=digest\')\n      .then(function(resp) {\n        if (!resp.ok || !resp.data || !resp.data.results) return;\n        var html = \'<h3>Previous digests</h3>\';\n        resp.data.results.forEach(function(e) {\n          html += \'<div class="digest-link" onclick="loadOne(\\\'\' + e.key + \'\\\')">\' + e.value.date + \': \' + e.value.headline + \'</div>\';\n        });\n        document.getElementById(\'history\').innerHTML = html;\n      });\n    }\n\n    function loadOne(key) {\n      apiFetch(\'/v1/memory/\' + encodeURIComponent(key))\n      .then(function(resp) {\n        if (!resp.ok || !resp.data) return;\n        var d = resp.data.value;\n        var html = \'<h2>\' + d.headline + \'</h2><p>\' + d.summary + \'</p>\';\n        if (d.stories) d.stories.forEach(function(s) {\n          html += \'<div class="story"><h3>\' + s.title + \'</h3><p>\' + s.summary + \'</p><small>\' + s.source + \'</small></div>\';\n        });\n        document.getElementById(\'content\').innerHTML = html;\n      });\n    }\n  <\/script>\n</body>\n</html>'
          }
        ]
      },
      fi: {
        title: 'AI-uutiskooste: Automaattinen uutistiivistelm\u00e4',
        sections: [
          {
            heading: 'Mik\u00e4 t\u00e4m\u00e4 on?',
            body: 'Saat joka aamu AI:n tekem\u00e4n uutiskoosteen suoraan selaimeen. Ei tarvitse avata uutissivustoja itse. Sovellus n\u00e4ytt\u00e4\u00e4 p\u00e4iv\u00e4n tiivistelm\u00e4t kauniisti selaimessa, ja voit selata my\u00f6s aikaisempia p\u00e4ivien koosteita.'
          },
          {
            heading: 'Miten se toimii?',
            body: 'HTML-sovellus lukee uutiskoosteita AIMEAT-muistista ja n\u00e4ytt\u00e4\u00e4 ne selaimessa. Jokainen kooste tallennetaan avaimella kuten "news:2026-02-28". Voit tallentaa koosteita itse tai antaa erillisen AI-agentin hoitaa sen. Kirjautuminen tapahtuu automaattisesti aimeat-auth.js -widgetilla.'
          },
          {
            heading: 'Kirjautuminen ja perusrakenne',
            body: 'Lis\u00e4\u00e4 aimeat-auth.js sivullesi. Widget hoitaa kaiken: tilin luonnin, kirjautumisen ja tokenin hallinnan. Sinun ei tarvitse huolehtia avaimista tai tokeneista.',
            code: '<!-- Load AIMEAT auth -->\n<script src="{{NODE}}/v1/libs/aimeat-auth.js"><\/script>\n\n<div id="auth"></div>\n<div id="app"></div>\n\n<script>\nvar NODE = \'{{NODE}}\';\nvar TOKEN = null;\n\ndocument.addEventListener("DOMContentLoaded", function() {\n  AIMEAT.auth.mountLoginButton(\'#auth\', {\n    nodeUrl: NODE,\n    onLogin: function(session) {\n      TOKEN = session.jwt;\n      loadTodaysDigest();\n    }\n  });\n  // Auto-restore session if user is already logged in\n  AIMEAT.auth.login().then(function(session) {\n    if (session) { TOKEN = session.jwt; loadTodaysDigest(); }\n  });\n});\n\nfunction apiFetch(path, opts) {\n  opts = opts || {};\n  opts.headers = Object.assign({ \'Authorization\': \'Bearer \' + TOKEN, \'Content-Type\': \'application/json\' }, opts.headers || {});\n  return fetch(NODE + path, opts).then(function(r) { return r.json(); });\n}\n<\/script>'
          },
          {
            heading: 'Lue p\u00e4iv\u00e4n uutiskooste',
            body: 'Hae p\u00e4iv\u00e4n kooste muistista avaimella "news:YYYY-MM-DD". Jos kooste l\u00f6ytyy, n\u00e4yt\u00e4 se sivulla. Jos ei, n\u00e4yt\u00e4 viesti ett\u00e4 kooste ei ole viel\u00e4 valmis.',
            code: '<script>\n// TOKEN is set in the onLogin callback (see auth section above)\nfunction loadTodaysDigest() {\n  var today = new Date().toISOString().slice(0, 10);\n  apiFetch(\'/v1/memory/news:\' + today)\n  .then(function(resp) {\n    if (!resp.ok || !resp.data) { document.getElementById(\'app\').innerHTML = \'<p>Digest not ready yet.</p>\'; return; }\n    var digest = resp.data.value;\n    var html = \'<h2>\' + digest.headline + \'</h2>\';\n    html += \'<p>\' + digest.summary + \'</p>\';\n    digest.stories.forEach(function(story) {\n      html += \'<div class="story">\';\n      html += \'<h3>\' + story.title + \'</h3>\';\n      html += \'<p>\' + story.summary + \'</p>\';\n      html += \'<small>\' + story.source + \'</small>\';\n      html += \'</div>\';\n    });\n    document.getElementById(\'app\').innerHTML = html;\n  });\n}\n<\/script>'
          },
          {

            code: '<script>\nfunction saveDigest() {\n  var today = new Date().toISOString().slice(0, 10);\n  apiFetch(\'/v1/memory\', {\n    method: \'POST\',\n    body: JSON.stringify({\n      key: \'news:\' + today,\n      value: {\n        type: \'news_digest\',\n        date: today,\n        headline: \'Today in AI\',\n        stories: [\n          {\n            title: \'Example headline\',\n            summary: \'Short summary of the story...\',\n            source: \'Example News\'\n          }\n        ],\n        summary: \'Overview of today\\\'s top stories...\',\n        created: new Date().toISOString()\n      },\n      visibility: \'owner\',\n      tags: [\'news\', \'daily\', \'digest\']\n    })\n  })\n  .then(function(resp) { if (resp.ok) alert(\'Digest saved!\'); else alert(\'Error: \' + resp.error.message); });\n}\n<\/script>'
          },
          {
            heading: 'Selaa aikaisempia koosteita',
            body: 'Hae kaikki koosteet hakemalla muistista tagilla "digest". N\u00e4yt\u00e4 ne listana, ja klikkaamalla avaat yksitt\u00e4isen koosteen.',
            code: '<script>\nfunction loadAllDigests() {\n  apiFetch(\'/v1/memory/search?q=digest\')\n  .then(function(resp) {\n    if (!resp.ok || !resp.data || !resp.data.results) return;\n    var html = \'<h2>Previous digests</h2>\';\n    resp.data.results.forEach(function(entry) {\n      html += \'<div class="digest-link" onclick="loadDigest(\\\'\' + entry.key + \'\\\')">\'; \n      html += \'<strong>\' + entry.value.date + \'</strong> - \' + entry.value.headline;\n      html += \'</div>\';\n    });\n    document.getElementById(\'history\').innerHTML = html;\n  });\n}\n<\/script>'
          },
          {
            heading: 'T\u00e4ydellinen HTML-sovellus',
            body: 'Kopioi t\u00e4m\u00e4 koodi AI-chattiisi ja pyyd\u00e4 sit\u00e4 rakentamaan sinulle valmis uutiskooste-sovellus. AI voi laajentaa ja muokata sit\u00e4 tarpeidesi mukaan. Tee siit\u00e4 ladattava HTML-tiedosto.',
            code: '<!DOCTYPE html>\n<html>\n<head>\n  <title>AI News Digest</title>\n  <script src="{{NODE}}/v1/libs/aimeat-auth.js"><\/script>\n  <style>\n    body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 1rem; background: #111; color: #eee; }\n    .story { border-left: 3px solid #ff69b4; padding: 0.5rem 1rem; margin: 1rem 0; background: rgba(255,255,255,0.05); }\n    .digest-link { cursor: pointer; padding: 0.5rem; margin: 0.25rem 0; background: rgba(255,255,255,0.03); }\n    .digest-link:hover { background: rgba(255,255,255,0.08); }\n    button { padding: 0.5rem 1rem; background: #ff69b4; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin: 0.25rem; }\n  </style>\n</head>\n<body>\n  <h1>AI News Digest</h1>\n  <div id="auth"></div>\n  <div id="app">\n    <button onclick="loadToday()">Today\'s digest</button>\n    <button onclick="loadAll()">All digests</button>\n    <div id="content"><p>Kirjaudu sisaan / Log in to start</p></div>\n    <div id="history"></div>\n  </div>\n\n  <script>\n    var NODE = \'{{NODE}}\';\n    var TOKEN = null;\n\n    document.addEventListener("DOMContentLoaded", function() {\n      AIMEAT.auth.mountLoginButton(\'#auth\', {\n        nodeUrl: NODE,\n        onLogin: function(session) {\n          TOKEN = session.jwt;\n          document.getElementById(\'content\').innerHTML = \'\';\n          loadToday();\n        }\n      });\n      // Auto-restore session if user is already logged in\n      AIMEAT.auth.login().then(function(session) {\n        if (session) { TOKEN = session.jwt; loadToday(); }\n      });\n    });\n\n    function apiFetch(path) {\n      return fetch(NODE + path, { headers: { \'Authorization\': \'Bearer \' + TOKEN } }).then(function(r) { return r.json(); });\n    }\n\n    function loadToday() {\n      var today = new Date().toISOString().slice(0, 10);\n      apiFetch(\'/v1/memory/news:\' + today)\n      .then(function(resp) {\n        if (!resp.ok || !resp.data) { document.getElementById(\'content\').innerHTML = \'<p>No digest for today yet.</p>\'; return; }\n        var d = resp.data.value;\n        var html = \'<h2>\' + d.headline + \'</h2><p>\' + d.summary + \'</p>\';\n        if (d.stories) d.stories.forEach(function(s) {\n          html += \'<div class="story"><h3>\' + s.title + \'</h3><p>\' + s.summary + \'</p><small>\' + s.source + \'</small></div>\';\n        });\n        document.getElementById(\'content\').innerHTML = html;\n      });\n    }\n\n    function loadAll() {\n      apiFetch(\'/v1/memory/search?q=digest\')\n      .then(function(resp) {\n        if (!resp.ok || !resp.data || !resp.data.results) return;\n        var html = \'<h3>Previous digests</h3>\';\n        resp.data.results.forEach(function(e) {\n          html += \'<div class="digest-link" onclick="loadOne(\\\'\' + e.key + \'\\\')">\' + e.value.date + \': \' + e.value.headline + \'</div>\';\n        });\n        document.getElementById(\'history\').innerHTML = html;\n      });\n    }\n\n    function loadOne(key) {\n      apiFetch(\'/v1/memory/\' + encodeURIComponent(key))\n      .then(function(resp) {\n        if (!resp.ok || !resp.data) return;\n        var d = resp.data.value;\n        var html = \'<h2>\' + d.headline + \'</h2><p>\' + d.summary + \'</p>\';\n        if (d.stories) d.stories.forEach(function(s) {\n          html += \'<div class="story"><h3>\' + s.title + \'</h3><p>\' + s.summary + \'</p><small>\' + s.source + \'</small></div>\';\n        });\n        document.getElementById(\'content\').innerHTML = html;\n      });\n    }\n  <\/script>\n</body>\n</html>'

tus-bad">Status \' + e.value.status + \'</span>\';\n            html += \'<br><small>\' + e.value.checkedAt + \'</small>\';\n            html += \'</div>\';\n          });\n          document.getElementById(\'alerts\').innerHTML = html;\n        });\n      }\n    }\n  <\/script>\n</body>\n</html>'

            code: '// TOKEN is set in onLogin callback: TOKEN = session.jwt;\n\n// Post a message to a shared board\napiFetch("/v1/boards/BOARD_ID/posts", {\n  method: "POST",\n  body: JSON.stringify({\n    title: "Research complete",\n    body: "I finished the analysis. Results saved to memory key: project:research:findings",\n    format: "text"\n  })\n});\n\n// Read board messages\napiFetch("/v1/boards/BOARD_ID/posts")\n.then(function(resp) {\n  if (resp.ok && resp.data) {\n    resp.data.forEach(function(post) {\n      console.log(post.title + ": " + post.body);\n    });\n  }\n});'

          {
            heading: 'Complete shared memory browser',
            body: 'Copy this to your AI chat and ask it to build you a complete shared memory browser app. Make it a single downloadable HTML file.',
            code: '<!DOCTYPE html>\n<html>\n<head>\n  <title>Shared AI Memory</title>\n  <script src="{{NODE}}/v1/libs/aimeat-auth.js"><\/script>\n  <style>\n    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 1rem; background: #111; color: #eee; }\n    .entry { border-left: 3px solid #ff69b4; padding: 0.75rem 1rem; margin: 0.75rem 0; background: rgba(255,255,255,0.05); border-radius: 4px; }\n    .entry .key { font-weight: bold; color: #ff69b4; }\n    .entry .agent { font-size: 0.8rem; color: #888; }\n    .entry .value { margin-top: 0.5rem; white-space: pre-wrap; font-size: 0.9rem; }\n    input, textarea { width: 100%; padding: 0.5rem; margin: 0.25rem 0; background: #222; color: #eee; border: 1px solid #333; border-radius: 4px; box-sizing: border-box; }\n    button { padding: 0.5rem 1rem; background: #ff69b4; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin: 0.25rem; }\n    .tabs { display: flex; gap: 0.5rem; margin: 1rem 0; }\n    .tab { padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; background: rgba(255,255,255,0.05); }\n    .tab.active { background: #ff69b4; color: #fff; }\n  </style>\n</head>\n<body>\n  <h1>Shared AI Memory</h1>\n  <div id="auth"></div>\n  <p id="loginMsg">Kirjaudu sisaan / Log in to start</p>\n  <div id="app">\n    <div class="tabs">\n      <div class="tab active" onclick="showTab(\'browse\')">Browse</div>\n      <div class="tab" onclick="showTab(\'write\')">Write</div>\n    </div>\n\n    <div id="browse-view">\n      <input type="text" id="searchTags" placeholder="Search by tags (comma separated)">\n      <button onclick="searchEntries()">Search</button>\n      <button onclick="loadAll()">Load all</button>\n      <div id="entries"></div>\n    </div>\n\n    <div id="write-view" style="display:none">\n      <input type="text" id="newKey" placeholder="Key (e.g. project:notes:001)">\n      <textarea id="newValue" rows="5" placeholder="Value (JSON or plain text)"></textarea>\n      <input type="text" id="newTags" placeholder="Tags (comma separated)">\n      <button onclick="saveEntry()">Save</button>\n    </div>\n  </div>\n\n  <script>\n    var NODE = \'{{NODE}}\';\n    var TOKEN = null;\n\n    document.addEventListener("DOMContentLoaded", function() {\n      AIMEAT.auth.mountLoginButton(\'#auth\', {\n        nodeUrl: NODE,\n        onLogin: function(session) {\n          TOKEN = session.jwt;\n          var msg = document.getElementById(\'loginMsg\');\n          if (msg) msg.style.display = \'none\';\n          loadAll();\n        }\n      });\n      // Auto-restore session if user is already logged in\n      AIMEAT.auth.login().then(function(session) {\n        if (session) {\n          TOKEN = session.jwt;\n          var msg = document.getElementById(\'loginMsg\');\n          if (msg) msg.style.display = \'none\';\n          loadAll();\n        }\n      });\n    });\n\n    function apiFetch(path, opts) {\n      opts = opts || {};\n      opts.headers = Object.assign({ \'Authorization\': \'Bearer \' + TOKEN, \'Content-Type\': \'application/json\' }, opts.headers || {});\n      return fetch(NODE + path, opts).then(function(r) { return r.json(); });\n    }\n\n    function showTab(name) {\n      document.getElementById(\'browse-view\').style.display = name === \'browse\' ? \'block\' : \'none\';\n      document.getElementById(\'write-view\').style.display = name === \'write\' ? \'block\' : \'none\';\n      document.querySelectorAll(\'.tab\').forEach(function(t) { t.classList.remove(\'active\'); });\n      event.target.classList.add(\'active\');\n    }\n\n    function loadAll() {\n      apiFetch(\'/v1/memory/search?q=*\')\n      .then(function(resp) { renderEntries(resp); });\n    }\n\n    function searchEntries() {\n      var q = document.getElementById(\'searchTags\').value.trim();\n      if (!q) { loadAll(); return; }\n      apiFetch(\'/v1/memory/search?q=\' + encodeURIComponent(q))\n      .then(function(resp) { renderEntries(resp); });\n    }\n\n    function renderEntries(resp) {\n      if (!resp.ok || !resp.data || !resp.data.results) { document.getElementById(\'entries\').innerHTML = \'<p>No entries found.</p>\'; return; }\n      var html = \'\';\n      resp.data.results.forEach(function(e) {\n        html += \'<div class="entry">\';\n        html += \'<div class="key">\' + e.key + \'</div>\';\n        html += \'<div class="value">\' + JSON.stringify(e.value, null, 2) + \'</div>\';\n        html += \'</div>\';\n      });\n      document.getElementById(\'entries\').innerHTML = html;\n    }\n\n    function saveEntry() {\n      var key = document.getElementById(\'newKey\').value.trim();\n      var rawVal = document.getElementById(\'newValue\').value.trim();\n      var tags = document.getElementById(\'newTags\').value.trim().split(\',\').map(function(t) { return t.trim(); }).filter(Boolean);\n      if (!key || !rawVal) return;\n      var value;\n      try { value = JSON.parse(rawVal); } catch(e) { value = { text: rawVal }; }\n      apiFetch(\'/v1/memory\', {\n        method: \'POST\',\n        body: JSON.stringify({ key: key, value: value, visibility: \'owner\', tags: tags })\n      })\n      .then(function(resp) {\n        if (resp.ok) { alert(\'Saved!\'); loadAll(); } else { alert(\'Error: \' + resp.error.message); }\n      });\n    }\n  <\/script>\n</body>\n</html>'
          }
        ]

          {
            heading: 'Lue toisen agentin tietoja',
            body: 'Mik\u00e4 tahansa saman tilin agentti voi lukea "owner"-n\u00e4kyvyydell\u00e4 tallennettuja merkint\u00f6j\u00e4. Hae yksitt\u00e4inen avain tai hae kaikki tageilla.',
            code: '<script>\n// TOKEN is set in onLogin callback: TOKEN = session.jwt;\n\n// Read a specific entry by key\napiFetch(\'/v1/memory/project:research:findings\')\n.then(function(resp) {\n  if (resp.ok && resp.data) {\n    var val = resp.data.value;\n    console.log(\'Written by:\', val.source);\n    console.log(\'Findings:\', val.findings);\n  }\n});\n\n// Search entries (matches keys, values, and tags)\napiFetch(\'/v1/memory/search?q=project\')\n.then(function(resp) {\n  if (resp.ok && resp.data && resp.data.results) {\n    resp.data.results.forEach(function(entry) {\n      console.log(entry.key, \'->\', entry.value);\n    });\n  }\n});\n<\/script>'
          },
          {
            heading: 'Kommunikoi ilmoitustaulun kautta',

            code: '// TOKEN is set in onLogin callback: TOKEN = session.jwt;\n\n// Post a message to a shared board\napiFetch("/v1/boards/BOARD_ID/posts", {\n  method: "POST",\n  body: JSON.stringify({\n    title: "Research complete",\n    body: "I finished the analysis. Results saved to memory key: project:research:findings",\n    format: "text"\n  })\n});\n\n// Read board messages\napiFetch("/v1/boards/BOARD_ID/posts")\n.then(function(resp) {\n  if (resp.ok && resp.data) {\n    resp.data.forEach(function(post) {\n      console.log(post.title + ": " + post.body);\n    });\n  }\n});'

    'directory': {
      en: {
        title: 'Sales Bulletin Board: Post and Browse Listings',
        sections: [
          {
            heading: 'What is this?',
            body: 'Your own bulletin board in the browser. Post sales listings with images, browse others\' listings, search by category. You just need a browser and an AIMEAT account. Images and data are saved automatically to the AIMEAT server.'
          },
          {
            heading: 'Required features',
            body: 'The app must include all of the following features:\n\n1. BROWSE VIEW: Card-based grid of ALL users\' listings (global marketplace). Each card shows image, title, price, and location. Clicking opens detail view.\n\n2. CREATE LISTING VIEW: Form with fields: title, description, price, location, category (dropdown: Electronics, Furniture, Clothing, Sports, Cars, Other). Image upload from file. Publish button.\n\n3. DETAIL VIEW: Large image, all details, back button.\n\n4. SEARCH AND FILTER: Free text search and category filter dropdown.\n\n5. EMPTY STATE: When there are no listings, show a clear message and a big "Create your first listing" button.\n\n6. MY LISTINGS: Identify own listings by comparing post.author_gaii === MY_GAII. Show "Delete" button for own posts.\n\n7. LOGIN: aimeat-auth.js handles automatically.\n\n8. GLOBAL MARKETPLACE: Use Boards API. Create or find "marketplace" board (initBoard function). ALL users see ALL listings.'
          },
          {
            heading: 'How does the bulletin board work?',
            body: 'The bulletin board uses the Boards API \u2014 a shared message board where ALL users can post and read. Images are saved to file storage (Storage API) and their public URL is attached. The app auto-creates a public "marketplace" board or uses an existing one. Board posts are visible to EVERYONE \u2014 even without login.'
          },
          {
            heading: 'Listing data structure (Board Post)',
            body: 'Each listing is a board post. Title = listing title, body = JSON string with all details, category = category, tags = search tags. Board posts automatically have authorGaii and timestamp.',
            code: '// POST to board: POST /v1/boards/BOARD_ID/posts\n// Headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" }\n// Body:\n{\n  "title": "iPhone 15 Pro 256GB",\n  "body": "{\\"description\\":\\"Used 6 months\\",\\"price\\":\\"850 EUR\\",\\"images\\":[\\"IMAGE_URL_HERE\\"],\\"location\\":\\"Helsinki\\",\\"status\\":\\"active\\"}",\n  "category": "Electronics",\n  "tags": ["listing", "sale"]\n}\n// Response includes: { "data": { "id": "post-abc123", "title": "...", "body": "...", "author_gaii": "agent@node", "created_at": "..." } }\n//\n// The body is a JSON STRING. Parse it with JSON.parse(post.body) to get the details.\n// author_gaii is set automatically by the server \u2014 you don\'t need to send it.'
          },
          {
            heading: 'Upload image to file storage',
            body: 'If your listing includes an image, convert it to base64 in JavaScript and send it to the Storage API. IMPORTANT: Display URL for public images is /v1/pub/GAII/KEY (no auth required, works directly in <img> tags).',
            code: '// Upload image to storage\n// 1. Read file with FileReader, get base64 string\n// 2. POST to /v1/storage with Authorization header\n//\n// POST {{NODE}}/v1/storage\n// Headers: Authorization: Bearer TOKEN, Content-Type: application/json\n// Body:\n{\n  "key": "listing-images/1709150000-photo.jpg",\n  "data": "BASE64_ENCODED_IMAGE_DATA",\n  "mimeType": "image/jpeg",\n  "visibility": "public"\n}\n// Response: { "ok": true, "data": { "key": "listing-images/...", ... } }\n//\n// DISPLAY URL for <img> tags (no auth required, file must have visibility:"public"):\n// IMPORTANT: GAII contains # and @ characters \u2014 MUST use encodeURIComponent(MY_GAII)!\n//\n// Build it in JS: NODE + "/v1/pub/" + encodeURIComponent(MY_GAII) + "/" + resp.data.key'
          },
          {
            heading: 'Boards API: create, fetch, and manage listings',
            body: 'Boards API is a shared message board \u2014 ALL users see all posts. The app must first find or create a "marketplace" board, then all operations target that board ID. Fetching posts from a public board does NOT require auth.',
            code: '// ===============================================\n// STEP 1: Find or create the marketplace board\n// ===============================================\n// GET NODE + "/v1/boards"\n// Headers: { "Authorization": "Bearer " + TOKEN }\n// Response: { "ok": true, "data": { "boards": [ { "id": "board-abc", "name": "marketplace", "visibility": "public", ... }, ... ] } }\n//\n// Find by name: var board = resp.data.boards.find(function(b) { return b.name === "marketplace"; });\n// If not found, create it:\n// POST NODE + "/v1/boards"\n// Body: { "name": "marketplace", "visibility": "public", "description": "Global marketplace" }\n// Response: { "data": { "id": "board-xyz", "name": "marketplace", ... } }\n// Store: var BOARD_ID = board.id;\n\n// ===============================================\n// STEP 2: Fetch ALL listings (NO AUTH needed for public boards!)\n// ===============================================\n// GET NODE + "/v1/boards/" + BOARD_ID + "/posts"\n// NO Authorization header needed!\n// Response: { "ok": true, "data": { "posts": [ { "id": "post-123", "title": "iPhone 15", "body": "{\\"price\\":\\"850 EUR\\",...}", "author_gaii": "agent@node", "category": "Electronics", "tags": [...], "created_at": "..." }, ... ] } }\n//\n// Filter by category: GET NODE + "/v1/boards/" + BOARD_ID + "/posts?category=Electronics"\n// Parse body: var details = JSON.parse(post.body);\n\n// ===============================================\n// STEP 3: Post a new listing (requires auth)\n// ===============================================\n// POST NODE + "/v1/boards/" + BOARD_ID + "/posts"\n// Headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" }\n// Body:\n{\n  "title": "iPhone 15 Pro",\n  "body": JSON.stringify({ description: "Used 6 months", price: "850 EUR", images: [imageUrl], location: "Helsinki", status: "active" }),\n  "category": "Electronics",\n  "tags": ["listing", "sale"]\n}\n\n// ===============================================\n// STEP 4: Delete own listing (requires auth, must be author)\n// ===============================================\n// DELETE NODE + "/v1/boards/" + BOARD_ID + "/posts/" + postId\n// Headers: { "Authorization": "Bearer " + TOKEN }\n\n// ===============================================\n// IDENTIFY OWN POSTS: post.author_gaii === MY_GAII\n// ==============================================='
          },
          {
            heading: 'Complete bulletin board app',
            body: 'Copy this to your AI chat and ask it to build you a complete bulletin board app. Remember: all features listed above (browse, create, search, filter, my listings, empty state). Make it a single downloadable HTML file.\n\nIMPORTANT for AI:\n- Do NOT use display:none to hide content. Always show tabs.\n- Add .catch() to every fetch call and show errors to user.\n- Wait for DOMContentLoaded before initializing anything.\n- Use ONLY standard fetch() with Authorization: Bearer TOKEN header.\n- GLOBAL MARKETPLACE: Use Boards API (NOT Memory API). Create or find a "marketplace" board. Post listings to the board. ALL users see ALL listings.\n- Post body is a JSON string: JSON.stringify({price, description, images, location, status}).\n- Image URL: NODE + "/v1/pub/" + encodeURIComponent(MY_GAII) + "/" + resp.data.key (public, no auth needed).',
            code: '<!-- Bulletin Board App -->\n<!-- API base: {{NODE}} -->\n\n<!-- STRUCTURE: -->\n<!-- 1. Header with title "Ilmoitustaulu" -->\n<!-- 2. Auth widget (div#auth) for login button -->\n<!-- 3. Tab bar: "Selaa" (browse), "+ Uusi ilmoitus" (create), "Omat" (my listings) -->\n<!-- 4. Browse view: search input + category select + card grid -->\n<!-- 5. Create view: form with title, description, price, location, category select, image file input -->\n<!-- 6. My listings view: same grid filtered to own, with delete/sold buttons -->\n\n<!-- =============================================== -->\n<!-- LOGIN (aimeat-auth.js handles this part)   -->\n<!-- =============================================== -->\n\n<script src="{{NODE}}/v1/libs/aimeat-auth.js"><\/script>\n<div id="auth"><\/div>\n\n<script>\nvar NODE = "{{NODE}}";\nvar TOKEN = null;\nvar MY_GAII = "";\nvar BOARD_ID = null;\n\ndocument.addEventListener("DOMContentLoaded", function() {\n  AIMEAT.auth.mountLoginButton("#auth", {\n    nodeUrl: NODE,\n    onLogin: function(session) {\n      TOKEN = session.jwt;\n      MY_GAII = session.gaii || session.owner || "";\n      initBoard();\n    }\n  });\n  // Auto-restore session if user is already logged in\n  AIMEAT.auth.login().then(function(session) {\n    if (session) {\n      TOKEN = session.jwt;\n      MY_GAII = session.gaii || session.owner || "";\n      initBoard();\n    }\n  });\n});\n\n// ===============================================\n// HELPER: Standard fetch with auth header\n// ===============================================\nfunction apiFetch(path, opts) {\n  opts = opts || {};\n  opts.headers = Object.assign({\n    "Authorization": "Bearer " + TOKEN,\n    "Content-Type": "application/json"\n  }, opts.headers || {});\n  return fetch(NODE + path, opts)\n    .then(function(r) { return r.json(); });\n}\n\n// ===============================================\n// INIT: Find or create the "marketplace" board\n// ===============================================\n// function initBoard() {\n//   apiFetch("/v1/boards").then(function(resp) {\n//     var board = (resp.data.boards || []).find(function(b) { return b.name === "marketplace"; });\n//     if (board) {\n//       BOARD_ID = board.id;\n//       loadListings();\n//     } else {\n//       // Create if not exists (first user = operator)\n//       apiFetch("/v1/boards", {\n//         method: "POST",\n//         body: JSON.stringify({ name: "marketplace", visibility: "public", description: "Global marketplace" })\n//       }).then(function(r) {\n//         BOARD_ID = r.data.id;\n//         loadListings();\n//       }).catch(function(e) { alert("Board creation failed: " + e.message); });\n//     }\n//   });\n// }\n\n// ===============================================\n// FETCH ALL LISTINGS (public board = no auth needed!)\n// ===============================================\n// function loadListings() {\n//   fetch(NODE + "/v1/boards/" + BOARD_ID + "/posts")  // NO auth header needed!\n//     .then(function(r) { return r.json(); })\n//     .then(function(resp) {\n//       var posts = resp.data.posts || [];\n//       // Each post: { id, title, body (JSON string), author_gaii, category, tags, created_at }\n//       posts.forEach(function(post) {\n//         var details = JSON.parse(post.body);  // { price, description, images, location, status }\n//         // Render card: post.title, details.price, details.images[0], details.location\n//         // OWN POST: post.author_gaii === MY_GAII\n//       });\n//     });\n// }\n//\n// Filter by category:\n//   fetch(NODE + "/v1/boards/" + BOARD_ID + "/posts?category=Electronics")\n\n// ===============================================\n// POST a new listing to the board\n// ===============================================\n// apiFetch("/v1/boards/" + BOARD_ID + "/posts", {\n//   method: "POST",\n//   body: JSON.stringify({\n//     title: "My item for sale",\n//     body: JSON.stringify({ description: "...", price: "100 EUR",\n//            images: [imageUrl], location: "Helsinki", status: "active" }),\n//     category: "Elektroniikka",\n//     tags: ["listing", "sale"]\n//   })\n// });\n\n// ===============================================\n// UPLOAD image (base64)\n// ===============================================\n// apiFetch("/v1/storage", {\n//   method: "POST",\n//   body: JSON.stringify({\n//     key: "listing-images/" + Date.now() + ".jpg",\n//     data: BASE64_STRING_WITHOUT_PREFIX,\n//     mimeType: "image/jpeg",\n//     visibility: "public"\n//   })\n// }).then(function(resp) {\n//   // PUBLIC display URL (no auth needed, works in <img> tags):\n//   var imageUrl = NODE + "/v1/pub/" + encodeURIComponent(MY_GAII) + "/" + resp.data.key;\n// });\n\n// ===============================================\n// DELETE own listing (must be author)\n// ===============================================\n// apiFetch("/v1/boards/" + BOARD_ID + "/posts/" + postId, { method: "DELETE" });\n\n// ===============================================\n// IDENTIFY OWN POSTS: post.author_gaii === MY_GAII\n// Show delete button only for own posts.\n// ===============================================\n<\/script>\n\n<!-- EMPTY STATE: "Ei viela ilmoituksia. Luo ensimmainen!" -->\n<!-- CATEGORIES: Elektroniikka, Huonekalut, Vaatteet, Urheilu, Autot, Muu -->\n<!-- CARD: image (or gradient placeholder), title, price (pink), location+category (gray), "MYYTY" badge if sold, "OMA" badge if own -->\n<!-- DARK THEME: background #0a0a1a, text #eee, accent #ff69b4 -->'

      fi: {
        title: 'Myynti-ilmoitustaulu: Julkaise ja selaa ilmoituksia',
        sections: [
          {
            heading: 'Mik\u00e4 t\u00e4m\u00e4 on?',
            body: 'Oma ilmoitustaulu selaimessa. Julkaise myynti-ilmoituksia kuvineen, selaa muiden ilmoituksia, hae kategorioittain. Tarvitset vain selaimen ja AIMEAT-tilin. Kuvat ja tiedot tallentuvat automaattisesti AIMEAT-palvelimelle.'
          },
          {
            heading: 'Vaaditut ominaisuudet',
            body: 'Sovelluksen tulee sis\u00e4lt\u00e4\u00e4 kaikki seuraavat toiminnot:\n\n1. SELAA-N\u00c4KYM\u00c4: Korttipohjainen ruudukko KAIKKIEN k\u00e4ytt\u00e4jien ilmoituksista (global marketplace). Jokaisessa kortissa kuva, otsikko, hinta ja paikkakunta. Klikkaamalla avautuu yksityiskohtainen n\u00e4kym\u00e4.\n\n2. LUO ILMOITUS -N\u00c4KYM\u00c4: Lomake jossa kent\u00e4t: otsikko, kuvaus, hinta, paikkakunta, kategoria (dropdown: Elektroniikka, Huonekalut, Vaatteet, Urheilu, Autot, Muu). Kuvanlataus tiedostosta. Julkaise-nappi.\n\n3. YKSITYISKOHTA-N\u00c4KYM\u00c4: Iso kuva, kaikki tiedot, takaisin-nappi.\n\n4. HAKU JA SUODATUS: Vapaa tekstihaku ja kategoria-suodatin.\n\n5. TYH\u00c4TILA: Kun ilmoituksia ei ole, n\u00e4yt\u00e4 selke\u00e4 viesti ja iso "Luo ensimm\u00e4inen ilmoitus" -nappi.\n\n6. OMAT ILMOITUKSET: Tunnista omat ilmoitukset vertaamalla post.author_gaii === MY_GAII. N\u00e4yt\u00e4 "Poista"-nappi omille.\n\n7. KIRJAUTUMINEN: aimeat-auth.js hoitaa automaattisesti.\n\n8. GLOBAL MARKETPLACE: K\u00e4yt\u00e4 Boards API:a. Luo tai hae "marketplace"-board (initBoard-funktio). KAIKKI k\u00e4ytt\u00e4j\u00e4t n\u00e4kev\u00e4t kaikkien ilmoitukset.'
          },
          {
            heading: 'Miten ilmoitustaulu toimii?',
            body: 'Ilmoitustaulu k\u00e4ytt\u00e4\u00e4 Boards API:a \u2014 jaettua ilmoitustaulua johon KAIKKI k\u00e4ytt\u00e4j\u00e4t voivat kirjoittaa ja lukea. Kuvat tallennetaan tiedostovarastoon (Storage API) ja niiden julkinen URL liitet\u00e4\u00e4n ilmoitukseen. Sovellus luo automaattisesti julkisen "marketplace"-boardin tai k\u00e4ytt\u00e4\u00e4 olemassa olevaa. Boardin postit n\u00e4kyv\u00e4t KAIKILLE \u2014 my\u00f6s ilman kirjautumista.'
          },
          {
            heading: 'Ilmoituksen datarakenne (Board Post)',
            body: 'Jokainen ilmoitus on board-postin muodossa. Title = otsikko, body = JSON-merkkijono jossa kaikki tiedot, category = kategoria, tags = hakutagit. Board-postilla on automaattisesti authorGaii ja aikaleima.',
            code: '// POST to board: POST /v1/boards/BOARD_ID/posts\n// Headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" }\n// Body:\n{\n  "title": "iPhone 15 Pro 256GB",\n  "body": "{\\"description\\":\\"Used 6 months\\",\\"price\\":\\"850 EUR\\",\\"images\\":[\\"IMAGE_URL_HERE\\"],\\"location\\":\\"Helsinki\\",\\"status\\":\\"active\\"}",\n  "category": "Electronics",\n  "tags": ["listing", "sale"]\n}\n// Response includes: { "data": { "id": "post-abc123", "title": "...", "body": "...", "author_gaii": "agent@node", "created_at": "..." } }\n//\n// The body is a JSON STRING. Parse it with JSON.parse(post.body) to get the details.\n// author_gaii is set automatically by the server \u2014 you don\'t need to send it.'
          },
          {
            heading: 'Lataa kuva tiedostovarastoon',
            body: 'Jos ilmoitukseesi kuuluu kuva, muunna se base64-muotoon JavaScriptissa ja l\u00e4het\u00e4 Storage API:lle. Tiedosto saa julkisen URL:n. T\u00c4RKE\u00c4\u00c4: Kuvan n\u00e4ytt\u00f6-URL on /v1/pub/GAII/KEY (ei vaadi autentikointia, toimii suoraan <img>-tageissa).',
            code: '// Upload image to storage\n// 1. Read file with FileReader, get base64 string\n// 2. POST to /v1/storage with Authorization header\n//\n// POST {{NODE}}/v1/storage\n// Headers: Authorization: Bearer TOKEN, Content-Type: application/json\n// Body:\n{\n  "key": "listing-images/1709150000-photo.jpg",\n  "data": "BASE64_ENCODED_IMAGE_DATA",\n  "mimeType": "image/jpeg",\n  "visibility": "public"\n}\n// Response: { "ok": true, "data": { "key": "listing-images/...", ... } }\n//\n// DISPLAY URL for <img> tags (no auth required, file must have visibility:"public"):\n// IMPORTANT: GAII contains # and @ characters \u2014 MUST use encodeURIComponent(MY_GAII)!\n//\n// Build it in JS: NODE + "/v1/pub/" + encodeURIComponent(MY_GAII) + "/" + resp.data.key'
          },
          {
            heading: 'Boards API: luo, hae ja hallinnoi ilmoituksia',
            body: 'Boards API on jaettu ilmoitustaulu \u2014 KAIKKI k\u00e4ytt\u00e4j\u00e4t n\u00e4kev\u00e4t kaikkien postaukset. Sovelluksen pit\u00e4\u00e4 ensin hakea tai luoda "marketplace"-board, ja sitten kaikki operaatiot kohdistuvat sen boardin ID:hen. Postausten hakeminen julkiselta boardilta EI vaadi kirjautumista.',

// STEP 4: Delete own listing (requires auth, must be author)\n// ===============================================\n// DELETE NODE + "/v1/boards/" + BOARD_ID + "/posts/" + postId\n// Headers: { "Authorization": "Bearer " + TOKEN }\n\n// ===============================================\n// IDENTIFY OWN POSTS: post.author_gaii === MY_GAII\n// ==============================================='
          },

            code: '<!-- Bulletin Board App -->\n<!-- API base: {{NODE}} -->\n\n<!-- STRUCTURE: -->\n<!-- 1. Header with title "Ilmoitustaulu" -->\n<!-- 2. Auth widget (div#auth) for login button -->\n<!-- 3. Tab bar: "Selaa" (browse), "+ Uusi ilmoitus" (create), "Omat" (my listings) -->\n<!-- 4. Browse view: search input + category select + card grid -->\n<!-- 5. Create view: form with title, description, price, location, category select, image file input -->\n<!-- 6. My listings view: same grid filtered to own, with delete/sold buttons -->\n\n<!-- =============================================== -->\n<!-- LOGIN (aimeat-auth.js handles this part)   -->\n<!-- =============================================== -->\n\n<script src="{{NODE}}/v1/libs/aimeat-auth.js"><\/script>\n<div id="auth"><\/div>\n\n<script>\nvar NODE = "{{NODE}}";\nvar TOKEN = null;\nvar MY_GAII = "";\nvar BOARD_ID = null;\n\ndocument.addEventListener("DOMContentLoaded", function() {\n  AIMEAT.auth.mountLoginButton("#auth", {\n    nodeUrl: NODE,\n    onLogin: function(session) {\n      TOKEN = session.jwt;\n      MY_GAII = session.gaii || session.owner || "";\n      initBoard();\n    }\n  });\n  // Auto-restore session if user is already logged in\n  AIMEAT.auth.login().then(function(session) {\n    if (session) {\n      TOKEN = session.jwt;\n      MY_GAII = session.gaii || session.owner || "";\n      initBoard();\n    }\n  });\n});\n\n// ===============================================\n// HELPER: Standard fetch with auth header\n// ===============================================\nfunction apiFetch(path, opts) {\n  opts = opts || {};\n  opts.headers = Object.assign({\n    "Authorization": "Bearer " + TOKEN,\n    "Content-Type": "application/json"\n  }, opts.headers || {});\n  return fetch(NODE + path, opts)\n    .then(function(r) { return r.json(); });\n}\n\n// ===============================================\n// INIT: Find or create the "marketplace" board\n// ===============================================\n// function initBoard() {\n//   apiFetch("/v1/boards").then(function(resp) {\n//     var board = (resp.data.boards || []).find(function(b) { return b.name === "marketplace"; });\n//     if (board) {\n//       BOARD_ID = board.id;\n//       loadListings();\n//     } else {\n//       // Create if not exists (first user = operator)\n//       apiFetch("/v1/boards", {\n//         method: "POST",\n//         body: JSON.stringify({ name: "marketplace", visibility: "public", description: "Global marketplace" })\n//       }).then(function(r) {\n//         BOARD_ID = r.data.id;\n//         loadListings();\n//       }).catch(function(e) { alert("Board creation failed: " + e.message); });\n//     }\n//   });\n// }\n\n// ===============================================\n// FETCH ALL LISTINGS (public board = no auth needed!)\n// ===============================================\n// function loadListings() {\n//   fetch(NODE + "/v1/boards/" + BOARD_ID + "/posts")  // NO auth header needed!\n//     .then(function(r) { return r.json(); })\n//     .then(function(resp) {\n//       var posts = resp.data.posts || [];\n//       // Each post: { id, title, body (JSON string), author_gaii, category, tags, created_at }\n//       posts.forEach(function(post) {\n//         var details = JSON.parse(post.body);  // { price, description, images, location, status }\n//         // Render card: post.title, details.price, details.images[0], details.location\n//         // OWN POST: post.author_gaii === MY_GAII\n//       });\n//     });\n// }\n//\n// Filter by category:\n//   fetch(NODE + "/v1/boards/" + BOARD_ID + "/posts?category=Electronics")\n\n// ===============================================\n// POST a new listing to the board\n// ===============================================\n// apiFetch("/v1/boards/" + BOARD_ID + "/posts", {\n//   method: "POST",\n//   body: JSON.stringify({\n//     title: "My item for sale",\n//     body: JSON.stringify({ description: "...", price: "100 EUR",\n//     'build-apps': {
      en: {
        title: 'Build Apps: Just HTML Is Enough',
        sections: [
          {
            heading: 'What is this?',
            body: 'Build your own apps with just HTML. AIMEAT handles everything else: login, database, files. You do not need to set up a server or database. A single HTML file and a browser are enough.'
          },
          {
            heading: 'How does it work?',
            body: 'AIMEAT provides ready-made services: Memory works as a database (key-value JSON), Storage saves files (images, PDFs), Boards work as messaging channels. The login widget handles account creation and token management automatically. You do not need to know anything about keys or tokens.'
          },
          {
            heading: 'Login: aimeat-auth.js',
            body: 'Add aimeat-auth.js to your page. It creates a login button and handles account creation + token. After login you get a session object \u2014 take the JWT from session.jwt. Use standard fetch() with Authorization: Bearer TOKEN for all API calls.',
            code: '<!-- Minimal app template -->\n<script src="{{NODE}}/v1/libs/aimeat-auth.js"><\/script>\n<div id="auth"></div>\n<div id="app">\n  <p id="loginMsg">Kirjaudu sisaan aloittaaksesi / Log in to start</p>\n</div>\n\n<script>\nvar NODE = "{{NODE}}";\nvar TOKEN = null;\n\ndocument.addEventListener("DOMContentLoaded", function() {\n  AIMEAT.auth.mountLoginButton("#auth", {\n    nodeUrl: NODE,\n    onLogin: function(session) {\n      TOKEN = session.jwt;\n      document.getElementById("loginMsg").style.display = "none";\n      // App is ready. Use apiFetch() for all API calls.\n    }\n  });\n  // Auto-restore session if user is already logged in\n  AIMEAT.auth.login().then(function(session) {\n    if (session) {\n      TOKEN = session.jwt;\n      var msg = document.getElementById("loginMsg");\n      if (msg) msg.style.display = "none";\n    }\n  });\n});\n\n// Helper: standard fetch with Authorization header\nfunction apiFetch(path, opts) {\n  opts = opts || {};\n  opts.headers = Object.assign({\n    "Authorization": "Bearer " + TOKEN,\n    "Content-Type": "application/json"\n  }, opts.headers || {});\n  return fetch(NODE + path, opts).then(function(r) { return r.json(); });\n}\n\n// Example: apiFetch("/v1/memory/search?q=mydata")\n//   .then(function(resp) { console.log(resp.data.results); });\n<\/script>'
          },
          {
            heading: 'Memory: database',
            body: 'Memory is a key-value database where you can store any JSON data. Use keys systematically (e.g. "todos:item:001") and tags for searching.',
            code: '// All calls use standard fetch with Authorization: Bearer TOKEN\n// Use the apiFetch() helper shown in the auth section above\n\n// CREATE: Save data\napiFetch("/v1/memory", {\n  method: "POST",\n  body: JSON.stringify({\n    key: "todos:item:" + Date.now(),\n    value: { title: "Buy groceries", done: false, priority: "high" },\n    tags: ["todo", "active"],\n    visibility: "owner"\n  })\n});\n\n// READ: Get one entry by key\napiFetch("/v1/memory/todos:item:12345")\n.then(function(resp) {\n  // resp.data = { key: "...", value: {...}, tags: [...], ... }\n  console.log(resp.data.value);\n});\n\n// SEARCH: Find entries (searches keys, values, and tags)\napiFetch("/v1/memory/search?q=todo")\n.then(function(resp) {\n  // resp.data.results = array of entries with full values\n  resp.data.results.forEach(function(entry) {\n    console.log(entry.key, entry.value.title);\n  });\n});\n\n// LIST: Get all keys (metadata only, no values)\napiFetch("/v1/memory?tags=todo,active")\n.then(function(resp) {\n  // resp.data.items = array of { key, tags, visibility, ... } (NO value field)\n});\n\n// UPDATE: Change data\napiFetch("/v1/memory/todos:item:12345", {\n  method: "PUT",\n  body: JSON.stringify({\n    value: { title: "Buy groceries", done: true, priority: "high" },\n    tags: ["todo", "completed"]\n  })\n});\n\n// DELETE: Remove entry\napiFetch("/v1/memory/todos:item:12345", { method: "DELETE" });'
          },

            heading: 'Storage: files',

pplication/json\' }, opts.headers || {});\n      return fetch(NODE + path, opts).then(function(r) { return r.json(); });\n    }\n\n    function saveNote() {\n      var text = document.getElementById(\'noteText\').value.trim();\n      if (!text) return;\n      apiFetch(\'/v1/memory\', {\n        method: \'POST\',\n        body: JSON.stringify({\n          key: \'note:\' + Date.now(),\n          value: { text: text, created: new Date().toISOString() },\n          tags: [\'note\'],\n          visibility: \'owner\'\n        })\n      })\n      .then(function(resp) {\n        if (resp.ok) { document.getElementById(\'noteText\').value = \'\'; loadNotes(); }\n        else { alert(\'Error: \' + (resp.error ? resp.error.message : \'Unknown\')); }\n      });\n    }\n\n    function loadNotes() {\n      apiFetch(\'/v1/memory/search?q=note\')\n      .then(function(resp) {\n        var html = \'\';\n        if (resp.ok && resp.data && resp.data.results) {\n          resp.data.results.forEach(function(m) {\n            html += \'<div class="item">\';\n            html += \'<p>\' + m.value.text + \'</p>\';\n            html += \'<small style="color:#888">\' + m.value.created + \'</small>\';\n            html += \'<button onclick="deleteNote(\\\'\' + m.key + \'\\\')">\u200bDelete</button>\';\n            html += \'</div>\';\n          });\n        }\n        document.getElementById(\'notes\').innerHTML = html || \'<p>No notes yet.</p>\';\n      });\n    }\n\n    function deleteNote(key) {\n      apiFetch(\'/v1/memory/\' + encodeURIComponent(key), { method: \'DELETE\' })\n      .then(function() { loadNotes(); });\n    }\n  <\/script>\n</body>\n</html>\n\nAPI reference for your AI:\n\nNode URL: {{NODE}}\nAuth: <script src="{{NODE}}/v1/libs/aimeat-auth.js"><\/script>\nLogin: AIMEAT.auth.mountLoginButton("#auth", { nodeUrl: NODE, onLogin: function(session) { TOKEN = session.jwt; } })\nAuth header for all API calls: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"   /* ================================================================
     LOCALE MANAGEMENT
     ================================================================ */
  var LANG_KEY = 'aimeat-lang';
  var currentLocale = 'en';

  function detectLocale() {
    var urlParams = new URLSearchParams(window.location.search);
    var langFromUrl = urlParams.get('lang');
    if (langFromUrl && (langFromUrl === 'en' || langFromUrl === 'fi')) {
      currentLocale = langFromUrl;
      try { localStorage.setItem(LANG_KEY, currentLocale); } catch(e) {}
      document.cookie = LANG_KEY + '=' + currentLocale + ';path=/;max-age=31536000;SameSite=Lax';
      return;
    }
    try {
      var stored = localStorage.getItem(LANG_KEY);
      if (stored === 'fi' || stored === 'en') { currentLocale = stored; return; }
    } catch(e) {}
    var cookies = document.cookie.split(';');
    for (var i = 0; i < cookies.length; i++) {
      var c = cookies[i].trim();
      if (c.indexOf(LANG_KEY + '=') === 0) {
        var val = c.substring(LANG_KEY.length + 1);
        if (val === 'fi' || val === 'en') { currentLocale = val; return; }
      }
    }
  }

  function switchLang(lang) {
    var url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.location.href = url.toString();
  }
  window.switchLang = switchLang;

  function updateLangButtons() {
    var btnFi = document.getElementById('langFi');
    var btnEn = document.getElementById('langEn');
    if (btnFi) {
      btnFi.classList.toggle('active', currentLocale === 'fi');
    }
    if (btnEn) {
      btnEn.classList.toggle('active', currentLocale === 'en');
    }
  }

  function getLabels() {
    return LABELS[currentLocale] || LABELS.en;
  }

  /* ================================================================

     ================================================================ */
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

    if (devLink) {
      devLink.textContent = labels.devLabel;
      devLink.href = '/v1/portal?view=dev' + (currentLocale !== 'fi' ? '&lang=' + currentLocale : '');
    }

    var html = '<a href="/v1/portal" class="guide-back">' + esc(labels.backLabel) + '</a>';
    html += '<h1>' + esc(labels.guidesTitle) + '</h1>';

    GUIDE_ORDER.forEach(function(slug) {
      var guide = GUIDES[slug];
      if (!guide) return;
      var localeData = guide[currentLocale] || guide.en;
      var desc = labels.guideDescriptions[slug] || '';
      html += '<a class="guide-card" href="#' + slug + '" onclick="showGuide(\'' + slug + '\'); return false;">';
      html += '<h2>' + esc(localeData.title) + '</h2>';
      html += '<p>' + esc(desc) + '</p>';
      html += '</a>';
    });

    indexEl.innerHTML = html;
  }

  function renderGuide(slug) {
    var guide = GUIDES[slug];
    if (!guide) { renderIndex(); return; }

    var labels = getLabels();
    var localeData = guide[currentLocale] || guide.en;
    var indexEl = document.getElementById('guideIndex');
    var detailEl = document.getElementById('guideDetail');
    indexEl.style.display = 'none';
    detailEl.style.display = 'block';
    document.title = localeData.title + ' | AIME AT';
    document.documentElement.lang = currentLocale;

    var devLink = document.getElementById('devLink');
    if (devLink) {
      devLink.textContent = labels.devLabel;
      devLink.href = '/v1/portal?view=dev' + (currentLocale !== 'fi' ? '&lang=' + currentLocale : '');
    }

    // Build markdown for copy
    var md = '# ' + localeData.title + '\n\n';
    md += 'Node URL: ' + NODE_URL + '\n\n';
    md += 'IMPORTANT: Make it a single downloadable HTML file.\n\n';
    localeData.sections.forEach(function(s) {
      md += '## ' + s.heading + '\n\n' + s.body + '\n\n';
      if (s.code) {
        var codeWithNode = s.code.replace(/\{\{NODE\}\}/g, NODE_URL);
        md += '```\n' + codeWithNode + '\n```\n\n';
      }
    });

    var html = '';
    html += '<a class="guide-back" href="#" onclick="showIndex(); return false;">' + esc(labels.backToIndex) + '</a>';
    html += '<h1 class="guide-title">' + esc(localeData.title) + '</h1>';

    // First section as intro
    if (localeData.sections.length > 0) {
      html += '<p class="guide-intro">' + esc(localeData.sections[0].body) + '</p>';
    }

    html += '<div class="guide-node">Node: <code>' + esc(NODE_URL) + '</code></div>';

    // Copy button
    html += '<div class="guide-copy-section">';
    html += '<div class="guide-copy-instruction">' + esc(labels.copyInstruction) + '</div>';
    html += '<button class="guide-copy-btn" id="copyGuideBtn">\ud83d\udccb ' + esc(labels.copyBtnLabel) + '</button>';
    html += '</div>';

    // Tech warning
    html += '<div class="tech-warning">' + esc(labels.techWarning) + '</div>';

    // Technical sections (skip first intro section)
    localeData.sections.slice(1).forEach(function(s) {
      html += '<div class="guide-section">';
      html += '<h2>' + esc(s.heading) + '</h2>';
      html += '<p>' + esc(s.body) + '</p>';
      if (s.code) {
        var codeWithNode = s.code.replace(/\{\{NODE\}\}/g, esc(NODE_URL));
        html += '<div class="guide-code">' + esc(s.code).replace(/\{\{NODE\}\}/g, esc(NODE_URL)) + '</div>';
      }
      html += '</div>';
    });

    detailEl.innerHTML = html;

    // Wire up copy button
    var btn = document.getElementById('copyGuideBtn');
    if (btn) {
      btn.addEventListener('click', function() {
        var mdWithNode = md.replace(/\{\{NODE\}\}/g, NODE_URL);
        copyToClipboard(mdWithNode).then(function() {
          btn.textContent = '\u2714 ' + labels.copiedLabel;
          btn.classList.add('copied');
          setTimeout(function() {
            btn.textContent = '\ud83d\udccb ' + labels.copyBtnLabel;
            btn.classList.remove('copied');
          }, 2000);
        });
      });
    }

    // Scroll to top
    window.scrollTo(0, 0);
  }

  /* ================================================================
     CLIPBOARD
     ================================================================ */
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function() { return fallbackCopy(text); });
    }
    return fallbackCopy(text);
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  /* ================================================================
     NAVIGATION
     ================================================================ */
  function showGuide(slug) {
    window.location.hash = slug;
  }
  window.showGuide = showGuide;

  function showIndex() {
    window.location.hash = '';
  }
  window.showIndex = showIndex;

  function handleHash() {
    var hash = window.location.hash.replace('#', '');
    if (hash && GUIDES[hash]) {
      renderGuide(hash);
    } else {
      renderIndex();
    }
  }

  /* ================================================================
     STARFIELD BACKGROUND
     ================================================================ */
  function initStarfield() {
    var canvas = document.getElementById('bgCanvas');
    if (!canvas) return;
    for (var i = 0; i < 60; i++) {
      var star = document.createElement('div');
      star.className = 'star';
      star.style.left = (Math.random() * 100) + '%';
      star.style.top = (Math.random() * 100) + '%';
      star.style.animationDuration = (2 + Math.random() * 4) + 's';
      star.style.animationDelay = (Math.random() * 4) + 's';
      star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
      canvas.appendChild(star);
    }
  }

  /* ================================================================
     INIT
     ================================================================ */
  detectLocale();
  updateLangButtons();
  initStarfield();
  handleHash();

  window.addEventListener('hashchange', handleHash);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<!--
  @file agent-consent.html
  @description The standalone device-authorization consent page (/v1/agents/verify?code=…): the
    owner confirms the code their AI showed, picks how much the agent may do, and approves or
    denies. Standalone — not part of the SPA — but it reads the shared i18n runtime, the shared
    scope model and the shared consent vocabulary, so its presets and sentences can never diverge
    from the SPA's AgentConsent panel again.
  @version-history
    v1.1.0 — 2026-08-17 — Three private copies deleted, one behavior change. The inline EN/FI
        string table (29 of its keys absent from locales) is replaced by /js/i18n.js over
        agentConsentPage.* + the shared consent.* keys; the page-private SCOPE_PRESETS — whose
        "Standard" DIVERGED from the SPA's (it granted memory:*, work:*, wallet:read and no
        storage) — is replaced by SCOPE_TEMPLATES from scope-model.js, so Standard now grants the
        same audited set on both doors (BEHAVIOR CHANGE, tested in e2e-device-consent-presets);
        the stale 18-entry custom checkbox list (offering nonexistent board:*, consent:read,
        wallet:write, work:write) is generated from SCOPE_DOMAINS with the localized sentence per
        row. Preset buttons carry a one-line summary generated from the real preset sets, the
        boundary sentences state what an agent can never reach, and deny says what was NOT granted.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Authorization — AIMEAT</title>
  <style>
    :root { --bg:#0d0d12; --card:#16161f; --border:#2a2a3a; --text:#e8e8f0;
      --muted:#8888aa; --accent:#a78bfa; --success:#4ade80; --danger:#ff6b6b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .consent-card { background:var(--card); border:1px solid var(--border); border-radius:1rem;
      padding:2rem; max-width:480px; width:100%; }
    h1 { font-size:1.4rem; margin-bottom:.5rem; }
    .subtitle { color:var(--muted); font-size:.9rem; margin-bottom:1.5rem; }
    label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:.25rem; }
    input { width:100%; padding:.6rem .75rem; background:var(--bg); border:1px solid var(--border);
      border-radius:.5rem; color:var(--text); font-size:.9rem; margin-bottom:.75rem; }
    input:focus { outline:none; border-color:var(--accent); }
    .user-code-display { text-align:center; padding:1rem; margin:.75rem 0;
      background:rgba(130,100,255,.08); border:1px solid rgba(130,100,255,.25);
      border-radius:.75rem; }
    .user-code-value { font-family:'Courier New',monospace; font-size:2rem; font-weight:700;
      letter-spacing:.25em; color:var(--accent); }
    .user-code-hint { font-size:.8rem; color:var(--muted); margin-top:.4rem; }
    .agent-info { background:rgba(255,255,255,.03); border-radius:.5rem; padding:.75rem 1rem;
      margin:.75rem 0; font-size:.85rem; }
    .agent-info-row { display:flex; justify-content:space-between; padding:.25rem 0; }
    .agent-info-label { color:var(--muted); }
    .agent-info-value { font-weight:600; }
    .scope-section { margin:.75rem 0; }
    .scope-section-title { font-size:.9rem; font-weight:600; margin-bottom:.5rem; }
    .scope-radio { display:flex; align-items:flex-start; gap:.5rem; padding:.5rem .75rem;
      background:rgba(255,255,255,.03); border:1px solid transparent; border-radius:.5rem;
      margin-bottom:.4rem; cursor:pointer; transition:border-color .15s; }
    .scope-radio:hover { border-color:var(--border); }
    .scope-radio.selected { background:rgba(130,100,255,.12); border-color:rgba(130,100,255,.3); }
    .scope-radio input[type="radio"] { width:auto; margin:0; margin-top:.15rem; accent-color:var(--accent); }
    .scope-radio-content { flex:1; }
    .scope-radio-name { font-weight:600; font-size:.85rem; }
    .scope-radio-desc { font-size:.75rem; color:var(--muted); margin-top:.1rem; }
    .custom-scopes { padding:.5rem .75rem; background:rgba(255,255,255,.03); border-radius:.5rem;
      margin-top:.4rem; display:none; }
    .custom-scopes.visible { display:block; }
    .scope-checkbox { display:flex; align-items:center; gap:.5rem; padding:.25rem 0; font-size:.82rem; }
    .scope-checkbox input[type="checkbox"] { width:auto; margin:0; accent-color:var(--accent); }
    .btn-row { display:flex; gap:.75rem; margin-top:1.25rem; }
    .btn { flex:1; padding:.65rem 1rem; border:none; border-radius:.5rem; font-size:.9rem;
      font-weight:600; cursor:pointer; transition:opacity .15s; }
    .btn:hover { opacity:.85; }
    .btn-approve { background:var(--success); color:#000; }
    .btn-deny { background:transparent; border:1px solid var(--danger); color:var(--danger); }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .error-msg { color:var(--danger); font-size:.85rem; margin-top:.5rem; min-height:1.2em; }
    .success-msg { text-align:center; padding:1.5rem 0; }
    .success-msg h2 { color:var(--success); margin-bottom:.5rem; }
    .success-msg .gaii { font-family:monospace; font-size:.85rem; color:var(--accent);
      background:rgba(130,100,255,.1); padding:.3rem .6rem; border-radius:.3rem; display:inline-block; margin-top:.5rem; }
    .denied-msg { text-align:center; padding:1.5rem 0; }
    .denied-msg h2 { color:var(--muted); margin-bottom:.5rem; }
    .expired-msg { text-align:center; padding:1.5rem 0; }
    .expired-msg h2 { color:var(--danger); margin-bottom:.5rem; }
    .polling-guidance { margin-top:1.25rem; text-align:left; }
    .polling-guidance-note { font-size:.85rem; color:var(--muted); margin-bottom:.75rem; line-height:1.5; }
    .gaii-block { margin:.75rem 0; }
    .gaii-label { font-size:.8rem; color:var(--muted); margin-bottom:.3rem; }
    .polling-hint { margin-top:.75rem; padding:.75rem 1rem; background:rgba(130,100,255,.06);
      border:1px solid rgba(130,100,255,.2); border-radius:.5rem; font-size:.82rem; color:var(--muted); line-height:1.5; }
    .polling-hint code { font-family:'Courier New',monospace; color:var(--accent);
      background:rgba(130,100,255,.12); padding:.1rem .35rem; border-radius:.25rem; }
    .msg-muted { color:var(--muted); }
    .boundary-list { margin:.75rem 0 0; padding-left:1.1rem; font-size:.82rem; color:var(--muted); }
    .boundary-list li { margin-bottom:.3rem; }
    .scope-token { font-size:.72rem; color:var(--muted); font-family:'Courier New',monospace; }
    #loading { text-align:center; padding:2rem; color:var(--muted); }
    #loading p { margin-top:.75rem; }
    .error-msg-spaced { margin-top:1rem; }
    .login-prompt { margin-bottom:1rem; font-size:.9rem; }
    .spinner { display:inline-block; width:1.5rem; height:1.5rem; border:2px solid var(--border);
      border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="consent-card" id="app">
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <script type="module">
    import { loadTranslations, t as translate } from '/js/i18n.js';
    import { scopeSentence, presetSummary, boundaryLines } from '/js/consent-vocab.js';
    import { SCOPE_TEMPLATES, SCOPE_DOMAINS } from '/views/profile/agents/scope-model.js';

    const escHtml = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const params = new URLSearchParams(location.search);
    const code = params.get('code') || '';

    // Shared i18n runtime (stored-locale preference, en fallback, dot keys). Page-local shorthand:
    // a bare key is agentConsentPage.*; a dotted key (consent.*, profile.*) passes through.
    await loadTranslations();
    const t = (key, vars) => translate(key.includes('.') ? key : 'agentConsentPage.' + key, vars);

    // The three boundary sentences — shared with every other consent surface.
    const boundaryHtml = () =>
      `<ul class="boundary-list">${boundaryLines(t).map((l) => `<li>${escHtml(l)}</li>`).join('')}</ul>`;

    // Preset button labels come from the SPA's own label keys, so the two doors use one word.
    const presetLabel = (p) => p === 'keep'
      ? translate('profile.agents.pendingRequests.keepCurrent')
      : translate(`profile.agents.scopeUi.${{ readonly: 'readOnly', standard: 'standard', full: 'fullAccess', custom: 'custom' }[p]}`);

    const app = document.getElementById('app');
    let session = null;
    let requestInfo = null;
    let selectedPreset = 'standard';
    let customScopes = ['memory:read', 'wallet:read'];

    if (!code) {
      app.innerHTML = `<h1>${escHtml(t('title'))}</h1><p class="error-msg">${escHtml(t('errorNoCode'))}</p>`;
    }

    async function checkSession() {
      // Read session from localStorage (same origin as SPA)
      try {
        const raw = localStorage.getItem('aimeat_session');
        if (raw) {
          const s = JSON.parse(raw);
          if (s && s.jwt) return s;
        }
      } catch {}
      return null;
    }

    async function doLogin(username, password, totp) {
      const body = { username, password };
      if (totp) body.totp_code = totp;
      const r = await fetch('/v1/ghii/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error?.message || 'Login failed');
      return d.data;
    }

    async function fetchRequestInfo(userCode) {
      const r = await fetch(`/v1/agents/verify/info/${encodeURIComponent(userCode)}`);
      const d = await r.json();
      if (!d.ok) return null;
      return d.data;
    }

    const getOwnerName = () => {
      const o = session?.owner;
      return typeof o === 'string' ? o : o?.name || session?.username || '';
    };

    function renderError(msg) {
      app.innerHTML = `<h1>${escHtml(t('title'))}</h1><p class="error-msg error-msg-spaced">${escHtml(msg)}</p>`;
    }

    function renderLogin() {
      app.innerHTML = `
        <h1>${escHtml(t('title'))}</h1>
        <p class="subtitle">${escHtml(t('consent.priming.device'))}</p>
        <div class="user-code-display">
          <div class="user-code-value">${escHtml(code)}</div>
          <div class="user-code-hint">${escHtml(t('confirmHint'))}</div>
        </div>
        <p class="login-prompt">${escHtml(t('loginRequired'))}</p>
        <form id="loginForm">
          <label>${escHtml(t('usernameLabel'))}</label>
          <input type="text" id="username" required autocomplete="username" />
          <label>${escHtml(t('passwordLabel'))}</label>
          <input type="password" id="password" required autocomplete="current-password" />
          <label>${escHtml(t('totpLabel'))}</label>
          <input type="text" id="totp" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" />
          <div id="loginError" class="error-msg"></div>
          <div class="btn-row">
            <button type="submit" class="btn btn-approve">${escHtml(t('loginBtn'))}</button>
          </div>
        </form>
      `;
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('loginError');
        errEl.textContent = '';
        try {
          session = await doLogin(
            document.getElementById('username').value.trim(),
            document.getElementById('password').value,
            document.getElementById('totp').value.trim() || undefined,
          );
          // Persist session so SPA and future consent pages pick it up
          try {
            localStorage.setItem('aimeat_session', JSON.stringify({
              owner: session.owner, jwt: session.jwt || session.token,
              ghii: session.ghii || null, gaii: session.gaii || null,
            }));
          } catch {}
          await loadAndRender();
        } catch (err) {
          errEl.textContent = err.message;
        }
      });
    }

    function getSelectedScopes() {
      // null = "nothing chosen", which is how the server reads an approval with no `scopes` field:
      // an existing agent keeps exactly what it holds.
      if (selectedPreset === 'keep') return null;
      if (selectedPreset === 'custom') return [...customScopes];
      return SCOPE_TEMPLATES[selectedPreset] || SCOPE_TEMPLATES.standard;
    }

    function renderConsent() {
      const info = requestInfo;

      // An agent coming BACK keeps what it has unless the owner picks otherwise. 'Standard' used
      // to be preselected either way, so re-approving a full-access agent after its token expired
      // narrowed it on a click that meant "yes, this is my agent".
      // Presets, labels and descriptions all come from the shared model + vocabulary, so this door
      // and the SPA's AgentConsent grant the same sets and describe them with the same sentences.
      const presetKeys = [...(info.existing_agent ? ['keep'] : []), 'readonly', 'standard', 'full', 'custom'];
      const scopeOptions = presetKeys.map((p) => ({ key: p, name: presetLabel(p), desc: presetSummary(p, t) }));
      if (info.existing_agent && selectedPreset === 'standard') selectedPreset = 'keep';

      const scopeRadiosHtml = scopeOptions.map(o => `
        <label class="scope-radio ${selectedPreset === o.key ? 'selected' : ''}" data-preset="${escHtml(o.key)}">
          <input type="radio" name="scopePreset" value="${escHtml(o.key)}" ${selectedPreset === o.key ? 'checked' : ''} />
          <div class="scope-radio-content">
            <div class="scope-radio-name">${escHtml(o.name)}</div>
            <div class="scope-radio-desc">${escHtml(o.desc)}</div>
          </div>
        </label>
      `).join('');

      // The custom list is the editor vocabulary itself — every domain and permission the node
      // enforces, each with its localized sentence. The old hand-kept 18-entry list offered four
      // scope names the node never reads.
      const customCheckboxesHtml = SCOPE_DOMAINS.flatMap((d) => d.permissions.map((p) => {
        const s = `${d.key}:${p}`;
        return `
        <label class="scope-checkbox">
          <input type="checkbox" value="${escHtml(s)}" ${customScopes.includes(s) ? 'checked' : ''} />
          <span>${escHtml(scopeSentence(s, t))} <code class="scope-token">${escHtml(s)}</code></span>
        </label>`;
      })).join('');

      app.innerHTML = `
        <h1>${escHtml(t('title'))}</h1>
        <p class="subtitle">${escHtml(t('consent.priming.device'))}</p>
        <div class="user-code-display">
          <div class="user-code-value">${escHtml(info.user_code)}</div>
          <div class="user-code-hint">${escHtml(t('confirmHint'))}</div>
        </div>
        <div class="agent-info">
          <div class="agent-info-row">
            <span class="agent-info-label">${escHtml(t('agentName'))}</span>
            <span class="agent-info-value">${escHtml(info.agent_name)}</span>
          </div>
          ${info.display_name ? `<div class="agent-info-row">
            <span class="agent-info-label">${escHtml(t('displayName'))}</span>
            <span class="agent-info-value">${escHtml(info.display_name)}</span>
          </div>` : ''}
          ${info.description ? `<div class="agent-info-row">
            <span class="agent-info-label">${escHtml(t('description'))}</span>
            <span class="agent-info-value">${escHtml(info.description)}</span>
          </div>` : ''}
        </div>
        <div class="scope-section">
          <div class="scope-section-title">${escHtml(t('scopeLabel'))}</div>
          ${scopeRadiosHtml}
          <div class="custom-scopes ${selectedPreset === 'custom' ? 'visible' : ''}" id="customScopes">
            ${customCheckboxesHtml}
          </div>
        </div>
        ${boundaryHtml()}
        <div id="consentError" class="error-msg"></div>
        <div class="btn-row">
          <button class="btn btn-deny" id="denyBtn">${escHtml(t('denyBtn'))}</button>
          <button class="btn btn-approve" id="approveBtn">${escHtml(t('approveBtn'))}</button>
        </div>
      `;

      // Scope radio handlers
      document.querySelectorAll('input[name="scopePreset"]').forEach(radio => {
        radio.addEventListener('change', () => {
          selectedPreset = radio.value;
          document.querySelectorAll('.scope-radio').forEach(el => {
            el.classList.toggle('selected', el.dataset.preset === selectedPreset);
          });
          document.getElementById('customScopes').classList.toggle('visible', selectedPreset === 'custom');
        });
      });

      // Custom scope checkboxes
      document.querySelectorAll('#customScopes input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          customScopes = Array.from(document.querySelectorAll('#customScopes input[type="checkbox"]:checked'))
            .map(el => el.value);
        });
      });

      // Deny
      document.getElementById('denyBtn').addEventListener('click', async () => {
        const btn = document.getElementById('denyBtn');
        btn.disabled = true;
        try {
          const jwt = session.jwt || session.token;
          await fetch('/v1/agents/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_code: code, action: 'deny', owner_token: jwt }),
          });
          renderDenied();
        } catch {
          renderDenied();
        }
      });

      // Approve
      document.getElementById('approveBtn').addEventListener('click', async () => {
        const btn = document.getElementById('approveBtn');
        const errEl = document.getElementById('consentError');
        btn.disabled = true;
        btn.textContent = t('approving');
        errEl.textContent = '';

        const scopes = getSelectedScopes();
        if (scopes && scopes.length === 0) {
          errEl.textContent = t('selectOne');
          btn.disabled = false;
          btn.textContent = t('approveBtn');
          return;
        }

        try {
          const jwt = session.jwt || session.token;
          const r = await fetch('/v1/agents/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            // `scopes` omitted entirely when keeping the current access — the server treats a
            // missing field as "nothing was chosen" and leaves an existing agent untouched.
            body: JSON.stringify({ user_code: code, action: 'approve', owner_token: jwt,
              ...(scopes ? { scopes } : {}) }),
          });
          const d = await r.json();
          if (d.ok) {
            renderApproved(d.data);
          } else {
            throw new Error(d.error?.message || t('errorGeneric'));
          }
        } catch (err) {
          errEl.textContent = err.message;
          btn.disabled = false;
          btn.textContent = t('approveBtn');
        }
      });
    }

    function renderApproved(data) {
      app.innerHTML = `
        <div class="success-msg">
          <h2>${escHtml(t('approved'))}</h2>
          <p>${escHtml(t('approvedMsg'))}</p>
          ${data?.gaii ? `
          <div class="polling-guidance">
            <p class="polling-guidance-note">${escHtml(t('pollingNote'))}</p>
            <div class="gaii-block">
              <div class="gaii-label">${escHtml(t('agentGaii'))}</div>
              <span class="gaii">${escHtml(data.gaii)}</span>
            </div>
            <div class="polling-hint">
              ${escHtml(t('pollingHint'))} <code>${escHtml(t('pollingHintCode'))}</code> ${escHtml(t('pollingHintSuffix'))}
            </div>
          </div>` : ''}
        </div>
      `;
    }

    function renderDenied() {
      app.innerHTML = `
        <div class="denied-msg">
          <h2>${escHtml(t('consent.denied.title'))}</h2>
          <p class="msg-muted">${escHtml(t('consent.denied.device'))}</p>
        </div>
      `;
    }

    function renderExpired() {
      app.innerHTML = `
        <div class="expired-msg">
          <h2>${escHtml(t('expired'))}</h2>
          <p class="msg-muted">${escHtml(t('expiredMsg'))}</p>
        </div>
      `;
    }

    async function loadAndRender() {
      requestInfo = await fetchRequestInfo(code);
      if (!requestInfo) {
        renderError(t('errorNotFound'));
        return;
      }
      if (requestInfo.status === 'expired') {
        renderExpired();
        return;
      }
      if (requestInfo.status === 'approved') {
        renderApproved({ gaii: null });
        return;
      }
      if (requestInfo.status === 'denied') {
        renderDenied();
        return;
      }

      // Verify owner matches
      const ownerName = getOwnerName();
      if (requestInfo.owner && ownerName && requestInfo.owner !== ownerName) {
        renderError(t('errorOwnerMismatch'));
        return;
      }

      renderConsent();
    }

    // Boot
    if (code) {
      session = await checkSession();
      if (session) {
        await loadAndRender();
      } else {
        // Fetch info first to show code, then show login
        requestInfo = await fetchRequestInfo(code);
        if (!requestInfo) {
          renderError(t('errorNotFound'));
        } else if (requestInfo.status === 'expired') {
          renderExpired();
        } else {
          renderLogin();
        }
      }
    }
  </script>
</body>
</html>

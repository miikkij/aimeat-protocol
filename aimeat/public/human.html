// ── i18n helpers ──
function detectLang() {
  var params = new URLSearchParams(window.location.search);
  var langParam = params.get('lang');
  if (langParam === 'fi' || langParam === 'en') return langParam;
  try {
    var stored = localStorage.getItem('aimeat-lang');

<style>
/* -- Reset & Variables -- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a1a;

  --bg-grad-mid: #0a0a1a;

  --text-dim: #888;
  --text-muted: #6b6b8a;

  --success-bg: rgba(34, 197, 94, 0.1);

}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* -- Animated background -- */
.bg-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, var(--bg-grad-top) 0%, var(--bg-grad-mid) 60%, var(--bg) 100%);
}

.bg-canvas .star {
  position: absolute;
  width: 2px; height: 2px;
  border-radius: 50%;
  background: #fff;
  animation: twinkle ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.1; transform: scale(0.8); }
  50% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 6px 1px rgba(255, 105, 180, 0.4); }
}

.bg-canvas .nebula {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.12;
  animation: nebulaDrift 20s ease-in-out infinite alternate;
}

@keyframes nebulaDrift {

}

/* -- Top Navigation -- */
.topnav {

}

.topnav-brand {

}

.topnav-brand .heart {

}

@keyframes heartPulse {

}

.topnav-center {

.lang-btn {

.cards-grid {

.launcher-cta {

.launcher-badges {

.launcher-badge {

.card-text {

.chip:hover {

/* -- Board messages -- */
.board-messages { margin-bottom: 1rem; }

.service-actions { display: flex; gap: 0.75rem; margin-bottom: 1rem; }

.service-form.visible { display: block; animation: fadeSlideIn 0.3s ease; }
.service-input { width: 100%; padding: 0.85rem 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-sm); color: var(--text-bright); font-size: 0.95rem; font-family: var(--font); outline: none; transition: all 0.25s; resize: none; }

.service-submit-btn { padding: 0.7rem 1.6rem; background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 0.92rem; font-weight: 700; font-family: var(--font); cursor: pointer; transition: all 0.25s; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.25); }

.prompt-area { display: none; margin-top: 1rem; }
.prompt-area.visible { display: block; animation: fadeSlideIn 0.3s ease; }
.prompt-box { width: 100%; min-height: 200px; padding: 1rem; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-sm); color: var(--text); font-family: 'Courier New', monospace; font-size: 0.82rem; line-height: 1.6; resize: vertical; outline: none; }
.prompt-actions { display: flex; align-items: center; gap: 1rem; margin-top: 0.75rem; flex-wrap: wrap; }
.copy-prompt-btn { padding: 0.6rem 1.4rem; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(255, 105, 180, 0.25); font-family: var(--font); }
.copy-prompt-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(255, 105, 180, 0.4); }
.back-to-cats { font-size: 0.85rem; color: var(--text-dim); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.back-to-cats:hover { color: var(--text); }
.prompt-steps { margin-top: 0.75rem; font-size: 0.82rem; color: var(--text-dim); line-height: 1.7; }
.prompt-steps ol { padding-left: 1.2rem; }
.any-ai-note { margin-top: 1rem; padding: 0.75rem 1rem; background: rgba(99, 102, 241, 0.08); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: var(--radius-sm); font-size: 0.85rem; color: #a5b4fc; line-height: 1.6; }

/* -- More section -- */
.more-section { max-width: 700px; margin: 2rem auto 3rem; padding: 0 1rem; }
.more-section-title { text-align: center; font-size: 1.25rem; font-weight: 700; color: var(--text-bright); margin-bottom: 1.25rem; }
.more-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; }
.more-item { padding: 1rem; background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: var(--radius-sm); transition: background 0.2s, border-color 0.2s; text-decoration: none; color: inherit; }
.more-item:hover { background: var(--card-bg-hover); border-color: rgba(255, 255, 255, 0.12); }
.more-item-title { font-size: 0.9rem; font-weight: 600; color: var(--text); }
.more-item-desc { font-size: 0.82rem; color: var(--text-dim); margin-top: 0.25rem; line-height: 1.4; }

/* -- Morsels Footer -- */
.morsels-footer { text-align: center; padding: 2rem 0 3.5rem; font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; max-width: 500px; margin: 0 auto; }
.morsels-footer .heart-icon { display: inline-block; color: var(--accent); font-size: 0.9rem; margin: 0 0.15rem; animation: heartPulse 2s ease-in-out infinite; }

/* -- Anonymous note -- */
.anon-banner { text-align: center; padding: 0.65rem 1rem; background: rgba(124, 58, 237, 0.08); border: 1px solid rgba(124, 58, 237, 0.2); border-radius: var(--radius-sm); font-size: 0.82rem; color: #c4b5fd; margin-bottom: 1.5rem; }
.anon-banner a { color: var(--accent-bright); text-decoration: underline; text-underline-offset: 2px; }

/* -- Responsive -- */
@media (min-width: 768px) {
  .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  .card-header { flex-direction: column; text-align: center; padding: 1.5rem 1.25rem 1.25rem; }
  .card-text { text-align: center; }
  .card-arrow { align-self: center; }
  .card.expanded { grid-column: 1 / -1; }
  .card.expanded .card-header { flex-direction: row; text-align: left; }
  .card.expanded .card-text { text-align: left; }
  .hero { padding: 5rem 0 3.5rem; }
  .main { max-width: 800px; }
}

@media (max-width: 400px) {

.save-btn.loading { position: relative; color: transparent; pointer-events: none; }
.save-btn.loading::after { content: ''; position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

/* -- Fade in on load -- */
.main { animation: pageIn 0.6s ease; }

<script>
(function() {
  'use strict';

  /* -- Modal i18n strings -- */
  var __modalI18n = {
    title: t('modal.title'),
    descNew: t('modal.descNew'),
    descReturning: t('modal.descReturning'),
    usernamePlaceholder: t('modal.usernamePlaceholder'),
    passwordPlaceholder: t('modal.passwordPlaceholder'),
    displayNamePlaceholder: t('modal.displayNamePlaceholder'),
    signInBtn: t('modal.signInBtn'),
    cancelBtn: t('modal.cancelBtn'),
    working: t('modal.working'),
    errUserShort: t('modal.errUserShort'),
    errPassShort: t('modal.errPassShort'),
    errWrongPass: t('modal.errWrongPass'),
    loggedIn: t('modal.loggedIn'),
    logoutBtn: t('modal.logoutBtn'),
    whyTitle: t('modal.whyTitle'),
    whyGhii: t('modal.whyGhii'),
    whyPrivacy: t('modal.whyPrivacy'),
    whyControl: t('modal.whyControl'),
    whyAgents: t('modal.whyAgents'),
    whyMorsels: t('modal.whyMorsels')
  };

  /* -- Clipboard helper (fallback for HTTP) -- */
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function() { return fallbackCopy(text); });
    }
    return fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  /* -- Language persistence -- */
  var LANG_KEY = 'aimeat-lang';
  var urlParams = new URLSearchParams(window.location.search);
  var langFromUrl = urlParams.get('lang');

  if (langFromUrl) {
    try { localStorage.setItem(LANG_KEY, langFromUrl); } catch(e) {}
    document.cookie = LANG_KEY + '=' + langFromUrl + ';path=/;max-age=31536000;SameSite=Lax';
  }

  /* -- Starfield background -- */
  var canvas = document.getElementById('bgCanvas');
  if (canvas) {
    for (var i = 0; i < 60; i++) {
      var star = document.createElement('div');
      star.className = 'star';
      star.style.left = (Math.random() * 100) + '%';
      star.style.top = (Math.random() * 100) + '%';
      star.style.animationDuration = (2 + Math.random() * 4) + 's';
      star.style.animationDelay = (Math.random() * 4) + 's';
      star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
      canvas.appendChild(star);
    }
  }

  /* -- Group expand / collapse -- */
  var cards = document.querySelectorAll('.card');
  cards.forEach(function(card) {
    var header = card.querySelector('.card-header');
    if (!header) return;
    header.addEventListener('click', function() {
      var isExpanded = card.classList.contains('expanded');
      cards.forEach(function(c) { c.classList.remove('expanded'); });
      if (!isExpanded) {
        card.classList.add('expanded');
        setTimeout(function() {
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
      }
    });
  });

  /* -- Welcome Board: fetch & render -- */
  var welcomeBoardList = document.getElementById('welcomeBoardList');
  var WELCOME_KEY = 'board.welcome';
  var nodeUrl = window.location.origin;

  function timeAgo(iso) {
    var sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (sec < 60) return sec + 's';
    var min = Math.floor(sec / 60);
    if (min < 60) return min + 'm';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h';
    return Math.floor(hr / 24) + 'd';
  }

  function renderWelcomeBoard(messages) {
    if (!welcomeBoardList) return;
    if (!messages || messages.length === 0) {
      welcomeBoardList.innerHTML = '<div class="board-empty">' + esc(t('welcome.emptyBoard')) + '</div>';
      return;
    }
    welcomeBoardList.innerHTML = '';
    messages.slice(-10).reverse().forEach(function(m) {
      var div = document.createElement('div');
      div.className = 'board-msg';
      div.innerHTML = '<span class="board-msg-text"></span><span class="board-msg-time">' + timeAgo(m.t) + '</span>';
      div.querySelector('.board-msg-text').textContent = m.msg;
      welcomeBoardList.appendChild(div);
    });
  }

  function loadWelcomeBoard() {
    fetch('/v1/memory/' + WELCOME_KEY)
      .then(function(r) {
        if (!r.ok) return null;
        return r.json();
      })
      .then(function(d) {
        if (d && d.ok && d.data && d.data.value && d.data.value.messages) {
          renderWelcomeBoard(d.data.value.messages);
        }
      })
      .catch(function() {});
  }

  loadWelcomeBoard();

  /* -- Welcome Board: send greeting -- */
  var welcomeSendBtn = document.getElementById('welcomeSendBtn');
  var welcomeInput = document.getElementById('welcomeInput');
  var welcomeResult = document.getElementById('welcomeResult');

  if (welcomeSendBtn && welcomeInput) {
    welcomeSendBtn.addEventListener('click', function() {
      var text = welcomeInput.value.trim();
      if (!text) { welcomeInput.focus(); return; }
      if (text.length > 280) return;

      welcomeSendBtn.disabled = true;
      welcomeSendBtn.classList.add('loading');

      fetch('/v1/portal/try-memory', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

      '### Memory API (agent state + results)\n' +
      'Server: ' + nodeUrl + ' (no authentication needed for public data)\n' +
      'Write: POST ' + nodeUrl + '/v1/memory\n' +
      'Content-Type: application/json\n' +
      'Body: {"key":"agent.[name].state", "value":{...}, "visibility":"public", "ttl_hours":72}\n' +
      'Read: GET ' + nodeUrl + '/v1/memory/{key}\n' +
      'Response: { ok: true, data: { key: "...", value: {...}, ... } }\n' +
      'List: GET ' + nodeUrl + '/v1/memory?prefix={prefix}\n' +
      'IMPORTANT: When updating, always GET first, modify, then POST back (read-modify-write).\n' +
      'Agents store state at "agent.[name].state" and results at "agent.[name].results"\n\n' +
      '### Board API (publish findings to public board)\n' +
      'Read board: GET ' + nodeUrl + '/v1/memory/board.public\n' +
      'Response: { ok: true, data: { value: { messages: [{msg, t}] } } }\n' +
      'Post to board: GET existing messages, append {msg:"text", t:new Date().toISOString()}, POST the full updated array back.\n' +
      'Messages are in data.value.messages \u2014 array of objects with "msg" (text) and "t" (ISO 8601). Newest last.\n\n' +
      '### Work API (task queue between agents)\n' +
      'List work: GET ' + nodeUrl + '/v1/work/inbox\n' +
      'Accept task: POST ' + nodeUrl + '/v1/work/{id}/accept\n' +
      'Deliver result: POST ' + nodeUrl + '/v1/work/{id}/deliver {result}\n' +
      'Use for delegating sub-tasks between agents.\n\n' +
      '### Auth (agent identity)\n' +
      'Anonymous token: POST ' + nodeUrl + '/v1/auth/anonymous \u2192 {data:{token}}\n' +
      'Register agent: POST ' + nodeUrl + '/v1/agents {name, capabilities}\n' +
      'Use header: Authorization: Bearer {token} for all authenticated API calls.\n\n' +
      '## Agent Patterns\n\n' +
      '### News Monitor Agent\n' +
      '1. Fetch RSS feeds or web pages at scheduled intervals\n' +
      '2. Parse and extract key information (titles, summaries, links)\n' +
      '3. Compare with previous results stored at "agent.[name].state" (seen article IDs, last check timestamp)\n' +
      '4. Summarize new content and post to board or save to "agent.[name].results"\n' +
      '5. State format: { lastCheck: "ISO", seenIds: ["id1", "id2"], sourceUrls: [...] }\n' +
      '6. Results format: { articles: [{ title, summary, url, source, found: "ISO" }] }\n\n' +
      '### Website/API Watcher Agent\n' +
      '1. Fetch target URL at regular intervals\n' +
      '2. Compare with stored previous version at "agent.[name].state"\n' +
      '3. If changed: generate diff/summary and post alert to board or memory\n' +
      '4. State format: { url: "...", lastHash: "sha256...", lastContent: "...", changeHistory: [{date, diff}] }\n' +
      '5. For APIs: compare JSON response, highlight changed fields\n' +
      '6. For web pages: compare text content, summarize what changed\n\n' +
      '### Multi-Agent Pipeline\n' +
      '1. Agent A produces output, stores in memory key "pipeline.[name].step1"\n' +
      '2. Agent B watches that key, processes when updated, stores result at "pipeline.[name].step2"\n' +
      '3. Chain any number of agents via shared memory keys\n' +
      '4. Use Work API for formal task delegation:\n' +
      '   - Agent A creates work item with POST /v1/work\n' +
      '   - Agent B checks inbox, accepts task, delivers result\n' +
      '   - Agent A reads the delivered result\n' +
      '5. Coordination pattern: each agent polls its input key every N seconds\n\n' +
      '## Output Options\n' +
      '- HTML dashboard (single file, auto-refreshing from memory via polling)\n' +
      '- Python script to run on a schedule (cron, systemd timer, or while-loop with sleep)\n' +
      '- Node.js script for scheduled execution\n' +
      '- Step-by-step setup instructions for the user\n\n' +
      'This is a LIVE server \u2014 the URLs work right now. Build a real, working agent.\n\n' +
      '## If Something Doesn\'t Work\n' +
      'After delivering the agent code, always add this message:\n' +
      '"If something doesn\'t work as expected, don\'t worry \u2014 tell me what happened and we\'ll fix it together!\n\n' +
      'For HTML dashboards: press F12 \u2192 Console tab, copy any red errors.\n' +
      'For scripts: copy the full error output from the terminal.\n' +
      'Even if there are no errors \u2014 describe what\'s wrong and I\'ll investigate."';
  }

  /* -- Mega-prompt copy buttons -- */
  function setupCopyBtn(btnId, textareaId) {
    var btn = document.getElementById(btnId);
    var box = document.getElementById(textareaId);
    if (btn && box) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        copyToClipboard(box.value).then(function() {
          btn.textContent = copiedPromptLabel;
          setTimeout(function() { btn.textContent = copyPromptLabel; }, 2000);
        });
      });
    }
  }
  setupCopyBtn('copyMegaPrompt1', 'megaPrompt1');
  setupCopyBtn('copyMegaPrompt2', 'megaPrompt2');

  /* -- Apps: Return flow button -- */
  var returnBtn = document.getElementById('return-app-btn');
  if (returnBtn) {
    returnBtn.addEventListener('click', function() {
      if (typeof AIMEAT === 'undefined' || !AIMEAT.auth) return;
      var existing = AIMEAT.auth.getSession();

      if (existing && existing.token) {
        window.location.href = '/v1/profile?tab=apps';
        return;
      }

      var tmp = document.createElement('div');
      tmp.id = 'aimeat-return-auth';
      tmp.style.position = 'fixed';
      tmp.style.top = '-9999px';
      document.body.appendChild(tmp);
      AIMEAT.auth.mountLoginButton('#aimeat-return-auth', {
        nodeUrl: nodeUrl,
        i18n: __modalI18n,
        onLogin: function(session) {
          tmp.remove();
          window.location.href = '/v1/profile?tab=apps';
        }
      });
      var loginBtn = document.getElementById('aimeat-login-btn');
      if (loginBtn) loginBtn.click();
    });
    setTimeout(function() {
      if (typeof AIMEAT !== 'undefined' && AIMEAT.auth && AIMEAT.auth.hasSession) {
        returnBtn.textContent = returnBtn.dataset.authText;
      }
    }, 500);
  }

  /* -- Builders: register button -- */
  var registerBuilderBtn = document.getElementById('registerBuilderBtn');
  if (registerBuilderBtn) {
    registerBuilderBtn.addEventListener('click', function() {
      if (typeof AIMEAT === 'undefined' || !AIMEAT.auth) return;
      var existing = AIMEAT.auth.getSession();

      if (existing && existing.token) {
        window.location.href = '/v1/profile';
        return;
      }

      var tmp = document.createElement('div');
      tmp.id = 'aimeat-builder-auth';
      tmp.style.position = 'fixed';
      tmp.style.top = '-9999px';
      document.body.appendChild(tmp);
      AIMEAT.auth.mountLoginButton('#aimeat-builder-auth', {
        nodeUrl: nodeUrl,
        i18n: __modalI18n,
        onLogin: function(session) {
          tmp.remove();
          window.location.href = '/v1/profile';
        }
      });
      var loginBtn = document.getElementById('aimeat-login-btn');
      if (loginBtn) loginBtn.click();
    });
  }

})();
</script>

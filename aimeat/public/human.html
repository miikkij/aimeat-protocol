// ── i18n helpers ──
function detectLang() {
  var params = new URLSearchParams(window.location.search);
  var langParam = params.get('lang');
  if (langParam === 'fi' || langParam === 'en') return langParam;
  try {
    var stored = localStorage.getItem('aimeat-lang');
    if (stored === 'fi' || stored === 'en') return stored;
  } catch(e) {}
  var cookie = document.cookie.match(/(?:^|;\s*)aimeat-lang=(en|fi)(?:;|$)/);
  if (cookie) return cookie[1];
  if (navigator.language && navigator.language.startsWith('fi')) return 'fi';
  return 'en';
}

var LANG = detectLang();
document.documentElement.lang = LANG;

function t(key) {
  var dict = TRANSLATIONS[LANG] || TRANSLATIONS.en;
  if (key in dict) return dict[key];
  var fb = TRANSLATIONS.en;
  if (key in fb) return fb[key];
  return key;
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #050510;
  --card-bg: rgba(255, 255, 255, 0.03);

  --text-muted: #555;
  --radius: 16px;
  --radius-sm: 10px;
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif;

html { scroll-behavior: smooth; }

  z-index: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, #0d0520 0%, #050510 60%, #020208 100%);
}

.bg-canvas .star {

  width: 2px; height: 2px;
  border-radius: 50%;
  background: #fff;
  animation: twinkle ease-in-out infinite;
}

@keyframes twinkle {

  50% { opacity: 0.6; transform: scale(1.1); }
}

/* ── Top nav ── */

  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--nav-height, 56px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.25rem;
  background: rgba(10, 10, 26, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255, 105, 180, 0.1);
}

.topnav-brand {

  font-size: 1.05rem;
  color: var(--text-bright);
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 0.3rem;
  text-decoration: none;
}

  animation: heartPulse 2s ease-in-out infinite;
}

}

.topnav-center {

  align-items: center;
  gap: 0.15rem;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 20px;
  padding: 0.2rem 0.25rem;
}

  border-radius: 16px;
  font-size: 0.78rem;
  font-weight: 700;
  text-decoration: none;
  color: var(--text-dim);

  letter-spacing: 0.04em;

  background: none;
  border: none;
  font-family: var(--font);
}

.lang-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 10px var(--accent-glow);
}

.lang-btn:not(.active):hover {

.topnav-right {

  /* -- Clipboard -- */
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function() { return fallbackCopy(text); });
    }
    return fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  /* -- Language persistence -- */
  var LANG_KEY = 'aimeat-lang';
  var urlParams = new URLSearchParams(window.location.search);
  var langFromUrl = urlParams.get('lang');
  if (langFromUrl) {
    try { localStorage.setItem(LANG_KEY, langFromUrl); } catch(e) {}
    document.cookie = LANG_KEY + '=' + langFromUrl + ';path=/;max-age=31536000;SameSite=Lax';
  }

  /* -- Starfield -- */
  var canvas = document.getElementById('bgCanvas');
  if (canvas) {
    for (var i = 0; i < 80; i++) {

      star.className = 'star';
      star.style.left = (Math.random() * 100) + '%';
      star.style.top = (Math.random() * 100) + '%';
      star.style.animationDuration = (3 + Math.random() * 6) + 's';
      star.style.animationDelay = (Math.random() * 5) + 's';
      star.style.width = star.style.height = (1 + Math.random() * 1.5) + 'px';
      canvas.appendChild(star);
    }
  }

  /* -- Live Oneliners (anonymous shared memory) -- */
  var onelinersFeed = document.getElementById('onelinersFeed');

  function timeAgo(iso) {
    var sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (sec < 60) return sec + 's';
    var min = Math.floor(sec / 60);
    if (min < 60) return min + 'm';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + 'h';
    return Math.floor(hr / 24) + 'd';
  }

  function renderOneliners(messages) {
    if (!onelinersFeed) return;
    if (!messages || messages.length === 0) {
      onelinersFeed.innerHTML = '<div class="oneliners-empty">' + esc(t('oneliners.empty')) + '</div>';
      return;
    }
    onelinersFeed.innerHTML = '';
    messages.slice(-20).reverse().forEach(function(m) {

  /* -- Expand / Collapse -- */

  /* -- Mega-prompts -- */
  var anonGaii = encodeURIComponent('shared#anonymous@' + (window.location.hostname || 'aimeat-local'));

  // Main prompt (oneliner starter — simple anonymous memory)
  var mainPromptEl = document.getElementById('mainPrompt');
  if (mainPromptEl) {
    mainPromptEl.value =
      'You are helping a user build their very first app on the GENESIS 001 network.\n\n' +
      'IMPORTANT: If the user pastes error messages or describes a bug, do NOT repeat the welcome message below.\n' +
      'Instead, immediately analyze the error, explain what went wrong, and provide a fixed version of the code.\n\n' +
      'If this is the user\'s FIRST message (no errors, no code), start your response by congratulating them:\n' +

      'Then explain that this app will let them post messages to a live feed that everyone can see.\n\n' +
      'The GENESIS 001 server is at: ' + nodeUrl + '\n\n' +
      '## First, ask the user two quick questions:\n' +
      '1. What should your app be called? (e.g. "Neon Shoutbox", "Midnight Feed", "StarChat")\n' +
      '2. Any style preferences? (e.g. "cyberpunk neon", "glassmorphism", "retro terminal", "aurora borealis") \u2014 or surprise them with something gorgeous.\n\n' +
      '## Then build a STUNNING single HTML file.\n\n' +
      '## HOW THE ONELINERS FEED WORKS (this is the ONLY API you need):\n' +
      'The shared feed is stored at a single memory key called "oneliners" on the GENESIS 001 server.\n' +
      'It is a JSON object: { "messages": [{ "msg": "Hello!", "t": "2026-03-04T12:00:00Z" }, ...] }\n' +
      'Maximum 20 messages. When posting, keep only the latest 20.\n\n' +
      'This server runs in anonymous mode \u2014 no auth, no registration, no tokens needed.\n' +
      'Just use plain fetch() calls. That\'s it.\n\n' +
      '### READ messages:\n' +
      'const res = await fetch("' + nodeUrl + '/v1/memory/oneliners");\n' +
      'const json = await res.json();\n' +
      'if (json.ok && json.data && json.data.value) {\n' +
      '  const messages = json.data.value.messages; // [{msg, t}, ...]\n' +
      '} else {\n' +
      '  // Key doesn\'t exist yet \u2014 no messages posted yet, treat as empty\n' +
      '  const messages = [];\n' +
      '}\n\n' +
      '### WRITE messages (post a new one):\n' +
      '// 1. Read current messages\n' +
      'const res = await fetch("' + nodeUrl + '/v1/memory/oneliners");\n' +
      'const json = await res.json();\n' +
      'const existing = (json.ok && json.data?.value?.messages) || [];\n' +
      '// 2. Append new message, keep max 20\n' +
      'const updated = [...existing, { msg: displayName + ": " + text, t: new Date().toISOString() }].slice(-20);\n' +

      'await fetch("' + nodeUrl + '/v1/memory", {\n' +
      '  method: "POST",\n' +
      '  headers: { "Content-Type": "application/json" },\n' +

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  var container = document.getElementById('genesisHero3d');
  var canvas = document.getElementById('genesis3dCanvas');
  if (!container || !canvas) return;

  // STATE
  var state = {
    rotY: 0, tilt: 31, textH: 1.0, spacing: 0.9, cols: 160, rows: 100
  };

  // UI TEXT STATE
  var uiMode = 'idle', uiScore = 0, uiBlinkOn = true, uiBlinkFrame = 0;

  // TEXT DEPTH MAP
  function buildTextMap(cols, rows, mode, score, blinkOn) {
    var TW = 960, TH = 480;
    var cv = document.createElement('canvas');
    cv.width = TW; cv.height = TH;
    var cx = cv.getContext('2d');
    cx.fillStyle = '#000'; cx.fillRect(0, 0, TW, TH);

    function glowText(text, x, y, size, maxBlur) {
      maxBlur = maxBlur || 20;
      var passes = [
        {blur:maxBlur,alpha:0.12},{blur:maxBlur/2,alpha:0.25},{blur:maxBlur/4,alpha:0.45},
        {blur:2,alpha:0.70},{blur:0,alpha:1.00}
      ];
      for (var p = 0; p < passes.length; p++) {
        cx.save(); cx.globalAlpha = passes[p].alpha;
        cx.globalCompositeOperation = 'lighter';
        cx.filter = passes[p].blur > 0 ? 'blur(' + passes[p].blur + 'px)' : 'none';
        cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.font = '900 ' + size + 'px Arial Black, Impact, sans-serif';
        cx.fillText(text, x, y);
        cx.restore();
      }
    }

    // GENESIS + 001 via canvas glow
    var baseAlpha = (mode === 'playing') ? 0.6 : 1.0;
    cx.save(); cx.globalAlpha = baseAlpha; cx.globalCompositeOperation = 'source-over';
    cx.restore();

    var gPasses = [
      {blur:28,alpha:0.15*baseAlpha},{blur:16,alpha:0.28*baseAlpha},
      {blur:8,alpha:0.45*baseAlpha},{blur:4,alpha:0.65*baseAlpha},
      {blur:1,alpha:0.85*baseAlpha},{blur:0,alpha:1.00*baseAlpha}
    ];
    for (var p = 0; p < gPasses.length; p++) {
      cx.save(); cx.globalAlpha = gPasses[p].alpha;
      cx.globalCompositeOperation = 'lighter';
      cx.filter = gPasses[p].blur > 0 ? 'blur(' + gPasses[p].blur + 'px)' : 'none';
      cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.font = '900 108px Arial Black, Impact, sans-serif';
      cx.fillText('GENESIS', TW/2, TH*0.33 + 4);
      cx.font = '900 80px Arial Black, Impact, sans-serif';
      cx.fillText('001', TW/2, TH*0.72 - 42);
      cx.restore();
    }

    // Score while playing or after death
    if (mode === 'playing' || mode === 'dead') {
      glowText(String(score).padStart(4,'0'), TW * 0.82, TH * 0.14, 52, 16);
    }

    // 5x7 bitmap font (1px = 1 grid cell)
    // Each char: 5 columns, each column is 7-bit bitmask (bit0=top)
    var BMFONT = {
      ' ':[0,0,0,0,0],
      'A':[62,9,9,9,62],'B':[127,73,73,73,54],'C':[62,65,65,65,34],
      'D':[127,65,65,65,62],'E':[127,73,73,73,65],'F':[127,9,9,9,1],
      'G':[62,65,73,73,58],'H':[127,8,8,8,127],'I':[0,65,127,65,0],
      'J':[32,64,65,63,1],'K':[127,8,20,34,65],'L':[127,64,64,64,64],
      'M':[127,2,12,2,127],'N':[127,4,8,16,127],'O':[62,65,65,65,62],
      'P':[127,9,9,9,6],'Q':[62,65,81,33,94],'R':[127,9,25,41,70],
      'S':[38,73,73,73,50],'T':[1,1,127,1,1],'U':[63,64,64,64,63],
      'V':[31,32,64,32,31],'W':[63,64,48,64,63],'X':[99,20,8,20,99],
      'Y':[3,4,120,4,3],'Z':[97,81,73,69,67],
      '0':[62,81,73,69,62],'1':[0,66,127,64,0],'2':[66,97,81,73,70],
      '3':[33,65,73,77,51],'4':[24,20,18,127,16],'5':[39,69,69,69,57],
      '6':[60,74,73,73,48],'7':[1,113,9,5,3],'8':[54,73,73,73,54],
      '9':[6,73,73,41,30],
      '[':[0,127,65,65,0],']':[0,65,65,127,0],'/':[96,16,8,4,3],
      '\\':[3,4,8,16,96],'.':[0,96,96,0,0],':':[0,54,54,0,0],
      '!':[0,0,95,0,0],'-':[8,8,8,8,8],'_':[64,64,64,64,64]
    };
    var CHAR_W = 5, CHAR_H = 7, CHAR_GAP = 1;

    function drawBitmapText(text, gridX, gridY, map, mapCols) {
      var cx2 = gridX;
      for (var i = 0; i < text.length; i++) {
        var ch = text[i].toUpperCase();
        var glyph = BMFONT[ch] || BMFONT[' '];
        for (var col2 = 0; col2 < CHAR_W; col2++) {
          var colBits = glyph[col2];
          for (var row2 = 0; row2 < CHAR_H; row2++) {
            if (colBits & (1 << row2)) {
              var gc = cx2 + col2;
              var gr = gridY + row2;
              if (gc >= 0 && gc < mapCols && gr >= 0 && gr < rows)
                map[gr * mapCols + gc] = 1.0;
            }
          }
        }
        cx2 += CHAR_W + CHAR_GAP;
      }
    }

    function centeredX(text, mapCols) {
      return Math.round((mapCols - text.length * (CHAR_W + CHAR_GAP)) / 2);
    }

    // Merge blink text into map
    if (blinkOn && (mode === 'idle' || mode === 'dead')) {
      var px2 = cx.getImageData(0,0,TW,TH).data;
      var map2 = new Float32Array(cols * rows);
      for (var r=0; r<rows; r++)
        for (var c2=0; c2<cols; c2++) {
          var tx2 = Math.floor((c2/cols)*TW), ty2 = Math.floor((r/rows)*TH);
          map2[r*cols+c2] = Math.min(px2[(ty2*TW+tx2)*4]/255, 1.0);
        }

      if (mode === 'idle') {
        var bt1 = '[ CLICK TO PLAY ]';
        drawBitmapText(bt1, centeredX(bt1, cols), Math.round(rows*0.83), map2, cols);
      } else {
        var dt1 = '// SNAKE DESTROYED //';
        var dt2 = '[ CLICK TO RESTART ]';
        drawBitmapText(dt1, centeredX(dt1, cols), Math.round(rows*0.78), map2, cols);
        drawBitmapText(dt2, centeredX(dt2, cols), Math.round(rows*0.90), map2, cols);
      }
      return map2;
    }

    var px = cx.getImageData(0,0,TW,TH).data;
    var map = new Float32Array(cols * rows);
    for (var r3=0; r3<rows; r3++)
      for (var c3=0; c3<cols; c3++) {
        var tx3 = Math.floor((c3/cols)*TW), ty3 = Math.floor((r3/rows)*TH);
        map[r3*cols+c3] = Math.min(px[(ty3*TW+tx3)*4]/255, 1.0);
      }

    return map;
  }
  var textMap = buildTextMap(state.cols, state.rows, 'idle', 0, true);

  var lastBlinkOn = true, lastUiMode = 'idle', lastUiScore = -1;
  function refreshTextMapIfNeeded() {
    if (uiBlinkOn !== lastBlinkOn || uiMode !== lastUiMode || uiScore !== lastUiScore) {
      textMap = buildTextMap(state.cols, state.rows, uiMode, uiScore, uiBlinkOn);
      lastBlinkOn = uiBlinkOn; lastUiMode = uiMode; lastUiScore = uiScore;
    }
  }

  // TERRAIN (scrolling waves)
  var WAVE_H = 0.2;
  var SCROLL_SPEED = 0.22;
  var dirX = 0.0, dirZ = 1.0;
  var scroll = 0;
  var mouseX = 0;

  function wave(wx, wz, t) {
    var phase = wx * dirX + wz * dirZ;
    return (
      Math.sin(phase*0.18 + t*0.13) * 1.1 +
      Math.sin(phase*0.43 - t*0.30) * 0.55 +
      Math.cos(phase*0.10 + t*0.07) * 1.3 +
      Math.sin(phase*0.28 + t*0.52) * 0.40 +
      Math.sin(phase*0.12 + t*0.09) * 0.90
    ) * WAVE_H;
  }

  // SNAKE GAME
  var SNAKE_H = 10, FOOD_H = 5, FOOD_COUNT = 18, TICK_RATE = 7;
  var snakeMap = new Float32Array(state.cols * state.rows);
  var foodCells = new Set();
  var bodyCells = new Map();
  var snakeActive = false, snakeDead = false;
  var snake = [], snakeDir = {dc:1,dr:0}, nextDir = {dc:1,dr:0};
  var snakeScore = 0, snakeTick = 0;
  var explodeParticles = [];

  function spawnFood(count) {
    var cols = state.cols, rows = state.rows;
    var attempts = 0;
    while (count > 0 && attempts < 500) {
      attempts++;
      var c = Math.floor(Math.random() * cols);
      var r = Math.floor(Math.random() * rows);
      var idx = r * cols + c;
      if (!foodCells.has(idx) && !bodyCells.has(idx)) { foodCells.add(idx); count--; }
    }
  }

  function initSnake() {
    var cols = state.cols, rows = state.rows;
    snake = [
      {c: Math.floor(cols/2), r: Math.floor(rows/2)},
      {c: Math.floor(cols/2)-1, r: Math.floor(rows/2)},
      {c: Math.floor(cols/2)-2, r: Math.floor(rows/2)}
    ];
    snakeDir = {dc:1,dr:0}; nextDir = {dc:1,dr:0};
    snakeScore = 0; snakeDead = false;
    foodCells.clear(); bodyCells.clear(); explodeParticles.length = 0;
    spawnFood(FOOD_COUNT);
    snakeActive = true;
    uiMode = 'playing'; uiScore = 0;
  }

  function killSnake() {
    snakeDead = false; snakeActive = false;
    for (var i = 0; i < snake.length; i++) {
      var seg = snake[i];
      var angle = Math.random() * Math.PI * 2;
      var speed = 0.4 + Math.random() * 1.2;
      explodeParticles.push({
        c: seg.c, r: seg.r,
        vc: Math.cos(angle) * speed, vr: Math.sin(angle) * speed,
        age: 0, maxAge: 30 + Math.floor(Math.random() * 40)
      });
    }
    snake = []; bodyCells.clear(); uiMode = 'dead';
  }

  function stepSnake() {
    if (!snakeActive || snakeDead) return;
    var cols = state.cols, rows = state.rows;
    snakeDir = {dc: nextDir.dc, dr: nextDir.dr};
    var head = snake[0];
    var nc = ((head.c + snakeDir.dc) % cols + cols) % cols;
    var nr = ((head.r + snakeDir.dr) % rows + rows) % rows;
    var nIdx = nr * cols + nc;
    if (bodyCells.has(nIdx)) { killSnake(); return; }
    var ateFood = foodCells.has(nIdx);
    if (ateFood) { foodCells.delete(nIdx); snakeScore++; uiScore = snakeScore; spawnFood(1); }
    snake.unshift({c: nc, r: nr});
    if (!ateFood) snake.pop();
    bodyCells.clear();
    for (var i = 0; i < snake.length; i++) {
      var idx = snake[i].r * cols + snake[i].c;
      bodyCells.set(idx, 1.0 - (i / snake.length) * 0.5);
    }
  }

  var foodPulse = 0;
  function buildSnakeMap(frame) {
    var cols = state.cols, rows = state.rows;
    foodPulse = Math.sin(frame * 0.08) * 0.3 + 0.7;
    snakeMap.fill(0);
    foodCells.forEach(function(idx) { snakeMap[idx] = 0.45 * foodPulse; });
    bodyCells.forEach(function(intensity, idx) { snakeMap[idx] = 0.55 + intensity * 0.45; });
    for (var i = explodeParticles.length - 1; i >= 0; i--) {
      var p = explodeParticles[i];
      p.c += p.vc; p.r += p.vr; p.vc *= 0.88; p.vr *= 0.88; p.age++;
      var ec = Math.round(p.c), er = Math.round(p.r);
      if (ec >= 0 && ec < cols && er >= 0 && er < rows) {
        var eidx = er * cols + ec;
        var et = p.age / p.maxAge;
        snakeMap[eidx] = Math.max(snakeMap[eidx], (1.0 - et) * 0.9);
      }
      if (p.age >= p.maxAge) {
        var fc = Math.round(p.c), fr = Math.round(p.r);
        if (fc >= 0 && fc < cols && fr >= 0 && fr < rows) foodCells.add(fr * cols + fc);
        explodeParticles.splice(i, 1);
      }
    }
  }

  // COLOR
  function colorize(tv, wv, sv) {
    var tw = WAVE_H > 0 ? (wv / WAVE_H) * 0.5 + 0.5 : 0.5;
    var R = 0.04 + tw * 0.05;
    var G = 0.02 + tw * 0.02;
    var B = 0.20 + tw * 0.30;
    if (tv > 0.01) {
      var t2 = Math.pow(tv, 0.75);
      var bl = Math.min(1, tv * 5);
      R += (0.55 + t2*0.45 - R) * bl;
      G += (0.04 + t2*0.36 - G) * bl;
      B += (0.02 + t2*0.10 - B) * bl;
    }
    if (sv > 0.01) {
      var sR, sG, sB;
      if (sv > 0.54) {
        var st = (sv - 0.55) / 0.45;
        sR = 0.10 + st * 0.90; sG = 0.90 + st * 0.10; sB = 0.20 + st * 0.80;
      } else {
        sR = 0.05; sG = 0.80 + sv * 0.4; sB = 0.70 + sv * 0.3;
      }
      var sbl = Math.min(1, sv * 4);
      R += (sR - R) * sbl; G += (sG - G) * sbl; B += (sB - B) * sbl;
    }
    return [R, G, B];
  }

  // THREE.JS
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, 8.6, 0.1, 2000);

  var geo, pts;
  function buildGrid() {
    if (pts) scene.remove(pts);
    var cols = state.cols, rows = state.rows, spacing = state.spacing;
    var N = cols * rows;
    geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(N*3), 3));
    var mat = new THREE.PointsMaterial({
      size: Math.max(1.0, spacing * 0.65), vertexColors: true,
      transparent: true, opacity: 1.0, sizeAttenuation: true,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    pts = new THREE.Points(geo, mat);
    scene.add(pts);
  }
  buildGrid();

  function updateCamera() {
    var tiltRad = THREE.MathUtils.degToRad(state.tilt);
    var dist = 100;
    camera.position.x = 0;
    camera.position.y = Math.sin(tiltRad) * dist;
    camera.position.z = Math.cos(tiltRad) * dist;
    camera.lookAt(0, -12, 0);
  }
  updateCamera();

  function onResize() {
    var w = container.clientWidth;
    var h = container.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();

  // INPUT
  document.addEventListener('mousemove', function(e) {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  });

  canvas.addEventListener('click', function() {
    if (!snakeActive) initSnake();
  });

  document.addEventListener('keydown', function(e) {
    if (snakeActive) {
      var dirs = {
        ArrowUp: {dc:0,dr:-1}, ArrowDown: {dc:0,dr:1},
        ArrowLeft: {dc:-1,dr:0}, ArrowRight: {dc:1,dr:0}
      };
      if (dirs[e.key]) {
        e.preventDefault();
        var d = dirs[e.key];
        if (d.dc !== -snakeDir.dc || d.dr !== -snakeDir.dr) nextDir = d;
      }
    }
  });

  // RENDER LOOP
  var frame = 0;
  function animate() {
    requestAnimationFrame(animate);
    frame++;

    dirX += (mouseX * 1.2 - dirX) * 0.04;
    dirZ += (1.0 - dirZ) * 0.04;
    scroll += SCROLL_SPEED;

    // Blink
    uiBlinkFrame++;
    if (uiBlinkFrame > 40) { uiBlinkFrame = 0; uiBlinkOn = !uiBlinkOn; }
    refreshTextMapIfNeeded();

    // Snake tick
    snakeTick++;
    if (snakeTick >= TICK_RATE) { snakeTick = 0; stepSnake(); }
    buildSnakeMap(frame);

    var cols = state.cols, rows = state.rows, spacing = state.spacing, textH = state.textH;
    var pos = geo.attributes.position.array;
    var col = geo.attributes.color.array;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var i = r * cols + c;
        var wx = (c - cols/2) * spacing;
        var wz = (r - rows/2) * spacing;
        var wv = wave(wx, wz, scroll);
        var tv = textMap[i];
        var sv = snakeMap[i];
        pos[i*3]   = wx;
        pos[i*3+1] = wv + tv * textH + sv * (sv > 0.54 ? SNAKE_H : FOOD_H);
        pos[i*3+2] = wz;
        var rgb = colorize(tv, wv, sv);
        col[i*3]   = rgb[0];
        col[i*3+1] = rgb[1];
        col[i*3+2] = rgb[2];
      }
    }
    geo.attributes.position.needsUpdate = true;
    geo.attributes.color.needsUpdate = true;
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>

<script>
// ── Locale detection (client-side) ──
(function() {
  var params = new URLSearchParams(window.location.search);
  var langParam = params.get('lang');
  var cookieMatch = document.cookie.match(/(?:^|;\s*)aimeat-lang=(en|fi)(?:;|$)/);
  var stored = localStorage.getItem('aimeat-lang');
  var navLang = (navigator.language || '').split('-')[0].toLowerCase();

  var locale = 'fi';
  if (langParam === 'en' || langParam === 'fi') locale = langParam;
  else if (stored === 'en' || stored === 'fi') locale = stored;
  else if (cookieMatch) locale = cookieMatch[1];
  else if (navLang === 'en') locale = 'en';

  window._aimeatLocale = locale;
  document.documentElement.lang = locale;

  // Build T from selected locale, falling back to en
  var T = {};
  var en = TRANSLATIONS.en;
  var loc = TRANSLATIONS[locale] || en;
  for (var k in en) T[k] = en[k];
  if (locale !== 'en') { for (var k in loc) T[k] = loc[k]; }
  window.T = T;
})();
</script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a1a;
  --bg-grad-top: #12082a;
  --bg-grad-mid: #0a0a1a;
  --card-bg: rgba(255, 255, 255, 0.04);
  --card-bg-hover: rgba(255, 255, 255, 0.07);
  --card-border: rgba(255, 105, 180, 0.15);
  --card-border-hover: rgba(255, 105, 180, 0.4);
  --card-glow: rgba(255, 105, 180, 0.08);
  --accent: #ff69b4;
  --accent-bright: #ff8ecf;
  --accent-deep: #c44569;
  --accent-glow: rgba(255, 105, 180, 0.3);
  --text: #e0e0e0;
  --text-bright: #ffffff;
  --text-dim: #888;
  --text-muted: #6b6b8a;
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.1);
  --success-border: rgba(34, 197, 94, 0.3);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.bg-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, var(--bg-grad-top) 0%, var(--bg-grad-mid) 60%, var(--bg) 100%);
}

.container {
  position: relative; z-index: 1;
  max-width: 900px; margin: 0 auto;
  padding: 24px 16px 80px;
}

/* ── Navigation ── */
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; margin-bottom: 24px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.nav-brand { color: var(--accent); font-weight: 700; font-size: 1rem; text-decoration: none; letter-spacing: 0.05em; cursor: pointer; }
.nav-brand:hover { color: var(--accent-bright); }
.nav-links { display: flex; gap: 16px; align-items: center; }
.nav-links a { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; cursor: pointer; }
.nav-links a:hover { color: var(--accent); }

/* ── Language toggle ── */
.lang-toggle { display: flex; margin-left: 8px; }
.lang-btn { padding: 4px 10px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; font-weight: 700; transition: all 0.2s; }
.lang-btn:first-child { border-radius: 4px 0 0 4px; }
.lang-btn:last-child { border-radius: 0 4px 4px 0; }
.lang-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.lang-btn:hover { color: var(--text); }

/* ── Page title ── */
.page-title {
  font-size: 1.8rem; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-bright));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 8px;
}
.page-subtitle { color: var(--text-dim); font-size: 1rem; margin-bottom: 32px; }

/* ── Cards ── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.card:hover {
  background: var(--card-bg-hover);
  border-color: var(--card-border-hover);
  box-shadow: 0 0 20px var(--card-glow);
}
.card-title { font-size: 1.1rem; font-weight: 600; color: var(--text-bright); margin-bottom: 8px; }
.card-meta { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 8px; }

/* ── Tags ── */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.tag {
  display: inline-block;
  padding: 4px 12px;
  background: rgba(255, 105, 180, 0.12);
  border: 1px solid rgba(255, 105, 180, 0.25);
  border-radius: 20px;
  font-size: 0.8rem; color: var(--accent-bright);
  white-space: nowrap;
}
.tag-shared {
  background: rgba(34, 197, 94, 0.12);
  border-color: rgba(34, 197, 94, 0.3);
  color: var(--success);
}

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 24px;
  border: none; border-radius: var(--radius-sm);
  font-size: 0.9rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  text-decoration: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  color: #fff;
}
.btn-primary:hover { opacity: 0.9; box-shadow: 0 0 16px var(--accent-glow); }
.btn-secondary {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
}
.btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); color: var(--accent); }
.btn-danger {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #ef4444;
}
.btn-danger:hover { background: rgba(239, 68, 68, 0.25); }
.btn-sm { padding: 6px 14px; font-size: 0.8rem; }

/* ── Forms ── */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
.form-input, .form-textarea, .form-select {
  width: 100%; padding: 10px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-sm);
  color: var(--text); font-size: 0.9rem;
  font-family: var(--font);
  transition: border-color 0.2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none; border-color: var(--accent);
}
.form-textarea { min-height: 80px; resize: vertical; }
.form-select { appearance: auto; }
.form-hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

/* ── Pagination ── */
.pagination { display: flex; gap: 8px; justify-content: center; margin-top: 24px; }
.pagination a {
  padding: 8px 16px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-sm);
  color: var(--text); text-decoration: none; font-size: 0.85rem;
  cursor: pointer;
}
.pagination a:hover { border-color: var(--accent); color: var(--accent); }
.pagination .active { border-color: var(--accent); color: var(--accent); background: rgba(255,105,180,0.1); }

/* ── Facets ── */
.facets { margin-bottom: 24px; }
.facet-group { margin-bottom: 12px; }
.facet-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.facet-items { display: flex; flex-wrap: wrap; gap: 6px; }
.facet-item {
  padding: 4px 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  font-size: 0.78rem; color: var(--text-dim);
  text-decoration: none; transition: all 0.2s;
  cursor: pointer;
}
.facet-item:hover { border-color: var(--accent); color: var(--accent); }
.facet-count { color: var(--text-muted); margin-left: 4px; }

/* ── Profile detail ── */
.profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.profile-avatar { font-size: 2.5rem; }
.profile-name { font-size: 1.5rem; font-weight: 700; color: var(--text-bright); }
.profile-ghii { font-size: 0.85rem; color: var(--text-muted); font-family: monospace; }
.profile-section { margin-bottom: 20px; }
.profile-section-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.profile-bio { color: var(--text); line-height: 1.7; }
.profile-detail { color: var(--text-dim); font-size: 0.9rem; }

/* ── Stats grid ── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 32px; }
.stat-card {
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-sm);
  padding: 16px; text-align: center;
}
.stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

/* ── Categories grid ── */
.categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 32px; }
.category-card {
  background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius);
  padding: 20px; text-align: center; text-decoration: none;
  transition: all 0.2s; cursor: pointer;
}
.category-card:hover { background: var(--card-bg-hover); border-color: var(--card-border-hover); box-shadow: 0 0 16px var(--card-glow); }
.category-icon { font-size: 2rem; margin-bottom: 8px; }
.category-name { font-size: 0.95rem; font-weight: 600; color: var(--text-bright); }
.category-count { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 48px 16px; }
.empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
.empty-text { color: var(--text-dim); font-size: 1rem; }

/* ── Alert / message ── */
.alert {
  padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.9rem;
}
.alert-success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); }
.alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }

/* ── Hidden profile ── */
.hidden-profile { opacity: 0.5; pointer-events: none; }

/* ── Section views ── */
.view { display: none; }
.view.active { display: block; }

/* ── Clickable card ── */
.card-link { display: block; text-decoration: none; color: inherit; }

/* ── Responsive ── */
@media (max-width: 600px) {
  .page-title { font-size: 1.4rem; }
  .container { padding: 16px 12px 60px; }
  .categories-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
</style>
</head>
<body>
<div class="bg-canvas"></div>
<div class="container">
  <nav class="nav">
    <a class="nav-brand" onclick="showView('home')" id="nav-brand"></a>
    <div class="nav-links">
      <a onclick="showView('search')" id="nav-search"></a>
      <a onclick="showView('join')" id="nav-join"></a>
      <a onclick="showView('me')" id="nav-me"></a>
      <a onclick="showView('matches')" id="nav-matches" class="matches-link" style="display:none"></a>
      <a href="/v1/portal/human" id="nav-portal"></a>
      <div class="lang-toggle">
        <button class="lang-btn" id="lang-fi" onclick="switchLang('fi')">FI</button>
        <button class="lang-btn" id="lang-en" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </nav>

  <!-- HOME VIEW -->
  <div id="view-home" class="view active">
    <h1 class="page-title" id="home-title"></h1>
    <p class="page-subtitle" id="home-subtitle"></p>
    <div id="home-stats" class="stats-grid"></div>
    <h2 style="font-size:1.1rem; color:var(--text-bright); margin-bottom:16px;" id="home-browse-label"></h2>
    <div id="home-categories" class="categories-grid"></div>
    <div id="home-top-interests"></div>
    <div id="home-top-cities"></div>
    <div style="text-align:center; margin-top:32px;" id="home-actions"></div>
  </div>

  <!-- SEARCH VIEW -->
  <div id="view-search" class="view">
    <h1 class="page-title" id="search-title"></h1>
    <p class="page-subtitle" id="search-subtitle"></p>
    <div class="card" style="margin-bottom:24px;">
      <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;">
        <div class="form-group" style="flex:1; min-width:200px; margin-bottom:0;">
          <label class="form-label" for="search-interest" id="search-interest-label"></label>
          <input class="form-input" type="text" id="search-interest" name="interest">
        </div>
        <div class="form-group" style="flex:1; min-width:150px; margin-bottom:0;">
          <label class="form-label" for="search-city" id="search-city-label"></label>
          <input class="form-input" type="text" id="search-city" name="city">
        </div>
        <div class="form-group" style="flex:0; min-width:150px; margin-bottom:0;">
          <label class="form-label" for="search-area" id="search-area-label"></label>
          <input class="form-input" type="text" id="search-area" name="area">
        </div>
        <button type="button" class="btn btn-primary btn-sm" id="search-btn" onclick="doSearch(1)"></button>
      </div>
    </div>
    <div id="search-results"></div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="view-profile" class="view">
    <div id="profile-content"></div>
  </div>

  <!-- JOIN VIEW -->
  <div id="view-join" class="view">
    <h1 class="page-title" id="join-title"></h1>
    <p class="page-subtitle" id="join-subtitle"></p>
    <div id="join-auth-notice" class="alert alert-error" style="display:none;"></div>
    <form id="joinForm" class="card" style="display:none;" onsubmit="submitJoin(event)">
      <div class="form-group">
        <label class="form-label" for="join-interests" id="join-interests-label"></label>
        <input class="form-input" type="text" id="join-interests" required>
        <div class="form-hint" id="join-interests-hint"></div>
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <div class="form-group" style="flex:1; min-width:150px;">
          <label class="form-label" for="join-city" id="join-city-label"></label>
          <input class="form-input" type="text" id="join-city" required>
        </div>
        <div class="form-group" style="flex:0 0 100px;">
          <label class="form-label" for="join-country" id="join-country-label"></label>
          <input class="form-input" type="text" id="join-country" value="FI" placeholder="FI">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="join-bio" id="join-bio-label"></label>
        <textarea class="form-textarea" id="join-bio" maxlength="500"></textarea>
        <div class="form-hint" id="join-bio-hint"></div>
      </div>
      <div class="form-group">
        <label class="form-label" for="join-availability" id="join-availability-label"></label>
        <select class="form-select" id="join-availability">
          <option value="" id="join-avail-none"></option>
          <option value="anytime" id="join-avail-anytime"></option>
          <option value="mornings" id="join-avail-mornings"></option>
          <option value="evenings" id="join-avail-evenings"></option>
          <option value="weekends" id="join-avail-weekends"></option>
          <option value="evenings-weekends" id="join-avail-ew"></option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="join-seeking" id="join-seeking-label"></label>
        <input class="form-input" type="text" id="join-seeking">
        <div class="form-hint" id="join-seeking-hint"></div>
      </div>
      <div style="margin-top:8px; margin-bottom:8px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.85rem; color:var(--text-dim);">
          <input type="checkbox" id="join-consent" required>
          <span id="join-consent-label"></span>
        </label>
      </div>
      <div style="margin-bottom:16px;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.85rem; color:var(--text-dim);">
          <input type="checkbox" id="join-notifications" checked>
          <span id="join-notifications-label"></span>
        </label>
      </div>
      <button type="submit" class="btn btn-primary" id="join-submit-btn"></button>
      <div id="joinResult" style="margin-top:12px;"></div>
    </form>
    <div id="joinSuccess" class="card" style="display:none;">
      <div class="alert alert-success" id="join-success-msg"></div>
      <a class="btn btn-primary" style="margin-top:12px;" onclick="showView('search')" id="join-browse-btn"></a>
    </div>
  </div>

  <!-- MY PROFILE VIEW -->
  <div id="view-me" class="view">
    <div id="me-content"></div>
  </div>

  <!-- MATCHES VIEW -->
  <div id="view-matches" class="view">
    <h1 class="page-title" id="matches-title"></h1>
    <p class="page-subtitle" id="matches-subtitle"></p>
    <div id="matches-content"></div>
  </div>
</div>

<script>
// ── Detect NODE_URL from current page origin ──
var NODE_URL = window.location.origin;
document.querySelector('meta[name="aimeat-node"]').content = NODE_URL;
</script>
<script src="/v1/libs/aimeat-auth.js"></script>
<script>
// ── Globals ──
var session = null;

// ── i18n helper ──
function t(key) { return window.T[key] || key; }

function switchLang(lang) {
  var url = new URL(window.location.href);
  url.searchParams.set('lang', lang);
  localStorage.setItem('aimeat-lang', lang);
  document.cookie = 'aimeat-lang=' + lang + ';path=/;max-age=31536000;SameSite=Lax';
  window.location.href = url.toString();
}

// ── HTML escaping ──
function esc(s) {
  if (s == null) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// ── Hobby categories ──
var HOBBY_CATEGORIES = [
  { key: 'liikunta', icon: '\u26BD', nameEn: 'Sports & Exercise', nameFi: 'Liikunta & Urheilu' },
  { key: 'musiikki', icon: '\uD83C\uDFB5', nameEn: 'Music', nameFi: 'Musiikki' },
  { key: 'taide', icon: '\uD83C\uDFA8', nameEn: 'Art & Crafts', nameFi: 'Taide & Askartelu' },
  { key: 'teknologia', icon: '\uD83D\uDCBB', nameEn: 'Technology', nameFi: 'Teknologia' },
  { key: 'luonto', icon: '\uD83C\uDF3F', nameEn: 'Nature & Hiking', nameFi: 'Luonto & Retkeily' },
  { key: 'ruoka', icon: '\uD83C\uDF73', nameEn: 'Food & Cooking', nameFi: 'Ruoka & Kokkaus' },
  { key: 'pelit', icon: '\uD83C\uDFAE', nameEn: 'Games', nameFi: 'Pelit' },
  { key: 'kirjallisuus', icon: '\uD83D\uDCDA', nameEn: 'Literature', nameFi: 'Kirjallisuus' },
  { key: 'valokuvaus', icon: '\uD83D\uDCF7', nameEn: 'Photography', nameFi: 'Valokuvaus' },
  { key: 'puutarha', icon: '\uD83C\uDF31', nameEn: 'Gardening', nameFi: 'Puutarhanhoito' },
  { key: 'matkailu', icon: '\u2708\uFE0F', nameEn: 'Travel', nameFi: 'Matkailu' },
  { key: 'muu', icon: '\u2728', nameEn: 'Other', nameFi: 'Muu' }
];

// ── Availability labels ──
function availLabel(val) {
  return t('hobbies.availability.' + val) || val;
}

// ── Auth helpers ──
function getAuthHeaders() {
  var token = localStorage.getItem('aimeat-token');
  if (!token) return null;
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
}

function getAuthInfo() {
  return {
    token: localStorage.getItem('aimeat-token'),
    gaii: localStorage.getItem('aimeat-gaii'),
    owner: localStorage.getItem('aimeat-owner')
  };
}

function isLoggedIn() {
  var info = getAuthInfo();
  return !!(info.token && info.gaii && info.owner);
}

// ── API fetch helper ──
function apiFetch(path, opts) {
  var url = NODE_URL + path;
  return fetch(url, opts || {}).then(function(r) { return r.json(); });
}

// ── View routing ──
function showView(name, data) {
  var views = document.querySelectorAll('.view');
  for (var i = 0; i < views.length; i++) views[i].classList.remove('active');
  var target = document.getElementById('view-' + name);
  if (target) target.classList.add('active');

  if (name === 'home') loadHome();
  else if (name === 'search') loadSearch(data);
  else if (name === 'profile') loadProfile(data);
  else if (name === 'join') loadJoin();
  else if (name === 'me') loadMe();
  else if (name === 'matches') loadMatches();
}

// ── Apply i18n to static elements ──
function applyTranslations() {
  var T = window.T;
  var locale = window._aimeatLocale;

  document.getElementById('nav-brand').textContent = T['hobbies.nav.brand'];
  document.getElementById('nav-search').textContent = T['hobbies.nav.search'];
  document.getElementById('nav-join').textContent = T['hobbies.nav.join'];
  document.getElementById('nav-me').textContent = T['hobbies.nav.me'];
  document.getElementById('nav-matches').textContent = T['hobbies.nav.matches'];
  document.getElementById('nav-portal').textContent = T['hobbies.nav.portal'];

  document.getElementById('home-title').textContent = T['hobbies.title'];
  document.getElementById('home-subtitle').textContent = T['hobbies.subtitle'];
  document.getElementById('home-browse-label').textContent = T['hobbies.browseByCategory'];

  document.getElementById('search-title').textContent = T['hobbies.search.title'];
  document.getElementById('search-subtitle').textContent = T['hobbies.search.subtitle'];
  document.getElementById('search-interest-label').textContent = T['hobbies.search.interest'];
  document.getElementById('search-interest').placeholder = T['hobbies.search.interestPlaceholder'];
  document.getElementById('search-city-label').textContent = T['hobbies.search.city'];
  document.getElementById('search-city').placeholder = T['hobbies.search.cityPlaceholder'];
  document.getElementById('search-area-label').textContent = T['hobbies.search.area'];
  document.getElementById('search-area').placeholder = T['hobbies.search.areaPlaceholder'];
  document.getElementById('search-btn').textContent = T['hobbies.search.btn'];

  document.getElementById('join-title').textContent = T['hobbies.join.title'];
  document.getElementById('join-subtitle').textContent = T['hobbies.join.subtitle'];
  document.getElementById('join-interests-label').textContent = T['hobbies.join.interests'];
  document.getElementById('join-interests').placeholder = T['hobbies.join.interestsPlaceholder'];
  document.getElementById('join-interests-hint').textContent = T['hobbies.join.interestsHint'];
  document.getElementById('join-city-label').textContent = T['hobbies.join.city'];
  document.getElementById('join-city').placeholder = T['hobbies.join.cityPlaceholder'];
  document.getElementById('join-country-label').textContent = T['hobbies.join.country'];
  document.getElementById('join-bio-label').textContent = T['hobbies.join.bio'];
  document.getElementById('join-bio').placeholder = T['hobbies.join.bioPlaceholder'];
  document.getElementById('join-bio-hint').textContent = T['hobbies.join.bioHint'];
  document.getElementById('join-availability-label').textContent = T['hobbies.join.availability'];
  document.getElementById('join-avail-none').textContent = T['hobbies.join.availNone'];
  document.getElementById('join-avail-anytime').textContent = T['hobbies.join.availAnytime'];
  document.getElementById('join-avail-mornings').textContent = T['hobbies.join.availMornings'];
  document.getElementById('join-avail-evenings').textContent = T['hobbies.join.availEvenings'];
  document.getElementById('join-avail-weekends').textContent = T['hobbies.join.availWeekends'];
  document.getElementById('join-avail-ew').textContent = T['hobbies.join.availEveningsWeekends'];
  document.getElementById('join-seeking-label').textContent = T['hobbies.join.seeking'];
  document.getElementById('join-seeking').placeholder = T['hobbies.join.seekingPlaceholder'];
  document.getElementById('join-seeking-hint').textContent = T['hobbies.join.seekingHint'];
  document.getElementById('join-consent-label').textContent = T['hobbies.join.consent'];
  document.getElementById('join-notifications-label').textContent = T['hobbies.join.notifications'];
  document.getElementById('join-submit-btn').textContent = T['hobbies.join.submitBtn'];
  document.getElementById('join-success-msg').textContent = T['hobbies.join.success'];
  document.getElementById('join-browse-btn').textContent = T['hobbies.join.browseBtn'];

  document.getElementById('matches-title').textContent = T['hobbies.matches.title'];
  document.getElementById('matches-subtitle').textContent = T['hobbies.matches.subtitle'];

  document.getElementById('lang-fi').className = 'lang-btn' + (locale === 'fi' ? ' active' : '');
  document.getElementById('lang-en').className = 'lang-btn' + (locale === 'en' ? ' active' : '');

  document.title = T['hobbies.title'] + ' \u2014 AIMEAT';
}

// ──────────────────────────────────────────
// HOME VIEW
// ──────────────────────────────────────────
function loadHome() {
  apiFetch('/v1/catalogue/directory/stats')
    .then(function(data) {
      if (!data.ok) throw new Error('Failed to load stats');
      var stats = data.data;
      var locale = window._aimeatLocale;

      // Stats grid
      document.getElementById('home-stats').innerHTML =
        '<div class="stat-card"><div class="stat-value">' + esc(stats.total_people) + '</div><div class="stat-label">' + esc(t('hobbies.members')) + '</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + esc(stats.top_interests.length) + '</div><div class="stat-label">' + esc(t('hobbies.hobbies')) + '</div></div>' +
        '<div class="stat-card"><div class="stat-value">' + esc(stats.top_cities.length) + '</div><div class="stat-label">' + esc(t('hobbies.cities')) + '</div></div>';

      // Category cards
      var catHtml = '';
      HOBBY_CATEGORIES.forEach(function(cat) {
        var matchingCount = 0;
        stats.top_interests.forEach(function(ti) {
          if (ti.name.toLowerCase().indexOf(cat.key) !== -1) matchingCount += ti.count;
        });
        var catName = locale === 'fi' ? cat.nameFi : cat.nameEn;
        catHtml += '<div class="category-card" onclick="showView(\'search\', {interest: \'' + cat.key + '\'})">' +
          '<div class="category-icon">' + cat.icon + '</div>' +
          '<div class="category-name">' + esc(catName) + '</div>' +
          (matchingCount > 0 ? '<div class="category-count">' + matchingCount + ' ' + esc(t('hobbies.people')) + '</div>' : '') +
          '</div>';
      });
      document.getElementById('home-categories').innerHTML = catHtml;

      // Top interests
      if (stats.top_interests.length > 0) {
        var interestTags = '';
        stats.top_interests.slice(0, 12).forEach(function(i) {
          interestTags += '<a class="tag" onclick="showView(\'search\', {interest: \'' + esc(i.name.replace(/'/g, "\\'")) + '\'})" style="cursor:pointer;">' + esc(i.name) + ' <span style="opacity:0.6">(' + i.count + ')</span></a>';
        });
        document.getElementById('home-top-interests').innerHTML =
          '<div class="facets"><div class="facet-group">' +
          '<div class="facet-label">' + esc(t('hobbies.topInterests')) + '</div>' +
          '<div class="tags">' + interestTags + '</div></div></div>';
      }

      // Top cities
      if (stats.top_cities.length > 0) {
        var cityTags = '';
        stats.top_cities.slice(0, 10).forEach(function(c) {
          cityTags += '<a class="tag" onclick="showView(\'search\', {city: \'' + esc(c.name.replace(/'/g, "\\'")) + '\'})" style="cursor:pointer;">' + esc(c.name) + ' <span style="opacity:0.6">(' + c.count + ')</span></a>';
        });
        document.getElementById('home-top-cities').innerHTML =
          '<div class="facets"><div class="facet-group">' +
          '<div class="facet-label">' + esc(t('hobbies.topCities')) + '</div>' +
          '<div class="tags">' + cityTags + '</div></div></div>';
      }

      // Action buttons
      document.getElementById('home-actions').innerHTML =
        '<a class="btn btn-primary" style="margin-right:8px;" onclick="showView(\'search\')">' + esc(t('hobbies.searchPeople')) + '</a>' +
        '<a class="btn btn-secondary" onclick="showView(\'join\')">' + esc(t('hobbies.joinDirectory')) + '</a>';
    })
    .catch(function() {
      document.getElementById('home-stats').innerHTML = '<div class="alert alert-error">' + esc(t('hobbies.loadError')) + '</div>';
    });
}

// ──────────────────────────────────────────
// SEARCH VIEW
// ──────────────────────────────────────────
function loadSearch(data) {
  if (data && data.interest) {
    document.getElementById('search-interest').value = data.interest;
    doSearch(1);
  } else if (data && data.city) {
    document.getElementById('search-city').value = data.city;
    doSearch(1);
  }
}

function doSearch(page) {
  var interest = document.getElementById('search-interest').value.trim();
  var city = document.getElementById('search-city').value.trim();
  var area = document.getElementById('search-area').value.trim();
  var perPage = 20;

  var params = new URLSearchParams();
  if (interest) params.set('interest', interest);
  if (city) params.set('city', city);
  if (area) params.set('area', area);
  params.set('page', String(page));
  params.set('per_page', String(perPage));

  var resultsEl = document.getElementById('search-results');
  resultsEl.innerHTML = '<div style="color:var(--text-dim); text-align:center; padding:24px;">...</div>';

  apiFetch('/v1/catalogue/directory?' + params.toString())
    .then(function(data) {
      if (!data.ok) throw new Error('Search failed');

      var entries = data.data.entries;
      var facets = data.data.facets;
      var total = data.data.total;
      var totalPages = Math.ceil(total / perPage);

      // Build facets
      var facetHtml = '';
      if (facets.interests.length > 0 || facets.cities.length > 0) {
        facetHtml = '<div class="facets" style="min-width:160px; flex:0 0 auto;">';
        if (facets.interests.length > 0) {
          facetHtml += '<div class="facet-group"><div class="facet-label">' + esc(t('hobbies.search.interests')) + '</div><div class="facet-items">';
          facets.interests.slice(0, 15).forEach(function(i) {
            facetHtml += '<a class="facet-item" onclick="document.getElementById(\'search-interest\').value=\'' + esc(i.name.replace(/'/g, "\\'")) + '\';doSearch(1);">' + esc(i.name) + '<span class="facet-count">(' + i.count + ')</span></a>';
          });
          facetHtml += '</div></div>';
        }
        if (facets.cities.length > 0) {
          facetHtml += '<div class="facet-group"><div class="facet-label">' + esc(t('hobbies.search.cities')) + '</div><div class="facet-items">';

          });
          facetHtml += '</div></div>';
        }
        facetHtml += '</div>';
      }

      // Build entry cards
      var cardsHtml = '';
      if (entries.length > 0) {
        entries.forEach(function(entry) {
          var interestTags = '';
          (entry.interests || []).forEach(function(i) {

            '<span style="font-size:1.5rem;">' + (entry.avatar ? esc(entry.avatar) : '\uD83D\uDE0A') + '</span>' +
            '<div>' +
            '<div class="card-title">' + esc(entry.displayName) + '</div>' +
            (locStr ? '<div class="card-meta">' + esc(locStr) + '</div>' : '') +
            '</div></div>' +
            '<div class="tags">' + interestTags + '</div>' +
            '</a>';
        });
      } else {
        cardsHtml = '<div class="empty-state">' +
          '<div class="empty-icon">\uD83D\uDD0D</div>' +
          '<div class="empty-text">' + esc(t('hobbies.search.noResults')) + ' <a onclick="showView(\'join\')" style="color:var(--accent); cursor:pointer;">' + esc(t('hobbies.search.joinLink')) + '</a>!</div>' +
          '</div>';
      }

      // Pagination
      var paginationHtml = '';
      if (totalPages > 1) {
        paginationHtml = '<div class="pagination">';
        if (page > 1) {
          paginationHtml += '<a onclick="doSearch(' + (page - 1) + ')">' + esc(t('hobbies.search.prev')) + '</a>';
        }
        for (var p = 1; p <= Math.min(totalPages, 5); p++) {
          paginationHtml += '<a onclick="doSearch(' + p + ')" class="' + (p === page ? 'active' : '') + '">' + p + '</a>';
        }
        if (page < totalPages) {
          paginationHtml += '<a onclick="doSearch(' + (page + 1) + ')">' + esc(t('hobbies.search.next')) + '</a>';
        }
        paginationHtml += '</div>';
      }

      // Summary text
      var summaryHtml = total + ' ' + t('hobbies.search.results');
      if (interest) summaryHtml += ' ' + t('hobbies.search.forInterest') + ' "' + esc(interest) + '"';
      if (city) summaryHtml += ' ' + t('hobbies.search.inCity') + ' ' + esc(city);

      resultsEl.innerHTML =
        '<div style="display:flex; gap:24px; flex-wrap:wrap;">' +
        facetHtml +
        '<div style="flex:1; min-width:0;">' +
        '<div style="color:var(--text-dim); font-size:0.85rem; margin-bottom:12px;">' + summaryHtml + '</div>' +
        cardsHtml +
        paginationHtml +
        '</div></div>';
    })
    .catch(function() {
      resultsEl.innerHTML = '<div class="alert alert-error">' + esc(t('hobbies.search.error')) + '</div>';
    });
}

function loadProfile(ghii) {
  var contentEl = document.getElementById('profile-content');
  contentEl.innerHTML = '<div style="color:var(--text-dim); text-align:center; padding:24px;">...</div>';

  // First get directory entry
  apiFetch('/v1/catalogue/directory?per_page=10000')
    .then(function(data) {
      if (!data.ok) throw new Error('Failed');
      var entries = data.data.entries;
      var entry = null;
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].ghii === ghii) { entry = entries[i]; break; }
      }

      if (!entry) {
        contentEl.innerHTML =
          '<div class="empty-state">' +
          '<div class="empty-icon">\uD83D\uDE15</div>' +
          '<div class="empty-text">' + esc(t('hobbies.profile.notFound')) + '</div>' +
          '<a class="btn btn-secondary" style="margin-top:16px;" onclick="showView(\'search\')">' + esc(t('hobbies.profile.backToSearch')) + '</a>' +
          '</div>';
        return;
      }

      // Check flags
      return apiFetch('/v1/flags/summary/agent/' + encodeURIComponent(ghii))
        .then(function(flagData) {
          var isHidden = false;
          if (flagData.ok && flagData.data && (flagData.data.total_flags || 0) >= 5) {
            isHidden = true;
          }

          if (isHidden) {
            contentEl.innerHTML =
              '<div class="empty-state">' +
              '<div class="empty-icon">\uD83D\uDEAB</div>' +
              '<div class="empty-text">' + esc(t('hobbies.profile.hidden')) + '</div>' +
              '<a class="btn btn-secondary" style="margin-top:16px;" onclick="showView(\'search\')">' + esc(t('hobbies.profile.backToSearch')) + '</a>' +
              '</div>';
            return;
          }

          // Render profile
          renderProfile(entry, ghii);
        });
    })
    .catch(function() {
      contentEl.innerHTML = '<div class="alert alert-error">' + esc(t('hobbies.profile.loadError')) + '</div>';
    });
}

function renderProfile(entry, ghii) {
  var contentEl = document.getElementById('profile-content');

  var interestTags = '';
  (entry.interests || []).forEach(function(i) {
    interestTags += '<span class="tag">' + esc(i) + '</span>';
  });

  var locParts = [];
  if (entry.city) locParts.push(entry.city);
  if (entry.area) locParts.push(entry.area);
  if (entry.country) locParts.push(entry.country);
  var locStr = locParts.join(', ');

  var html = '<div class="profile-header">' +
    '<span class="profile-avatar">' + (entry.avatar ? esc(entry.avatar) : '\uD83D\uDE0A') + '</span>' +
    '<div>' +
    '<div class="profile-name">' + esc(entry.displayName) + '</div>' +
    '<div class="profile-ghii">' + esc(ghii) + '</div>' +
    '</div></div>';

  if (entry.bio) {
    html += '<div class="profile-section">' +
      '<div class="profile-section-label">' + esc(t('hobbies.profile.description')) + '</div>' +
      '<div class="profile-bio">' + esc(entry.bio) + '</div></div>';
  }

  html += '<div class="profile-section">' +
    '<div class="profile-section-label">' + esc(t('hobbies.profile.interests')) + '</div>' +
    '<div class="tags">' + interestTags + '</div></div>';

  if (locStr) {
    html += '<div class="profile-section">' +
      '<div class="profile-section-label">' + esc(t('hobbies.profile.location')) + '</div>' +
      '<div class="profile-detail">' + esc(locStr) + '</div></div>';
  }

  // Try to load availability and seeking from GHII
  apiFetch('/v1/ghii/' + encodeURIComponent(ghii))
    .then(function(ghiiData) {
      if (!ghiiData.ok || !ghiiData.data || !ghiiData.data.agents || ghiiData.data.agents.length === 0) return;

      // We need to try loading availability/seeking from memory for the first agent
      var agentGaii = ghiiData.data.agents[0].gaii;
      var username = ghiiData.data.display_name || '';

      // Try to load availability and seeking
      var availPromise = apiFetch('/v1/catalogue/directory?per_page=10000').then(function() { return null; }).catch(function() { return null; });

      // These are stored in memory as profile.<username>.availability and profile.<username>.seeking
      // But memory read requires auth for non-public entries. The directory already has this info embedded.
      // The SSR version reads from memory using storage directly; client-side we show what the directory has.
      return null;
    })
    .catch(function() { /* ignore */ });

  // Flag button for authenticated users
  if (isLoggedIn()) {
    html += '<div style="margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.06);">' +
      '<button onclick="flagProfile(\'' + esc(ghii.replace(/'/g, "\\'")) + '\')" class="btn btn-danger btn-sm">' + esc(t('hobbies.profile.flagBtn')) + '</button>' +
      '<div id="flagResult" style="margin-top:8px;"></div></div>';
  }

  html += '<div style="margin-top:24px;">' +
    '<a class="btn btn-secondary" onclick="showView(\'search\')">' + esc(t('hobbies.profile.backToSearch')) + '</a></div>';

  contentEl.innerHTML = html;
}

function flagProfile(ghii) {
  var reason = prompt(t('hobbies.profile.flagReason'));
  if (!reason) return;
  var validReasons = ['unreliable', 'inappropriate', 'illegal', 'spam', 'other'];
  if (validReasons.indexOf(reason) === -1) reason = 'other';

  var headers = getAuthHeaders();
  if (!headers) return;

  fetch(NODE_URL + '/v1/flags', {
    method: 'POST',
    headers: headers,
    body: JSON.stringify({
      target_type: 'agent',
      target_id: ghii,
      reason: reason
    })
  }).then(function(r) { return r.json(); })
    .then(function(data) {
      var el = document.getElementById('flagResult');
      if (data.ok) {
        el.innerHTML = '<span style="color:var(--success);">' + esc(t('hobbies.profile.flagSent')) + '</span>';
      } else {
        el.innerHTML = '<span style="color:#ef4444;">' + esc(data.error && data.error.message ? data.error.message : t('hobbies.profile.flagError')) + '</span>';
      }
    })
    .catch(function() {
      document.getElementById('flagResult').innerHTML = '<span style="color:#ef4444;">' + esc(t('hobbies.profile.networkError')) + '</span>';
    });
}

function submitJoin(e) {
  e.preventDefault();
  var resultEl = document.getElementById('joinResult');
  resultEl.innerHTML = '<span style="color:var(--text-dim);">' + esc(t('hobbies.join.saving')) + '</span>';

  var interests = document.getElementById('join-interests').value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
  var city = document.getElementById('join-city').value.trim();
  var country = document.getElementById('join-country').value.trim() || 'FI';
  var bio = document.getElementById('join-bio').value.trim();
  var availability = document.getElementById('join-availability').value;
  var seeking = document.getElementById('join-seeking').value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);

  if (interests.length === 0) {
    resultEl.innerHTML = '<span style="color:#ef4444;">' + esc(t('hobbies.join.needInterest')) + '</span>';
    return;
  }
  if (!city) {
    resultEl.innerHTML = '<span style="color:#ef4444;">' + esc(t('hobbies.join.needCity')) + '</span>';
    return;
  }

  var headers = getAuthHeaders();
  if (!headers) return;

  var owner = getAuthInfo().owner;

  var notifyOptIn = document.getElementById('join-notifications').checked;

  // Step 1: Create consent grant
  fetch(NODE_URL + '/v1/consent', {
    method: 'POST',
    headers: headers,
    body: JSON.stringify({
      data_pattern: 'profile.**',
      recipient: '*',
      purpose: 'community-discovery',
      scope: 'federation'
    })
  }).then(function(r) { return r.json(); })
  .then(function() {
    // Step 1b: If match notifications opted in, create that consent too
    if (notifyOptIn) {
      return fetch(NODE_URL + '/v1/consent', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({
          data_pattern: 'profile.' + owner + '.*',
          recipient: '*',
          purpose: 'match-notification',
          scope: 'federation'
        })
      }).then(function(r) { return r.json(); });
    }
  })
  .then(function() {
    // Step 2: Write profile data to memory
    var memPromises = [];

    memPromises.push(fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(owner) + '.interests', {
      method: 'PUT',
      headers: headers,
      body: JSON.stringify({ value: interests, visibility: 'public', tags: ['profile', 'interests'] })
    }));

    memPromises.push(fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(owner) + '.location', {
      method: 'PUT',
      headers: headers,
      body: JSON.stringify({ value: { city: city, country: country }, visibility: 'public', tags: ['profile', 'location'] })
    }));

    if (bio) {
      memPromises.push(fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(owner) + '.bio', {
        method: 'PUT',
        headers: headers,
        body: JSON.stringify({ value: bio, visibility: 'public', tags: ['profile', 'bio'] })
      }));
    }

    if (availability) {
      memPromises.push(fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(owner) + '.availability', {
        method: 'PUT',
        headers: headers,
        body: JSON.stringify({ value: availability, visibility: 'public', tags: ['profile', 'availability'] })
      }));
    }

    if (seeking.length > 0) {
      memPromises.push(fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(owner) + '.seeking', {
        method: 'PUT',
        headers: headers,
        body: JSON.stringify({ value: seeking, visibility: 'public', tags: ['profile', 'seeking'] })
      }));
    }

    return Promise.all(memPromises);
  })
  .then(function(responses) {
    var allOk = responses.every(function(r) { return r.ok || r.status === 200; });
    if (allOk) {
      document.getElementById('joinForm').style.display = 'none';
      document.getElementById('joinSuccess').style.display = 'block';
    } else {
      resultEl.innerHTML = '<span style="color:#ef4444;">' + esc(t('hobbies.join.saveFailed')) + '</span>';
    }
  })
  .catch(function(err) {
    resultEl.innerHTML = '<span style="color:#ef4444;">' + esc(t('hobbies.profile.networkError')) + ' ' + esc(err.message) + '</span>';
  });
}

// MY PROFILE VIEW
// ──────────────────────────────────────────
function loadMe() {
  var contentEl = document.getElementById('me-content');

  if (!isLoggedIn()) {
    contentEl.innerHTML =
      '<div class="empty-state">' +
      '<div class="empty-icon">\uD83D\uDE15</div>' +
      '<div class="empty-text">' + esc(t('hobbies.me.signInRequired')) + ' <a href="/v1/portal/human" style="color:var(--accent);">' + esc(t('hobbies.me.registerFirst')) + '</a></div>' +
      '</div>';
    return;
  }

  contentEl.innerHTML = '<div style="color:var(--text-dim); text-align:center; padding:24px;">...</div>';

  var info = getAuthInfo();
  var headers = getAuthHeaders();

  // Find user's GHII via directory search
  apiFetch('/v1/catalogue/directory?per_page=10000')
    .then(function(data) {
      if (!data.ok) throw new Error('Failed to load directory');

      var entries = data.data.entries;
      var myEntry = null;

      // Find entry by owner name: we need to check GHII records
      // Since we don't know the user's GHII directly, try to find via the GHII endpoint
      return apiFetch('/v1/ghii/list?owner=' + encodeURIComponent(info.owner))
        .then(function(ghiiData) {
          var myGhii = null;
          if (ghiiData.ok && ghiiData.data && ghiiData.data.profiles && ghiiData.data.profiles.length > 0) {
            myGhii = ghiiData.data.profiles[0].ghii;
          }

          if (!myGhii) {
            contentEl.innerHTML =
              '<div class="empty-state">' +
              '<div class="empty-icon">\uD83D\uDE15</div>' +
              '<div class="empty-text">' + esc(t('hobbies.me.noGhii')) + ' <a href="/v1/portal/human" style="color:var(--accent);">' + esc(t('hobbies.me.registerFirst')) + '</a></div>' +
              '</div>';
            return;
          }

          // Find in directory
          for (var i = 0; i < entries.length; i++) {
            if (entries[i].ghii === myGhii) { myEntry = entries[i]; break; }
          }

          if (!myEntry) {
            contentEl.innerHTML =
              '<h1 class="page-title">' + esc(t('hobbies.me.title')) + '</h1>' +
              '<div class="card">' +
              '<p style="color:var(--text-dim);">' + esc(t('hobbies.me.notInDirectory')) + '</p>' +
              '<a class="btn btn-primary" style="margin-top:12px;" onclick="showView(\'join\')">' + esc(t('hobbies.me.joinBtn')) + '</a>' +
              '</div>';
            return;
          }

          // Load availability, seeking, and notification consent from memory
          var availValue = '';
          var seekingValue = [];
          var notifyEnabled = false;
          var username = info.owner;

          var memAvailUrl = '/v1/memory/profile.' + encodeURIComponent(username) + '.availability';
          var memSeekUrl = '/v1/memory/profile.' + encodeURIComponent(username) + '.seeking';

          return Promise.all([
            fetch(NODE_URL + memAvailUrl, { headers: { 'Authorization': 'Bearer ' + info.token } }).then(function(r) { return r.json(); }).catch(function() { return {}; }),
            fetch(NODE_URL + memSeekUrl, { headers: { 'Authorization': 'Bearer ' + info.token } }).then(function(r) { return r.json(); }).catch(function() { return {}; }),
            fetch(NODE_URL + '/v1/consent', { headers: { 'Authorization': 'Bearer ' + info.token } }).then(function(r) { return r.json(); }).catch(function() { return {}; })
          ]).then(function(results) {
            // Parse availability
            if (results[0] && results[0].ok && results[0].data && results[0].data.value != null) {
              var av = results[0].data.value;
              if (typeof av === 'string') availValue = av;
              else if (av && typeof av === 'object' && typeof av.availability === 'string') availValue = av.availability;
            }
            // Parse seeking
            if (results[1] && results[1].ok && results[1].data && results[1].data.value != null) {
              var sk = results[1].data.value;
              if (Array.isArray(sk)) seekingValue = sk;
              else if (sk && typeof sk === 'object' && Array.isArray(sk.items)) seekingValue = sk.items;
            }
            // Check for match-notification consent
            if (results[2] && results[2].ok && results[2].data) {
              var grants = Array.isArray(results[2].data) ? results[2].data : (results[2].data.grants || []);
              for (var g = 0; g < grants.length; g++) {
                if (grants[g].purpose === 'match-notification' && grants[g].status !== 'revoked') {
                  notifyEnabled = true;
                  break;
                }
              }
            }

            renderMyProfile(myEntry, myGhii, availValue, seekingValue, username, notifyEnabled);
          });
        });
    })
    .catch(function() {
      contentEl.innerHTML = '<div class="alert alert-error">' + esc(t('hobbies.me.loadError')) + '</div>';
    });
}

    '<option value="anytime"' + (availability === 'anytime' ? ' selected' : '') + '>' + esc(t('hobbies.join.availAnytime')) + '</option>' +
    '<option value="mornings"' + (availability === 'mornings' ? ' selected' : '') + '>' + esc(t('hobbies.join.availMornings')) + '</option>' +
    '<option value="evenings"' + (availability === 'evenings' ? ' selected' : '') + '>' + esc(t('hobbies.join.availEvenings')) + '</option>' +
    '<option value="weekends"' + (availability === 'weekends' ? ' selected' : '') + '>' + esc(t('hobbies.join.availWeekends')) + '</option>' +
    '<option value="evenings-weekends"' + (availability === 'evenings-weekends' ? ' selected' : '') + '>' + esc(t('hobbies.join.availEveningsWeekends')) + '</option>' +
    '</select></div>';

  html += '<div class="form-group">' +
    '<label class="form-label" for="edit-seeking">' + esc(t('hobbies.join.seeking')) + '</label>' +
    '<input class="form-input" type="text" id="edit-seeking" value="' + esc((seeking || []).join(', ')) + '"></div>';

  html += '<div style="margin-top:8px; margin-bottom:16px;">' +
    '<label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.85rem; color:var(--text-dim);">' +
    '<input type="checkbox" id="edit-notifications"' + (notifyEnabled ? ' checked' : '') + '>' +
    '<span>' + esc(t('hobbies.join.notifications')) + '</span>' +
    '</label>' +
    '<div class="form-hint" style="margin-top:4px;">' + esc(t(notifyEnabled ? 'hobbies.me.notificationsOn' : 'hobbies.me.notificationsOff')) + '</div>' +
    '</div>';

  html += '<button type="submit" class="btn btn-primary">' + esc(t('hobbies.me.saveBtn')) + '</button>' +
    '<div id="editResult" style="margin-top:12px;"></div></form>';

  html += '<div style="margin-top:24px;">' +
    '<a class="btn btn-secondary" onclick="showView(\'profile\', \'' + esc(ghii.replace(/'/g, "\\'")) + '\')">' + esc(t('hobbies.me.viewPublic')) + '</a></div>';

  contentEl.innerHTML = html;
}

function submitEdit(e, username) {
  e.preventDefault();
  var resultEl = document.getElementById('editResult');
  resultEl.innerHTML = '<span style="color:var(--text-dim);">' + esc(t('hobbies.me.saving')) + '</span>';

  var headers = getAuthHeaders();
  if (!headers) return;

  var interests = document.getElementById('edit-interests').value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
  var city = document.getElementById('edit-city').value.trim();
  var country = document.getElementById('edit-country').value.trim() || 'FI';
  var bio = document.getElementById('edit-bio').value.trim();
  var av = document.getElementById('edit-availability').value;
  var sk = document.getElementById('edit-seeking').value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);

  var notifyChecked = document.getElementById('edit-notifications').checked;

  var promises = [];
  promises.push(fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(username) + '.interests', {
    method: 'PUT', headers: headers,
    body: JSON.stringify({ value: interests, visibility: 'public', tags: ['profile', 'interests'] })
  }));
  promises.push(fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(username) + '.location', {
    method: 'PUT', headers: headers,
    body: JSON.stringify({ value: { city: city, country: country }, visibility: 'public', tags: ['profile', 'location'] })
  }));
  promises.push(fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(username) + '.bio', {
    method: 'PUT', headers: headers,
    body: JSON.stringify({ value: bio, visibility: 'public', tags: ['profile', 'bio'] })
  }));
  promises.push(fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(username) + '.availability', {
    method: 'PUT', headers: headers,
    body: JSON.stringify({ value: av, visibility: 'public', tags: ['profile', 'availability'] })
  }));
  promises.push(fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(username) + '.seeking', {
    method: 'PUT', headers: headers,
    body: JSON.stringify({ value: sk, visibility: 'public', tags: ['profile', 'seeking'] })
  }));

  // Handle match-notification consent toggle
  var consentPromise = fetch(NODE_URL + '/v1/consent', { headers: { 'Authorization': headers['Authorization'] } })
    .then(function(r) { return r.json(); })
    .then(function(consentData) {
      var grants = [];
      if (consentData && consentData.ok && consentData.data) {
        grants = Array.isArray(consentData.data) ? consentData.data : (consentData.data.grants || []);
      }
      var existing = null;
      for (var g = 0; g < grants.length; g++) {
        if (grants[g].purpose === 'match-notification' && grants[g].status !== 'revoked') {
          existing = grants[g];
          break;
        }
      }

      if (notifyChecked && !existing) {
        // Create match-notification consent
        return fetch(NODE_URL + '/v1/consent', {
          method: 'POST', headers: headers,
          body: JSON.stringify({
            data_pattern: 'profile.' + username + '.*',
            recipient: '*',
            purpose: 'match-notification',
            scope: 'federation'
          })
        });
      } else if (!notifyChecked && existing) {
        // Revoke match-notification consent
        return fetch(NODE_URL + '/v1/consent/' + existing.id, {
          method: 'DELETE', headers: headers
        });
      }
    });
  promises.push(consentPromise);

  Promise.all(promises).then(function(responses) {
    // Filter out undefined (from consentPromise when no action needed)
    var allOk = responses.every(function(r) { return !r || r.ok; });
    resultEl.innerHTML = allOk
      ? '<span style="color:var(--success);">' + esc(t('hobbies.me.saved')) + '</span>'
      : '<span style="color:#ef4444;">' + esc(t('hobbies.me.saveFailed')) + '</span>';
  }).catch(function(err) {
    resultEl.innerHTML = '<span style="color:#ef4444;">' + esc(t('hobbies.profile.networkError')) + ' ' + esc(err.message) + '</span>';
  });
}

// ──────────────────────────────────────────
// MATCHES VIEW
// ──────────────────────────────────────────
function loadMatches() {
  var contentEl = document.getElementById('matches-content');

  if (!isLoggedIn()) {
    contentEl.innerHTML =
      '<div class="empty-state">' +
      '<div class="empty-icon">\uD83D\uDD12</div>' +
      '<div class="empty-text">' + esc(t('hobbies.matches.loginRequired')) +
      ' <a href="/v1/portal/human" style="color:var(--accent);">' + esc(t('hobbies.join.authLink')) + '</a></div>' +
      '</div>';
    return;
  }

  contentEl.innerHTML = '<div style="color:var(--text-dim); text-align:center; padding:24px;">' + esc(t('hobbies.matches.loading')) + '</div>';

  var info = getAuthInfo();
  var headers = { 'Authorization': 'Bearer ' + info.token };

  // Step 1: Fetch user's own interests
  fetch(NODE_URL + '/v1/memory/profile.' + encodeURIComponent(info.owner) + '.interests', { headers: headers })
    .then(function(r) { return r.json(); })
    .then(function(memData) {
      if (!memData.ok || !memData.data || !memData.data.value) {
        contentEl.innerHTML =
          '<div class="empty-state">' +
          '<div class="empty-icon">\uD83E\uDD37</div>' +
          '<div class="empty-text">' + esc(t('hobbies.matches.noMatches')) +
          ' <a onclick="showView(\'join\')" style="color:var(--accent); cursor:pointer;">' + esc(t('hobbies.joinDirectory')) + '</a></div>' +
          '</div>';
        return;
      }

      var myInterests = memData.data.value;
      if (!Array.isArray(myInterests) || myInterests.length === 0) {
        contentEl.innerHTML =
          '<div class="empty-state">' +
          '<div class="empty-icon">\uD83E\uDD37</div>' +
          '<div class="empty-text">' + esc(t('hobbies.matches.noMatches')) +
          ' <a onclick="showView(\'join\')" style="color:var(--accent); cursor:pointer;">' + esc(t('hobbies.joinDirectory')) + '</a></div>' +
          '</div>';
        return;
      }

      // Step 2: Fetch directory entries for each interest
      var fetches = myInterests.map(function(interest) {
        return apiFetch('/v1/catalogue/directory?interest=' + encodeURIComponent(interest) + '&per_page=200')
          .then(function(data) {
            if (!data.ok) return [];
            return data.data.entries.map(function(entry) {
              return { entry: entry, matchedInterest: interest };
            });
          })
          .catch(function() { return []; });
      });

      return Promise.all(fetches).then(function(results) {
        // Step 3: Merge results into a Map keyed by GHII
        var matchMap = {};
        results.forEach(function(entryList) {
          entryList.forEach(function(item) {
            var ghii = item.entry.ghii;
            if (!matchMap[ghii]) {
              matchMap[ghii] = { entry: item.entry, sharedInterests: [] };
            }
            if (matchMap[ghii].sharedInterests.indexOf(item.matchedInterest) === -1) {
              matchMap[ghii].sharedInterests.push(item.matchedInterest);
            }
          });
        });

        // Step 4: Exclude self — find user's own GHII
        return apiFetch('/v1/ghii/list?owner=' + encodeURIComponent(info.owner))
          .then(function(ghiiData) {
            var myGhii = null;
            if (ghiiData.ok && ghiiData.data && ghiiData.data.profiles && ghiiData.data.profiles.length > 0) {
              myGhii = ghiiData.data.profiles[0].ghii;
            }

            // Remove self from matches
            if (myGhii && matchMap[myGhii]) {
              delete matchMap[myGhii];
            }

            // Step 5: Sort by shared interest count (descending)
            var matches = Object.keys(matchMap).map(function(ghii) {
              return matchMap[ghii];
            });
            matches.sort(function(a, b) { return b.sharedInterests.length - a.sharedInterests.length; });

            // Step 6: Render
            if (matches.length === 0) {
              contentEl.innerHTML =
                '<div class="empty-state">' +
                '<div class="empty-icon">\uD83D\uDE15</div>' +
                '<div class="empty-text">' + esc(t('hobbies.matches.noMatches')) + '</div>' +
                '</div>';
              return;
            }

            var cardsHtml = '';
            matches.forEach(function(match) {
              var entry = match.entry;
              var sharedCount = match.sharedInterests.length;

              var interestTags = '';
              (entry.interests || []).forEach(function(i) {
                var isShared = match.sharedInterests.indexOf(i) !== -1;
                interestTags += '<span class="tag' + (isShared ? ' tag-shared' : '') + '">' + esc(i) + '</span>';
              });

              var locParts = [];
              if (entry.city) locParts.push(entry.city);
              if (entry.area) locParts.push(entry.area);
              var locStr = locParts.join(', ');

              cardsHtml += '<a class="card card-link" onclick="showView(\'profile\', \'' + esc(entry.ghii.replace(/'/g, "\\'")) + '\')">' +
                '<div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">' +
                '<span style="font-size:1.5rem;">' + (entry.avatar ? esc(entry.avatar) : '\uD83D\uDE0A') + '</span>' +
                '<div style="flex:1;">' +
                '<div class="card-title">' + esc(entry.displayName) + '</div>' +
                (locStr ? '<div class="card-meta">' + esc(locStr) + '</div>' : '') +
                '</div>' +
                '<div style="text-align:right;">' +
                '<span class="tag tag-shared" style="font-weight:600;">' + sharedCount + ' ' + esc(t('hobbies.matches.shared')) + '</span>' +
                '</div>' +
                '</div>' +
                '<div class="tags">' + interestTags + '</div>' +
                '</a>';
            });

            contentEl.innerHTML = cardsHtml;
          });
      });
    })
    .catch(function() {
      contentEl.innerHTML = '<div class="alert alert-error">' + esc(t('hobbies.loadError')) + '</div>';
    });
}

// ──────────────────────────────────────────
// AUTH SETUP
// ──────────────────────────────────────────
function updateAuthUI() {
  var matchesLink = document.querySelector('.matches-link');
  if (matchesLink) {
    matchesLink.style.display = isLoggedIn() ? '' : 'none';
  }
}

var auth = window.AIMEAT && window.AIMEAT.auth;
if (auth) {
  auth.login().then(function(s) {
    if (s) session = s;
    updateAuthUI();
  }).catch(function() {
    updateAuthUI();
  });
} else {
  updateAuthUI();
}

// ──────────────────────────────────────────
// INIT
// ──────────────────────────────────────────
applyTranslations();

// Handle hash routing
function handleRoute() {
  var hash = window.location.hash.replace('#', '');
  if (hash === 'search') showView('search');
  else if (hash === 'join') showView('join');
  else if (hash === 'me') showView('me');
  else if (hash === 'matches') showView('matches');
  else if (hash.indexOf('profile/') === 0) showView('profile', decodeURIComponent(hash.substring(8)));
  else showView('home');
}

// Update hash on navigation
var _origShowView = showView;
showView = function(name, data) {
  if (name === 'home') window.location.hash = '';
  else if (name === 'search' && !data) window.location.hash = 'search';
  else if (name === 'search' && data) {
    window.location.hash = 'search';
  }
  else if (name === 'profile' && typeof data === 'string') window.location.hash = 'profile/' + encodeURIComponent(data);
  else if (name === 'join') window.location.hash = 'join';
  else if (name === 'me') window.location.hash = 'me';
  else if (name === 'matches') window.location.hash = 'matches';
  _origShowView(name, data);
};

window.addEventListener('hashchange', handleRoute);

// Also handle Enter key in search fields
document.getElementById('search-interest').addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(1); } });
document.getElementById('search-city').addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(1); } });
document.getElementById('search-area').addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(1); } });

// Initial route
handleRoute();
</script>

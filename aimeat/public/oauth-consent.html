<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authorize — AIMEAT</title>
  <style>
    :root { --bg:#0d0d12; --card:#16161f; --border:#2a2a3a; --text:#e8e8f0;
      --muted:#8888aa; --accent:#a78bfa; --success:#4ade80; --danger:#ff6b6b;
      --love1:#E8564A; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .consent-card { background:var(--card); border:1px solid var(--border); border-radius:1rem;
      padding:2rem; max-width:480px; width:100%; }
    h1 { font-size:1.4rem; margin-bottom:.5rem; }
    .subtitle { color:var(--muted); font-size:.9rem; margin-bottom:1.5rem; }
    .platform-badge { background:rgba(130,100,255,.1); border:1px solid rgba(130,100,255,.3);
      border-radius:.5rem; padding:.75rem 1rem; margin-bottom:1.5rem; font-size:.9rem; }
    .platform-name { font-weight:700; color:var(--accent); }
    label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:.25rem; }
    input, select { width:100%; padding:.6rem .75rem; background:var(--bg); border:1px solid var(--border);
      border-radius:.5rem; color:var(--text); font-size:.9rem; margin-bottom:.75rem; }
    input:focus, select:focus { outline:none; border-color:var(--accent); }
    .agent-option { display:flex; justify-content:space-between; align-items:center; padding:.6rem .75rem;
      background:rgba(255,255,255,.03); border:1px solid transparent; border-radius:.5rem;
      margin-bottom:.4rem; cursor:pointer; transition:border-color .15s; }
    .agent-option:hover { border-color:var(--border); }
    .agent-option.selected { background:rgba(130,100,255,.12); border-color:rgba(130,100,255,.3); }
    .agent-name { font-weight:600; }
    .agent-gaii { font-size:.75rem; color:var(--muted); font-family:monospace; }
    .agent-balance { font-size:.8rem; color:var(--muted); }
    .scope-list { background:rgba(255,255,255,.03); border-radius:.5rem; padding:.75rem 1rem;
      margin:.75rem 0; font-size:.85rem; }
    .wallet-note { background:rgba(255,180,0,.08); border:1px solid rgba(255,180,0,.25);
      border-radius:.5rem; padding:.6rem .75rem; font-size:.82rem; margin-bottom:1rem; color:var(--muted); }
    .btn-row { display:flex; gap:.75rem; margin-top:1.25rem; }
    .btn { flex:1; padding:.65rem 1rem; border:none; border-radius:.5rem; font-size:.9rem;
      font-weight:600; cursor:pointer; transition:opacity .15s; }
    .btn:hover { opacity:.85; }
    .btn-approve { background:var(--success); color:#000; }
    .btn-deny { background:transparent; border:1px solid var(--border); color:var(--muted); }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .error-msg { color:var(--danger); font-size:.85rem; margin-top:.5rem; min-height:1.2em; }
    .create-agent-row { display:flex; align-items:center; gap:.5rem; padding:.5rem .75rem;
      margin-bottom:.4rem; cursor:pointer; border:1px dashed var(--border); border-radius:.5rem;
      color:var(--accent); font-size:.85rem; transition:border-color .15s; }
    .create-agent-row:hover { border-color:var(--accent); }
    .create-agent-form { padding:.6rem .75rem; background:rgba(130,100,255,.06);
      border:1px solid rgba(130,100,255,.2); border-radius:.5rem; margin-bottom:.4rem; }
    .create-agent-form input { margin-bottom:.4rem; }
    .create-agent-form .btn-row { margin-top:.5rem; }
    .btn-sm { padding:.4rem .75rem; border:none; border-radius:.35rem; font-size:.8rem;
      font-weight:600; cursor:pointer; }
    .btn-sm-accent { background:var(--accent); color:#000; }
    .btn-sm-muted { background:transparent; border:1px solid var(--border); color:var(--muted); }
  </style>
</head>
<body>
  <div class="consent-card" id="app">
    <div id="loading" style="text-align:center;padding:2rem;color:var(--muted)">Loading...</div>
  </div>

  <script type="module">
    // XSS-safe HTML escape
    const escHtml = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    // Parse URL params
    const params = new URLSearchParams(location.search);
    const clientId = params.get('client_id') || '';
    const clientName = params.get('client_name') || clientId;
    const redirectUri = params.get('redirect_uri') || '';
    const state = params.get('state') || '';
    const codeChallenge = params.get('code_challenge') || '';

    // i18n
    const lang = (navigator.language || 'en').startsWith('fi') ? 'fi' : 'en';
    let T = {};
    try {
      const resp = await fetch(`/locales/${lang}.json`);
      const all = await resp.json();
      T = all.oauthConsent || {};
    } catch {}
    const t = (key) => T[key] || key;

    const app = document.getElementById('app');

    if (!clientId) {
      app.innerHTML = '<h1>Error</h1><p>Missing client_id parameter.</p>';
    }

    let session = null;
    let agents = [];
    let selectedAgent = null;

    // session.owner may be a string or { name: string } depending on the endpoint
    const getOwnerName = () => {
      const o = session?.owner;
      return typeof o === 'string' ? o : o?.name || session?.username || '';
    };

    // Restore an existing browser session from the httpOnly refresh cookie.
    // POST /v1/auth/refresh is the session-restore endpoint (GET /v1/auth/session is the
    // unrelated legacy challenge flow and always 400s here, which forced a re-login).
    async function checkSession() {
      try {
        const r = await fetch('/v1/auth/refresh', {
          method: 'POST',
          credentials: 'include',
          headers: { 'X-AIMEAT-Refresh': '1' },
        });
        const d = await r.json();
        const jwt = d.ok && d.data?.token;
        if (!jwt) return null;
        // Owner name lives in the JWT payload; decode it client-side.
        const payload = JSON.parse(atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        if (!payload.owner) return null;
        return { jwt, owner: payload.owner };
      } catch {}
      return null;
    }

    async function doLogin(username, password, totp) {
      const body = { username, password };
      if (totp) body.totp_code = totp;
      const r = await fetch('/v1/ghii/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error?.message || 'Login failed');
      return d.data;
    }

    async function fetchAgents(ownerName, jwt) {
      const r = await fetch(`/v1/agents?owner=${encodeURIComponent(ownerName)}`, {
        headers: { Authorization: 'Bearer ' + jwt },
      });
      const d = await r.json();
      if (!d.ok) return [];
      return d.data?.agents || d.data || [];
    }

    async function createAgent(name, displayName, jwt, ownerName) {
      const r = await fetch('/v1/agents', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + jwt },
        body: JSON.stringify({ name, owner: ownerName, display_name: displayName || name }),
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error?.message || 'Failed to create agent');
      return d.data?.agent;
    }

    function deny() {
      if (redirectUri) {
        const url = new URL(redirectUri);
        url.searchParams.set('error', 'access_denied');
        url.searchParams.set('error_description', 'User denied the request');
        if (state) url.searchParams.set('state', state);
        location.href = url.toString();
      } else {
        app.innerHTML = '<h1>' + escHtml(t('denied')) + '</h1>';
      }
    }

    function renderLogin() {
      app.innerHTML = `
        <h1>${escHtml(t('title'))}</h1>
        <p class="subtitle">${escHtml(t('subtitle'))}</p>
        <div class="platform-badge">
          ${escHtml(t('platformLabel'))} <span class="platform-name">${escHtml(clientName)}</span>
        </div>
        <div class="scope-list">
          <strong>${escHtml(t('scopeLabel'))}</strong><br/>
          ${escHtml(t('scopeFull'))}
        </div>
        <p style="margin-bottom:1rem;font-size:.9rem">${escHtml(t('loginRequired'))}</p>
        <form id="loginForm">
          <label>${escHtml(t('usernameLabel'))}</label>
          <input type="text" id="username" required autocomplete="username" />
          <label>${escHtml(t('passwordLabel'))}</label>
          <input type="password" id="password" required autocomplete="current-password" />
          <label>${escHtml(t('totpLabel'))}</label>
          <input type="text" id="totp" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" />
          <div id="loginError" class="error-msg"></div>
          <div class="btn-row">
            <button type="button" class="btn btn-deny" id="denyBtn">${escHtml(t('denyBtn'))}</button>
            <button type="submit" class="btn btn-approve">${escHtml(t('loginBtn'))}</button>
          </div>
        </form>
      `;
      document.getElementById('denyBtn').addEventListener('click', deny);
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('loginError');
        errEl.textContent = '';
        try {
          const data = await doLogin(
            document.getElementById('username').value.trim(),
            document.getElementById('password').value,
            document.getElementById('totp').value.trim() || undefined,
          );
          session = data;
          const loginOwner = typeof data.owner === 'string' ? data.owner : data.owner?.name || data.username;
          agents = await fetchAgents(loginOwner, data.jwt || data.token);
          renderApproval();
        } catch (err) {
          errEl.textContent = err.message;
        }
      });
    }

    function renderCreateForm(container, onCreated) {
      container.innerHTML = `
        <div class="create-agent-form">
          <label>${escHtml(t('newAgentName'))}</label>
          <input type="text" id="newAgentName" placeholder="e.g. claude-mcp" minlength="3" maxlength="64" required />
          <label>${escHtml(t('newAgentDisplayName'))}</label>
          <input type="text" id="newAgentDisplayName" placeholder="${escHtml(t('newAgentDisplayNameHint'))}" />
          <div id="createError" class="error-msg"></div>
          <div class="btn-row" style="margin-top:.5rem">
            <button type="button" class="btn-sm btn-sm-muted" id="cancelCreate">${escHtml(t('cancelBtn'))}</button>
            <button type="button" class="btn-sm btn-sm-accent" id="confirmCreate">${escHtml(t('createBtn'))}</button>
          </div>
        </div>
      `;
      document.getElementById('cancelCreate').addEventListener('click', () => renderApproval());
      document.getElementById('confirmCreate').addEventListener('click', async () => {
        const nameVal = document.getElementById('newAgentName').value.trim().toLowerCase();
        const displayVal = document.getElementById('newAgentDisplayName').value.trim();
        const errEl = document.getElementById('createError');
        errEl.textContent = '';
        if (!nameVal || nameVal.length < 3 || !/^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$/.test(nameVal)) {
          errEl.textContent = t('newAgentNameError');
          return;
        }
        const btn = document.getElementById('confirmCreate');
        btn.disabled = true;
        btn.textContent = '...';
        try {
          const jwt = session.jwt || session.token;
          const ownerName = getOwnerName();
          const newAgent = await createAgent(nameVal, displayVal || nameVal, jwt, ownerName);
          agents = await fetchAgents(ownerName, jwt);
          onCreated(newAgent);
        } catch (err) {
          errEl.textContent = err.message;
          btn.disabled = false;
          btn.textContent = t('createBtn');
        }
      });
    }

    function renderApproval() {
      if (agents.length === 0) {
        app.innerHTML = `
          <h1>${escHtml(t('title'))}</h1>
          <p class="subtitle">${escHtml(t('noAgentsCreate'))}</p>
          <div id="createContainer"></div>
          <div class="btn-row" style="margin-top:1rem">
            <button class="btn btn-deny" id="denyBtn">${escHtml(t('denyBtn'))}</button>
          </div>
        `;
        document.getElementById('denyBtn').addEventListener('click', deny);
        renderCreateForm(document.getElementById('createContainer'), () => renderApproval());
        return;
      }

      // Keep previous selection if valid, otherwise default to first
      const prevGaii = selectedAgent?.gaii;
      const prevIdx = prevGaii ? agents.findIndex(a => a.gaii === prevGaii) : -1;
      const selIdx = prevIdx >= 0 ? prevIdx : 0;
      selectedAgent = agents[selIdx];

      const agentListHtml = agents.map((a, i) => `
        <div class="agent-option ${i === selIdx ? 'selected' : ''}" data-idx="${i}">
          <div>
            <div class="agent-name">${escHtml(a.displayName || a.name)}</div>
            <div class="agent-gaii">${escHtml(a.gaii)}</div>
          </div>
          <div class="agent-balance">${escHtml(a.morselBalance || 0)} ${escHtml(t('morsels'))}</div>
        </div>
      `).join('');

      app.innerHTML = `
        <h1>${escHtml(t('title'))}</h1>
        <p class="subtitle">${escHtml(t('subtitle'))}</p>
        <div class="platform-badge">
          ${escHtml(t('platformLabel'))} <span class="platform-name">${escHtml(clientName)}</span>
        </div>
        <p style="font-size:.9rem;margin-bottom:.5rem;font-weight:600">${escHtml(t('selectAgent'))}</p>
        <div id="agentList">${agentListHtml}</div>
        <div class="create-agent-row" id="showCreateBtn">+ ${escHtml(t('createNewAgent'))}</div>
        <div id="inlineCreateContainer" style="display:none"></div>
        <div class="scope-list">
          <strong>${escHtml(t('scopeLabel'))}</strong><br/>
          ${escHtml(t('scopeFull'))}
        </div>
        <div class="wallet-note">${escHtml(t('walletNote'))}</div>
        <div id="approveError" class="error-msg"></div>
        <div class="btn-row">
          <button class="btn btn-deny" id="denyBtn">${escHtml(t('denyBtn'))}</button>
          <button class="btn btn-approve" id="approveBtn">${escHtml(t('approveBtn'))}</button>
        </div>
      `;

      // Agent selection
      document.querySelectorAll('.agent-option').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.agent-option').forEach(e => e.classList.remove('selected'));
          el.classList.add('selected');
          selectedAgent = agents[parseInt(el.dataset.idx)];
        });
      });

      document.getElementById('showCreateBtn').addEventListener('click', () => {
        document.getElementById('showCreateBtn').style.display = 'none';
        const container = document.getElementById('inlineCreateContainer');
        container.style.display = 'block';
        renderCreateForm(container, (newAgent) => {
          // Re-render with new agent auto-selected
          selectedAgent = agents.find(a => a.gaii === newAgent?.gaii) || agents[agents.length - 1];
          renderApproval();
        });
      });

      document.getElementById('denyBtn').addEventListener('click', deny);
      document.getElementById('approveBtn').addEventListener('click', async () => {
        const btn = document.getElementById('approveBtn');
        const errEl = document.getElementById('approveError');
        btn.disabled = true;
        btn.textContent = t('approving');
        errEl.textContent = '';
        try {
          const jwt = session.jwt || session.token;
          const r = await fetch('/v1/mcp/authorize-consent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              client_id: clientId,
              client_name: clientName || undefined,
              redirect_uri: redirectUri,
              state,
              gaii: selectedAgent.gaii,
              owner_token: jwt,
              code_challenge: codeChallenge || undefined,
            }),
          });
          const d = await r.json();
          if (d.redirect_url) {
            location.href = d.redirect_url;
          } else if (d.code) {
            // Fallback: manual redirect construction
            if (redirectUri) {
              const url = new URL(redirectUri);
              url.searchParams.set('code', d.code);
              if (d.state) url.searchParams.set('state', d.state);
              location.href = url.toString();
            } else {
              const code = escHtml(d.code);
              app.innerHTML = `
                <h1>${escHtml(t('doneTitle'))}</h1>
                <p style="margin-bottom:.5rem;font-size:.9rem">${escHtml(t('authCodeLabel'))}</p>
                <div style="display:flex;align-items:center;gap:.5rem;background:var(--bg);border:1px solid var(--border);border-radius:.5rem;padding:.6rem .75rem;margin-bottom:1rem;font-family:monospace;font-size:.8rem;word-break:break-all">
                  <span style="flex:1" id="codeValue">${code}</span>
                  <button id="copyBtn" class="btn-sm btn-sm-accent" style="white-space:nowrap">${escHtml(t('copyBtn'))}</button>
                </div>
                <p style="color:var(--muted);font-size:.82rem">${escHtml(t('authCodeHint'))}</p>
              `;
              document.getElementById('copyBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(d.code).then(() => {
                  const btn = document.getElementById('copyBtn');
                  btn.textContent = t('copiedBtn');
                  btn.style.background = 'var(--success)';
                  setTimeout(() => { btn.textContent = t('copyBtn'); btn.style.background = ''; }, 2000);
                });
              });
            }
          } else {
            // d.error may be an OAuth string ("invalid_request") OR an AIMEAT
            // envelope object ({code,message}); never stringify the object as
            // "[object Object]" — surface the real message.
            const msg = d.error_description
              || (typeof d.error === 'string' ? d.error : d.error && d.error.message)
              || t('errorGeneric');
            throw new Error(msg);
          }
        } catch (err) {
          errEl.textContent = err.message;
          btn.disabled = false;
          btn.textContent = t('approveBtn');
        }
      });
    }

    // Boot
    session = await checkSession();
    if (session) {
      const ownerName = getOwnerName();
      const jwt = session.jwt || session.token;
      agents = await fetchAgents(ownerName, jwt);
      renderApproval();
    } else {
      renderLogin();
    }
  </script>
</body>
</html>

# AIMEAT-boosted OpenHands. `docker compose up -d` after ./scripts/setup.sh.
# Persistent state (settings, skills, MCP) lives in the host ~/.openhands volume, so config
# survives restarts and rebuilds. Secrets come from .env — never hard-code them here.

services:
  openhands:
    image: docker.openhands.dev/openhands/openhands:1.8
    pull_policy: always
    container_name: aimeat-openhands
    ports:
      # Host bind for the UI. Default publishes on all interfaces :3000 (fine for local dev).
      # On a shared/prod host set OPENHANDS_PORT_BIND in .env to bind localhost-only on a
      # non-default port, e.g. OPENHANDS_PORT_BIND=127.0.0.1:13781, and reach it via an SSH
      # tunnel. The container port is always 3000; PERMITTED_CORS_ORIGINS must match the origin
      # you browse to.
      - "${OPENHANDS_PORT_BIND:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The agent RUNTIME image the app spawns. We point it at a CUSTOM image that bakes the
      # aimeat-app-builder skill into /home/openhands/.openhands/skills (built by
      # scripts/build-runtime.sh). This is the mechanism that works: the runtime container is
      # separate from this app container and does NOT see its ~/.openhands, and bind-mounting a
      # host dir into the runtime HOME breaks its permission setup — so the skill must live in
      # the runtime image itself. The app uses a locally-built image as-is (it only pulls when
      # the image is absent), so no registry push is needed.
      - AGENT_SERVER_IMAGE_REPOSITORY=${AGENT_SERVER_IMAGE_REPOSITORY:-aimeat/agent-server}
      - AGENT_SERVER_IMAGE_TAG=${AGENT_SERVER_IMAGE_TAG:-1.26.0-python}
      - LOG_ALL_EVENTS=true
      # LLM: Kimi K2.7 Code via OpenRouter (the documented GUI env path).
      - LLM_MODEL=${LLM_MODEL:-openrouter/moonshotai/kimi-k2.7-code}
      - LLM_API_KEY=${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      # Allow the browser origins that reach this UI. Add the host IP for LAN access (an
      # IP-based origin otherwise fails CORS). Comma-separated.
      - PERMITTED_CORS_ORIGINS=${PERMITTED_CORS_ORIGINS:-http://localhost:3000}
      # Public hostname (no scheme). If set, the app self-links + spawned runtime containers
      # reach the default MCP proxy via https://<WEB_HOST>/mcp/mcp instead of the fallback
      # http://host.docker.internal:3000/mcp/mcp — which fails whenever the app is bound
      # to a non-3000 host port (spawned runtime containers cannot reach it). Leave empty
      # for pure-local dev on :3000; set to your public domain in prod (e.g. openhands.example.com).
      - WEB_HOST=${WEB_HOST:-}
      # Internal loopback for the app's own MCP proxy calls. Keeps the default MCP resolvable
      # inside the app container regardless of the host port bind.
      - SANDBOX_LOCAL_RUNTIME_URL=${SANDBOX_LOCAL_RUNTIME_URL:-http://127.0.0.1:3000}
      # Browser-facing URL pattern for spawned runtime containers. Required when the app
      # is behind a reverse proxy — without it the browser gets a naked host_port URL like
      # https://openhands.example.com:56743 which is not reachable through the proxy.
      # Only meaningful in bridge network mode (the default).
      - SANDBOX_CONTAINER_URL_PATTERN=${SANDBOX_CONTAINER_URL_PATTERN:-http://localhost:{port}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent OpenHands state (settings.json, openhands.db, user microagents live here).
      # MUST mount at /root/.openhands — the container runs as root, and the app looks for
      # user skills at `Path.home() / '.openhands' / 'microagents'` (== /root/.openhands/microagents).
      # A previous version mounted at /.openhands, which the app never reads. See
      # scripts/postup.sh for the matching user-microagent install.
      - ${HOME}/.openhands:/root/.openhands
      # Preconfigured MCP + LLM + pruning for the CLI/core path. render-config.sh produces
      # this file with the real token/key. Harmless if the GUI ignores it (MCP also lives
      # in the mounted ~/.openhands once added).
      - ./config.toml:/app/config.toml:ro
    restart: unless-stopped

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: aimeat_kysely_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: aimeat
        run: pnpm lint

      - name: Type check
        working-directory: aimeat
        run: pnpm typecheck

      - name: Type check (frontend — checkJs over public/)
        working-directory: aimeat
        run: pnpm typecheck:frontend

      - name: Importmap consistency (spa.html ↔ absolute imports)
        working-directory: aimeat
        run: pnpm check:importmap

      - name: No max_tokens caps on AI calls
        working-directory: aimeat
        run: pnpm check:no-max-tokens

      - name: app-catalog.html in sync with its sources
        working-directory: aimeat
        run: pnpm check:app-catalog

      - name: MCP tool surface/handler parity (check:mcp-tools)
        working-directory: aimeat
        run: pnpm check:mcp-tools

      - name: Unit tests (vitest)
        working-directory: aimeat
        run: pnpm test

      - name: Build
        working-directory: aimeat
        run: pnpm build

      - name: Prepare E2E env files (from committed examples)
        working-directory: aimeat
        run: |
          cp .env.test.sqlite.example .env.test.sqlite
          cp .env.test.postgres-kysely.example .env.test.postgres-kysely

      - name: E2E tests (SQLite)
        continue-on-error: true
        working-directory: aimeat
        run: pnpm test:e2e:sqlite

      - name: E2E tests (PostgreSQL + Kysely — primary backend)
        continue-on-error: true
        working-directory: aimeat
        run: pnpm test:e2e:postgres-kysely

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: aimeat_kysely_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: aimeat
        run: pnpm lint

      - name: Type check
        working-directory: aimeat
        run: pnpm typecheck

      - name: Type check (frontend — checkJs over public/)
        working-directory: aimeat
        run: pnpm typecheck:frontend

      - name: Type check (SDK libs — checkJs over src/static/sdk-libs/)
        working-directory: aimeat
        run: pnpm typecheck:sdk

      - name: Importmap consistency (spa.html ↔ absolute imports)
        working-directory: aimeat
        run: pnpm check:importmap

      - name: Every profile tab reachable from the menu
        working-directory: aimeat
        run: pnpm check:profile-tabs

      - name: Config coverage (every setting reachable in the admin Config tab)
        working-directory: aimeat
        run: pnpm check:config-coverage

      - name: No max_tokens caps on AI calls
        working-directory: aimeat
        run: pnpm check:no-max-tokens

      - name: Vendored /lib assets present and hash-verified (fetched, not committed)
        working-directory: aimeat
        run: pnpm check:vendored

      - name: Library-pack doc-truth (assets exist + ai_doc claims executed)
        working-directory: aimeat
        run: pnpm check:packs-doc

      - name: openapi.yaml parses + every $ref resolves (Rule 3 contract health)
        working-directory: aimeat
        run: pnpm check:openapi

      - name: app-catalog.html in sync with its sources
        working-directory: aimeat
        run: pnpm check:app-catalog

      - name: SDK-libs dist bundles in sync with their sources
        working-directory: aimeat
        run: pnpm check:sdk

      - name: No silent exception handlers in the cleaned areas (check:silent-catch)
        working-directory: .
        run: pnpm check:silent-catch -- --strict

      - name: MCP tool surface/handler parity (check:mcp-tools)
        working-directory: aimeat
        run: pnpm check:mcp-tools

      - name: MCP tool input-schema parity (check:mcp-schemas)
        working-directory: aimeat
        run: pnpm check:mcp-schemas

      - name: Plain language for the messages a person hears (check:plain-language)
        working-directory: aimeat
        run: pnpm check:plain-language

      - name: Cortex pack integrity (embedded viewport + VERSION constants)
        working-directory: aimeat
        run: pnpm check:viewport

      # TARGET-058: one LLM path, one publish path, every label still where it has to be.
      - name: AI disclosure gates (check:ai-disclosure)
        working-directory: aimeat
        run: pnpm check:ai-disclosure

      # Three language files now, so "they change together" cannot rest on a person seeing both.
      - name: Language files agree with en.json (check:locales)
        working-directory: aimeat
        run: pnpm check:locales

      # The August 2026 audit gates. Each is a ratchet seeded with that day's count, so it fails only
      # on a NEW offender: route authorization, outbound fetch through safeFetch, server-trusted
      # memory keys, owner-scoped tables in both deletion cascades, and every sandbox entry point
      # taking its capability object from the shared builder. They went into the pre-commit hook
      # first, which `--no-verify` walks straight past; this is the copy that guards the branch.
      - name: Security ratchets (check:audit-gates)
        working-directory: aimeat
        run: pnpm check:audit-gates

      - name: Unit tests (vitest)
        working-directory: aimeat
        run: pnpm test

      - name: Build
        working-directory: aimeat
        run: pnpm build

      - name: Prepare E2E env files (from committed examples)
        working-directory: aimeat
        run: |
          cp .env.test.sqlite.example .env.test.sqlite
          cp .env.test.postgres-kysely.example .env.test.postgres-kysely

      # THE GUARD TIER BLOCKS. Twelve suites, chosen on one question: does a failure here mean a
      # principal can reach money, an identity, or another account's data that they must not? The
      # list and the reason for each entry are in test/run-e2e-ci.ts (GUARD_SUITES). 323 assertions,
      # under half a minute per backend, no continue-on-error — a red run here is a hole, and merging
      # on top of it is the thing this repo spent August discovering it had been doing.
      - name: E2E guard tier (SQLite) — blocking
        working-directory: aimeat
        run: pnpm test:e2e:guards:sqlite

      - name: E2E guard tier (PostgreSQL + Kysely — primary backend) — blocking
        working-directory: aimeat
        run: pnpm test:e2e:guards:postgres-kysely

      # The full sweep stays advisory, deliberately and not by neglect: it takes about two hours, and
      # the runner's database cleanup can hand one suite the previous one's data when a server
      # shutdown slips past its fixed wait (docs/pitfalls.md §18), which produces hundreds of
      # unrelated 403s. A gate that is slow and occasionally wrong gets switched off within a week, so
      # it reports instead — and the way OUT of advisory is to move a suite up into the guard tier.
      - name: E2E tests (SQLite) — full sweep, advisory
        continue-on-error: true
        working-directory: aimeat
        run: pnpm test:e2e:sqlite

      - name: E2E tests (PostgreSQL + Kysely — primary backend) — full sweep, advisory
        continue-on-error: true
        working-directory: aimeat
        run: pnpm test:e2e:postgres-kysely

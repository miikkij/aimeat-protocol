name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repo (checkout, build, test).
permissions:
  contents: read

# FOUR JOBS, SIDE BY SIDE. Until 2026-09-05 this was one job that ran everything in a row and took
# 82 minutes, most of it the two full E2E sweeps, which were advisory (continue-on-error) and so
# decided nothing while deciding the wall clock. The sweeps now run nightly and on demand in
# e2e-full.yml, with an issue opened when one is red; what a push waits for is the four things that
# block a merge, each in its own job so the clock is the longest of them rather than their sum, and
# so a red run names itself in the job list.
jobs:
  # The static gates: what the pre-commit hook runs, uncached and over the whole tree. The hook
  # exists to fail fast on a developer's machine; `--no-verify` walks straight past it, and this is
  # the copy that guards the branch.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: aimeat
        run: pnpm lint

      - name: Type check
        working-directory: aimeat
        run: pnpm typecheck

      - name: Type check (frontend — checkJs over public/)
        working-directory: aimeat
        run: pnpm typecheck:frontend

      - name: Type check (SDK libs — checkJs over src/static/sdk-libs/)
        working-directory: aimeat
        run: pnpm typecheck:sdk

      - name: Vendored /lib assets present and hash-verified (fetched, not committed)
        working-directory: aimeat
        run: pnpm check:vendored

      # The whole tree, which the hook no longer does: there it lints only the staged files, because
      # a new silent handler can only be in a file the commit touches. Here every file is on trial.
      - name: No silent exception handlers in the cleaned areas (check:silent-catch, whole tree)
        working-directory: .
        run: pnpm check:silent-catch -- --strict

      # Thirty-odd read-only checks, four at a time: importmap, profile tabs, crew definitions,
      # config coverage, openapi, the catalogue and SDK builds, MCP tool and schema parity, plain
      # language, cortex packs, AI disclosure, locales, licences and notices, protocol versions, and
      # the August 2026 audit ratchets (route scopes, denial coverage, outbound fetch, trusted keys,
      # storage parity, sandbox entry points, shared implementation, surface focus, dependency
      # cruiser, SSE parity, copied logic, doc counts, scope parity, the liaison surface). Each is a
      # ratchet seeded with its day's count, so it fails only on a NEW offender. `pnpm check:fast
      # --list` prints the set; a red one prints its own output whole.
      - name: The read-only gates, four at a time (check:fast)
        working-directory: aimeat
        run: pnpm check:fast

      # The five gates that read the compiler's own program — runtime read targets, identity
      # resolution, owner-principal refusals, federation write signatures, credential-free write
      # doors — on one program built once. All five run before any of them exits.
      - name: The five program-reading gates (check:invariants)
        working-directory: aimeat
        run: pnpm check:invariants

      - name: Build
        working-directory: aimeat
        run: pnpm build

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      # The whole suite. The hook runs only the files reachable from what changed (vitest --changed);
      # the pre-push hook and this job run all of it.
      - name: Unit tests (vitest)
        working-directory: aimeat
        run: pnpm test

  # THE GUARD TIER BLOCKS. 64 suites, chosen on one question: does a failure here mean a
  # principal can reach money, an identity, or another account's data that they must not? The
  # list and the reason for each entry are in test/run-e2e-ci.ts (GUARD_SUITES). The runner
  # prints the assertion total and runs the tier over four lanes — four nodes at once, each suite
  # still alone on an empty database — which is what brought a backend from six minutes to under
  # two. It was 20 suites and under a minute until the 44 promoted on 2026-09-04, each one earned
  # by running it alone on a freshly deleted database, three consecutive identical green runs on
  # BOTH backends.
  # The total itself is deliberately NOT written down here or in CLAUDE.md. check:doc-counts
  # holds the suite COUNT against GUARD_SUITES.length, and nothing can hold a total that changes
  # every time somebody adds an assertion to a guard suite — which this repo asks people to do
  # freely. It was written down for one day, 2026-09-04, and needed correcting twice within it.
  # No continue-on-error — a red run here is a hole, and merging
  # on top of it is the thing this repo spent August discovering it had been doing.
  guards-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Prepare E2E env file (from the committed example)
        working-directory: aimeat
        run: cp .env.test.sqlite.example .env.test.sqlite

      - name: E2E guard tier (SQLite) — blocking
        working-directory: aimeat
        run: pnpm test:e2e:guards:sqlite

  guards-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: aimeat_kysely_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Prepare E2E env file (from the committed example)
        working-directory: aimeat
        run: cp .env.test.postgres-kysely.example .env.test.postgres-kysely

      # The runner's lanes 1–3 each create a sibling database (aimeat_kysely_e2e_w1 …) beside the
      # service's; POSTGRES_USER is the superuser here, so CREATE DATABASE is allowed.
      - name: E2E guard tier (PostgreSQL + Kysely — primary backend) — blocking
        working-directory: aimeat
        run: pnpm test:e2e:guards:postgres-kysely

# Proves the desktop app still compiles and its own tests still pass, on every change that can
# reach it.
#
# This closes the gap the state analysis of 2026-09-18 measured: the installer was built only from
# a `desktop-v*` tag, so between 2026-08-31 and 2026-09-18 the repository took 925 commits with
# nothing checking that the desktop app still built against any of them. A tag-only build finds
# that out at release time, which is the worst moment to learn it.
#
# It is deliberately NOT the installer build. `pnpm stage` builds the whole node server and a
# production install of its dependencies, and `tauri build` then bundles NSIS and MSI; that belongs
# in release-desktop.yml, on a tag. Here only the Node sidecar is staged, because tauri-build
# validates `externalBin` while cargo compiles, and the Rust crate is compiled and tested.
name: Desktop Check

on:
  push:
    paths:
      - 'aimeat-desktop/**'
      - '.github/workflows/desktop-check.yml'
  pull_request:
    paths:
      - 'aimeat-desktop/**'
      - '.github/workflows/desktop-check.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo / Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: aimeat-desktop/src-tauri

      # tauri.conf.json declares the sidecar unconditionally and tauri-build checks it exists
      # while cargo compiles, so the crate does not build without this one copy. It needs no
      # dependencies: the script copies the runner's own node.exe.
      - name: Stage the Node sidecar
        run: node scripts/stage-node.mjs
        working-directory: aimeat-desktop

      # tauri-build also refuses a `resources` glob that matches nothing, and the real content of
      # those two folders is the built server and the generated notices, which is what makes
      # `pnpm stage` slow. One placeholder file each satisfies the globs; stage-server.mjs and
      # stage-licenses.mjs empty their folders before writing the real thing, so nothing of this
      # reaches an installer. WebView2Loader.dll is the third resource and is copied out of the
      # cargo registry, so it runs after the crates are there.
      - name: Placeholders for the resource globs
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/server | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri/resources/licenses | Out-Null
          Set-Content -Path src-tauri/resources/server/PLACEHOLDER.txt -Value 'Compile check only.'
          Set-Content -Path src-tauri/resources/licenses/PLACEHOLDER.txt -Value 'Compile check only.'
        shell: pwsh
        working-directory: aimeat-desktop

      - name: Stage WebView2Loader.dll
        run: node scripts/stage-webview2.mjs
        working-directory: aimeat-desktop

      # Build and test only. `cargo fmt --check` and `cargo clippy -D warnings` are deliberately
      # not here yet: this crate has never been held to either, so switching them on would paint
      # the gate red over files this change did not touch. They are worth adding as their own
      # piece of work, with the sweep that makes them pass.
      - name: Tests
        run: cargo test
        working-directory: aimeat-desktop/src-tauri

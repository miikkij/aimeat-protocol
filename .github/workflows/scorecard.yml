# OSSF Scorecard: the supply-chain posture check for a public platform others build on. It scores
# the repository against the Open Source Security Foundation's checks — are actions pinned, are
# workflow permissions least-privilege, is branch protection on, is there a security policy, are
# dangerous workflow patterns present — and uploads the result to the Security tab as tracked alerts.
#
# Advisory, like the other scanning workflows: findings land on the Security tab and inform the next
# hardening pass; nothing here blocks a merge. `publish_results` posts the score to the public OSSF
# dashboard, which is the point of running it on a repo meant to be trusted and built upon.

name: Scorecard supply-chain

on:
  branch_protection_rule:
  schedule:
    - cron: '20 5 * * 1' # weekly, an hour after the CodeQL refresh
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write        # publish the signed result to the OSSF dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif

# Builds the AIMEAT Personal Node desktop installer (Tauri, Windows) and publishes it
# as a downloadable GitHub Release. Triggered by a `desktop-v*.*.*` tag whose numeric part
# must match aimeat-desktop/src-tauri/tauri.conf.json `version` (mirrors the Python publish
# workflow's tag-vs-manifest gate). workflow_dispatch builds only (no release) for smoke tests.
#
# The installer is what the landing "Get your own →" button links to
# (https://github.com/miikkij/aimeat-protocol/releases/latest).
#
# THREE JOBS, EACH HOLDING ONLY WHAT IT NEEDS. The build installs and runs the whole dependency
# tree (npm packages, crates and their build scripts), so it holds no secret and a token that can
# only read. The sign job holds the updater signing key and runs nothing but the Tauri CLI's
# signer, a fixed release checked by its sha256, over the installer the build made. The publish
# job holds the token that writes releases and runs nothing but a copy: it downloads what the two
# jobs made and uploads it. The file names, the release assets, latest.json and the
# `desktop-latest` release are the ones this workflow published when it was one job.
name: Release Desktop Installer

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#desktop-v}"
          MANIFEST="$(node -p "require('./aimeat-desktop/src-tauri/tauri.conf.json').version")"
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag desktop-v$TAG does not match tauri.conf.json version $MANIFEST. Bump the manifest before tagging."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo / Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: aimeat-desktop/src-tauri

      - name: Install server deps (for stage-server build)
        run: pnpm install --frozen-lockfile
        working-directory: aimeat

      - name: Install desktop deps (Tauri CLI)
        run: pnpm install --frozen-lockfile
        working-directory: aimeat-desktop

      # `pnpm stage` runs stage-node + stage-webview2 + stage-server. The local agent runtime
      # (resources/agent-runtime/*.mjs + llm_providers.default.json) ships as static bundle
      # resources (tauri.conf.json), so it needs no staging — Python/uv/Ollama are provisioned
      # at first run on the user's machine (D1), not baked into the installer.
      - name: Stage sidecars + server
        run: pnpm stage
        working-directory: aimeat-desktop

      # No updater artifacts in this build, so it needs no signing key: sign-windows below signs
      # the installer. With Tauri v2 and createUpdaterArtifacts true, the NSIS updater artifact is
      # the -setup.exe itself and `tauri build` only adds its .sig, so the installers come out the
      # same (tauri-cli 2.11.2: sign_updaters in bundle.rs returns at once when the setting is
      # false, and the bundler builds NSIS and MSI the same way either way).
      - name: Build installers (NSIS + MSI)
        run: |
          Set-Content -Path "$env:RUNNER_TEMP\no-updater-artifacts.json" -Value '{"bundle":{"createUpdaterArtifacts":false}}' -NoNewline -Encoding ascii
          pnpm tauri build --config "$env:RUNNER_TEMP\no-updater-artifacts.json"
        working-directory: aimeat-desktop

      - name: List built bundles
        shell: bash
        run: ls -R aimeat-desktop/src-tauri/target/release/bundle || true

      # ── Code signing ────────────────────────────────────────────────────
      # Installers currently ship UNSIGNED (Windows SmartScreen will warn).
      # A free Authenticode signing method is being evaluated; the signing
      # step will be added back here once one is chosen.
      - name: Assemble release files
        shell: bash
        run: |
          mkdir -p dist
          cp aimeat-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe dist/
          cp aimeat-desktop/src-tauri/target/release/bundle/msi/*.msi dist/
          ls -la dist

      # The run's copy of the installers, and what sign-windows and publish-windows download.
      - name: Upload build artifacts (run copy)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aimeat-desktop-windows
          path: dist/*
          if-no-files-found: error

  # THE UPDATER SIGNING KEY IS USED HERE AND NOWHERE ELSE. The job downloads the installers the
  # build made, puts the Tauri CLI on the runner and signs the installer the updater verifies. The
  # CLI is tauri-cli 2.11.2, the version aimeat-desktop/pnpm-lock.yaml pins, from the release
  # tauri-apps publishes it in; the sha256 is GitHub's digest of that asset. `tauri signer sign` is
  # the routine `tauri build` signs updater artifacts with (sign_file in the CLI's
  # helpers/updater_signature.rs) and writes <file>.sig beside the file. No checkout, no package
  # install and no build script runs in this job.
  sign-windows:
    needs: build-windows
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: Download the installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aimeat-desktop-windows
          path: dist

      - name: Install the Tauri CLI (the signer only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tauri-cli | Out-Null
          Invoke-WebRequest -Uri https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.2/cargo-tauri-x86_64-pc-windows-msvc.zip -OutFile tauri-cli/cargo-tauri.zip
          $sha = (Get-FileHash -Algorithm SHA256 tauri-cli/cargo-tauri.zip).Hash.ToLowerInvariant()
          if ($sha -ne 'b6844470bcbf1da6e5dbf01990ae317d4d7969171628bb8badbdbff2e3d06d23') { throw "cargo-tauri.zip: sha256 $sha is not the pinned one" }
          Expand-Archive -Path tauri-cli/cargo-tauri.zip -DestinationPath tauri-cli
          ./tauri-cli/cargo-tauri.exe --version

      - name: Sign the installer the updater verifies
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./tauri-cli/cargo-tauri.exe signer sign "$(ls dist/*-setup.exe | head -1)"

      # Build the updater manifest the app polls (tauri.conf.json endpoint). The .sig is the
      # minisign signature the step above made over the SAME .exe we publish. NOTE: GitHub
      # replaces spaces in asset names with dots, so the URL uses the dotted name.
      - name: Generate update manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          NSIS=dist
          EXE="$(ls $NSIS/*-setup.exe | head -1)"
          SIG="$(ls $NSIS/*-setup.exe.sig 2>/dev/null | head -1 || true)"
          if [ -z "$SIG" ]; then echo "No .sig (updater artifacts not built) — skipping latest.json"; exit 0; fi
          ASSET="$(basename "$EXE" | tr ' ' '.')"
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          PUBDATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          URL="https://github.com/miikkij/aimeat-protocol/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          jq -n --arg v "$VERSION" --arg d "$PUBDATE" --arg s "$(cat "$SIG")" --arg u "$URL" \
            '{version:$v, pub_date:$d, platforms:{"windows-x86_64":{signature:$s, url:$u}}}' > dist/latest.json
          echo "latest.json:"; cat dist/latest.json

      - name: Hand the manifest to the publish job
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aimeat-desktop-update-manifest
          path: dist/latest.json
          if-no-files-found: error

  # THE TOKEN THAT WRITES RELEASES IS HERE, and the job runs nothing but a copy: it downloads the
  # installers from build-windows and the manifest from sign-windows, and uploads them.
  publish-windows:
    needs: [build-windows, sign-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub Release and upload installer assets
    steps:
      - name: Download the installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aimeat-desktop-windows
          path: dist

      - name: Download the update manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aimeat-desktop-update-manifest
          path: dist

      # Publish the downloadable GitHub Release only for real tags.
      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: AIMEAT Personal Node ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*

      # THE MANIFEST ALSO GOES TO A FIXED ADDRESS, and this is what makes auto-update work at all.
      # The app cannot poll `releases/latest`: this repository releases the node under `v*` far
      # more often than the desktop app under `desktop-v*`, so "latest" stopped being a desktop
      # release in June and the updater has answered 404 ever since (measured 2026-09-18). The
      # tag `desktop-latest` never moves, so tauri.conf.json can name one address forever, and
      # the manifest inside it keeps pointing at the versioned release's own installer and
      # signature. It is marked prerelease so it never takes the repository's "Latest" label
      # away from a real release, and its name does not match the `desktop-v*.*.*` trigger
      # above, so publishing it cannot start this workflow again.
      # A DOWNLOAD LINK CANNOT CARRY A VERSION, or every release breaks the page that points at it.
      # The installer is copied to a name that never changes, beside the manifest, so aimeat.io has
      # one address to give a person for as long as this app exists.
      - name: Copy the installer to its fixed name
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cp "$(ls dist/*-setup.exe | head -1)" "dist/AIMEAT-Personal-Node-setup.exe"

      - name: Point the fixed address at this release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: AIMEAT Personal Node (newest)
          tag_name: desktop-latest
          body: |
            The newest Windows installer, at an address that never changes, and the manifest the
            installed app polls for updates. Both are rewritten by CI on every `desktop-v*`
            release, so a link to this page or to the installer below keeps working.

            The release notes for each version are on its own `desktop-v*` release.
          draft: false
          prerelease: true
          files: |
            dist/AIMEAT-Personal-Node-setup.exe
            dist/latest.json

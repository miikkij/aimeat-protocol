# Builds the AIMEAT Personal Node desktop app for Windows, macOS and Linux and publishes the
# installers as a GitHub Release. Triggered by a `desktop-v*.*.*` tag whose numeric part must match
# aimeat-desktop/src-tauri/tauri.conf.json `version` (mirrors the Python publish workflow's
# tag-vs-manifest gate). workflow_dispatch builds and signs only (no release), which is how a change
# to this file is proven before a tag depends on it.
#
# WHAT SHIPS, per platform:
#   Windows  NSIS installer (-setup.exe) and MSI. The updater installs the -setup.exe.
#   macOS    a .dmg for Apple silicon, and <app>.app.tar.gz, which is what the updater installs.
#            Intel Macs are not built: GitHub's macOS runners are Apple silicon, and a universal
#            build would need both a universal Node sidecar and the native SQLite module twice.
#   Linux    an .AppImage, which the updater installs, and a .deb, which it does not.
# Nothing is code-signed for the operating systems, by decision (2026-09-18): no signing until the
# app has been judged good. Windows shows SmartScreen, macOS asks the person to allow the app in
# System Settings > Privacy & Security, and the macOS bundle is signed ad hoc ("-" in
# tauri.macos.conf.json) so it is refused as unverified rather than reported as damaged.
#
# THREE JOBS, EACH HOLDING ONLY WHAT IT NEEDS, as before macOS and Linux joined. The build runs the
# whole dependency tree (npm packages, crates and their build scripts), once per platform, so it
# holds no secret and a token that can only read. The sign job holds the updater signing key and
# runs nothing but the Tauri CLI's signer, a fixed release checked by its sha256, over the three
# files the updater installs. The publish job holds the token that writes releases and runs nothing
# but a copy. `sign` needs every build, so a platform that fails to build publishes nothing at all:
# a release that updates two platforms and strands the third is worse than no release.
name: Release Desktop Installer

on:
  push:
    tags:
      - 'desktop-v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      # Every platform runs to the end even when another fails, so one run shows every failure.
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          # 22.04 rather than the newest: an AppImage runs on systems at least as new as the one
          # it was built on, so the older glibc reaches more of the people who download it.
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#desktop-v}"
          MANIFEST="$(node -p "require('./aimeat-desktop/src-tauri/tauri.conf.json').version")"
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag desktop-v$TAG does not match tauri.conf.json version $MANIFEST. Bump the manifest before tagging."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo / Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: aimeat-desktop/src-tauri

      # What Tauri v2 builds against on Linux: WebKitGTK 4.1 with GTK 3 and libsoup 3, librsvg
      # for the icons and the app indicator for the tray icon, libxdo for the menus and OpenSSL,
      # which reqwest uses there; the same list desktop-check.yml installs. patchelf and file are
      # what the AppImage bundler runs.
      - name: System packages for Tauri (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf file

      - name: Install server deps (for stage-server build)
        run: pnpm install --frozen-lockfile
        working-directory: aimeat

      - name: Install desktop deps (Tauri CLI)
        run: pnpm install --frozen-lockfile
        working-directory: aimeat-desktop

      # `pnpm stage` runs stage-node, stage-webview2, stage-server and stage-licenses. On macOS and
      # Linux stage-webview2 says there is nothing to stage and leaves: WebView2 is Windows only, and
      # only tauri.windows.conf.json names its loader as a resource. stage-server builds the native
      # SQLite module for the runner it is on, which is why every platform stages on its own runner.
      - name: Stage sidecars + server
        run: pnpm stage
        working-directory: aimeat-desktop

      # No updater artifacts in this build, so it needs no signing key: the sign job signs the
      # files the updater installs. With Tauri v2 and createUpdaterArtifacts false the installers
      # come out the same (tauri-cli 2.11.2: sign_updaters in bundle.rs returns at once when the
      # setting is false). On macOS the one thing that setting would add is the .app.tar.gz, which
      # the next step makes itself. APPIMAGE_EXTRACT_AND_RUN lets the AppImage tooling run without
      # FUSE, which a CI runner does not have; NO_STRIP keeps linuxdeploy from running its own old
      # strip over the libraries it copies, which fails on sections newer toolchains write. Both mean
      # nothing on the other two. --verbose prints linuxdeploy's own output: without it a failed
      # AppImage says only "failed to run linuxdeploy" (the first three-platform run, 2026-09-28).
      - name: Build installers
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater-artifacts.json"
          pnpm tauri build --verbose --config "$RUNNER_TEMP/no-updater-artifacts.json"
        working-directory: aimeat-desktop

      - name: List built bundles
        shell: bash
        run: ls -R aimeat-desktop/src-tauri/target/release/bundle || true

      # The names GitHub gives the assets replace spaces with dots, so a file is named that way here
      # already where this workflow chooses the name (the macOS updater archive), and the manifest
      # step turns the rest the same way.
      - name: Assemble release files
        shell: bash
        run: |
          B=aimeat-desktop/src-tauri/target/release/bundle
          mkdir -p dist
          case "${{ matrix.platform }}" in
            windows)
              cp "$B"/nsis/*-setup.exe dist/
              cp "$B"/msi/*.msi dist/
              ;;
            macos)
              cp "$B"/dmg/*.dmg dist/
              # The updater offers an update only when the SIGNED file name holds the version it
              # announces, between underscores (offered_version in src-tauri/src/updater.rs). The
              # Windows and Linux bundles are named <product>_<version>_<arch> by Tauri already;
              # this archive is named here, so it is named the same way. A name without the version
              # would make every macOS update refused.
              APP="$(ls -d "$B"/macos/*.app | head -1)"
              VERSION="$(node -p "require('./aimeat-desktop/src-tauri/tauri.conf.json').version")"
              NAME="$(basename "$APP" .app | tr ' ' '.')_${VERSION}_aarch64.app.tar.gz"
              tar -czf "dist/$NAME" -C "$(dirname "$APP")" "$(basename "$APP")"
              ;;
            linux)
              cp "$B"/deb/*.deb dist/
              cp "$B"/appimage/*.AppImage dist/
              ;;
          esac
          ls -la dist

      - name: Upload build artifacts (run copy)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aimeat-desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # THE UPDATER SIGNING KEY IS USED HERE AND NOWHERE ELSE. The job downloads what the three builds
  # made, puts the Tauri CLI on the runner and signs the three files the updater installs. The CLI
  # is tauri-cli 2.11.2, the version aimeat-desktop/pnpm-lock.yaml pins, from the release tauri-apps
  # publishes it in; the sha256 is GitHub's digest of that asset. `tauri signer sign` is the routine
  # `tauri build` signs updater artifacts with (sign_file in the CLI's helpers/updater_signature.rs)
  # and writes <file>.sig beside the file; a minisign signature is over the bytes, so one signer on
  # Windows signs the macOS and Linux files the same way. No checkout, no package install and no
  # build script runs in this job.
  sign:
    needs: build
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: Download the installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aimeat-desktop-*
          path: dist

      - name: Install the Tauri CLI (the signer only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tauri-cli | Out-Null
          Invoke-WebRequest -Uri https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.2/cargo-tauri-x86_64-pc-windows-msvc.zip -OutFile tauri-cli/cargo-tauri.zip
          $sha = (Get-FileHash -Algorithm SHA256 tauri-cli/cargo-tauri.zip).Hash.ToLowerInvariant()
          if ($sha -ne 'b6844470bcbf1da6e5dbf01990ae317d4d7969171628bb8badbdbff2e3d06d23') { throw "cargo-tauri.zip: sha256 $sha is not the pinned one" }
          Expand-Archive -Path tauri-cli/cargo-tauri.zip -DestinationPath tauri-cli
          ./tauri-cli/cargo-tauri.exe --version

      - name: Sign the three files the updater installs
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ./tauri-cli/cargo-tauri.exe signer sign "$(ls dist/aimeat-desktop-windows/*-setup.exe | head -1)"
          ./tauri-cli/cargo-tauri.exe signer sign "$(ls dist/aimeat-desktop-macos/*.app.tar.gz | head -1)"
          ./tauri-cli/cargo-tauri.exe signer sign "$(ls dist/aimeat-desktop-linux/*.AppImage | head -1)"

      # The updater manifest the app polls (tauri.conf.json endpoint), one entry per platform. Each
      # signature is the one the step above made over the SAME file this run publishes, and each URL
      # names the asset as GitHub stores it (spaces become dots).
      - name: Generate update manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          base="https://github.com/miikkij/aimeat-protocol/releases/download/${GITHUB_REF_NAME}"
          entry() {
            local file="$1"
            jq -n --arg s "$(cat "$file.sig")" --arg u "$base/$(basename "$file" | tr ' ' '.')" '{signature:$s, url:$u}'
          }
          WIN="$(ls dist/aimeat-desktop-windows/*-setup.exe | head -1)"
          MAC="$(ls dist/aimeat-desktop-macos/*.app.tar.gz | head -1)"
          LIN="$(ls dist/aimeat-desktop-linux/*.AppImage | head -1)"
          jq -n --arg v "${GITHUB_REF_NAME#desktop-v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson w "$(entry "$WIN")" --argjson m "$(entry "$MAC")" --argjson l "$(entry "$LIN")" \
            '{version:$v, pub_date:$d, platforms:{"windows-x86_64":$w, "darwin-aarch64":$m, "linux-x86_64":$l}}' \
            > latest.json
          echo "latest.json:"; cat latest.json

      - name: Hand the manifest to the publish job
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aimeat-desktop-update-manifest
          path: latest.json
          if-no-files-found: error

  # THE TOKEN THAT WRITES RELEASES IS HERE, and the job runs nothing but a copy: it downloads the
  # installers from the builds and the manifest from the sign job, and uploads them.
  publish:
    needs: [build, sign]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload installer assets
    steps:
      - name: Download the installers and the manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aimeat-desktop-*
          path: dist
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: AIMEAT Personal Node ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*

      # THE MANIFEST ALSO GOES TO A FIXED ADDRESS, and this is what makes auto-update work at all.
      # The app cannot poll `releases/latest`: this repository releases the node under `v*` far
      # more often than the desktop app under `desktop-v*`, so "latest" stopped being a desktop
      # release in June and the updater answered 404 until 2026-09-18. The tag `desktop-latest`
      # never moves, so tauri.conf.json can name one address forever, and the manifest inside it
      # keeps pointing at the versioned release's own files and signatures. It is marked
      # prerelease so it never takes the repository's "Latest" label away from a real release, and
      # its name does not match the `desktop-v*.*.*` trigger above, so publishing it cannot start
      # this workflow again.
      # A DOWNLOAD LINK CANNOT CARRY A VERSION, or every release breaks the page that points at it.
      # Each installer is copied to a name that never changes, beside the manifest, so aimeat.io has
      # one address per platform to give a person for as long as this app exists.
      - name: Copy the installers to their fixed names
        run: |
          cp "$(ls dist/*-setup.exe | head -1)" "dist/AIMEAT-Personal-Node-setup.exe"
          cp "$(ls dist/*.dmg | head -1)" "dist/AIMEAT-Personal-Node.dmg"
          cp "$(ls dist/*.AppImage | head -1)" "dist/AIMEAT-Personal-Node.AppImage"
          cp "$(ls dist/*.deb | head -1)" "dist/AIMEAT-Personal-Node.deb"

      - name: Point the fixed address at this release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: AIMEAT Personal Node (newest)
          tag_name: desktop-latest
          body: |
            The newest installers, at addresses that never change, and the manifest the installed
            app polls for updates. All are rewritten by CI on every `desktop-v*` release, so a link
            to this page or to an installer below keeps working.

            Windows: AIMEAT-Personal-Node-setup.exe
            macOS, Apple silicon: AIMEAT-Personal-Node.dmg
            Linux: AIMEAT-Personal-Node.AppImage, or AIMEAT-Personal-Node.deb on Debian and Ubuntu

            The release notes for each version are on its own `desktop-v*` release.
          draft: false
          prerelease: true
          files: |
            dist/AIMEAT-Personal-Node-setup.exe
            dist/AIMEAT-Personal-Node.dmg
            dist/AIMEAT-Personal-Node.AppImage
            dist/AIMEAT-Personal-Node.deb
            dist/latest.json

name: E2E full sweep

# THE ADVISORY SWEEP, ON ITS OWN CLOCK. Every suite on both backends, nightly and on demand. It
# lived in ci.yml as two continue-on-error steps until 2026-09-05, where it decided nothing (a red
# sweep never stopped a merge; the guard tier does that) and decided the wall clock of every push
# (82 minutes, most of it here). Here it runs at 03:00 Helsinki, and a red run opens an issue —
# one per backend, reused while it is open — so a failure is a thing somebody sees in the morning
# rather than a line in a log nobody reads. A green run closes that issue again, because an issue
# that only ever opens stops meaning "something is broken now". The way OUT of advisory is
# unchanged: fix a suite so it can be promoted into the guard tier in ci.yml.

on:
  schedule:
    # 00:00 UTC is 03:00 in Helsinki during summer time and 02:00 in winter.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    # Ubuntu 24.04, not ubuntu-latest: e2e-backup-restore runs pg_dump and pg_restore against the
    # postgres:16 service, as an operator does with the matching client. ubuntu-latest became 26.04
    # on 2026-10-25, whose pg_dump writes `SET transaction_timeout`, which a PostgreSQL 16 server
    # refuses, so pg_restore exits 1. Move this with the service image, never on its own.
    runs-on: ubuntu-24.04
    # A time limit per job (QA audit P1-06); the runner also limits each suite, so a hung suite is
    # one red row and not a job that runs until GitHub's six-hour default.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres-kysely]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: aimeat_kysely_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Prepare E2E env files (from committed examples)
        working-directory: aimeat
        run: |
          cp .env.test.sqlite.example .env.test.sqlite
          cp .env.test.postgres-kysely.example .env.test.postgres-kysely

      # KEEP THE E2E PORTS OUT OF THE KERNEL'S EPHEMERAL RANGE. Every port a suite or a lane binds is
      # in 40000-40999, and Linux hands out local ports for OUTGOING connections from 32768-60999, so
      # a database or HTTP client socket could hold 40320 at the moment a node wanted to listen there.
      # The listen then failed with EADDRINUSE while the port refused connections, and until
      # 2026-09-17 the node hid that error behind its start banner (index-start.ts). Reserving the
      # range takes it out of automatic allocation only; binding it explicitly still works.
      - name: Reserve the E2E port range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=40000-40999

      # THE CONNECTION LIMIT FITS THE LANES AND THE NODES A SUITE STARTS ITSELF. Every node opens a
      # pool of up to 20 connections (src/storage/providers/postgres-kysely/pool-limits.ts). Since
      # 2026-10-16 a suite's own nodes run on PostgreSQL too (test/helpers/own-node-db.ts), so four
      # lane nodes and federation-messages' three nodes can ask for 140 at once, and the image's
      # default is 100. On 2026-10-20 the sweep went red on "sorry, too many clients already" in
      # federation-messages 5b, the moment its third node booted. A service container takes no
      # command line, so the limit is set with ALTER SYSTEM and a restart, and read back.
      - name: Raise the PostgreSQL connection limit
        if: ${{ matrix.backend == 'postgres-kysely' }}
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -U appuser -d aimeat_kysely_e2e -c "ALTER SYSTEM SET max_connections = 300"
          docker restart "$PG_CONTAINER"
          for i in $(seq 1 30); do docker exec "$PG_CONTAINER" pg_isready -U appuser -d aimeat_kysely_e2e && break; sleep 1; done
          test "$(docker exec "$PG_CONTAINER" psql -U appuser -d aimeat_kysely_e2e -tAc 'SHOW max_connections')" = 300

      # Four lanes: four nodes at once, every suite still alone on an empty database. Measured on
      # one lane before this existed: 285 suites, 38 minutes, 20 of them restarts between suites.
      #
      # THE BOOT BUDGET IS THE DEFAULT HERE, AND THAT IS A CORRECTION. On 2026-09-12 two suites that
      # spawn a node of their own spent the whole 180-second default without binding a port, on 3%
      # of a core, and this step was given AIMEAT_E2E_BOOT_MS=420000 on the reading that four lanes
      # were starving them. The next night refuted it: e2e-core-jobs spent the whole 420 seconds the
      # same way, having burned a full boot's worth of CPU, while four other suites that spawn a
      # node booted in 7 to 11 seconds on the same lane of the same run. A node that gets 2% of a
      # core while its neighbours get all they ask for is not losing a fair fight for the processor,
      # and a bigger budget only makes a red night four minutes longer. What the next occurrence
      # needs is where it is stuck, which wait-for-server.ts now reports per thread.
      # EVERY NODE IN THE SWEEP STARTS FROM THE BUILD, NOT THROUGH tsx. From 2026-09-10 to
      # 2026-09-15 this job was red every night, and apart from two stale assertions every red suite
      # was one failure: a node that never bound its port. The stuck nodes printed only the warnings
      # the static import graph emits and no log line after them, sat in ep_poll for the whole budget
      # on a few per cent of a core, and stopped at the first dynamic import of a boot, where tsx has
      # to compile a few dozen provider files through its esbuild child. On 2026-09-11 a lane server
      # did the same inside its 60-second restart budget and took the whole Postgres run down with
      # no total. A node started from dist/ involves no compiler and no pipe to one, and boots in
      # about half the time of a warm tsx and a fifth of a cold one (measured 2026-09-15), which on a
      # runner restarting a node before every suite is also most of the load. The variable is read
      # by test/helpers/node-entry.ts; locally it stays unset, so one suite needs no build.
      - name: Build the node the sweep starts
        working-directory: aimeat
        run: pnpm build

      - name: Full sweep (${{ matrix.backend }})
        working-directory: aimeat
        env:
          AIMEAT_E2E_NODE_ENTRY: dist
        run: pnpm test:e2e:${{ matrix.backend }}

      # The node's own output for each red suite (the runner keeps it under test-results/e2e-node/
      # and prints its tail under the suite): a 500 or a crash leaves a stack here (QA audit P1-07).
      - name: Keep the node logs of the red suites
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-node-logs-${{ matrix.backend }}
          path: aimeat/test-results/e2e-node/
          if-no-files-found: ignore
          retention-days: 14

  # THE 4.0.0 HALF OF THE VERSION-AWARE SUITES, EVERY NIGHT. A suite whose expected answer depends on
  # the release (removedOn, helpers/node-release, a *_REMOVED_IN constant) asserts the 3.x answer in
  # the sweep above and the 4.0.0 answer only on a node run as 4.0.0. Until 2026-10-13 that second
  # half ran only when somebody started it by hand (docs-audit 2026-10, 4.0-testimuutokset.md §4
  # item 4). AIMEAT_TEST_SOFTWARE_VERSION is honoured only by a test node on a loopback address
  # (src/utils/version.ts testVersionOverride), which is what the runner starts. The list is
  # test/version-aware-suites.txt; test/unit/version-aware-suites.test.ts refuses a version-aware
  # suite that is not on it, so a new one is added there and nowhere else. SQLite only: the backend
  # is not what the release changes, and the sweep above runs both backends at the package version.
  release-4-0-0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Prepare the E2E env file (from the committed example)
        working-directory: aimeat
        run: cp .env.test.sqlite.example .env.test.sqlite

      # Same reason as in the sweep above: the E2E ports stay out of the kernel's ephemeral range.
      - name: Reserve the E2E port range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=40000-40999

      # Same reason as in the sweep above: every node starts from dist/, not through tsx.
      - name: Build the node the run starts
        working-directory: aimeat
        run: pnpm build

      - name: Version-aware suites as node 4.0.0 (sqlite)
        working-directory: aimeat
        env:
          AIMEAT_E2E_NODE_ENTRY: dist
          AIMEAT_TEST_SOFTWARE_VERSION: '4.0.0'
        run: node --env-file=.env.test.sqlite --import tsx test/run-e2e-ci.ts --tests-file=test/version-aware-suites.txt --workers=4

      # The unit tests branch on the release too (a *_REMOVED_IN constant, unprovenFormatLive,
      # legacyMorselFieldsLive), so the whole unit suite runs as 4.0.0 here, with no list: a new
      # version-aware unit test is covered the night it lands. The override needs test mode and a
      # loopback base URL (src/utils/version.ts testVersionOverride). It runs even when the step above
      # is red, so one night reports both halves.
      - name: Unit suite as node 4.0.0
        if: ${{ !cancelled() }}
        working-directory: aimeat
        env:
          AIMEAT_TEST_SOFTWARE_VERSION: '4.0.0'
          AIMEAT_TEST_MODE: 'true'
          AIMEAT_BASE_URL: 'http://localhost:40050'
        run: pnpm test

  # THE PACKAGE AN OPERATOR INSTALLS, STARTED EVERY NIGHT (QA audit 2026-10-16, P6-04). Nothing packed
  # the npm tarball, installed it into an empty directory with production dependencies only and
  # started it: every other check runs the build inside the checkout, where docs/, public/ and the
  # development dependencies sit beside dist/, and five packaging defects reached npm that way.
  # aimeat/scripts/pack-smoke.mjs does it and probes /v1/health, /v1/build (the packed commit),
  # /v1/spec, a bundled catalogue and a served library; prepublishOnly runs the same script, and a
  # release waits for this run being green on its commit (scripts/release-ready.mjs).
  pack-smoke:
    runs-on: ubuntu-latest
    # The production install of the packed tarball took 11 to 16 minutes on a loaded workstation.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Build the node that is packed
        working-directory: aimeat
        run: pnpm build

      - name: Pack, install with production dependencies only, start and probe
        working-directory: aimeat
        run: node scripts/pack-smoke.mjs

  # THE CARD RAIL AGAINST STRIPE ITSELF, IN TEST MODE (QA audit W30, 2026-10-16). Every other money
  # test settles through the in-process test.money handler, which a production node does not register,
  # so nothing ran the Stripe handler to success. This job runs the handler against Stripe (a payment
  # and its refund, the hold rail, a kept card, a decline) and one card sale through the node, with the
  # repository secret STRIPE_TEST_SECRET_KEY: a test-mode key of an account kept for this. Without the
  # secret both steps report their cases as SKIPPED (vitest's skip, and the runner's Skipped count),
  # never as passed. Both refuse a key that is not a test-mode key.
  stripe-testmode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile
      - name: Prepare the E2E env file (from the committed example)
        working-directory: aimeat
        run: cp .env.test.sqlite.example .env.test.sqlite

      - name: Reserve the E2E port range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=40000-40999

      - name: The Stripe handler against Stripe test mode
        working-directory: aimeat
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: pnpm test:stripe-testmode

      - name: A card sale through the node, settled on Stripe test mode
        if: ${{ !cancelled() }}
        working-directory: aimeat
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: node --env-file=.env.test.sqlite --import tsx test/run-e2e-ci.ts --test=e2e-stripe-testmode

  # THE UPGRADE EVERY SELF-HOSTED NODE TAKES (QA audit P6-05, 2026-10-16). The current code starts on a
  # database that the previous release tag created and wrote, on each backend, and its schema is held to
  # a fresh one (test/upgrade-from-release.ts). The sweep above starts every suite on a database the
  # current code made, so a CREATE without its ALTER or a migration that fails over rows passed it. The
  # full history is fetched because the release is found with git describe.
  upgrade-from-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres-kysely]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: devpassword123
          POSTGRES_DB: aimeat_kysely_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Upgrade from the previous release (${{ matrix.backend }})
        working-directory: aimeat
        env:
          AIMEAT_DB: ${{ matrix.backend }}
          DATABASE_URL: postgresql://appuser:devpassword123@localhost:5432/aimeat_kysely_e2e
        run: pnpm test:upgrade

  # THE ISSUE IS WRITTEN BY A JOB OF ITS OWN. The sweep installs and runs the whole dependency tree,
  # so it holds a token that can only read; this job holds the one that writes issues and runs
  # nothing but the gh CLI the runner carries. It reads each leg's result from this run (a sweep leg
  # is named "sweep (<backend>)" after its job id and matrix value, the 4.0.0 run "release-4-0-0")
  # and does what the sweep's own last two steps did: a red leg opens or updates its issue, a green
  # one closes it. Each leg has its own issue title, and no title contains another, because the
  # lookup is a phrase search on the title.
  issue:
    needs: [sweep, release-4-0-0, pack-smoke, stripe-testmode, upgrade-from-release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # read the sweep legs' results from this run
      checks: read # read a red leg's annotations, which name its red suites
      issues: write # open, comment on and close the nightly-sweep issue
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: sweep (sqlite)
            title: Nightly E2E sweep is red on sqlite
            what: The full E2E sweep on **sqlite**
          - job: sweep (postgres-kysely)
            title: Nightly E2E sweep is red on postgres-kysely
            what: The full E2E sweep on **postgres-kysely**
          - job: release-4-0-0
            title: Nightly 4.0.0 run of the version-aware suites is red
            what: The version-aware suites (test/version-aware-suites.txt) run as node **4.0.0** on sqlite
          - job: pack-smoke
            title: Nightly start of the packed npm package is red
            what: The npm tarball packed, installed with production dependencies only and started (aimeat/scripts/pack-smoke.mjs)
          - job: stripe-testmode
            title: Nightly Stripe test-mode run is red
            what: The Stripe card handler and a card sale against **Stripe test mode**
          - job: upgrade-from-release (sqlite)
            title: Nightly upgrade from the previous release is red on sqlite
            what: The current code started on a **sqlite** database written by the previous release
          - job: upgrade-from-release (postgres-kysely)
            title: Nightly upgrade from the previous release is red on postgres-kysely
            what: The current code started on a **postgres-kysely** database written by the previous release
    steps:
      - name: Read this leg's result
        id: sweep
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB: ${{ matrix.job }}
        run: |
          CONCLUSION="$(gh run view "$GITHUB_RUN_ID" --json jobs --jq ".jobs[] | select(.name == \"$JOB\") | .conclusion")"
          JOB_ID="$(gh run view "$GITHUB_RUN_ID" --json jobs --jq ".jobs[] | select(.name == \"$JOB\") | .databaseId")"
          echo "$JOB: ${CONCLUSION:-not found} (job ${JOB_ID:-not found})"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      # Every conclusion but success is red (QA audit P1-06): a leg that hit its time limit ends
      # as cancelled or timed_out, and one that could not be found answers nothing; both opened no
      # issue while the condition read only 'failure'.
      #
      # THE ISSUE NAMES THE RED SUITES (2026-10-16). Each comment from 2026-10-12 to 2026-10-16 said
      # only "Still red" with a run link, and GitHub serves a job's log to signed-in readers only, so
      # nobody working without a GitHub token could tell which suites were red. The E2E runner writes
      # its red suites as error annotations (scripts/lib/e2e-github-report.ts); the leg's annotations
      # with a title are copied here. The runner's "Process completed with exit code" line has no
      # title and is left out.
      #
      # THE SAME ANNOTATIONS OPEN ONE INCIDENT PER RED SUITE (2026-10-18). Lifecycle Central's
      # ci_sweep_ingest reads them through the public API with no token, and opens or updates an
      # incident per suite in AIMEAT CODING CENTRAL with its backends, first failure and the commits
      # between its last green and first red night. Their shapes are a contract with that reader:
      # see the header of aimeat/scripts/lib/e2e-github-report.ts before changing them.
      - name: Open or update the issue for a red sweep
        if: steps.sweep.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ matrix.title }}
          WHAT: ${{ matrix.what }}
          JOB_ID: ${{ steps.sweep.outputs.job_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RED=""
          if [ -n "$JOB_ID" ]; then
            RED="$(gh api "repos/$GH_REPO/check-runs/$JOB_ID/annotations?per_page=50" --jq '.[] | select(.annotation_level == "failure" and (.title // "") != "") | "- **" + .title + "**: " + (.message | gsub("\n"; " · "))' || true)"
          fi
          if [ -n "$RED" ]; then
            RED="

          $RED"
          fi
          BODY="$WHAT failed: $RUN_URL$RED

          The sweep is advisory and blocks nothing; a suite that is red here and matters is one to fix and promote into the guard tier (test/run-e2e-ci.ts, GUARD_SUITES). See docs/coding-guidelines/testing-requirements.md Rule 1b and docs/pitfalls.md §18 before reading a red suite as a regression."
          EXISTING="$(gh issue list --label nightly-sweep --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still red on $(date -u +%Y-%m-%d): $RUN_URL$RED"
          else
            gh label create nightly-sweep --description "Opened by the nightly E2E sweep" --color B60205 2>/dev/null || true
            gh issue create --title "$TITLE" --label nightly-sweep --body "$BODY"
          fi

      # A green night closes what a red one opened. Without this the issue outlives its cause: #3 and
      # #4 collected a "still red" comment every night from 2026-09-06 and nothing would ever have
      # taken them down, so the open count stopped meaning "something is broken now" and the person
      # who fixed the last red suite had to remember to close the issue by hand. The permission for
      # this is on this job (issues: write), and the step is silent when nothing is open.
      - name: Close the issue when the sweep is green
        if: steps.sweep.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ matrix.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING="$(gh issue list --label nightly-sweep --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Green on $(date -u +%Y-%m-%d): $RUN_URL"
          fi

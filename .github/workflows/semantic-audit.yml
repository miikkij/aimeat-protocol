# Semantic security audit: the security-development-dna invariants that can be checked as
# source -> sink / structural rules, run on every change and tracked on the Security tab.
#
# The rules live in security/semantic-audit/ast-grep and are run with ast-grep (a native binary,
# same tool the developer runs locally on Windows). Findings are uploaded to GitHub code scanning so
# each one becomes a tracked alert with a history, not a line in a log.
#
# Advisory for now (continue-on-error): the rules over-report by design and each hit is a review
# prompt, so a finding surfaces on the Security tab without blocking a merge. Tighten a rule with
# per-line `// ast-grep-ignore` once its false positives are understood, then make it blocking.
#
# EACH ANALYSIS AND ITS UPLOAD ARE TWO JOBS. An analysis installs and runs tools from npm, PyPI or
# the pnpm lockfile, so it holds a token that can only read and hands its SARIF over as an
# artifact. The upload job holds security-events: write and runs no code but the upload action.

name: Semantic security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ast-grep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run semantic security rules (ast-grep)
        continue-on-error: true
        run: >
          npx -y -p @ast-grep/cli@0.45.1 ast-grep scan
          -c security/semantic-audit/sgconfig.yml
          aimeat/src --format sarif > semantic-audit.sarif

      - name: Normalize SARIF for GitHub code scanning
        run: node security/semantic-audit/normalize-sarif.mjs semantic-audit.sarif

      - name: Hand the SARIF to the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-semantic-audit
          path: semantic-audit.sarif
          if-no-files-found: error
          retention-days: 1

  ast-grep-upload:
    needs: ast-grep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sarif-semantic-audit

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: semantic-audit.sarif
          category: semantic-audit

  # The deeper interprocedural taint pass: Semgrep follows a value through assignments and across
  # functions, which ast-grep cannot. Runs here on Linux because the developer machine is Windows
  # (Semgrep needs WSL/Docker there, which this project does not use). Advisory, same as ast-grep.
  semgrep-taint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Semgrep and every package it needs come from requirements-semgrep.txt, which names a sha256
      # for each, as wheels only (pip checks no hash inside a source build's own environment).
      - name: Install Semgrep
        run: |
          pip install --require-hashes --only-binary :all: -r security/semantic-audit/requirements-semgrep.txt

      - name: Run taint rules
        continue-on-error: true
        run: >
          semgrep scan --config security/semantic-audit/semgrep
          --sarif --output semgrep-taint.sarif aimeat/src

      - name: Hand the SARIF to the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-semgrep-taint
          path: semgrep-taint.sarif
          if-no-files-found: error
          retention-days: 1

  semgrep-taint-upload:
    needs: semgrep-taint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sarif-semgrep-taint

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: semgrep-taint.sarif
          category: semgrep-taint

  # The existing audit-gate ratchets and MCP surface-parity checks already gate ci.yml; this job
  # mirrors their state onto the same Security tab so every audit signal shares one pane. Advisory.
  audit-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Run audit gates and emit SARIF
        working-directory: aimeat
        continue-on-error: true
        run: node ../security/semantic-audit/checks-to-sarif.mjs audit-gates.sarif

      - name: Hand the SARIF to the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-audit-gates
          path: aimeat/audit-gates.sarif
          if-no-files-found: error
          retention-days: 1

  audit-gates-upload:
    needs: audit-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sarif-audit-gates
          path: aimeat

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: aimeat/audit-gates.sarif
          category: audit-gates

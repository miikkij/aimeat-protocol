# Semantic security audit: the security-development-dna invariants that can be checked as
# source -> sink / structural rules, run on every change and tracked on the Security tab.
#
# The rules live in security/semantic-audit/ast-grep and are run with ast-grep (a native binary,
# same tool the developer runs locally on Windows). Findings are uploaded to GitHub code scanning so
# each one becomes a tracked alert with a history, not a line in a log.
#
# Advisory for now (continue-on-error): the rules over-report by design and each hit is a review
# prompt, so a finding surfaces on the Security tab without blocking a merge. Tighten a rule with
# per-line `// ast-grep-ignore` once its false positives are understood, then make it blocking.

name: Semantic security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ast-grep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Run semantic security rules (ast-grep)
        continue-on-error: true
        run: >
          npx -y -p @ast-grep/cli@0.45.1 ast-grep scan
          -c security/semantic-audit/sgconfig.yml
          aimeat/src --format sarif > semantic-audit.sarif

      - name: Normalize SARIF for GitHub code scanning
        run: node security/semantic-audit/normalize-sarif.mjs semantic-audit.sarif

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: semantic-audit.sarif
          category: semantic-audit

  # The deeper interprocedural taint pass: Semgrep follows a value through assignments and across
  # functions, which ast-grep cannot. Runs here on Linux because the developer machine is Windows
  # (Semgrep needs WSL/Docker there, which this project does not use). Advisory, same as ast-grep.
  semgrep-taint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run taint rules
        continue-on-error: true
        run: >
          semgrep scan --config security/semantic-audit/semgrep
          --sarif --output semgrep-taint.sarif aimeat/src

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: semgrep-taint.sarif
          category: semgrep-taint

  # The existing audit-gate ratchets and MCP surface-parity checks already gate ci.yml; this job
  # mirrors their state onto the same Security tab so every audit signal shares one pane. Advisory.
  audit-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Run audit gates and emit SARIF
        working-directory: aimeat
        continue-on-error: true
        run: node ../security/semantic-audit/checks-to-sarif.mjs audit-gates.sarif

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: aimeat/audit-gates.sarif
          category: audit-gates

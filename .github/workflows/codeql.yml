# CodeQL, advanced setup. Default setup analysed everything — 1214 open alerts on first run, most
# of them rate-limiting notes on test files and vendored/minified libraries, which buries the number
# the Security tab exists to show. Default setup cannot exclude paths, so this workflow replaces it
# (default setup was turned off via the API on 2026-08-23) with the same query suite scoped to the
# code we actually ship. Advisory like the other scanning workflows: findings land on the Security
# tab; enforcement lives in ci.yml.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 4 * * 1' # weekly refresh so alert state tracks main even in quiet weeks

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout
      security-events: write  # upload the analysis to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: ${{ matrix.language }}
          # Default query suite, deliberately. security-extended was tried on 2026-08-24 and added
          # ~197 findings on this codebase — almost all from its low-precision audit queries
          # (log-injection, user-controlled-bypass, remote-property-injection, http-to-file-access),
          # which are noise here and buried the handful the tab exists to show. The default suite is
          # GitHub's high-confidence set; it is what surfaced the five real findings we fixed. Depth,
          # when wanted, belongs in a periodic security-extended run fed to the AI-triage pass, not on
          # the always-on tab.
          config: |
            paths-ignore:
              - 'aimeat/test/**'
              - 'python/aimeat-crewai/tests/**'
              - '**/dist/**'
              - 'aimeat/public/lib/**'
              - '**/*.min.js'
              - 'docs/**'
            # 1057 of the first scoped run's 1188 alerts were this one heuristic firing on every
            # Express handler: it only recognises express-rate-limit and friends, not the node's own
            # rate-limit middleware (src/middleware/rate-limit.ts + the global tarpit), so on this
            # codebase it is pure noise that buries the other ~130 findings.
            query-filters:
              - exclude:
                  id: js/missing-rate-limiting

      - uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          category: codeql/${{ matrix.language }}

name: Publish to MCP Registry
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A RELEASE WAITS FOR GREEN (QA audit 2026-10-16, P2-02, P6-01, S9-04). The v4.0.0 tag published
# here 95 seconds after CI started on the same commit, and that CI run ended red. The gate job
# below refuses unless the tagged commit is on main, the tag names the version server.json and
# aimeat/package.json carry, and CI and the nightly E2E sweep each have a green run of that exact
# commit (aimeat/scripts/release-ready.mjs). When the nightly has not run on the commit yet, start
# "E2E full sweep" for it from the Actions tab and re-run this workflow once it is green.
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read the CI and nightly runs of the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag names the version the manifests carry
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SERVER="$(jq -r .version server.json)"
          PKG="$(jq -r .version aimeat/package.json)"
          echo "tag=$TAG server.json=$SERVER aimeat/package.json=$PKG"
          if [ "$TAG" != "$SERVER" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match server.json ($SERVER) and aimeat/package.json ($PKG). Bump both, commit, then tag."
            exit 1
          fi

      - name: CI and the nightly sweep are green on the tagged commit, and it is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node aimeat/scripts/release-ready.mjs --sha="$GITHUB_SHA" --require=ci.yml,e2e-full.yml

  publish:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A fixed release of the publisher, checked against the sha256 in that release's own
      # registry_1.8.1_checksums.txt before it runs. It is the program that holds the aimeat.io
      # key below, so a bump is a commit here: the version and the sha256 change together.
      - name: Install mcp-publisher
        run: |
          curl -sSfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain aimeat.io --private-key "$MCP_PRIVATE_KEY"
      # The gate job proved the tag equals server.json's version, so the manifest publishes as
      # committed; nothing rewrites it here.
      - name: Publish
        run: ./mcp-publisher publish

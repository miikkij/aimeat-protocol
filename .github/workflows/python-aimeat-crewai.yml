name: aimeat-crewai (Python)

# Tests the Python CrewAI integration. Path-gated so the heavier Node+CrewAI
# setup only runs when the package or the connector it talks to changes.
on:
  push:
    branches: [main]
    paths:
      - 'python/aimeat-crewai/**'
      - 'aimeat/src/cli/connect/**'
      # tests/test_node_schema_parity.py validates against the node's offer and signal schemas and
      # reads the shape allowlist (2026-10-18).
      - 'aimeat/src/models/offer-schemas.ts'
      - 'aimeat/src/models/workflow-signals.ts'
      - 'aimeat/src/models/odps-schemas.ts'
      - 'aimeat/src/commerce/money.ts'
      - 'aimeat/security/python-shape-parity.json'
      - '.github/workflows/python-aimeat-crewai.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/aimeat-crewai/**'
      - 'aimeat/src/cli/connect/**'
      - 'aimeat/src/models/offer-schemas.ts'
      - 'aimeat/src/models/workflow-signals.ts'
      - 'aimeat/src/models/odps-schemas.ts'
      - 'aimeat/src/commerce/money.ts'
      - 'aimeat/security/python-shape-parity.json'
      - '.github/workflows/python-aimeat-crewai.yml'

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The integration suite (test_serve_loopback.py) spawns a REAL AIMEAT node
      # and the loopback serve daemon via `node --import tsx aimeat/src/index.ts`,
      # so Node + the connector's deps must be installed for it to run (otherwise
      # those tests skip themselves).
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'
          cache-dependency-path: aimeat/pnpm-lock.yaml

      - name: Install Node deps
        working-directory: aimeat
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/aimeat-crewai/pyproject.toml

      # Every package comes from a file that names its sha256, as wheels only (pip checks no hash
      # inside a source build's own environment): the tools from requirements-ci.txt, the package's
      # own dependencies and dev tools from uv.lock as it stands (uv export --frozen). The package
      # itself goes in last, built with those tools, and fetches nothing.
      # The export is the whole resolved set, so pip installs it with --no-deps and does not resolve
      # it again: pip does not read [tool.uv] override-dependencies, and its own resolution refused
      # the lock's mcp 1.30.0 against crewai's mcp~=1.28.1 pin (red from 2026-10-16 to 2026-10-19).
      - name: Install package + dev deps
        working-directory: python/aimeat-crewai
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-ci.txt
          uv export --frozen --extra dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/dev-requirements.txt"
          python -m pip install --no-deps --require-hashes --only-binary :all: -r "$RUNNER_TEMP/dev-requirements.txt"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ruff
        working-directory: python/aimeat-crewai
        run: ruff check .

      # Unit + smoke tests + the loopback integration suite (spawns node + serve
      # daemon, exercises serve_params/REST proxy/long-poll over one upstream WS).
      - name: Pytest
        working-directory: python/aimeat-crewai
        run: python -m pytest tests -q

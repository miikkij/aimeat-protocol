# Monthly: is there anything new upstream for the browser libraries this node serves.
#
# WHY IT IS SEPARATE FROM THE WEEKLY VULNERABILITY SCAN. That one asks "is anything we serve known to
# be broken", and it has to be weekly because an advisory lands on somebody else's schedule. This one
# asks "has anything moved on", which changes slowly and is a planning question rather than an alarm.
# Weekly would make it noise, and noise is how a report stops being read.
#
# WHY IT DOES NOT OPEN A PULL REQUEST. There is deliberately no Dependabot config in this repository
# (see docs/coding-guidelines/dependency-management.md): a solo maintainer does not want a queue of
# bot branches. This job writes a report and keeps it as an artifact. Someone goes and looks, the way
# they already go and look at the Security tab.
#
# WHY IT DOES NOT FAIL. Being a version behind is a decision here, not a defect — the major-pinned
# filename is the compatibility contract for every published app, so four files are deliberately
# frozen and would fail this job every month forever. A job that is always red says nothing.

name: Library freshness

on:
  schedule:
    - cron: '0 7 1 * *' # 07:00 on the first of the month
  workflow_dispatch:
    inputs:
      node_url:
        description: 'Node to count app usage against (blank = skip the usage report)'
        required: false
        default: 'https://aimeat.io'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, matching every other workflow here. A mutable tag means the action that
      # runs next month is whatever the tag points at then, which is the supply-chain hole Scorecard
      # flags (Pinned-Dependencies 1595-1598, all four of them mine).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # The same missing line as vulnerability-scan.yml had, and the same result: setup-node
          # looked for the lockfile in the repo root, found the stub, and the job died with
          # "Dependencies lock file is not found" before it read a single library version.
          cache-dependency-path: aimeat/pnpm-lock.yaml

      # The vendored binaries are identified by the manifest, not by their bytes being present, so
      # the 70 MB of wasm this job never looks at can stay unfetched.
      - name: Install
        # `pnpm install` AT THE REPO ROOT INSTALLS NOTHING. The root package.json only proxies;
        # the workspace with the dependencies is aimeat/, which is where every step below runs.
        # Without this the install "succeeded" against no projects and the next step that needed
        # a dev dependency died with `sh: 1: tsx: not found`.
        working-directory: aimeat
        run: pnpm install --frozen-lockfile
        env:
          AIMEAT_SKIP_VENDOR: '1'

      # What moved upstream: our version, the newest one, how old the bytes we serve are, and whether
      # anybody still releases the library at all.
      - name: What is new upstream (outdated:libs)
        working-directory: aimeat
        # `set -o pipefail`, and it is the whole reason this job could be green while doing
        # nothing. GitHub runs a `run:` block as `bash -e`, and `-e` does NOT fail a pipeline
        # whose LAST command succeeded -- so `pnpm outdated:libs | tee` exited 0 on tee's
        # status while the scan itself had died with `tsx: not found`. Measured 2026-09-07:
        # the run reported success with both of its real steps failed inside.
        run: |
          set -o pipefail
          pnpm outdated:libs | tee ../library-freshness.txt

      # Which apps load which file. This is the number that decides whether a frozen old file can
      # ever be retired: while even one app loads it, the file stays and there is nothing to discuss.
      # It reads only public endpoints, so it needs no token.
      - name: Who still loads what (libs:usage)
        if: ${{ github.event_name == 'schedule' || inputs.node_url != '' }}
        working-directory: aimeat
        run: |
          set -o pipefail
          pnpm libs:usage -- --node "${NODE_URL}" | tee -a ../library-freshness.txt
        env:
          NODE_URL: ${{ inputs.node_url || 'https://aimeat.io' }}

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: library-freshness
          path: library-freshness.txt
          retention-days: 180

# Dependabot: the routine that keeps dependencies moving without anyone remembering to look.
#
# WHY GROUPS. Twenty-three outdated packages arriving as twenty-three pull requests is a queue
# nobody works through, and the ones that matter are then indistinguishable from the ones that do
# not. Minor and patch updates within a line are grouped into one PR per ecosystem per week, which
# is a single CI run and a single review. A MAJOR update gets its own PR on purpose: it is a
# decision, not a bump, and it deserves to be read alone.
#
# WHAT THIS DOES NOT COVER, and it is a third of what the node distributes: the browser libraries
# under aimeat/public/lib/. They are committed files with no manifest above them, so no dependency
# bot can see them. `pnpm scan:vulns` is what watches those, and .github/workflows/vulnerability-scan.yml
# runs it weekly. That gap is not theoretical — on 2026-08-31 it held a HIGH-severity arbitrary code
# execution in PDF.js and five advisories in Mermaid, while `pnpm audit` reported zero.
#
# A security update does not wait for the weekly window: GitHub opens those as soon as an advisory
# lands, provided Dependabot alerts are on for the repository.

version: 2

updates:
  # The node itself. Production dependencies ship, so they are grouped apart from the toolchain:
  # a production bump is a change to what users run, a dev bump is a change to how we build.
  - package-ecosystem: npm
    directory: /aimeat
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Helsinki
    open-pull-requests-limit: 6
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      toolchain:
        dependency-type: development
        update-types: [minor, patch]

  # The desktop shell (Tauri CLI only; the server it bundles comes from /aimeat above).
  - package-ecosystem: npm
    directory: /aimeat-desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      desktop:
        patterns: ['*']
        update-types: [minor, patch]

  # The CrewAI liaison package, which has its own version line and its own release.
  - package-ecosystem: pip
    directory: /python/aimeat-crewai
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    groups:
      python:
        patterns: ['*']
        update-types: [minor, patch]

  # The actions in .github/workflows/. A compromised or abandoned action runs with whatever the
  # workflow's permissions allow, which is why this is watched like any other dependency.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']

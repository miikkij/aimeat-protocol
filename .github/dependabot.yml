# Keep the GitHub Actions SHA pins fresh — the maintenance half of pinning.
#
# Every action in .github/workflows is pinned to an immutable commit SHA (a floating @v4 runs
# whatever a retag points at, which is the supply-chain hole pinning closes). The cost of pinning is
# that a pin never moves on its own, so a fixed action version goes stale and silently misses its own
# security fixes. This updater is the answer: it watches the actions' upstreams and opens ONE grouped
# PR a week that bumps the pins (SHA and the trailing version comment together).
#
# Scoped to github-actions ONLY on purpose. The npm and pip version-update ecosystems are left off:
# they are the noisy ones, and this repo manages those dependencies deliberately. Dependabot SECURITY
# alerts (a separate feature, enabled on the repo) still cover npm/pip/cargo for known CVEs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

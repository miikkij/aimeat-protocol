  # ── Generator ───────────────────────────────────────────────
  /v1/generator/projects:
    post:
      operationId: createGeneratorProject
      summary: Create generator project
      description: Create a new service generator project. Requires `generator:write` scope.
      tags: [Generator]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Human-readable project name
                  example: Neighbourhood Hobby Hub
                description:
                  type: string
                  description: Optional project description
                  example: A platform for connecting locals around shared interests
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          projectId:
                            type: string
                            example: gen-1742300000000-abc123
                          project:
                            type: object
                            properties:
                              id: { type: string }
                              name: { type: string }
                              description: { type: string }
                              status: { type: string, enum: [draft, active, archived] }
                              blueprint: { type: object, nullable: true }
                              createdAt: { type: string, format: date-time }
                              updatedAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      operationId: listGeneratorProjects
      summary: List generator projects
      description: List all generator projects owned by the caller. Requires `generator:read` scope.
      tags: [Generator]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          projects:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string }
                                name: { type: string }
                                description: { type: string }
                                status: { type: string }
                                createdAt: { type: string, format: date-time }
                                updatedAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/generator/{projectId}:
    get:
      operationId: getGeneratorProject
      summary: Get generator project
      description: Get full project state including interview spec, components, and session. Requires `generator:read` scope.
      tags: [Generator]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
          description: Project ID (e.g. gen-1742300000000-abc123)
      responses:
        '200':
          description: Project state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          project:
                            type: object
                            nullable: true
                          interviewSpec:
                            type: object
                            nullable: true
                          components:
                            type: array
                            items:
                              type: object
                          session:
                            type: object
                            nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/generator/{projectId}/interview:
    post:
      operationId: saveGeneratorInterviewSpec
      summary: Save interview spec
      description: Save or replace the interview spec for a project. Writes with owner visibility so agent JWTs can read it. Requires generator:write scope.
      tags: [Generator]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
          description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interviewSpec]
              properties:
                interviewSpec:
                  type: object
                  description: Interview specification object (validated by generator-validate service)
      responses:
        '200':
          description: Interview spec saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          saved: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation error - interview spec failed schema validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

  /v1/generator/{projectId}/steps/blueprint:
    post:
      operationId: submitGeneratorBlueprint
      summary: Validate and store blueprint
      description: |
        Validates the blueprint JSON submitted by the agent. On validation failure, returns
        `valid: false` with structured errors (HTTP 200) so the agent can correct and retry —
        nothing is written to memory. On success, stores the blueprint in the project record
        and sets status to `blueprint_ready`. Requires `generator:write` scope.
      tags: [Generator]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
          description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              properties:
                blueprint:
                  type: string
                  description: Blueprint JSON string to validate and store
      responses:
        '200':
          description: Validation result (valid or invalid — check `data.valid`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          valid: { type: boolean }
                          errors: { type: array, items: { type: string } }
                          warnings: { type: array, items: { type: string } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/generator/{projectId}/components/{componentId}/submit:
    post:
      operationId: submitGeneratorComponent
      summary: Validate and store component content
      description: |
        Validates component content submitted by the agent. On validation failure, returns
        `valid: false` with structured errors (HTTP 200) — nothing is written to memory.
        On success, writes the validated component to `generator.{id}.component.{componentId}`.
        Requires `generator:write` scope.
      tags: [Generator]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
          description: Project ID
        - name: componentId
          in: path
          required: true
          schema: { type: string }
          description: Component ID (matches blueprint component id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, content]
              properties:
                type:
                  type: string
                  enum: [csm, msm, extension, app, memory, translation, cortex]
                  description: Component type
                content:
                  type: string
                  description: Component content string to validate and store
      responses:
        '200':
          description: Validation result (valid or invalid — check `data.valid`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          valid: { type: boolean }
                          errors: { type: array, items: { type: string } }
                          warnings: { type: array, items: { type: string } }
                          extracted:
                            description: Extracted/normalized content (string or object for cortex)
                            nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/generator/{projectId}/components/{componentId}/register:
    post:
      tags: [Generator]
      summary: Register a validated component into the AIMEAT catalogue
      operationId: generatorRegisterComponent
      description: >
        Register a previously submitted and validated component (status `ready`) into the AIMEAT
        catalogue. Resolves the agent's owner GHII and calls storage registration methods directly,
        bypassing owner-only HTTP routes. After successful registration the component status is
        updated to `registered`. Types `memory`, `translation`, and `cortex` are stored in generator
        memory keys only and require no catalogue registration — this endpoint is a no-op for them.
        Requires `generator:execute` scope.
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Component registered successfully
        '400':
          description: Component not ready or unsupported type
        '403':
          description: Agent record not found
        '404':
          description: Component not found
        '500':
          description: Registration error

  /v1/generator/{projectId}/log:
    post:
      operationId: writeGeneratorLog
      summary: Write a generator log entry
      description: |
        Writes a log entry to `generator.{projectId}.logs.{taskId}` in memory.
        Used by agents to record progress, warnings, and errors during generation.
        Requires `generator:execute` scope.
      tags: [Generator]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
          description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, level, message]
              properties:
                taskId:
                  type: string
                  description: Unique task/step identifier for this log entry
                level:
                  type: string
                  enum: [info, warn, error]
                  description: Log level
                message:
                  type: string
                  description: Log message
                meta:
                  description: Optional structured metadata
                  nullable: true
      responses:
        '200':
          description: Log entry written
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/generator/{projectId}/complete:
    post:
      operationId: completeGeneratorProject
      summary: Mark project active and release session
      description: |
        Marks the project status as `active` and records `completedAt`. Also releases the
        execution session if one exists. Called by the agent when all components have been
        successfully submitted. Requires `generator:execute` scope.
      tags: [Generator]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
          description: Project ID
      responses:
        '200':
          description: Project marked active
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: active }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'


  /v1/generator/{projectId}/settings:
    post:
      operationId: saveGeneratorProjectSettings
      summary: Store project settings values
      description: |
        Stores a full set of key-value settings for a generator project.
        Values are written to `generator.{projectId}.settings` in memory.
        Replaces the entire settings object — performs a full overwrite.
        `secretKeys` lists which keys hold sensitive values (for UI masking).
        Owner-only endpoint.
      tags: [Generator]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
          description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  description: Key-value settings to store
                  additionalProperties: true
                secretKeys:
                  type: array
                  description: Keys whose values are secrets (for UI masking)
                  items: { type: string }
      responses:
        '200':
          description: Settings stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          stored:
                            type: integer
                            description: Number of settings keys stored
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: getGeneratorProjectSettings
      summary: Retrieve project settings values
      description: |
        Returns the stored settings for a generator project.
        Reads from `generator.{projectId}.settings` in memory.
        Returns an empty `values` object if no settings have been stored.
        Owner-only endpoint.
      tags: [Generator]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
          description: Project ID
      responses:
        '200':
          description: Project settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          values:
                            type: object
                            description: Stored key-value settings
                            additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/generator/{projectId}/test:
    post:
      operationId: runGeneratorProjectTests
      summary: Run project component tests
      description: |
        Runs tests against the project's components in dependency order (topological sort).
        Level `none` returns an empty passed report immediately without executing tests.
        Level `basic` tests each registered component against its blueprint test scenarios.
        Level `comprehensive` runs the full test suite (reserved for future expansion).
        Requires an active blueprint with components. Owner-only endpoint.
      tags: [Generator]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
          description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level:
                  type: string
                  enum: [comprehensive, basic, none]
                  description: Test depth level (defaults to basic)
      responses:
        '200':
          description: Test report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          report:
                            type: object
                            properties:
                              level:
                                type: string
                                description: Test level used
                              timestamp:
                                type: string
                                format: date-time
                              overall:
                                type: string
                                enum: [passed, failed]
                                description: Overall test outcome
                              components:
                                type: array
                                description: Per-component test results
                                items:
                                  type: object
                                  properties:
                                    componentId: { type: string }
                                    type: { type: string }
                                    status:
                                      type: string
                                      enum: [passed, failed, skipped]
                                    scenarios: { type: integer }
                                    passed: { type: integer }
                                    errors:
                                      type: array
                                      items: { type: string }
                                    screenshots:
                                      type: array
                                      items: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/generator/{projectId}/screenshots/{filename}:
    get:
      operationId: getGeneratorScreenshot
      summary: Serve test screenshot image
      description: |
        Returns a PNG screenshot captured during test execution.
        Screenshots are stored in the server's temp directory keyed by project ID and filename.
        Owner-only endpoint.
      tags: [Generator]
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
          description: Project ID
        - name: filename
          in: path
          required: true
          schema: { type: string }
          description: Screenshot filename (e.g. step-001.png)
      responses:
        '200':
          description: PNG image binary
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # -- OpenRouter -----------------------------------------------
  /v1/openrouter/settings:
    put:
      operationId: saveOpenRouterSettings
      summary: Save OpenRouter API key and preferences
      description: Save API key and preferences for OpenRouter integration. Owner-only.
      tags: [OpenRouter]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey:
                  type: string
                  description: OpenRouter API key
                model:
                  type: string
                  description: Default model to use (e.g. openai/gpt-4o)
                autoRetry:
                  type: boolean
                  description: Whether to automatically retry failed completions
                maxRetries:
                  type: integer
                  description: Maximum number of retry attempts
                provider:
                  type: string
                  enum: [openrouter, lmstudio, custom]
                  description: AI provider type
                baseUrl:
                  type: string
                  format: uri
                  description: Custom API base URL (required for custom provider, optional for lmstudio)
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          saved: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Encryption not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

    get:
      operationId: getOpenRouterSettings
      summary: Get OpenRouter settings (API key not returned)
      description: Get current OpenRouter settings. The API key is never returned for security. Owner-only.
      tags: [OpenRouter]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          hasApiKey:
                            type: boolean
                            description: Whether an API key has been saved
                          model:
                            type: string
                            nullable: true
                            description: Currently configured default model
                          autoRetry:
                            type: boolean
                            description: Whether auto-retry is enabled
                          maxRetries:
                            type: integer
                            description: Maximum retry count
                          provider:
                            type: string
                            enum: [openrouter, lmstudio, custom]
                            default: openrouter
                            description: AI provider type
                          baseUrl:
                            type: string
                            format: uri
                            description: Custom API base URL
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Encryption not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

    delete:
      operationId: deleteOpenRouterSettings
      summary: Remove OpenRouter API key and settings
      description: Permanently removes the stored API key and all OpenRouter settings. Owner-only.
      tags: [OpenRouter]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Settings deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/openrouter/models:
    get:
      operationId: listOpenRouterModels
      summary: List available OpenRouter models
      description: Fetches the list of available models from OpenRouter using the configured API key. Owner-only.
      tags: [OpenRouter]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of available models
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          models:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Model identifier (e.g. openai/gpt-4o)
                                name:
                                  type: string
                                  description: Human-readable model name
                                description:
                                  type: string
                                  description: Model description
                                context_length:
                                  type: integer
                                  description: Maximum context window in tokens
                                pricing:
                                  type: object
                                  properties:
                                    prompt:
                                      type: string
                                      description: Cost per prompt token
                                    completion:
                                      type: string
                                      description: Cost per completion token
        '400':
          description: No API key configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
        '503':
          description: Encryption not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

  /v1/openrouter/test:
    post:
      operationId: testOpenRouterKey
      summary: Test OpenRouter API key validity
      description: Sends a minimal test request to OpenRouter to verify the stored API key is valid. Owner-only.
      tags: [OpenRouter]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: API key is valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                          model:
                            type: string
                            description: Model used for the test request
        '400':
          description: No API key configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
        '503':
          description: Encryption not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

  /v1/openrouter/complete:
    post:
      operationId: openRouterComplete
      summary: Run AI completion via OpenRouter
      description: |
        Sends a prompt to OpenRouter and returns the AI completion. Used by the generator
        pipeline to automate steps without requiring the user to copy/paste to an AI chat.
        Owner-only.
      tags: [OpenRouter]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, prompt]
              properties:
                projectId:
                  type: string
                  description: Generator project ID for context and logging
                prompt:
                  type: string
                  description: The user prompt to send to the AI model
                systemPrompt:
                  type: string
                  description: Optional system prompt to prepend
                model:
                  type: string
                  description: Override the default model for this request
      responses:
        '200':
          description: Completion result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: string
                            description: The AI model's response text
                          model:
                            type: string
                            description: The model that produced the response
        '400':
          description: Invalid request body or no API key configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
        '429':
          description: Rate limited by OpenRouter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
        '502':
          description: OpenRouter returned an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
        '503':
          description: Encryption not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

  # ── Capabilities ──────────────────────────────────────────────────

  /v1/capabilities:
    get:
      tags: [Capabilities]
      summary: List and search capabilities
      description: Returns all public active capabilities. Supports search, tag filtering, callable filtering, and pagination.
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: tags
          in: query
          schema: { type: string }
        - name: callable
          in: query
          schema: { type: boolean }
        - name: authRequired
          in: query
          schema: { type: string, enum: [none, anonymous, registered] }
        - name: source_type
          in: query
          schema: { type: string, enum: [extension, action, cortex, manual] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Capability list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
    post:
      tags: [Capabilities]
      summary: Create a manual capability
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id: { type: string }
                name: { type: string }
                summary: { type: string }
                callable: { type: boolean }
                visibility: { type: string, enum: [private, owner, group, public] }
                webhookUrl: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        '201':
          description: Capability created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

  /v1/capabilities/{id}:
    get:
      tags: [Capabilities]
      summary: Get capability detail with schemas, examples, exports, dependencies
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Capability detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
    put:
      tags: [Capabilities]
      summary: Update own capability
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
    delete:
      tags: [Capabilities]
      summary: Delete own manual capability
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

  /v1/capabilities/{id}/invoke:
    post:
      tags: [Capabilities]
      summary: Invoke a callable capability
      description: Proxies to extension or webhook. Cortex returns BROWSER_ONLY. Non-callable returns NOT_CALLABLE with usage.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: mode
          in: query
          schema: { type: string, enum: [normal, raw] }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input: { type: object }
      responses:
        '200':
          description: Invoke result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

  /v1/capabilities/{id}/telemetry:
    post:
      tags: [Capabilities]
      summary: Record client-side telemetry (fire-and-forget)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Recorded

  /v1/admin/capabilities:
    get:
      tags: [Capabilities, Admin]
      summary: List all capabilities (operator sees all visibilities)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

  /v1/admin/capabilities/{id}/override:
    put:
      tags: [Capabilities, Admin]
      summary: Set operator override (disable, notes, visibility)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated with override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

  /v1/admin/capabilities/{id}/logs:
    get:
      tags: [Capabilities, Admin]
      summary: View capability invocation logs and stats
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [success, error] }
      responses:
        '200':
          description: Logs and stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'

  # ============================================================
  # Agent Tasks
  # ============================================================

  /v1/agents/{name}/tasks:
    post:
      operationId: createAgentTask
      summary: Create a task for an agent
      description: Create a new task in draft or queued status for the specified agent.
      tags: [Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: Agent name (not full GAII)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [draft, queued]
                  default: draft
                todos:
                  type: array
                  items:
                    type: object
                    properties:
                      text: { type: string }
                      done: { type: boolean, default: false }
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: listAgentTasks
      summary: List tasks for an agent
      description: List all tasks for the specified agent, optionally filtered by status.
      tags: [Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: Agent name
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasks:
                            type: array
                            items:
                              $ref: '#/components/schemas/AgentTask'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{name}/tasks/{id}:
    get:
      operationId: getAgentTask
      summary: Get task detail
      description: Get full task detail including all events and TODO items.
      tags: [Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAgentTask
      summary: Update a task
      description: Update task title, description, or TODO items. Only draft and queued tasks can have their title/description changed.
      tags: [Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                todos:
                  type: array
                  items:
                    type: object
                    properties:
                      text: { type: string }
                      done: { type: boolean }
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAgentTask
      summary: Delete a task
      description: Delete a task. Only draft and queued tasks can be deleted.
      tags: [Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{name}/tasks/{id}/start:
    post:
      operationId: startAgentTask
      summary: Start a task
      description: Transition a queued task to active status. Only queued tasks can be started.
      tags: [Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Task started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/agents/{name}/tasks/{id}/event:
    post:
      operationId: addTaskEvent
      summary: Add an event to a task
      description: Append a progress, log, or status event to an active task.
      tags: [Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [progress, log, stalled]
                message:
                  type: string
                details:
                  type: object
      responses:
        '200':
          description: Event added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{name}/tasks/{id}/complete:
    post:
      operationId: completeAgentTask
      summary: Complete a task
      description: Mark an active task as done with an optional completion message.
      tags: [Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Completion summary
      responses:
        '200':
          description: Task completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/agents/{name}/tasks/{id}/fail:
    post:
      operationId: failAgentTask
      summary: Fail a task
      description: Mark an active task as failed with an error message.
      tags: [Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Failure reason
      responses:
        '200':
          description: Task failed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/agents/{name}/tasks/{id}/events:
    get:
      operationId: listTaskEvents
      summary: List task events
      description: Get the full event history for a task.
      tags: [Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Task events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          events:
                            type: array
                            items:
                              $ref: '#/components/schemas/TaskEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Agent Integration
  # ============================================================

  /v1/agents/{name}/inbox:
    get:
      operationId: getAgentInbox
      summary: Agent inbox
      description: |
        Returns pending tasks, directives, and notifications for the agent.
        Designed for agents to poll on startup or periodically.
      tags: [Agent Integration]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agent inbox contents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasks:
                            type: array
                            items:
                              $ref: '#/components/schemas/AgentTask'
                          directives:
                            $ref: '#/components/schemas/AgentDirectives'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{name}/integration-kit:
    get:
      operationId: getAgentIntegrationKit
      summary: Agent integration kit
      description: |
        Returns the full integration context for an agent: directives, available
        memory areas, capabilities, and connection details. Agents use this on
        first connect to understand their operating environment.
      tags: [Agent Integration]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Integration kit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimeatEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{name}/tasks/wait:
    get:
      operationId: waitForAgentTask
      summary: Long-poll for new tasks
      description: |
        Long-poll endpoint that blocks until a new task is available for the agent
        or the timeout expires. Returns the next queued task if one exists.
      tags: [Agent Integration]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: timeout
          in: query
          schema:
            type: integer
            default: 30
            maximum: 120
          description: Maximum seconds to wait before returning empty
      responses:
        '200':
          description: Task available or timeout
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task:
                            $ref: '#/components/schemas/AgentTask'
                            nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Agent Directives
  # ============================================================

  /v1/agents/{name}/directives:
    get:
      operationId: getAgentDirectives
      summary: Get merged agent directives
      description: |
        Returns the merged view of agent directives combining system defaults,
        owner defaults, and agent-specific overrides. Rules are ordered by
        source priority: system, owner, agent.
      tags: [Agent Directives]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Merged directives
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentDirectives'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: upsertAgentDirectives
      summary: Set agent directives
      description: Create or replace the agent-specific directives. System and owner rules cannot be modified through this endpoint.
      tags: [Agent Directives]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      text: { type: string }
                memoryAreas:
                  type: array
                  items:
                    type: object
                    properties:
                      key: { type: string }
                      description: { type: string }
                      access: { type: string, enum: [read, write, readwrite] }
                resources:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      uri: { type: string }
                      description: { type: string }
      responses:
        '200':
          description: Directives saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentDirectives'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: resetAgentDirectives
      summary: Reset agent directives to defaults
      description: Remove all agent-specific directive overrides. System and owner defaults will still apply.
      tags: [Agent Directives]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Agent Messages
  # ============================================================

  /v1/agents/{name}/messages:
    post:
      operationId: sendAgentMessage
      summary: Send message to agent
      description: Send an inbound message (owner to agent) or outbound message (agent to user)
      tags: [Agent Messages]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Agent name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageCreate'
      responses:
        '200':
          description: Message created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentMessageRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: listAgentMessages
      summary: List message history
      description: Paginated message history with optional direction and thread filters
      tags: [Agent Messages]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: direction
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
        - name: thread_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          messages:
                            type: array
                            items:
                              $ref: '#/components/schemas/AgentMessageRecord'
                          total:
                            type: integer
                          page:
                            type: integer
                          per_page:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{name}/messages/inbox:
    get:
      operationId: getAgentInbox
      summary: Get pending inbound messages
      description: Returns messages with status 'pending' and direction 'inbound' (agent polling endpoint)
      tags: [Agent Messages]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pending messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          messages:
                            type: array
                            items:
                              $ref: '#/components/schemas/AgentMessageRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{name}/messages/threads:
    get:
      operationId: listAgentMessageThreads
      summary: List conversation threads
      description: Returns thread summaries with last message preview and message count
      tags: [Agent Messages]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thread list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          threads:
                            type: array
                            items:
                              type: object
                              properties:
                                threadId:
                                  type: string
                                  format: uuid
                                lastMessage:
                                  $ref: '#/components/schemas/AgentMessageRecord'
                                messageCount:
                                  type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{name}/messages/{id}:
    patch:
      operationId: updateAgentMessageStatus
      summary: Update message status
      description: Transition message status (pending -> processing -> delivered/error)
      tags: [Agent Messages]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageStatusUpdate'
      responses:
        '200':
          description: Message updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentMessageRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Agent Capabilities & Activity
  # ============================================================

  /v1/agents/{name}/capabilities:
    put:
      operationId: reportAgentCapabilities
      summary: Report agent capabilities
      tags: [Agents]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                technical:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [mcp, skill, tool]
                  maxItems: 100
                domain:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                languages:
                  type: array
                  items:
                    type: string
                  maxItems: 20
      responses:
        '200':
          description: Capabilities updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: getAgentCapabilities
      summary: Get agent capabilities
      tags: [Agents]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent capabilities and activity stats
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{name}/activity:
    get:
      operationId: getAgentActivity
      summary: Get agent activity stats and history
      tags: [Agents]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
            default: 30
        - name: granularity
          in: query
          schema:
            type: string
            enum: [daily, hourly]
            default: daily
      responses:
        '200':
          description: Activity stats, history, and scheduled jobs
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/agents/{name}/activity/log:
    get:
      operationId: getAgentActivityLog
      summary: Get agent activity event log
      tags: [Agents]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated event log
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Owner Agent Defaults
  # ============================================================

  /v1/owner/agent-defaults:
    get:
      operationId: getOwnerAgentDefaults
      summary: Get owner's agent defaults
      description: Returns the default rules and settings the owner has configured for all their agents.
      tags: [Agent Directives]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Agent defaults
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentDefaults'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: upsertOwnerAgentDefaults
      summary: Set owner's agent defaults
      description: Create or replace the owner's default rules and settings applied to all their agents.
      tags: [Agent Directives]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      text: { type: string }
                tokenBudget:
                  type: integer
      responses:
        '200':
          description: Defaults saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentDefaults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Sharing Groups
  # ============================================================

  /v1/groups:
    post:
      operationId: createSharingGroup
      summary: Create a sharing group
      description: Create a new sharing group. The creator is automatically added as an admin member.
      tags: [Sharing Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SharingGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      operationId: listSharingGroups
      summary: List sharing groups
      description: List all sharing groups the authenticated user is a member of or owns.
      tags: [Sharing Groups]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          groups:
                            type: array
                            items:
                              $ref: '#/components/schemas/SharingGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/groups/{id}:
    get:
      operationId: getSharingGroup
      summary: Get sharing group detail
      description: Get full detail of a sharing group including members and entry count.
      tags: [Sharing Groups]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Group detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SharingGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSharingGroup
      summary: Update sharing group
      description: Update group name or description. Requires admin role in the group.
      tags: [Sharing Groups]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SharingGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSharingGroup
      summary: Delete a sharing group
      description: Delete a sharing group. Only the group owner can delete it. All group visibility references become invalid.
      tags: [Sharing Groups]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/groups/{id}/members:
    post:
      operationId: addSharingGroupMember
      summary: Add a member to a sharing group
      description: Add a user or agent to the sharing group with a specified role. Requires admin role.
      tags: [Sharing Groups]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  description: GAII or GHII of the member to add
                role:
                  type: string
                  enum: [reader, writer, admin]
                  default: reader
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SharingGroupMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/groups/{id}/members/{identifier}:
    patch:
      operationId: updateSharingGroupMember
      summary: Update a member's role
      description: Change a member's role in the sharing group. Requires admin role.
      tags: [Sharing Groups]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: identifier
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded GAII or GHII
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [reader, writer, admin]
      responses:
        '200':
          description: Member role updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SharingGroupMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: removeSharingGroupMember
      summary: Remove a member from a sharing group
      description: Remove a user or agent from the sharing group. Requires admin role or the member themselves.
      tags: [Sharing Groups]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: identifier
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded GAII or GHII
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Admin — Agent Tasks & Sharing Groups
  # ============================================================

  /v1/admin/agent-tasks:
    get:
      operationId: adminListAgentTasks
      summary: List all agent tasks (operator)
      description: Returns all agent tasks across the node with optional status filter. Operator-only.
      tags: [Admin, Agent Tasks]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: All agent tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasks:
                            type: array
                            items:
                              $ref: '#/components/schemas/AgentTask'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/sharing-groups:
    get:
      operationId: adminListSharingGroups
      summary: List all sharing groups (operator)
      description: Returns all sharing groups on the node with member counts. Operator-only.
      tags: [Admin, Sharing Groups]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All sharing groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          groups:
                            type: array
                            items:
                              $ref: '#/components/schemas/SharingGroup'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

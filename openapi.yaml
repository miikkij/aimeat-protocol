      tags: [Federation]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/admin/peering/requests/{id}:
    put:
      operationId: decidePeering
      summary: Approve/reject peering request
      tags: [Federation]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeeringDecision'
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/federation/peer/activate:
    post:
      operationId: activatePeering
      summary: Activate approved peering
      tags: [Federation]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [peer_node_id]
              properties:
                peer_node_id:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/federation/heartbeat:
    post:
      operationId: peerHeartbeat
      summary: Peer health heartbeat
      description: Node-to-node health check. Authenticated with federation keys. Exchanged every 60 seconds between peers.
      tags: [Federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationHeartbeat'
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FederationHeartbeat'

  /v1/federation/peers:
    get:
      operationId: listPeers
      summary: List peers
      tags: [Federation]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of peered nodes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          peers:
                            type: array
                            items:
                              $ref: '#/components/schemas/PeerInfo'

  /v1/federation/directory:
    get:
      operationId: getDirectory
      summary: Network node directory
      description: Public directory of all known nodes in the federation.
      tags: [Catalogue]
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/federation/peers/{id}:
    put:
      operationId: updatePeer
      summary: Update peer config
      tags: [Federation]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

    delete:
      operationId: depeer
      summary: De-peer
      description: Remove a peered node. Use ?emergency=true for immediate de-peering (no grace period).
      tags: [Federation]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: emergency
          in: query
          schema:
            type: boolean
            default: false
          description: Emergency de-peering (immediate, no grace period)
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  # ── Federation Internal (node-to-node) ─────────────────────
  /v1/federation/ping:
    post:
      operationId: federationPing
      summary: Federation health check
      description: |
        Node-to-node ping. No auth required. If `from_node` matches a known
        peer, that peer's `lastSeen` and status are updated.
      tags: [Federation]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from_node:
                  type: string
                  description: Sending node's ID (optional)
      responses:
        '200':
          description: Pong response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pong:
                            type: boolean
                          node_id:
                            type: string
                          timestamp:
                            type: string
                            format: date-time

  /v1/federation/replicate:
    post:
      operationId: federationReplicate
      summary: Receive replicated memory
      description: |
        Accept a memory entry replicated from a peer node. The source node must
        be an active peer. Memory is stored with a `replica:{source}:` key prefix.
      tags: [Federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_node, gaii, key, value, version]
              properties:
                source_node:
                  type: string
                gaii:
                  $ref: '#/components/schemas/GAII'
                key:
                  type: string
                value: {}
                visibility:
                  $ref: '#/components/schemas/Visibility'
                version:
                  type: integer
                timestamp:
                  type: string
                  format: date-time
                signature:
                  type: string
                  description: Ed25519 signature of the payload
      responses:
        '200':
          description: Replica accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          replicated:
                            type: boolean
                          key:
                            type: string
                          source_node:
                            type: string
                          version:
                            type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/federation/catalogue-sync:
    post:
      operationId: federationCatalogueSync
      summary: Receive catalogue updates from peer
      description: |
        Synchronise action catalogue entries from a peer node. Supports
        incremental sync via `since_timestamp`. New actions are created;
        existing federated actions are updated (upsert by federated ID).
      tags: [Federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_node, actions]
              properties:
                source_node:
                  type: string
                actions:
                  type: array
                  items:
                    type: object
                    required: [id, provider_gaii, display_name]
                    properties:
                      id:
                        type: string
                      provider_gaii:
                        $ref: '#/components/schemas/GAII'
                      display_name:
                        type: string
                      description:
                        type: string
                      category:
                        type: string
                      input_schema:
                        type: object
                      output_schema:
                        type: object
                      pricing:
                        type: object
                        properties:
                          base_morsels:
                            type: integer
                          per_unit:
                            type: number
                      tags:
                        type: array
                        items:
                          type: string
                      created_at:
                        type: string
                        format: date-time
                since_timestamp:
                  type: string
                  format: date-time
                  description: Only sync actions newer than this timestamp
                catalogue_hash:
                  type: string
                  description: Hash of the sender's full catalogue for consistency checks
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          synced:
                            type: integer
                            description: Newly created actions
                          updated:
                            type: integer
                            description: Updated existing actions
                          source_node:
                            type: string
                          total_received:
                            type: integer
                          incremental:
                            type: boolean
                          catalogue_hash:
                            type: string
                            nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/federation/key-exchange:
    post:
      operationId: federationKeyExchange
      summary: Exchange public keys with peer
      description: |
        Synchronise Ed25519 public keys between peered nodes. The peer must
        already exist in the federation registry.
      tags: [Federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, public_key]
              properties:
                node_id:
                  type: string
                public_key:
                  type: string
                  description: Ed25519 public key (hex)
                capabilities:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Key exchange accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          node_id:
                            type: string
                          public_key:
                            type: string
                          capabilities:
                            type: array
                            items:
                              type: string
                          accepted:
                            type: boolean
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/federation/trust-advisory:
    post:
      operationId: federationTrustAdvisory
      summary: Issue trust advisory
      description: |
        Issue a trust warning, suspension, or ban against a target node.
        Operator auth required. A `ban` advisory automatically de-peers the
        target node.
      tags: [Federation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_node, advisory_type, reason]
              properties:
                target_node:
                  type: string
                advisory_type:
                  type: string
                  enum: [warning, suspend, ban]
                reason:
                  type: string
                evidence_hash:
                  type: string
                  description: SHA-256 hash of supporting evidence
                issued_by:
                  type: string
                  description: Issuing node (defaults to this node)
      responses:
        '201':
          description: Advisory recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          target_node:
                            type: string
                          advisory_type:
                            type: string
                            enum: [warning, suspend, ban]
                          reason:
                            type: string
                          evidence_hash:
                            type: string
                          issued_by:
                            type: string
                          created_at:
                            type: string
                            format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Administration ─────────────────────────────────────────
  /v1/admin/dashboard:
    get:
      operationId: getDashboard
      summary: Dashboard
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Node dashboard
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dashboard'

  /v1/admin/config:
    get:
      operationId: getConfig
      summary: View config
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

    put:
      operationId: updateConfig
      summary: Update config (atomic)
      description: |
        Atomic configuration update. Send complete config object.
        AI-driven configuration is supported — an operator-level AI agent can
        tune the node via this endpoint.
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Full node configuration (see Appendix B)
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/admin/roles/grant:
    post:
      operationId: grantRole
      summary: Grant operator role
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, role]
              properties:
                owner:
                  type: string
                role:
                  type: string
                  enum: [operator]
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  # ── Additional Implemented Endpoints ───────────────────────

  /v1/health:
    get:
      operationId: getHealth
      summary: Health check
      description: Liveness/readiness endpoint. No auth required.
      tags: [Bootstrap]
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/auth/otk:
    post:
      operationId: generateOtk
      summary: Generate one-time key
      description: Create a one-time key for Tier 0.5 operations (GET-based writes).
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, params]
              properties:
                action:
                  type: string
                  description: Operation type (write_memory, post_board, etc.)
                params:
                  type: object
                  description: Parameters for the OTK operation
                ttl_minutes:
                  type: integer
                  default: 60
      responses:
        '201':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/otk/{key}:
    get:
      operationId: executeOtk
      summary: Execute one-time key
      description: |
        Execute a previously generated one-time key (Tier 0.5). No auth
        required — the key itself is the credential. Currently supports
        the `write_memory` action. The key is consumed on first use.
      tags: [Auth]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The one-time key token
      responses:
        '200':
          description: OTK action executed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          action:
                            type: string
                            example: write_memory
                          key:
                            type: string
                          written:
                            type: boolean
        '401':
          description: Session expired due to inactivity
        '404':
          description: One-time key not found, expired, or already used

  # ── Chunked Upload ─────────────────────────────────────────

  /v1/storage/upload/init:
    post:
      operationId: initChunkedUpload
      summary: Initiate chunked upload
      description: Start a multi-part file upload for large files.
      tags: [Storage]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, mime_type, chunk_size]
              properties:
                key:
                  type: string
                mime_type:
                  type: string
                chunk_size:
                  type: integer
                visibility:
                  $ref: '#/components/schemas/Visibility'
                total_chunks:
                  type: integer
      responses:
        '201':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/storage/upload/{id}/{chunk}:
    put:
      operationId: uploadChunk
      summary: Upload a single chunk
      tags: [Storage]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: chunk
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/storage/upload/{id}/complete:
    post:
      operationId: completeChunkedUpload
      summary: Finalize chunked upload
      description: Assemble all uploaded chunks into the final file.
      tags: [Storage]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/storage/upload/{id}:
    delete:
      operationId: abortChunkedUpload
      summary: Abort chunked upload
      tags: [Storage]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  # ── Admin Extensions ───────────────────────────────────────

  /v1/admin/agents:
    get:
      operationId: listAllAgents
      summary: List all agents (operator)
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/admin/stats:
    get:
      operationId: getAdminStats
      summary: System statistics (operator)
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/admin/backup:
    get:
      operationId: getBackup
      summary: Export all data
      description: Full data backup as JSON. Operator only.
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/admin/restore:
    post:
      operationId: restoreBackup
      summary: Import data from backup
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/admin/hooks:
    get:
      operationId: listHooks
      summary: List extension hooks
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/admin/hooks/{hookName}:
    put:
      operationId: setHook
      summary: Set hook action URLs
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: hookName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actions]
              properties:
                actions:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

    delete:
      operationId: clearHook
      summary: Clear hook
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: hookName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  # ── MCP (Model Context Protocol) ───────────────────────────

  /v1/mcp:
    post:
      operationId: mcpExecute
      summary: Execute MCP tool call
      description: Streamable HTTP transport for MCP protocol. Optional extension.
      tags: [MCP]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: MCP response (may be SSE stream)

    get:
      operationId: mcpResources
      summary: List MCP resources
      tags: [MCP]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: MCP resource list

    delete:
      operationId: mcpDeleteSession
      summary: Delete MCP session
      tags: [MCP]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/mcp/register:
    post:
      operationId: mcpRegisterClient
      summary: Register MCP OAuth client
      description: Dynamic client registration for MCP OAuth 2.1 flow.
      tags: [MCP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/mcp/authorize:
    get:
      operationId: mcpAuthorize
      summary: MCP OAuth authorization endpoint
      description: Initiates OAuth 2.1 authorization code flow for MCP clients.
      tags: [MCP]
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to callback with authorization code

  /v1/mcp/token:
    post:
      operationId: mcpToken
      summary: MCP OAuth token exchange
      description: Exchange authorization code for access token (MCP OAuth 2.1).
      tags: [MCP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                code:
                  type: string
                client_id:
                  type: string
                code_verifier:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/mcp/token/revoke:
    post:
      operationId: mcpRevokeToken
      summary: Revoke MCP OAuth token
      tags: [MCP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthServerMetadata
      summary: OAuth 2.0 Authorization Server Metadata
      description: RFC 8414 discovery document for MCP OAuth integration.
      tags: [MCP]
      responses:
        '200':
          description: OAuth server metadata
          content:
            application/json:
              schema:
                type: object

  # ====================================================================
  # Phase 0: Foundation Endpoints
  # ====================================================================

  # --- Phase 0.1: Schema Locking ---

  /v1/memory/{key}/schema:
    put:
      operationId: setMemorySchema
      summary: Set schema for a memory key pattern
      description: |
        Lock a memory key (or key prefix) to a JSON Schema. All future writes
        to matching keys will be validated against this schema. Requires operator role.
      tags: [Schema]
      security:
        - BearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Memory key or key prefix to lock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaLockRequest'
      responses:
        '200':
          description: Schema set successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          key:
                            type: string
                          apply_to:
                            type: string
                          schema_mode:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Invalid JSON Schema
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: VALIDATION_ERROR

    get:
      operationId: getMemorySchema
      summary: Get schema for a memory key
      description: Retrieve the JSON Schema locked to a specific memory key or prefix. No authentication required.
      tags: [Schema]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Memory key to look up
      responses:
        '200':
          description: Schema for the key
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          key:
                            type: string
                          apply_to:
                            type: string
                          schema_mode:
                            type: string
                          schema:
                            type: object
                          semantic_context:
                            $ref: '#/components/schemas/SemanticAnnotation'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteMemorySchema
      summary: Remove schema from a memory key
      description: Remove the schema lock from a memory key pattern. Requires operator role.
      tags: [Schema]
      security:
        - BearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Memory key to unlock
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/schemas:
    get:
      operationId: listSchemas
      summary: List all schemas
      description: List all registered schema locks on this node. No authentication required.
      tags: [Schema]
      parameters:
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of schema locks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            apply_to:
                              type: string
                            schema_mode:
                              type: string
                            schema:
                              type: object
                            semantic_context:
                              $ref: '#/components/schemas/SemanticAnnotation'

  # --- Phase 0.2: CSM (Community Service Manifest) ---

  /v1/csm:
    post:
      operationId: registerCsm
      summary: Register a Community Service Manifest
      description: |
        Register a new CSM service definition. Accepts either YAML (text/yaml)
        or JSON (application/json) request body. Requires operator role.
      tags: [CSM]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsmDefinition'
          text/yaml:
            schema:
              type: string
              description: YAML CSM definition
      responses:
        '201':
          description: CSM registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CsmDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: CSM with this name already exists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: NAME_TAKEN
        '422':
          description: Invalid CSM definition
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: VALIDATION_ERROR

    get:
      operationId: listCsm
      summary: List CSM services
      description: List all registered Community Service Manifests. No authentication required.
      tags: [CSM]
      parameters:
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
        - name: service_type
          in: query
          schema:
            type: string
          description: Filter by service type
      responses:
        '200':
          description: List of CSM services
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CsmDefinition'

  /v1/csm/{name}:
    get:
      operationId: getCsm
      summary: Get a single CSM
      description: Retrieve a Community Service Manifest by name. No authentication required.
      tags: [CSM]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: CSM service name
      responses:
        '200':
          description: CSM definition
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CsmDefinition'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteCsm
      summary: Delete a CSM
      description: Remove a Community Service Manifest by name. Requires operator role.
      tags: [CSM]
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: CSM service name
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Phase 0.3: Consent Layer ---

  /v1/consent:
    post:
      operationId: createConsent
      summary: Create a consent grant
      description: |
        Grant consent for a specific data pattern to be shared with a recipient
        for a stated purpose. Requires agent authentication.
      tags: [Consent]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrant'
      responses:
        '201':
          description: Consent grant created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/ConsentGrant'
                          - type: object
                            properties:
                              id:
                                type: string
                              created_at:
                                type: string
                                format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid consent grant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: VALIDATION_ERROR

    get:
      operationId: listConsent
      summary: List own consent grants
      description: List all consent grants for the authenticated agent.
      tags: [Consent]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
        - name: recipient
          in: query
          schema:
            type: string
          description: Filter by recipient
        - name: scope
          in: query
          schema:
            type: string
            enum: [private, dmz, federation]
          description: Filter by scope
      responses:
        '200':
          description: List of consent grants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/ConsentGrant'
                            - type: object
                              properties:
                                id:
                                  type: string
                                created_at:
                                  type: string
                                  format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/consent/{id}:
    get:
      operationId: getConsent
      summary: Get a single consent grant
      description: Retrieve a specific consent grant by ID. Requires agent authentication.
      tags: [Consent]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Consent grant ID
      responses:
        '200':
          description: Consent grant details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/ConsentGrant'
                          - type: object
                            properties:
                              id:
                                type: string
                              created_at:
                                type: string
                                format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: revokeConsent
      summary: Revoke a consent grant
      description: Revoke a previously issued consent grant. Requires agent authentication.
      tags: [Consent]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Consent grant ID to revoke
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/consent/audit:
    get:
      operationId: consentAuditLog
      summary: View consent audit log
      description: |
        Retrieve the audit log of consent-related events (grants, revocations,
        access checks) for the authenticated agent.
      tags: [Consent]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
        - name: action
          in: query
          schema:
            type: string
            enum: [grant, revoke, access_check, denied]
          description: Filter by audit event type
      responses:
        '200':
          description: Consent audit log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            action:
                              type: string
                              enum: [grant, revoke, access_check, denied]
                            consent_id:
                              type: string
                            data_pattern:
                              type: string
                            recipient:
                              type: string
                            timestamp:
                              type: string
                              format: date-time
                            details:
                              type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- Phase 0.5: TOTP Two-Factor Authentication ---

  /v1/ghii/totp/setup:
    post:
      operationId: totpSetup
      summary: Enable TOTP two-factor authentication
      description: |
        Generate a TOTP secret and QR code for the authenticated owner.
        The owner must verify the code via /v1/ghii/totp/verify to complete setup.
      tags: [TOTP]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: TOTP setup initiated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TotpSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: TOTP already enabled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: TOTP_ALREADY_ENABLED

  /v1/ghii/totp/verify:
    post:
      operationId: totpVerify
      summary: Verify TOTP to confirm setup
      description: |
        Submit a TOTP code to confirm two-factor authentication setup.
        Must be called after /v1/ghii/totp/setup to activate 2FA.
      tags: [TOTP]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^\d{6}$'
                  description: Six-digit TOTP code from authenticator app
      responses:
        '200':
          description: TOTP verified and enabled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                          backup_codes:
                            type: array
                            items:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid TOTP code
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: VALIDATION_ERROR

  /v1/ghii/totp:
    delete:
      operationId: totpDisable
      summary: Disable TOTP two-factor authentication
      description: Disable TOTP 2FA for the authenticated owner. Requires current TOTP code or backup code.
      tags: [TOTP]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Current TOTP code or backup code
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid TOTP code
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: VALIDATION_ERROR

  /v1/ghii/totp/backup-codes:
    post:
      operationId: totpRegenerateBackupCodes
      summary: Regenerate TOTP backup codes
      description: |
        Regenerate backup codes for TOTP 2FA. Invalidates all previously
        issued backup codes. Requires current TOTP code for verification.
      tags: [TOTP]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Current TOTP code for verification
      responses:
        '200':
          description: New backup codes generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          backup_codes:
                            type: array
                            items:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid TOTP code
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: VALIDATION_ERROR

  # ============================================================
  # Phase 1.3: GHII Web Registration & Magic Link
  # ============================================================

  /v1/ghii/register-web:
    post:
      operationId: ghiiRegisterWeb
      summary: Web registration for humans
      description: |
        Register a new human owner via the web portal. Creates an owner record,
        GHII, and profile. No authentication required. If email is provided,
        a verification code is sent and the response includes a verificationId.
      tags: [GHII-Web]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebRegistrationRequest'
      responses:
        '201':
          description: Owner registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WebRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Username already taken
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: NAME_TAKEN
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Email service not configured (registration succeeds but email not sent)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: EMAIL_UNAVAILABLE

  /v1/ghii/verify-email:
    post:
      operationId: ghiiVerifyEmail
      summary: Verify email with code
      description: |
        Verify an email address using the six-digit code sent during registration.
        On success, returns the GHII, updated verification level, and a JWT token.
      tags: [GHII-Web]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ghii:
                            type: string
                          verificationLevel:
                            type: string
                            enum: [email_verified]
                          token:
                            type: string
                            description: JWT session token
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Verification session not found or expired
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: NOT_FOUND
        '422':
          description: Invalid verification code
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: VALIDATION_ERROR
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ghii/magic-link:
    post:
      operationId: ghiiMagicLink
      summary: Request magic link login
      description: |
        Request a magic link to be sent to the specified email address.
        Always returns 200 to prevent email enumeration attacks.
        If the email is registered, a magic link is sent.
      tags: [GHII-Web]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '200':
          description: Magic link request acknowledged (always 200)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: If this email is registered, a magic link has been sent.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ghii/magic-link/verify:
    get:
      operationId: ghiiMagicLinkVerify
      summary: Verify magic link token
      description: |
        Verify a magic link token from the email. Returns the GHII and
        a JWT session token on success. The token is single-use and expires
        after a short period.
      tags: [GHII-Web]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Magic link token from the email
      responses:
        '200':
          description: Magic link verified, session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ghii:
                            type: string
                          token:
                            type: string
                            description: JWT session token
        '400':
          description: Invalid or expired magic link token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: INVALID_INPUT
        '429':
          $ref: '#/components/responses/RateLimited'

  # ============================================================
  # Phase 1.4: Directories
  # ============================================================

  /v1/catalogue/directory:
    get:
      operationId: searchDirectory
      summary: Search the people directory
      description: |
        Search the people directory with faceted filtering. Supports filtering
        by type, city, area, country, interests, and geo-radius. Returns
        paginated results with facet counts for cities and interests.
        No authentication required (Tier 0).
      tags: [Directories]
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [people, agents]
          description: Directory type to search
        - name: city
          in: query
          schema:
            type: string
          description: Filter by city name
        - name: area
          in: query
          schema:
            type: string
          description: Filter by area/region
        - name: country
          in: query
          schema:
            type: string
          description: Filter by ISO country code
        - name: interest
          in: query
          schema:
            type: string
          description: Filter by a single interest
        - name: interests
          in: query
          schema:
            type: string
          description: Comma-separated list of interests (OR match)
        - name: radius_km
          in: query
          schema:
            type: number
          description: Radius in kilometers for geo search (requires lat/lon)
        - name: lat
          in: query
          schema:
            type: number
          description: Latitude for geo-radius search
        - name: lon
          in: query
          schema:
            type: number
          description: Longitude for geo-radius search
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Directory search results with facets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DirectorySearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/catalogue/directory/stats:
    get:
      operationId: getDirectoryStats
      summary: Directory statistics
      description: |
        Get aggregate statistics for the people directory including total
        registered people, top interests, and top cities. No authentication
        required (Tier 0).
      tags: [Directories]
      responses:
        '200':
          description: Directory statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DirectoryStats'

  # ============================================================
  # Phase 1.5: Data Quality Flags
  # ============================================================

  /v1/flags:
    post:
      operationId: createFlag
      summary: Create a quality flag
      description: |
        Flag a resource (profile, memory, action, board post) for quality issues.
        Requires authentication. Each user can only flag a given target once.
      tags: [Flags]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagRequest'
      responses:
        '201':
          description: Flag created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FlagRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: User has already flagged this target
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: ALREADY_FLAGGED
        '429':
          $ref: '#/components/responses/RateLimited'

    get:
      operationId: listFlags
      summary: List all flags (operator only)
      description: |
        List all quality flags across the node. Operator-only endpoint.
        Supports filtering by status and target type with pagination.
      tags: [Flags]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, reviewed, dismissed, actioned]
          description: Filter by flag status
        - name: targetType
          in: query
          schema:
            type: string
            enum: [profile, memory, action, board_post]
          description: Filter by target resource type
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of flags
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          flags:
                            type: array
                            items:
                              $ref: '#/components/schemas/FlagRecord'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/flags/summary/{targetType}/{targetId}:
    get:
      operationId: getFlagSummary
      summary: Get flag summary for a target
      description: |
        Get a summary of flags for a specific target resource. Public endpoint
        (no auth required). Returns total flags, breakdown by reason, and
        timestamp of the latest flag.
      tags: [Flags]
      parameters:
        - name: targetType
          in: path
          required: true
          schema:
            type: string
            enum: [profile, memory, action, board_post]
          description: Type of the flagged resource
        - name: targetId
          in: path
          required: true
          schema:
            type: string
          description: ID of the flagged resource
      responses:
        '200':
          description: Flag summary for the target
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FlagSummary'

  /v1/flags/{id}:
    put:
      operationId: updateFlag
      summary: Update flag status (operator only)
      description: |
        Update the status of a quality flag. Operator-only endpoint.
        Used for reviewing, dismissing, or actioning flags.
      tags: [Flags]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Flag ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [reviewed, dismissed, actioned]
                  description: New flag status
                reviewNote:
                  type: string
                  maxLength: 1000
                  description: Optional operator review note
      responses:
        '200':
          description: Flag updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FlagRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Phase 1.6: Hobby Portal (HTML)
  # ============================================================

  /v1/portal/human/hobbies:
    get:
      operationId: portalHobbyDirectory
      summary: Hobby directory browse page
      description: |
        HTML page for browsing the hobby directory. Displays people grouped
        by interests and location. Server-rendered HTML — not a JSON API endpoint.
      tags: [Hobby-Portal]
      responses:
        '200':
          description: HTML hobby directory page
          content:
            text/html:
              schema:
                type: string

  /v1/portal/human/hobbies/search:
    get:
      operationId: portalHobbySearch
      summary: Hobby search page
      description: |
        HTML page for searching the hobby directory with filters for interests,
        city, and area. Server-rendered HTML — not a JSON API endpoint.
      tags: [Hobby-Portal]
      responses:
        '200':
          description: HTML hobby search page
          content:
            text/html:
              schema:
                type: string

  /v1/portal/human/hobbies/profile/{ghii}:
    get:
      operationId: portalHobbyProfile
      summary: Hobby profile page
      description: |
        HTML page showing a person's hobby profile including interests,
        location, and bio. Server-rendered HTML — not a JSON API endpoint.
      tags: [Hobby-Portal]
      parameters:
        - name: ghii
          in: path
          required: true
          schema:
            type: string
          description: Owner GHII to view profile for
      responses:
        '200':
          description: HTML hobby profile page
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Profile not found (HTML error page)
          content:
            text/html:
              schema:
                type: string

  /v1/portal/human/hobbies/join:
    get:
      operationId: portalHobbyJoin
      summary: Join hobby directory page
      description: |
        HTML page with the registration form to join the hobby directory.
        Server-rendered HTML — not a JSON API endpoint.
      tags: [Hobby-Portal]
      responses:
        '200':
          description: HTML join page with registration form
          content:
            text/html:
              schema:
                type: string

  /v1/portal/human/hobbies/me:
    get:
      operationId: portalHobbyMe
      summary: My hobby profile page
      description: |
        HTML page showing the authenticated user's hobby profile with
        edit capabilities. Requires session cookie or token.
        Server-rendered HTML — not a JSON API endpoint.
      tags: [Hobby-Portal]
      responses:
        '200':
          description: HTML my-profile page
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Not authenticated (redirects to login)
          content:
            text/html:
              schema:
                type: string

  # ============================================================
  # Phase 2.1: Matching
  # ============================================================

  /v1/matches:
    get:
      operationId: listMatches
      summary: List own match suggestions
      description: |
        List match suggestions for the authenticated user. Returns AI-powered
        profile matches based on interests, location, and activity patterns.
        Supports pagination and filtering by status.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, dismissed, expired]
          description: Filter by match status
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of match suggestions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          matches:
                            type: array
                            items:
                              $ref: '#/components/schemas/MatchResponse'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/FeatureDisabled'

  /v1/matches/stats:
    get:
      operationId: getMatchingStats
      summary: Matching statistics (operator only)
      description: |
        Get aggregate matching statistics for the node. Operator-only endpoint.
        Returns total matches, acceptance rates, score distributions, and
        top matching dimensions.
      tags: [Matching]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Matching statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          totalMatches:
                            type: integer
                          acceptanceRate:
                            type: number
                          averageScore:
                            type: number
                          statusBreakdown:
                            type: object
                            additionalProperties:
                              type: integer
                          topDimensions:
                            type: array
                            items:
                              type: object
                              properties:
                                dimension:
                                  type: string
                                averageScore:
                                  type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/matches/{id}/respond:
    post:
      operationId: respondToMatch
      summary: Accept or dismiss a match
      description: |
        Respond to a match suggestion by accepting or dismissing it.
        Only the authenticated user who is part of the match can respond.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Match ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, dismiss]
                  description: Response action
      responses:
        '200':
          description: Match response recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MatchRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================================================
  # Phase 2.2: Organisms
  # ============================================================

  /v1/organisms:
    post:
      operationId: createOrganism
      summary: Create an organism
      description: |
        Create a new organism (club, team, community, or project).
        The creator automatically becomes the admin member.
        A notification board is created automatically for the organism.
      tags: [Organisms]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Organism display name
                  example: Helsinki Photography Club
                description:
                  type: string
                  maxLength: 2000
                type:
                  type: string
                  enum: [club, team, community, project]
                location:
                  type: object
                  properties:
                    city:
                      type: string
                    area:
                      type: string
                    country:
                      type: string
                interests:
                  type: array
                  items:
                    type: string
                  example: [photography, urban-exploration]
                joinPolicy:
                  type: string
                  enum: [open, approval, invite]
                  default: open
                visibility:
                  type: string
                  enum: [public, unlisted, private]
                  default: public
      responses:
        '201':
          description: Organism created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrganismRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

    get:
      operationId: listOrganisms
      summary: List organisms
      description: |
        List public organisms with optional filtering by type, interest,
        and location. No authentication required for public organisms.
        Supports pagination.
      tags: [Organisms]
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [club, team, community, project]
          description: Filter by organism type
        - name: interest
          in: query
          schema:
            type: string
          description: Filter by interest tag
        - name: city
          in: query
          schema:
            type: string
          description: Filter by city
        - name: country
          in: query
          schema:
            type: string
          description: Filter by country code
        - name: q
          in: query
          schema:
            type: string
          description: Free-text search query
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of organisms
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          organisms:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrganismRecord'
                          total:
                            type: integer

  /v1/organisms/{id}:
    get:
      operationId: getOrganism
      summary: Get organism detail
      description: |
        Get detailed information about a specific organism including
        member count and board reference.
      tags: [Organisms]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organism ID
      responses:
        '200':
          description: Organism details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrganismRecord'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateOrganism
      summary: Update organism
      description: |
        Update an organism's details. Only organism admins can update.
      tags: [Organisms]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organism ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  maxLength: 2000
                location:
                  type: object
                  properties:
                    city:
                      type: string
                    area:
                      type: string
                    country:
                      type: string
                interests:
                  type: array
                  items:
                    type: string
                joinPolicy:
                  type: string
                  enum: [open, approval, invite]
                visibility:
                  type: string
                  enum: [public, unlisted, private]
      responses:
        '200':
          description: Organism updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrganismRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteOrganism
      summary: Delete organism
      description: |
        Delete an organism. Only organism admins or node operators can delete.
        This removes all memberships and the associated board.
      tags: [Organisms]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organism ID
      responses:
        '200':
          description: Organism deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Organism deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/organisms/{id}/join:
    post:
      operationId: joinOrganism
      summary: Join an organism
      description: |
        Request to join an organism. For open organisms, the user is added
        immediately. For approval-based organisms, a join request is created
        for admin review. For invite-only organisms, returns 403.
      tags: [Organisms]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organism ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 500
                  description: Optional message for approval-based joins
      responses:
        '200':
          description: Joined organism (open policy) or join request created (approval policy)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          membership:
                            $ref: '#/components/schemas/OrganismMembershipRecord'
                          joinRequest:
                            $ref: '#/components/schemas/JoinRequestRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already a member of this organism
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: MEMBERSHIP_EXISTS

  /v1/organisms/{id}/leave:
    post:
      operationId: leaveOrganism
      summary: Leave an organism
      description: |
        Leave an organism. The last admin cannot leave without transferring
        the admin role first.
      tags: [Organisms]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organism ID
      responses:
        '200':
          description: Left organism
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Left organism
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/organisms/{id}/members:
    get:
      operationId: listOrganismMembers
      summary: List organism members
      description: |
        List all members of an organism. Public organisms show members
        to anyone. Private organisms require membership to view.
        Supports pagination.
      tags: [Organisms]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organism ID
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, moderator, member]
          description: Filter by member role
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          members:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrganismMembershipRecord'
                          total:
                            type: integer
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/organisms/{id}/join-requests:
    get:
      operationId: listJoinRequests
      summary: List join requests (admin only)
      description: |
        List pending join requests for an organism. Only organism admins
        can view join requests. Supports filtering by status and pagination.
      tags: [Organisms]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organism ID
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
          description: Filter by request status
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of join requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          requests:
                            type: array
                            items:
                              $ref: '#/components/schemas/JoinRequestRecord'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/organisms/{id}/join-requests/{requestId}/review:
    post:
      operationId: reviewJoinRequest
      summary: Review a join request
      description: |
        Approve or reject a join request for an organism. Only organism
        admins can review join requests. Approved requests automatically
        create a membership.
      tags: [Organisms]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organism ID
        - name: requestId
          in: path
          required: true
          schema:
            type: string
          description: Join request ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 500
                  description: Optional reason for the decision
      responses:
        '200':
          description: Join request reviewed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          joinRequest:
                            $ref: '#/components/schemas/JoinRequestRecord'
                          membership:
                            $ref: '#/components/schemas/OrganismMembershipRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================================================
  # Phase 2.4: Appeals
  # ============================================================

  /v1/flags/{flagId}/appeal:
    post:
      operationId: appealFlag
      summary: Appeal a flag
      description: |
        Appeal a quality flag that has been actioned against the user's content.
        The user must be the owner of the flagged resource. Only flags with
        status 'actioned' or 'reviewed' can be appealed.
      tags: [Appeals]
      security:
        - BearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema:
            type: string
          description: Flag ID to appeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 2000
                  description: Reason for the appeal
      responses:
        '201':
          description: Appeal created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AppealRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/appeals:
    get:
      operationId: listAppeals
      summary: List appeals (operator only)
      description: |
        List all content moderation appeals. Operator-only endpoint.
        Supports filtering by status and pagination.
      tags: [Appeals]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, upheld, overturned, dismissed]
          description: Filter by appeal status
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of appeals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          appeals:
                            type: array
                            items:
                              $ref: '#/components/schemas/AppealRecord'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/appeals/{id}/review:
    post:
      operationId: reviewAppeal
      summary: Review an appeal (operator only)
      description: |
        Review a content moderation appeal. Operator-only endpoint.
        The operator can uphold the original flag, overturn it, or dismiss
        the appeal.
      tags: [Appeals]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Appeal ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [uphold, overturn, dismiss]
                  description: Appeal review decision
                reviewNote:
                  type: string
                  maxLength: 2000
                  description: Operator review note
      responses:
        '200':
          description: Appeal reviewed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AppealRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================================================
  # Phase 2.5: CSM Templates
  # ============================================================

  /v1/csm/templates:
    get:
      operationId: listCsmTemplates
      summary: List CSM templates
      description: |
        List available Community Service Manifest templates. Templates provide
        starting-point YAML definitions for common service types. No authentication
        required (Tier 0).
      tags: [CSM-Templates]
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by template category
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of available CSM templates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          templates:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  description: Template type identifier
                                  example: hobby-club
                                name:
                                  type: string
                                  example: Hobby Club Template
                                description:
                                  type: string
                                category:
                                  type: string
                                  example: community
                          total:
                            type: integer

  /v1/csm/templates/{type}:
    get:
      operationId: getCsmTemplate
      summary: Get CSM template YAML
      description: |
        Get the full YAML definition for a specific CSM template. Returns
        the template as a downloadable YAML document. No authentication
        required (Tier 0).
      tags: [CSM-Templates]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
          description: Template type identifier
          example: hobby-club
      responses:
        '200':
          description: CSM template YAML
          content:
            application/x-yaml:
              schema:
                type: string
                description: YAML template content
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          type:
                            type: string
                          name:
                            type: string
                          yaml:
                            type: string
                            description: Raw YAML template content
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Phase 2.6: Marketplace
  # ============================================================

  /v1/marketplace/listings:
    post:
      operationId: createListing
      summary: Create a marketplace listing
      description: |
        Create a new listing in the morsel-based marketplace. Requires
        authentication. Listings are priced in morsels and can be
        categorized and tagged for discovery.
      tags: [Marketplace]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, priceMorsels]
              properties:
                title:
                  type: string
                  maxLength: 200
                  description: Listing title
                  example: Custom AI Training Dataset
                description:
                  type: string
                  maxLength: 5000
                  description: Detailed description
                category:
                  type: string
                  maxLength: 50
                  example: datasets
                priceMorsels:
                  type: integer
                  minimum: 0
                  description: Price in morsels
                  example: 150
                condition:
                  type: string
                  enum: [new, like_new, good, fair]
                location:
                  type: object
                  properties:
                    city:
                      type: string
                    country:
                      type: string
                tags:
                  type: array
                  items:
                    type: string
                  example: [ai, dataset, training]
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ListingRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/FeatureDisabled'

    get:
      operationId: browseListings
      summary: Browse marketplace listings
      description: |
        Browse and search marketplace listings. Supports filtering by
        category, price range, tags, and free-text search. No authentication
        required (Tier 0). Supports pagination.
      tags: [Marketplace]
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - name: minPrice
          in: query
          schema:
            type: integer
            minimum: 0
          description: Minimum price in morsels
        - name: maxPrice
          in: query
          schema:
            type: integer
          description: Maximum price in morsels
        - name: tag
          in: query
          schema:
            type: string
          description: Filter by tag
        - name: q
          in: query
          schema:
            type: string
          description: Free-text search query
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, sold]
          description: Filter by listing status
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of marketplace listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          listings:
                            type: array
                            items:
                              $ref: '#/components/schemas/ListingRecord'
                          total:
                            type: integer

  /v1/marketplace/listings/{id}:
    get:
      operationId: getListing
      summary: Get a single listing
      description: |
        Get detailed information about a specific marketplace listing.
        No authentication required (Tier 0).
      tags: [Marketplace]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Listing ID
      responses:
        '200':
          description: Listing details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ListingRecord'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateListing
      summary: Update a listing
      description: |
        Update a marketplace listing. Only the listing owner can update.
        Cannot update listings that are in a completed sale.
      tags: [Marketplace]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Listing ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                category:
                  type: string
                  maxLength: 50
                priceMorsels:
                  type: integer
                  minimum: 0
                condition:
                  type: string
                  enum: [new, like_new, good, fair]
                tags:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  enum: [active, paused]
                  description: Toggle listing visibility
      responses:
        '200':
          description: Listing updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ListingRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      operationId: deleteListing
      summary: Delist a marketplace listing
      description: |
        Remove a listing from the marketplace. Only the listing owner
        or a node operator can delist. Sets status to 'removed'.
      tags: [Marketplace]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Listing ID
      responses:
        '200':
          description: Listing removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Listing removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/marketplace/listings/{id}/purchase:
    post:
      operationId: purchaseListing
      summary: Purchase a listing
      description: |
        Purchase a marketplace listing with morsels. The price is held in
        escrow until delivery is confirmed. Requires sufficient morsel balance.
      tags: [Marketplace]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Listing ID
      responses:
        '201':
          description: Purchase initiated, morsels held in escrow
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PurchaseRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Listing not available for purchase
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: INVALID_STATUS

  /v1/marketplace/purchases/{id}/deliver:
    post:
      operationId: markDelivery
      summary: Mark a purchase as delivered
      description: |
        Mark a purchase as delivered. Only the seller can mark delivery.
        Releases escrowed morsels to the seller (minus transaction fee).
      tags: [Marketplace]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Purchase ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deliveryNote:
                  type: string
                  maxLength: 1000
                  description: Optional delivery note or instructions
      responses:
        '200':
          description: Delivery confirmed, escrow released
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PurchaseRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/marketplace/purchases/{id}/rate:
    post:
      operationId: ratePurchase
      summary: Rate a purchase
      description: |
        Rate a completed purchase. Only the buyer can rate, and only
        after delivery. Rating affects the seller's trust score.
      tags: [Marketplace]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Purchase ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Rating score (1-5)
                comment:
                  type: string
                  maxLength: 1000
                  description: Optional review comment
      responses:
        '200':
          description: Rating recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PurchaseRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/marketplace/my-listings:
    get:
      operationId: getMyListings
      summary: List own marketplace listings
      description: |
        List the authenticated user's own marketplace listings.
        Includes all statuses (active, paused, sold, removed).
        Supports pagination.
      tags: [Marketplace]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, sold, removed]
          description: Filter by listing status
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of own listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          listings:
                            type: array
                            items:
                              $ref: '#/components/schemas/ListingRecord'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/marketplace/my-purchases:
    get:
      operationId: getMyPurchases
      summary: List own purchases
      description: |
        List the authenticated user's marketplace purchases.
        Includes all purchase statuses. Supports pagination.
      tags: [Marketplace]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, delivered, completed, disputed, refunded]
          description: Filter by purchase status
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated list of own purchases
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          purchases:
                            type: array
                            items:
                              $ref: '#/components/schemas/PurchaseRecord'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Phase 3.1: PWA ──────────────────────────────────────────

  /v1/push/subscribe:
    post:
      operationId: pushSubscribe
      summary: Register push subscription
      description: |
        Register a Web Push subscription for the authenticated user.
        Uses the Web Push API standard with VAPID. The subscription
        endpoint and keys are stored server-side for sending notifications.
      tags: [PWA]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                  format: uri
                  description: Push service endpoint URL
                  example: https://fcm.googleapis.com/fcm/send/abc123
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh:
                      type: string
                      description: P-256 ECDH public key (base64url)
                    auth:
                      type: string
                      description: Authentication secret (base64url)
      responses:
        '201':
          description: Push subscription registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PushSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      operationId: pushUnsubscribe
      summary: Unsubscribe push notifications
      description: |
        Remove the push subscription for the authenticated user.
        Stops all future push notifications to this device.
      tags: [PWA]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Push subscription removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          unsubscribed:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/push/test:
    post:
      operationId: pushTest
      summary: Send test push notification
      description: |
        Send a test push notification to the authenticated user's
        registered subscription. Useful for verifying push setup.
      tags: [PWA]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Test notification sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sent:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No push subscription found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            example: NOT_FOUND

  /v1/push/vapid-key:
    get:
      operationId: getVapidKey
      summary: Get public VAPID key
      description: |
        Retrieve the server's public VAPID key for Web Push subscription.
        No authentication required. Clients use this key when calling
        `pushManager.subscribe()` in the browser.
      tags: [PWA]
      responses:
        '200':
          description: VAPID public key
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vapidPublicKey:
                            type: string
                            description: Base64url-encoded VAPID public key

  # ── Phase 3.3: Verification ─────────────────────────────────

  /v1/consent/{id}/receipt:
    get:
      operationId: getConsentReceipt
      summary: Get MyData consent receipt
      description: |
        Retrieve a MyData-compliant consent receipt for a specific
        consent grant. Follows the Kantara Initiative consent receipt
        specification. Useful for GDPR compliance and data portability.
      tags: [Verification]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Consent grant ID
      responses:
        '200':
          description: MyData consent receipt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          receipt:
                            $ref: '#/components/schemas/MyDataConsentReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ghii/{ghii}/credential:
    get:
      operationId: issueVerifiableCredential
      summary: Issue W3C Verifiable Credential
      description: |
        Issue a W3C Verifiable Credential for the specified GHII.
        The credential attests to the identity verification level
        and attributes verified through EUDIW, FTN, or other methods.
        Only available for GHIIs that have completed verification.
      tags: [Verification]
      security:
        - BearerAuth: []
      parameters:
        - name: ghii
          in: path
          required: true
          schema:
            type: string
          description: GHII to issue credential for
      responses:
        '200':
          description: Verifiable Credential issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          credential:
                            $ref: '#/components/schemas/VerifiableCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/ghii/verify/eudiw:
    post:
      operationId: verifyEudiw
      summary: Verify EUDIW VP token
      description: |
        Verify a Verifiable Presentation token from an EU Digital Identity
        Wallet (EUDIW). Validates the VP token and presentation submission
        against the previously generated authorization request. On success,
        updates the GHII verification level and stores verified attributes.
      tags: [Verification]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vp_token, presentation_submission]
              properties:
                vp_token:
                  type: string
                  description: Verifiable Presentation token (JWT or JSON-LD)
                presentation_submission:
                  type: object
                  description: OpenID4VP presentation submission descriptor
                  properties:
                    id:
                      type: string
                    definition_id:
                      type: string
                    descriptor_map:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          format:
                            type: string
                          path:
                            type: string
      responses:
        '200':
          description: EUDIW verification result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ghii:
                            type: string
                          verificationLevel:
                            type: string
                            enum: [basic, enhanced, verified]
                          verifiedAttributes:
                            type: array
                            items:
                              type: string
                            example: [given_name, family_name, date_of_birth]
                          issuer:
                            type: string
                            description: Credential issuer identifier
                          verifiedAt:
                            type: string
                            format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/ghii/verify/eudiw/request:
    get:
      operationId: getEudiwAuthRequest
      summary: Generate EUDIW OpenID4VP authorization request
      description: |
        Generate an OpenID4VP authorization request for EU Digital Identity
        Wallet verification. Returns the authorization request URL and state
        parameter. The client redirects the user to their EUDIW app to
        complete the presentation.
      tags: [Verification]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: EUDIW authorization request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          authorizationRequest:
                            type: object
                            description: OpenID4VP authorization request object
                            properties:
                              response_type:
                                type: string
                                example: vp_token
                              client_id:
                                type: string
                              redirect_uri:
                                type: string
                                format: uri
                              scope:
                                type: string
                              nonce:
                                type: string
                              presentation_definition:
                                type: object
                          state:
                            type: string
                            description: State parameter for correlating the response
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/FeatureDisabled'

  /v1/ghii/verify/ftn:
    post:
      operationId: verifyFtn
      summary: Finnish Trust Network verification
      description: |
        Verify identity through the Finnish Trust Network (FTN).
        Accepts a callback token from the FTN authentication flow.
        On success, updates the GHII verification level with strong
        identity assurance (eIDAS substantial/high).
      tags: [Verification]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [callback_token]
              properties:
                callback_token:
                  type: string
                  description: Token received from FTN callback
      responses:
        '200':
          description: FTN verification result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ghii:
                            type: string
                          verificationLevel:
                            type: string
                            enum: [basic, enhanced, verified]
                          ftnVerified:
                            type: boolean
                            example: true
                          verifiedAt:
                            type: string
                            format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/FeatureDisabled'

  /v1/trusted-issuers:
    post:
      operationId: addTrustedIssuer
      summary: Add a trusted credential issuer
      description: |
        Register a new trusted credential issuer. Only operators can
        add trusted issuers. Trusted issuers are used to validate
        Verifiable Credentials and VP tokens during identity verification.
      tags: [Verification]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, publicKey, type]
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: Human-readable issuer name
                  example: Finnish Digital Agency
                url:
                  type: string
                  format: uri
                  description: Issuer endpoint URL
                publicKey:
                  type: string
                  description: Ed25519 or ECDSA public key (base64url)
                type:
                  type: string
                  enum: [eudiw, ftn, w3c_vc, custom]
                  description: Type of credentials this issuer provides
      responses:
        '201':
          description: Trusted issuer added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TrustedIssuerRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      operationId: listTrustedIssuers
      summary: List trusted credential issuers
      description: |
        List all trusted credential issuers registered on this node.
        Optionally filter by issuer type. Requires authentication.
      tags: [Verification]
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [eudiw, ftn, w3c_vc, custom]
          description: Filter by issuer type
      responses:
        '200':
          description: List of trusted issuers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          issuers:
                            type: array
                            items:
                              $ref: '#/components/schemas/TrustedIssuerRecord'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Phase 3.4: Cross-Federation ─────────────────────────────

  /v1/federation/cross-catalogue:
    get:
      operationId: getCrossFederationCatalogue
      summary: Browse cross-federation catalogue
      description: |
        Browse the merged catalogue of actions and agents across
        all genesis-peered federations. No authentication required (Tier 0).
        Entries are aggregated from connected genesis peers.
      tags: [Cross-Federation]
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free-text search query
        - name: federation
          in: query
          schema:
            type: string
          description: Filter by federation (genesis node ID)
        - $ref: '#/components/parameters/Pagination'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Cross-federation catalogue entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          entries:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum: [action, agent]
                                sourceNodeId:
                                  type: string
                                sourceFederation:
                                  type: string
                                name:
                                  type: string
                                description:
                                  type: string
                                gaii:
                                  type: string
                                syncedAt:
                                  type: string
                                  format: date-time
                          total:
                            type: integer

  /v1/federation/genesis-peer:
    post:
      operationId: requestGenesisPeering
      summary: Request genesis peering
      description: |
        Request a genesis-level peering relationship with another federation's
        genesis node. Only operators can initiate genesis peering. This enables
        cross-federation catalogue sharing and agent mobility.
      tags: [Cross-Federation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [genesisNodeId, genesisUrl, publicKey]
              properties:
                genesisNodeId:
                  type: string
                  description: Node ID of the target genesis node
                  example: aimeat-usa-001-genesis
                genesisUrl:
                  type: string
                  format: uri
                  description: Base URL of the target genesis node
                  example: https://aimeat-usa-001-genesis.example.com
                publicKey:
                  type: string
                  description: Ed25519 public key for federation auth (base64url)
      responses:
        '201':
          description: Genesis peering request created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GenesisPeerRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/federation/genesis-peer/{id}:
    delete:
      operationId: removeGenesisPeer
      summary: Remove a genesis peering
      description: |
        Remove a genesis peering relationship. Only operators can remove
        genesis peers. Removes the peer and stops catalogue synchronization.
      tags: [Cross-Federation]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Genesis peer ID
      responses:
        '200':
          description: Genesis peer removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          removed:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/federation/genesis-peer/{id}/approve:
    put:
      operationId: approveGenesisPeer
      summary: Approve a genesis peering request
      description: |
        Approve a pending genesis peering request. Only operators can
        approve peering. Once approved, catalogue synchronization begins.
      tags: [Cross-Federation]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Genesis peer ID
      responses:
        '200':
          description: Genesis peer approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GenesisPeerRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/federation/genesis-peers:
    get:
      operationId: listGenesisPeers
      summary: List genesis peers
      description: |
        List all genesis peering relationships for this node.
        Only operators can view genesis peers. Optionally filter by status.
      tags: [Cross-Federation]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, active, suspended, revoked]
          description: Filter by peering status
      responses:
        '200':
          description: List of genesis peers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          peers:
                            type: array
                            items:
                              $ref: '#/components/schemas/GenesisPeerRecord'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/federation/network-stats:
    get:
      operationId: getNetworkStats
      summary: Get federation network statistics
      description: |
        Retrieve aggregate statistics about the federation network.
        Includes peer count, total agents, cross-federation metrics,
        and health information. No authentication required (Tier 0).
      tags: [Cross-Federation]
      responses:
        '200':
          description: Federation network statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          stats:
                            type: object
                            properties:
                              totalPeers:
                                type: integer
                                description: Total number of active peers
                              totalGenesisPeers:
                                type: integer
                                description: Number of genesis-level peers
                              totalAgents:
                                type: integer
                                description: Total agents across federation
                              totalActions:
                                type: integer
                                description: Total actions across federation
                              crossFederationEntries:
                                type: integer
                                description: Entries in cross-federation catalogue
                              lastSyncAt:
                                type: string
                                format: date-time
                              uptime:
                                type: string
                                description: Node uptime
                                example: 14d 6h 32m

  # ── Phase 3.4: Reputation ───────────────────────────────────

  /v1/organisms/{id}/reputation:
    get:
      operationId: getOrganismReputation
      summary: Get organism reputation
      description: |
        Retrieve the reputation score and breakdown for an organism.
        Reputation is calculated from member activity, work completion rate,
        dispute rate, community feedback, and organism age.
        No authentication required (Tier 0).
      tags: [Reputation]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Organism ID
      responses:
        '200':
          description: Organism reputation details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrganismReputationRecord'

  # ── Node Portal (Site) ─────────────────────────────────────

  /v1/site:
    get:
      operationId: getSiteMetadata
      summary: Portal metadata
      description: |
        Returns metadata about the node portal: whether a custom template is
        active, the template engine tag types, and node identity.
        No authentication required (Tier 0).
      tags: [Site]
      responses:
        '200':
          description: Portal metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          custom_template:
                            type: boolean
                          tag_types:
                            type: array
                            items:
                              type: string
                          node_id:
                            type: string
                          node_name:
                            type: string

  /v1/site/template:
    get:
      operationId: getSiteTemplate
      summary: Download current template
      description: |
        Download the current custom HTML template.
        Operator-only (Tier 2).
      tags: [Site]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current template content
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          template:
                            type: string
                          size_bytes:
                            type: integer
                          updated_at:
                            type: string
                            format: date-time
                          tags_found:
                            type: array
                            items:
                              type: string
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: uploadSiteTemplate
      summary: Upload new template
      description: |
        Upload a custom HTML template with `{{type:key}}` dynamic tags.
        Supported tag types: `config`, `memory`, `storage`, `kv`, `board`.
        The `board` tag (e.g. `{{board:announcements}}`) renders recent posts from a system/public board.
        Validates HTML safety (blocks raw `<script>` injections via memory tags).
        Operator-only (Tier 2).
      tags: [Site]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template:
                  type: string
                  description: HTML template content with optional {{type:key}} tags
      responses:
        '200':
          description: Template uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          stored:
                            type: boolean
                          size_bytes:
                            type: integer
                          tags_found:
                            type: array
                            items:
                              type: string
                          unresolvable_tags:
                            type: array
                            items:
                              type: string
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: deleteSiteTemplate
      summary: Revert to default portal
      description: |
        Delete the custom template and revert to the built-in default portal.
        Operator-only (Tier 2).
      tags: [Site]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Template deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean
                          reverted_to:
                            type: string

  /v1/site/import:
    post:
      operationId: importSiteBundle
      summary: Import portal bundle
      description: |
        Import a complete portal bundle containing template HTML,
        memory keys (under `portal/*` namespace), and KV pairs.
        Operator-only (Tier 2).
      tags: [Site]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  description: HTML template content
                memory:
                  type: object
                  additionalProperties:
                    type: string
                  description: Memory key-value pairs (keys must start with portal/)
                kv:
                  type: object
                  additionalProperties:
                    type: string
                  description: KV pairs for {{kv:key}} tag resolution
      responses:
        '200':
          description: Bundle imported
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          template_stored:
                            type: boolean
                          memory_keys_written:
                            type: integer
                          kv_pairs_updated:
                            type: integer
                          changelog_entry_id:
                            type: string
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/site/changelog:
    get:
      operationId: getSiteChangelog
      summary: View change log
      description: |
        List site change log entries (template uploads, deletions, imports, cache invalidations).
        Operator-only (Tier 2).
      tags: [Site]
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Change log entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            action:
                              type: string
                            summary:
                              type: string
                            changed_by:
                              type: string
                            changed_at:
                              type: string
                              format: date-time

  /v1/site/cache-invalidate:
    post:
      operationId: invalidateSiteCache
      summary: Force cache refresh
      description: |
        Clear the resolved template cache so the next request re-resolves all tags.
        Operator-only (Tier 2).
      tags: [Site]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cache cleared
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          cache_cleared:
                            type: boolean

  /v1/site/prompt:
    get:
      operationId: getSitePrompt
      summary: AI navigation prompt
      description: |
        Returns a text prompt that AI agents can use to understand
        how to navigate and interact with this node. Useful for
        AI-driven site editing workflows.
        No authentication required (Tier 0).
      tags: [Site]
      responses:
        '200':
          description: AI prompt text
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AimeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          prompt:
                            type: string
        '404':
          $ref: '#/components/responses/NotFound'

                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FederationHeartbeat'

  /v1/federation/peers:
    get:
      operationId: listPeers
      summary: List peers
      tags: [Federation]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of peered nodes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          peers:
                            type: array
                            items:
                              $ref: '#/components/schemas/PeerInfo'

  /v1/federation/directory:
    get:
      operationId: getDirectory
      summary: Network node directory
      description: Public directory of all known nodes in the federation.
      tags: [Catalogue]
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/federation/peers/{id}:
    put:
      operationId: updatePeer
      summary: Update peer config
      tags: [Federation]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

    delete:
      operationId: depeer
      summary: De-peer
      description: Remove a peered node. Use ?emergency=true for immediate de-peering (no grace period).
      tags: [Federation]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: emergency
          in: query
          schema:
            type: boolean
            default: false
          description: Emergency de-peering (immediate, no grace period)
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  # ── Federation Internal (node-to-node) ─────────────────────
  /v1/federation/ping:
    post:
      operationId: federationPing
      summary: Federation health check
      description: |
        Node-to-node ping. No auth required. If `from_node` matches a known
        peer, that peer's `lastSeen` and status are updated.
      tags: [Federation]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from_node:
                  type: string
                  description: Sending node's ID (optional)
      responses:
        '200':
          description: Pong response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pong:
                            type: boolean
                          node_id:
                            type: string
                          timestamp:
                            type: string
                            format: date-time

  /v1/federation/replicate:
    post:
      operationId: federationReplicate
      summary: Receive replicated memory
      description: |
        Accept a memory entry replicated from a peer node. The source node must
        be an active peer. Memory is stored with a `replica:{source}:` key prefix.
      tags: [Federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_node, gaii, key, value, version]
              properties:
                source_node:
                  type: string
                gaii:
                  $ref: '#/components/schemas/GAII'
                key:
                  type: string
                value: {}
                visibility:
                  $ref: '#/components/schemas/Visibility'
                version:
                  type: integer
                timestamp:
                  type: string
                  format: date-time
                signature:
                  type: string
                  description: Ed25519 signature of the payload
      responses:
        '200':
          description: Replica accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          replicated:
                            type: boolean
                          key:
                            type: string
                          source_node:
                            type: string
                          version:
                            type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/federation/catalogue-sync:
    post:
      operationId: federationCatalogueSync
      summary: Receive catalogue updates from peer
      description: |
        Synchronise action catalogue entries from a peer node. Supports
        incremental sync via `since_timestamp`. New actions are created;
        existing federated actions are updated (upsert by federated ID).
      tags: [Federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_node, actions]
              properties:
                source_node:
                  type: string
                actions:
                  type: array
                  items:
                    type: object
                    required: [id, provider_gaii, display_name]
                    properties:
                      id:
                        type: string
                      provider_gaii:
                        $ref: '#/components/schemas/GAII'
                      display_name:
                        type: string
                      description:
                        type: string
                      category:
                        type: string
                      input_schema:
                        type: object
                      output_schema:
                        type: object
                      pricing:
                        type: object
                        properties:
                          base_morsels:
                            type: integer
                          per_unit:
                            type: number
                      tags:
                        type: array
                        items:
                          type: string
                      created_at:
                        type: string
                        format: date-time
                since_timestamp:
                  type: string
                  format: date-time
                  description: Only sync actions newer than this timestamp
                catalogue_hash:
                  type: string
                  description: Hash of the sender's full catalogue for consistency checks
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          synced:
                            type: integer
                            description: Newly created actions
                          updated:
                            type: integer
                            description: Updated existing actions
                          source_node:
                            type: string
                          total_received:
                            type: integer
                          incremental:
                            type: boolean
                          catalogue_hash:
                            type: string
                            nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/federation/key-exchange:
    post:
      operationId: federationKeyExchange
      summary: Exchange public keys with peer
      description: |
        Synchronise Ed25519 public keys between peered nodes. The peer must
        already exist in the federation registry.
      tags: [Federation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, public_key]
              properties:
                node_id:
                  type: string
                public_key:
                  type: string
                  description: Ed25519 public key (hex)
                capabilities:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Key exchange accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          node_id:
                            type: string
                          public_key:
                            type: string
                          capabilities:
                            type: array
                            items:
                              type: string
                          accepted:
                            type: boolean
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/federation/trust-advisory:
    post:
      operationId: federationTrustAdvisory
      summary: Issue trust advisory
      description: |
        Issue a trust warning, suspension, or ban against a target node.
        Operator auth required. A `ban` advisory automatically de-peers the
        target node.
      tags: [Federation]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_node, advisory_type, reason]
              properties:
                target_node:
                  type: string
                advisory_type:
                  type: string
                  enum: [warning, suspend, ban]
                reason:
                  type: string
                evidence_hash:
                  type: string
                  description: SHA-256 hash of supporting evidence
                issued_by:
                  type: string
                  description: Issuing node (defaults to this node)
      responses:
        '201':
          description: Advisory recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          target_node:
                            type: string
                          advisory_type:
                            type: string
                            enum: [warning, suspend, ban]
                          reason:
                            type: string
                          evidence_hash:
                            type: string
                          issued_by:
                            type: string
                          created_at:
                            type: string
                            format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Administration ─────────────────────────────────────────
  /v1/admin/dashboard:
    get:
      operationId: getDashboard
      summary: Dashboard
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Node dashboard
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dashboard'

  /v1/admin/config:
    get:
      operationId: getConfig
      summary: View config
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

    put:
      operationId: updateConfig
      summary: Update config (atomic)
      description: |
        Atomic configuration update. Send complete config object.
        AI-driven configuration is supported — an operator-level AI agent can
        tune the node via this endpoint.
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Full node configuration (see Appendix B)
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/admin/roles/grant:
    post:
      operationId: grantRole
      summary: Grant operator role
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, role]
              properties:
                owner:
                  type: string
                role:
                  type: string
                  enum: [operator]
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  # ── Additional Implemented Endpoints ───────────────────────

  /v1/health:
    get:
      operationId: getHealth
      summary: Health check
      description: Liveness/readiness endpoint. No auth required.
      tags: [Bootstrap]
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/auth/otk:
    post:
      operationId: generateOtk
      summary: Generate one-time key
      description: Create a one-time key for Tier 0.5 operations (GET-based writes).
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, params]
              properties:
                action:
                  type: string
                  description: Operation type (write_memory, post_board, etc.)
                params:
                  type: object
                  description: Parameters for the OTK operation
                ttl_minutes:
                  type: integer
                  default: 60
      responses:
        '201':
          $ref: '#/components/responses/MeatSuccess'

  /v1/otk/{key}:
    get:
      operationId: executeOtk
      summary: Execute one-time key
      description: |
        Execute a previously generated one-time key (Tier 0.5). No auth
        required — the key itself is the credential. Currently supports
        the `write_memory` action. The key is consumed on first use.
      tags: [Auth]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The one-time key token
      responses:
        '200':
          description: OTK action executed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          action:
                            type: string
                            example: write_memory
                          key:
                            type: string
                          written:
                            type: boolean
        '401':
          description: Session expired due to inactivity
        '404':
          description: One-time key not found, expired, or already used

  # ── Chunked Upload ─────────────────────────────────────────

  /v1/storage/upload/init:
    post:
      operationId: initChunkedUpload
      summary: Initiate chunked upload
      description: Start a multi-part file upload for large files.
      tags: [Storage]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, mime_type, chunk_size]
              properties:
                key:
                  type: string
                mime_type:
                  type: string
                chunk_size:
                  type: integer
                visibility:
                  $ref: '#/components/schemas/Visibility'
                total_chunks:
                  type: integer
      responses:
        '201':
          $ref: '#/components/responses/MeatSuccess'

  /v1/storage/upload/{id}/{chunk}:
    put:
      operationId: uploadChunk
      summary: Upload a single chunk
      tags: [Storage]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: chunk
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/storage/upload/{id}/complete:
    post:
      operationId: completeChunkedUpload
      summary: Finalize chunked upload
      description: Assemble all uploaded chunks into the final file.
      tags: [Storage]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/storage/upload/{id}:
    delete:
      operationId: abortChunkedUpload
      summary: Abort chunked upload
      tags: [Storage]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  # ── Admin Extensions ───────────────────────────────────────

  /v1/admin/agents:
    get:
      operationId: listAllAgents
      summary: List all agents (operator)
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/admin/stats:
    get:
      operationId: getAdminStats
      summary: System statistics (operator)
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/admin/backup:
    get:
      operationId: getBackup
      summary: Export all data
      description: Full data backup as JSON. Operator only.
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/admin/restore:
    post:
      operationId: restoreBackup
      summary: Import data from backup
      tags: [Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/admin/hooks:
    get:
      operationId: listHooks
      summary: List extension hooks
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/admin/hooks/{hookName}:
    put:
      operationId: setHook
      summary: Set hook action URLs
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: hookName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actions]
              properties:
                actions:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

    delete:
      operationId: clearHook
      summary: Clear hook
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: hookName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  # ── MCP (Model Context Protocol) ───────────────────────────

  /v1/mcp:
    post:
      operationId: mcpExecute
      summary: Execute MCP tool call
      description: Streamable HTTP transport for MCP protocol. Optional extension.
      tags: [MCP]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: MCP response (may be SSE stream)

    get:
      operationId: mcpResources
      summary: List MCP resources
      tags: [MCP]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: MCP resource list

    delete:
      operationId: mcpDeleteSession
      summary: Delete MCP session
      tags: [MCP]
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/mcp/register:
    post:
      operationId: mcpRegisterClient
      summary: Register MCP OAuth client
      description: Dynamic client registration for MCP OAuth 2.1 flow.
      tags: [MCP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          $ref: '#/components/responses/MeatSuccess'

  /v1/mcp/authorize:
    get:
      operationId: mcpAuthorize
      summary: MCP OAuth authorization endpoint
      description: Initiates OAuth 2.1 authorization code flow for MCP clients.
      tags: [MCP]
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to callback with authorization code

  /v1/mcp/token:
    post:
      operationId: mcpToken
      summary: MCP OAuth token exchange
      description: Exchange authorization code for access token (MCP OAuth 2.1).
      tags: [MCP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                code:
                  type: string
                client_id:
                  type: string
                code_verifier:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/mcp/token/revoke:
    post:
      operationId: mcpRevokeToken
      summary: Revoke MCP OAuth token
      tags: [MCP]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthServerMetadata
      summary: OAuth 2.0 Authorization Server Metadata
      description: RFC 8414 discovery document for MCP OAuth integration.
      tags: [MCP]
      responses:
        '200':
          description: OAuth server metadata
          content:
            application/json:
              schema:
                type: object

      tags: [Work Queue]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TrackingCode'
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/work/{tc}/reject:
    post:
      operationId: rejectWork

      tags: [Work Queue]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TrackingCode'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/work/{tc}/deliver:
    post:
      operationId: deliverWork
      summary: Deliver work
      tags: [Work Queue]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TrackingCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkDelivery'
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/work/{tc}/rate:
    post:
      operationId: rateDelivery

          in: path
          required: true
          schema:
            type: string
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/extensions/{name}/actions/{actionId}:

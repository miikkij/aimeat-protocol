          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, archived] }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/packages/{groupId}/versions/{version}:

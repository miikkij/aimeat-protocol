    post:
      operationId: publishPackageVersion
      summary: Publish new version
      description: Publish a new version of an existing package group.
      tags: [Packages]
      security:
        - BearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [components]
              properties:
                changelog: { type: string }
                components:
                  type: array
                  items:
                    type: object
                    required: [type, label, content]
                    properties:
                      type: { type: string, enum: [csm, extension, cortex, app, msm, memory, translation] }
                      label: { type: string }
                      content: { type: string }
                      dependencies: { type: array, items: { type: string } }
      responses:
        '201':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Package exceeds size or component count limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodeId:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [SIZE_EXCEEDED, COMPONENT_LIMIT_EXCEEDED, QUOTA_EXCEEDED]
                      message:
                        type: string
    get:
      operationId: listPackageVersions

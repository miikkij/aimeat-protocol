  # ── Packages (Component Packages) ────────────────────────
  /v1/packages:
    post:
      operationId: createPackage
      summary: Create package
      description: Create a new package with components.
      tags: [Packages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, components]
              properties:
                name: { type: string }
                description: { type: string }
                category: { type: string, enum: [signage, marketplace, iot, social, productivity, communication, other] }
                tags: { type: array, items: { type: string } }
                visibility: { type: string, enum: [private, public] }
                components:
                  type: array
                  items:
                    type: object
                    required: [type, label, content]
                    properties:
                      type: { type: string, enum: [csm, extension, cortex, app, msm, memory, translation] }
                      label: { type: string }
                      content: { type: string }
                      dependencies: { type: array, items: { type: string } }
      responses:
        '201':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Package exceeds size or component count limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodeId:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum: [SIZE_EXCEEDED, COMPONENT_LIMIT_EXCEEDED, QUOTA_EXCEEDED]
                      message:
                        type: string
    get:
      operationId: listPackages
      summary: List packages
      description: List packages with optional filtering. Public packages visible without auth.
      tags: [Packages]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: author
          in: query
          schema: { type: string }
        - name: visibility
          in: query
          schema: { type: string, enum: [private, public] }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          $ref: '#/components/responses/AimeatSuccess'

  /v1/packages/import:
    post:
      operationId: importPackage
      summary: Import package from ZIP
      description: Import a package from a ZIP bundle uploaded as multipart/form-data.
      tags: [Packages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP archive containing manifest.yaml and component files
      responses:
        '201':
          $ref: '#/components/responses/AimeatSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Package exceeds size or component count limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodeId:
                    type: string
                  error:
                    type: object
                    properties:

      tags: [Work Queue]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkRequest'
      responses:
        '201':
          description: Work item created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WorkItem'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/work/batch:
    post:
      operationId: batchRequestWork
      summary: Batch work request
      tags: [Work Queue]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requests:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkRequest'
      responses:
        '201':
          $ref: '#/components/responses/MeatSuccess'

  /v1/work/inbox:
    get:
      operationId: getInbox
      summary: Provider inbox
      description: List pending work items assigned to the authenticated agent.
      tags: [Work Queue]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, in_progress]
        - $ref: '#/components/parameters/Pagination'
      responses:
        '200':
          $ref: '#/components/responses/MeatSuccess'

  /v1/work/{tc}:
    get:
      operationId: getWorkItem
      summary: Work item status
      tags: [Work Queue]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TrackingCode'
      responses:
        '200':
          description: Work item detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WorkItem'

  /v1/work/{tc}/accept:
    post:
      operationId: acceptWork

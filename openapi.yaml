        - name: node
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trust profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MeatEnvelope'
                  - type: object
                    properties:
                      data:

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "aimeat-crewai"
version = "0.37.0"
description = "AIMEAT Liaison Agent for CrewAI -- drop-in crew member that handles all communication with an AIMEAT node (Hello Integration handshake, capability reporting, memory writes, knowledge publishing, task lifecycle, offers + workflow-compatibility) so the rest of the crew can focus on domain work."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Jouni Miikki" },
]
keywords = ["aimeat", "crewai", "mcp", "ai-agents", "multi-agent", "agent-orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "crewai>=0.80.0",
    "crewai-tools[mcp]>=0.25.0",
    "mcp>=1.0.0",
    "requests>=2.31",
]

[project.scripts]
aimeat-offers = "aimeat_crewai.cli:main"

[project.optional-dependencies]
# Parquet is an EXTRA rather than a dependency: pyarrow is tens of megabytes, most crews never
# write a Parquet file, and to_parquet() raises a named ImportError when it is missing rather than
# quietly writing a CSV under a function whose name says otherwise.
# to_dataframe() is the headline of the data-package module and needs pandas; to_parquet() needs
# pyarrow on top. Both are extras rather than dependencies because a liaison crew that never touches
# a table should not carry either, and both functions raise a named ImportError naming the extra
# rather than degrading into something the caller did not ask for.
data = [
    "pandas>=2.0",
]
parquet = [
    "pandas>=2.0",
    "pyarrow>=17",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # PINNED, and this is the point: a linter's rule SET is part of the contract, not a detail of
    # whichever version CI happened to install that morning. `ruff>=0.4` meant the job could turn
    # red on a rule nobody chose, on a commit that changed nothing — which is the same shape as a
    # gate that is always red: it stops deciding anything and everyone learns to push past it.
    # Moving this line is how the rule set changes, deliberately, with the findings it brings.
    "ruff==0.16.6",
]

[project.urls]
Homepage = "https://aimeat.io"
Repository = "https://github.com/miikkij/aimeat-protocol"
Documentation = "https://github.com/miikkij/aimeat-protocol/tree/main/python/aimeat-crewai"
Issues = "https://github.com/miikkij/aimeat-protocol/issues"
Changelog = "https://github.com/miikkij/aimeat-protocol/blob/main/python/aimeat-crewai/CHANGELOG.md"

[tool.uv]
# Versions forced over what a dependency asks for, in uv.lock only (the CI test job installs from
# it); the published package's own requirements above are unchanged. Each line says why, and goes
# when the dependency's own pin moves past it.
#
# crewai (1.15.17, and 1.15.28, the newest on 2026-10-16) pins mcp~=1.28.1, and every mcp before
# 1.30.0 carries GHSA-84m7-p3x7-pcfv (moderate: the StreamableHTTP SERVER transport keeps sessions
# without a bound). This package and crewai use mcp as a client only, so the newer minor release is
# safe for what they run. Kept below 2, which is a new major line. An override replaces the whole
# requirement, so the [ws] extra that mcpadapt asks for is repeated here.
#
# crewai-cli (1.15.17, and 1.15.28, the newest on 2026-10-22) pins uv~=0.11.6, and every uv before
# 0.13.4 trusts the emSign ECC Root CA - G3 in its bundled CA store (GHSA-hq85-5cpj-mr62, critical:
# compromised intermediate keys allow a certificate for any host name). crewai-cli runs uv only as a
# subprocess for its `crewai install` and `crewai run` commands, which no crew of this package calls.
#
# crewai (1.15.17) pins opentelemetry-api, -sdk and -exporter-otlp-proto-http at ~=1.42.0, and every
# opentelemetry-api up to 1.45.0 parses a W3C tracestate header without a bound
# (GHSA-xcq7-p3pf-p88h, moderate). The sdk and the exporter require their own api version exactly,
# so the three move together. Kept below 2.
override-dependencies = [
    "mcp[ws]>=1.30.0,<2",
    "uv>=0.13.4",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aimeat_crewai"]

[tool.ruff]
line-length = 100
target-version = "py311"

csm: "1.0"

service:
  name: "Opinion Board"
  type: opinion
  description: "Open discussion board for community opinions, polls, and feedback"
  version: "1.0.0"
  semantic:
    "@context":
      schema: "https://schema.org/"
    "@type": "DiscussionForumPosting"

schema_mode: open

data_schema:
  required:
    title:
      type: string
      min: 3
      max: 200
    body:
      type: string
      min: 10
      max: 10000
  optional:
    category:
      type: string
      enum: ["general", "politics", "technology", "environment", "culture", "economy", "health", "education"]
    tags:
      type: array
      items: string
      max: 10
    anonymous:
      type: boolean
    author_display_name:
      type: string
      max: 50
    sentiment:
      type: string
      enum: ["positive", "negative", "neutral", "mixed"]
    poll:
      type: object
      properties:
        question:
          type: string
        options:
          type: array
          items: string
          min: 2
          max: 10
    reply_to:
      type: string
    image_url:
      type: string
      format: uri

consent_requirements:
  visibility_default: federation
  requires_consent: false
  consent_purpose: "public-opinion-sharing"
  data_retention: "until_revoked"

moderation:
  flags_enabled: true
  auto_hide_threshold: 3
  appeals_enabled: true

ui_hints:
  list_view: ["title", "category", "author_display_name", "sentiment"]
  detail_view: ["title", "body", "category", "author_display_name", "tags", "poll", "sentiment", "image_url"]
  search_fields: ["title", "body", "category", "tags"]
  sort_options: ["created_at", "title"]

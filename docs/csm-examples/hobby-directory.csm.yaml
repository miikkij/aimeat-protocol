csm: "1.0"

service:
  name: "Hobby Directory"
  type: directory
  description: "Discover hobbies and connect with like-minded people in your area"
  version: "1.0.0"
  semantic:
    "@context":
      schema: "https://schema.org/"
    "@type": "Organization"

schema_mode: open

data_schema:
  required:
    activity_type:
      type: string
      min: 2
      max: 100
    skill_level:
      type: string
      enum: ["beginner", "intermediate", "advanced", "expert", "all_levels"]
    meeting_frequency:
      type: string
      enum: ["daily", "weekly", "biweekly", "monthly", "on_demand"]
    location:
      type: object
      properties:
        city:
          type: string
          min: 1
          max: 100
        area:
          type: string
          required: false
        country:
          type: string
          required: false
  optional:
    display_name:
      type: string
      max: 100
    description:
      type: string
      max: 2000
    interests:
      type: array
      items: string
      min: 1
      max: 15
    group_size:
      type: string
      enum: ["solo", "pair", "small_group", "large_group", "any"]
    contact_info:
      type: string
      max: 200
    website:
      type: string
      format: uri
    images:
      type: array
      items: string
      max: 5
    tags:
      type: array
      items: string
      max: 10

consent_requirements:
  visibility_default: public
  requires_consent: false
  consent_purpose: "community-hobby-discovery"
  data_retention: "until_revoked"

moderation:
  flags_enabled: true
  auto_hide_threshold: 5
  appeals_enabled: true

ui_hints:
  list_view: ["activity_type", "skill_level", "meeting_frequency", "location.city"]
  detail_view: ["activity_type", "description", "skill_level", "meeting_frequency", "location", "interests", "group_size", "images", "website"]
  search_fields: ["activity_type", "skill_level", "location.city", "interests", "tags"]
  sort_options: ["created_at", "activity_type", "skill_level"]
  card_image_field: "images"

extension: "1.0"

metadata:
  name: "marketplace-behaviors"
  version: "2.0.0"
  description: "Multi-instance marketplace with purchase workflow, delivery confirmation, and ratings"
  author: "aimeat-core"
  license: "MIT"
  aimeat: ">=1.5"

required_apis:
  - wallet
  - memory
  - consent
  - trust

instances:
  supported: true
  config_per_instance:
    type: object
    properties:
      visibility:
        type: string
        enum: [public, password, invite]
        default: public
      password:
        type: string
      allowed_users:
        type: array
        items: { type: string }
      categories:
        type: array
        items: { type: string }
        default: ["general"]
      listing_fee_morsels:
        type: integer
        default: 2
      transaction_fee_percent:
        type: integer
        default: 5

actions:
  - id: create-listing
    description: "Create a new marketplace listing"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/create-listing"
    auth: required
    input:
      title:
        type: string
        required: true
      description:
        type: string
        required: true
      price:
        type: number
        required: true
      category:
        type: string
    output:
      listingId:
        type: string
    script: "actions/create-listing.js"

  - id: update-listing
    description: "Update an existing listing"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/update-listing"
    auth: required
    input:
      listingId:
        type: string
        required: true
      title:
        type: string
      description:
        type: string
      price:
        type: number
      category:
        type: string
      status:
        type: string
        enum: [active, paused]
    output:
      listing:
        type: object
    script: "actions/update-listing.js"

  - id: browse
    description: "Browse marketplace listings with filters and pagination"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/browse"
    auth: required
    input:
      category:
        type: string
      minPrice:
        type: number
      maxPrice:
        type: number
      status:
        type: string
      offset:
        type: integer
      limit:
        type: integer
    output:
      listings:
        type: array
      total:
        type: integer
      offset:
        type: integer
      limit:
        type: integer
    script: "actions/browse.js"

  - id: purchase
    description: "Purchase a listing"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/purchase"
    auth: required
    input:
      listingId:
        type: string
        required: true
    output:
      purchaseId:
        type: string
      total:
        type: number
      status:
        type: string
        enum: [purchased]
    script: "actions/purchase.js"

  - id: deliver
    description: "Confirm delivery of a purchased item"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/deliver"
    auth: required
    input:
      purchaseId:
        type: string
        required: true
    output:
      status:
        type: string
        enum: [delivered]
    script: "actions/deliver.js"

  - id: rate
    description: "Rate a completed purchase (1-5 stars)"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/rate"
    auth: required
    input:
      purchaseId:
        type: string
        required: true
      score:
        type: integer
        min: 1
        max: 5
      comment:
        type: string
        max: 500
    output:
      rated:
        type: boolean
    script: "actions/rate.js"

  - id: delist
    description: "Remove a listing from the marketplace"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/delist"
    auth: required
    input:
      listingId:
        type: string
        required: true
    output:
      status:
        type: string
        enum: [delisted]
    script: "actions/delist.js"

limits:
  memory_mb: 64
  timeout_ms: 5000
  max_api_calls: 50

config:
  listing_fee_morsels:
    type: integer
    default: 2
    description: "Global default fee charged to create a listing"
  transaction_fee_percent:
    type: integer
    default: 5
    description: "Global default percentage fee on each transaction"

federation:
  advertise: true
  capabilities:
    - "multi-instance"
    - "purchase-workflow"
    - "ratings"

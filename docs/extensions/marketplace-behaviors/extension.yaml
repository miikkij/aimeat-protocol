extension: "1.0"

metadata:
  name: "marketplace-behaviors"
  version: "3.0.0"
  description: "Multi-instance marketplace: listings with a money price, an agreement to buy, delivery confirmation and ratings. Payment is settled outside the extension"
  author: "aimeat-core"
  license: "MIT"
  aimeat: ">=3.26"

# A morsel paces use and is never a price (ruling decision-morseli-on-tahdistus-ei-hinta-tarjouksen-
# kaksi-arvoa). Two actions declare a pacing amount, `tollMorsels`, which the NODE charges per call
# before the script runs and credits to whoever installed the extension; the installer calls free.
# The scripts never touch the caller's wallet. A listing's price is money, stored as data: the buyer
# pays the seller outside this extension, or through the node's checkout when the seller sells the
# item as an offer or app tool with a money price.

required_apis:
  - memory

instances:
  supported: true
  config_per_instance:
    type: object
    properties:
      visibility:
        type: string
        enum: [public, password, invite]
        default: public
      password:
        type: string
      allowed_users:
        type: array
        items: { type: string }
      categories:
        type: array
        items: { type: string }
        default: ["general"]
      currency:
        type: string
        default: "EUR"

actions:
  - id: create-listing
    description: "Create a new marketplace listing with a money price"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/create-listing"
    auth: required
    tollMorsels: 2
    input:
      title:
        type: string
        required: true
      description:
        type: string
        required: true
      price:
        type: number
        required: true
        description: "The money price, in units of the currency (12.5 is 12.50)"
      currency:
        type: string
        description: "ISO 4217 code; the instance's currency when left out"
      category:
        type: string
    output:
      listingId:
        type: string
    script: "actions/create-listing.js"

  - id: update-listing
    description: "Update an existing listing"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/update-listing"
    auth: required
    input:
      listingId:
        type: string
        required: true
      title:
        type: string
      description:
        type: string
      price:
        type: number
      category:
        type: string
      status:
        type: string
        enum: [active, paused]
    output:
      listing:
        type: object
    script: "actions/update-listing.js"

  - id: browse
    description: "Browse marketplace listings with filters and pagination"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/browse"
    auth: required
    input:
      category:
        type: string
      minPrice:
        type: number
      maxPrice:
        type: number
      status:
        type: string
      offset:
        type: integer
      limit:
        type: integer
    output:
      listings:
        type: array
      total:
        type: integer
      offset:
        type: integer
      limit:
        type: integer
    script: "actions/browse.js"

  - id: purchase
    description: "Agree to buy a listing at its money price; the listing is reserved for the buyer. Payment is settled between buyer and seller, not by this action"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/purchase"
    auth: required
    tollMorsels: 1
    input:
      listingId:
        type: string
        required: true
    output:
      purchaseId:
        type: string
      price:
        type: number
      currency:
        type: string
      status:
        type: string
        enum: [agreed]
    script: "actions/purchase.js"

  - id: deliver
    description: "Confirm delivery of an item the buyer agreed to buy"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/deliver"
    auth: required
    input:
      purchaseId:
        type: string
        required: true
    output:
      status:
        type: string
        enum: [delivered]
    script: "actions/deliver.js"

  - id: rate
    description: "Rate a completed purchase (1-5 stars)"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/rate"
    auth: required
    input:
      purchaseId:
        type: string
        required: true
      score:
        type: integer
        min: 1
        max: 5
      comment:
        type: string
        max: 500
    output:
      rated:
        type: boolean
    script: "actions/rate.js"

  - id: delist
    description: "Remove a listing from the marketplace"
    method: POST
    path: "/v1/ext/marketplace-behaviors/:instanceId/delist"
    auth: required
    input:
      listingId:
        type: string
        required: true
    output:
      status:
        type: string
        enum: [delisted]
    script: "actions/delist.js"

limits:
  memory_mb: 64
  timeout_ms: 5000
  max_api_calls: 50

config:
  currency:
    type: string
    default: "EUR"
    description: "Default currency of a listing's money price when the instance names none"

federation:
  advertise: true
  capabilities:
    - "multi-instance"
    - "purchase-workflow"
    - "ratings"

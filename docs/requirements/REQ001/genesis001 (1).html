<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENESIS 001</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; }
  canvas#c { display:block; cursor:crosshair; }

  #controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; z-index: 20;
    background: rgba(0,0,0,0.55); border: 1px solid rgba(255,60,0,0.25);
    padding: 8px 14px; border-radius: 2px; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    background: rgba(255,40,0,0.12); border: 1px solid rgba(255,60,0,0.4);
    color: rgba(255,120,60,0.9); font: 700 0.6rem 'Courier New', monospace;
    letter-spacing: 0.08em; padding: 5px 10px; cursor: pointer;
    border-radius: 1px; transition: background 0.15s; user-select: none;
  }
  .btn:hover { background: rgba(255,60,0,0.3); }
  .sep { width:1px; height:22px; background:rgba(255,60,0,0.2); }
  #info {
    font: 600 0.48rem 'Courier New', monospace; letter-spacing: 0.25em;
    color: rgba(255,80,0,0.4); white-space: nowrap; min-width: 160px; text-align: center;
  }



  .corner { position:fixed; width:50px; height:50px; opacity:0.3; pointer-events:none; z-index:9; }
  #c1 { top:14px; left:14px;  border-top:1px solid #f30; border-left:1px solid #f30; }
  #c2 { top:14px; right:14px; border-top:1px solid #f30; border-right:1px solid #f30; }
  #c3 { bottom:60px; left:14px;  border-bottom:1px solid #f30; border-left:1px solid #f30; }
  #c4 { bottom:60px; right:14px; border-bottom:1px solid #f30; border-right:1px solid #f30; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="corner" id="c1"></div>
<div class="corner" id="c2"></div>
<div class="corner" id="c3"></div>
<div class="corner" id="c4"></div>


<div id="controls">
  <button class="btn" id="btnCCW">◀ CCW</button>
  <button class="btn" id="btnCW">CW ▶</button>
  <div class="sep"></div>
  <button class="btn" id="btnUp">TILT ▲</button>
  <button class="btn" id="btnDown">TILT ▼</button>
  <div class="sep"></div>
  <button class="btn" id="btnDenser">+ TIHEÄ</button>
  <button class="btn" id="btnSparser">- HARVA</button>
  <div class="sep"></div>
  <button class="btn" id="btnHigher">↑ KORKEUS</button>
  <button class="btn" id="btnLower">↓ KORKEUS</button>
  <div class="sep"></div>
  <button class="btn" id="btnWaveUp">↑ AALTO</button>
  <button class="btn" id="btnWaveDown">↓ AALTO</button>
  <div class="sep"></div>
  <div id="info">ROT: 0° · TILT: 35°</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
const state = {
  rotY: 0, tilt: 31, textH: 2.5, spacing: 1.6, cols: 160, rows: 100,
};

// ═══════════════════════════════════════════════════════
//  DEPTH MAP 1: TEXT (static, GENESIS 001)
// ═══════════════════════════════════════════════════════
// ── UI TEXT STATE (rendered into text depth map) ──────
let uiMode   = 'idle';   // 'idle' | 'playing' | 'dead'
let uiScore  = 0;
let uiBlinkOn = true;
let uiBlinkFrame = 0;

function buildTextMap(cols, rows, mode, score, blinkOn) {
  const TW = 960, TH = 480;
  const cv = document.createElement('canvas');
  cv.width = TW; cv.height = TH;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#000'; cx.fillRect(0, 0, TW, TH);

  // Helper: draw text with glow passes
  function glowText(text, x, y, size, maxBlur=20) {
    const passes = [
      {blur:maxBlur,   alpha:0.12},
      {blur:maxBlur/2, alpha:0.25},
      {blur:maxBlur/4, alpha:0.45},
      {blur:2,         alpha:0.70},
      {blur:0,         alpha:1.00},
    ];
    for (const p of passes) {
      cx.save(); cx.globalAlpha = p.alpha;
      cx.globalCompositeOperation = 'lighter';
      cx.filter = p.blur > 0 ? `blur(${p.blur}px)` : 'none';
      cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.font = `900 ${size}px Arial Black, Impact, sans-serif`;
      cx.fillText(text, x, y);
      cx.restore();
    }
  }

  // Always: GENESIS 001 (slightly dimmer when playing)
  const baseAlpha = (mode === 'playing') ? 0.6 : 1.0;
  cx.save(); cx.globalAlpha = baseAlpha; cx.globalCompositeOperation = 'source-over';
  cx.restore();

  // GENESIS (multi-pass glow)
  for (const p of [
    {blur:28,alpha:0.15*baseAlpha},{blur:16,alpha:0.28*baseAlpha},
    {blur:8, alpha:0.45*baseAlpha},{blur:4, alpha:0.65*baseAlpha},
    {blur:1, alpha:0.85*baseAlpha},{blur:0, alpha:1.00*baseAlpha}
  ]) {
    cx.save(); cx.globalAlpha = p.alpha;
    cx.globalCompositeOperation = 'lighter';
    cx.filter = p.blur > 0 ? `blur(${p.blur}px)` : 'none';
    cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.font = `900 108px Arial Black, Impact, sans-serif`;
    cx.fillText('GENESIS', TW/2, TH*0.33);
    cx.font = `900 80px Arial Black, Impact, sans-serif`;
    cx.fillText('001', TW/2, TH*0.72);
    cx.restore();
  }

  // Score while playing or after death
  if (mode === 'playing' || mode === 'dead') {
    const scoreStr = `${String(score).padStart(4,'0')}`;
    glowText(scoreStr, TW * 0.82, TH * 0.14, 52, 16);
  }

  // Blink text
  if (blinkOn) {
    if (mode === 'idle') {
      glowText('CLICK TO PLAY', TW/2, TH * 0.88, 36, 12);
    } else if (mode === 'dead') {
      glowText('SNAKE DESTROYED', TW/2, TH * 0.88, 40, 14);
      glowText('CLICK TO RESTART', TW/2, TH * 0.95, 30, 10);
    }
  }

  const px = cx.getImageData(0,0,TW,TH).data;
  const map = new Float32Array(cols * rows);
  for (let r=0; r<rows; r++)
    for (let c=0; c<cols; c++) {
      const tx = Math.floor((c/cols)*TW), ty = Math.floor((r/rows)*TH);
      map[r*cols+c] = Math.min(px[(ty*TW+tx)*4]/255, 1.0);
    }
  return map;
}
let textMap = buildTextMap(state.cols, state.rows, 'idle', 0, true);

// Redraw text map when UI state changes
let lastBlinkOn = true, lastUiMode = 'idle', lastUiScore = -1;
function refreshTextMapIfNeeded() {
  if (uiBlinkOn !== lastBlinkOn || uiMode !== lastUiMode || uiScore !== lastUiScore) {
    textMap = buildTextMap(state.cols, state.rows, uiMode, uiScore, uiBlinkOn);
    lastBlinkOn = uiBlinkOn; lastUiMode = uiMode; lastUiScore = uiScore;
  }
}

// ═══════════════════════════════════════════════════════
//  DEPTH MAP 2: TERRAIN (scrolling waves)
// ═══════════════════════════════════════════════════════
let WAVE_H = 0.2;
const SCROLL_SPEED = 0.22;
let dirX = 0.0, dirZ = 1.0;
let scroll = 0;

function wave(wx, wz, t) {
  const phase = wx * dirX + wz * dirZ;
  return (
    Math.sin(phase*0.18 + t*0.13) * 1.1 +
    Math.sin(phase*0.43 - t*0.30) * 0.55 +
    Math.cos(phase*0.10 + t*0.07) * 1.3 +
    Math.sin(phase*0.28 + t*0.52) * 0.40 +
    Math.sin(phase*0.12 + t*0.09) * 0.90
  ) * WAVE_H;
}

// ═══════════════════════════════════════════════════════
//  DEPTH MAP 3: SNAKE GAME
//  Values: 0=empty, 0.0–0.5=food (pulsing), 0.6–1.0=snake body
// ═══════════════════════════════════════════════════════
const SNAKE_H   = 10;  // max height of snake above terrain
const FOOD_H    = 5;   // food height
const FOOD_COUNT = 18; // how many food pellets start on field

// snakeMap: per-grid-cell value
// foodMap:  Float32Array marking food cells (1=food)
// bodyMap:  Float32Array marking body cells (0=empty, 1=head, 0.x=body)
const snakeMap  = new Float32Array(state.cols * state.rows); // combined for rendering
const foodCells = new Set();  // Set of grid indices with food
const bodyCells = new Map();  // index → intensity (1=head, taper toward tail)

// ── SNAKE GAME STATE ─────────────────────────────────
let snakeActive  = false;  // game running
let snakeDead    = false;
let snake        = [];     // [{c,r}, ...] head first
let snakeDir     = {dc:1, dr:0};
let nextDir      = {dc:1, dr:0};
let snakeScore   = 0;
let snakeTick    = 0;
const TICK_RATE  = 7;      // frames per snake move

// Explosion particles: {c,r,vc,vr,age,maxAge}
const explodeParticles = [];

// ── FOOD MANAGEMENT ──────────────────────────────────
function spawnFood(count=1) {
  const { cols, rows } = state;
  let attempts = 0;
  while (count > 0 && attempts < 500) {
    attempts++;
    const c = Math.floor(Math.random() * cols);
    const r = Math.floor(Math.random() * rows);
    const idx = r * cols + c;
    if (!foodCells.has(idx) && !bodyCells.has(idx)) {
      foodCells.add(idx);
      count--;
    }
  }
}

function initSnake() {
  const { cols, rows } = state;
  snake = [
    { c: Math.floor(cols/2),     r: Math.floor(rows/2) },
    { c: Math.floor(cols/2) - 1, r: Math.floor(rows/2) },
    { c: Math.floor(cols/2) - 2, r: Math.floor(rows/2) },
  ];
  snakeDir  = { dc:1, dr:0 };
  nextDir   = { dc:1, dr:0 };
  snakeScore = 0;
  snakeDead  = false;
  foodCells.clear();
  bodyCells.clear();
  explodeParticles.length = 0;
  spawnFood(FOOD_COUNT);
  snakeActive = true;
  uiMode  = 'playing';
  uiScore = 0;
  updateInfo();
}

function killSnake() {
  snakeDead   = false;
  snakeActive = false;
  for (let i = 0; i < snake.length; i++) {
    const seg = snake[i];
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.4 + Math.random() * 1.2;
    explodeParticles.push({
      c: seg.c, r: seg.r,
      vc: Math.cos(angle) * speed,
      vr: Math.sin(angle) * speed,
      age: 0,
      maxAge: 30 + Math.floor(Math.random() * 40),
    });
  }
  snake = [];
  bodyCells.clear();
  uiMode = 'dead';
}

function stepSnake() {
  if (!snakeActive || snakeDead) return;

  // Apply buffered direction
  snakeDir = { ...nextDir };

  const head = snake[0];
  const { cols, rows } = state;
  let nc = head.c + snakeDir.dc;
  let nr = head.r + snakeDir.dr;

  // Wrap at walls
  nc = ((nc % cols) + cols) % cols;
  nr = ((nr % rows) + rows) % rows;

  const nIdx = nr * cols + nc;

  // Self collision
  if (bodyCells.has(nIdx)) { killSnake(); return; }

  const ateFood = foodCells.has(nIdx);
  if (ateFood) {
    foodCells.delete(nIdx);
    snakeScore++;
    uiScore = snakeScore;
    spawnFood(1);
  }

  // Move: prepend new head
  snake.unshift({ c: nc, r: nr });

  // Remove tail unless ate food
  if (!ateFood) snake.pop();

  // Rebuild bodyCells with intensity gradient
  bodyCells.clear();
  for (let i = 0; i < snake.length; i++) {
    const idx = snake[i].r * cols + snake[i].c;
    const intensity = 1.0 - (i / snake.length) * 0.5; // 1.0 head → 0.5 tail
    bodyCells.set(idx, intensity);
  }
}

// Rebuild snakeMap each frame from foodCells + bodyCells + explode
let foodPulse = 0;
function buildSnakeMap(frame) {
  const { cols, rows } = state;
  foodPulse = Math.sin(frame * 0.08) * 0.3 + 0.7; // 0.4..1.0 pulse

  // Clear
  snakeMap.fill(0);

  // Food
  for (const idx of foodCells) {
    snakeMap[idx] = 0.45 * foodPulse;
  }

  // Body
  for (const [idx, intensity] of bodyCells) {
    snakeMap[idx] = 0.55 + intensity * 0.45; // 0.55..1.0
  }

  // Explosion particles (animate + settle as food)
  for (let i = explodeParticles.length - 1; i >= 0; i--) {
    const p = explodeParticles[i];
    p.c   += p.vc;
    p.r   += p.vr;
    p.vc  *= 0.88;
    p.vr  *= 0.88;
    p.age++;

    const c = Math.round(p.c);
    const r = Math.round(p.r);
    if (c >= 0 && c < cols && r >= 0 && r < rows) {
      const idx = r * cols + c;
      const t = p.age / p.maxAge;
      snakeMap[idx] = Math.max(snakeMap[idx], (1.0 - t) * 0.9);
    }

    if (p.age >= p.maxAge) {
      // Settle as food
      const fc = Math.round(p.c), fr = Math.round(p.r);
      if (fc >= 0 && fc < cols && fr >= 0 && fr < rows) {
        foodCells.add(fr * cols + fc);
      }
      explodeParticles.splice(i, 1);
    }
  }
}

// ═══════════════════════════════════════════════════════
//  COLOR: blend all 3 depth maps
// ═══════════════════════════════════════════════════════
function colorize(tv, wv, sv) {
  // ── Layer 1: terrain base ──
  const tw = WAVE_H > 0 ? (wv / WAVE_H) * 0.5 + 0.5 : 0.5;
  let R = 0.04 + tw * 0.05;
  let G = 0.02 + tw * 0.02;
  let B = 0.20 + tw * 0.30;

  // ── Layer 2: text (red→orange→white) ──
  if (tv > 0.01) {
    const t2 = Math.pow(tv, 0.75);
    const bl = Math.min(1, tv * 5);
    R += (0.55 + t2*0.45 - R) * bl;
    G += (0.04 + t2*0.36 - G) * bl;
    B += (0.02 + t2*0.10 - B) * bl;
  }

  // ── Layer 3: snake (green body / cyan food) ──
  if (sv > 0.01) {
    let sR, sG, sB;
    if (sv > 0.54) {
      // Snake body: green → white at head
      const t = (sv - 0.55) / 0.45;
      sR = 0.10 + t * 0.90;
      sG = 0.90 + t * 0.10;
      sB = 0.20 + t * 0.80;
    } else {
      // Food: cyan/teal pulse
      sR = 0.05;
      sG = 0.80 + sv * 0.4;
      sB = 0.70 + sv * 0.3;
    }
    const blend = Math.min(1, sv * 4);
    R += (sR - R) * blend;
    G += (sG - G) * blend;
    B += (sB - B) * blend;
  }

  return [R, G, B];
}

// ═══════════════════════════════════════════════════════
//  THREE.JS
// ═══════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 2000);

let geo, pts;
function buildGrid() {
  if (pts) scene.remove(pts);
  const { cols, rows, spacing } = state;
  const N = cols * rows;
  geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(N*3), 3));
  const mat = new THREE.PointsMaterial({
    size: Math.max(1.0, spacing * 0.65), vertexColors: true,
    transparent: true, opacity: 1.0, sizeAttenuation: true,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  pts = new THREE.Points(geo, mat);
  scene.add(pts);
}
buildGrid();

function updateCamera() {
  const rad     = THREE.MathUtils.degToRad(state.rotY);
  const tiltRad = THREE.MathUtils.degToRad(state.tilt);
  const dist = 160;
  camera.position.x = Math.sin(rad) * dist * Math.cos(tiltRad);
  camera.position.y = Math.sin(tiltRad) * dist;
  camera.position.z = Math.cos(rad) * dist * Math.cos(tiltRad);
  camera.lookAt(0, 4, 0);
}
updateCamera();

// ═══════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════
let frame = 0;
let mouseX = 0, mouseY = 0;

function animate() {
  requestAnimationFrame(animate);
  frame++;

  // Wave direction from mouse
  dirX += (mouseX * 1.2 - dirX) * 0.04;
  dirZ += (1.0        - dirZ) * 0.04;
  scroll += SCROLL_SPEED;

  // Blink ticker (every ~40 frames = ~0.67s)
  uiBlinkFrame++;
  if (uiBlinkFrame > 40) { uiBlinkFrame = 0; uiBlinkOn = !uiBlinkOn; }

  // Rebuild text depth map if UI state changed
  refreshTextMapIfNeeded();
  snakeTick++;
  if (snakeTick >= TICK_RATE) { snakeTick = 0; stepSnake(); }

  // Build snake depth map
  buildSnakeMap(frame);

  const { cols, rows, spacing, textH } = state;
  const pos = geo.attributes.position.array;
  const col = geo.attributes.color.array;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i   = r * cols + c;
      const wx  = (c - cols/2) * spacing;
      const wz  = (r - rows/2) * spacing;
      const wv  = wave(wx, wz, scroll);
      const tv  = textMap[i];
      const sv  = snakeMap[i];

      // Y = terrain + text relief + snake relief
      pos[i*3]   = wx;
      pos[i*3+1] = wv + tv * textH + sv * (sv > 0.54 ? SNAKE_H : FOOD_H);
      pos[i*3+2] = wz;

      const rgb  = colorize(tv, wv, sv);
      col[i*3]   = rgb[0];
      col[i*3+1] = rgb[1];
      col[i*3+2] = rgb[2];
    }
  }

  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate    = true;
  renderer.render(scene, camera);
}
animate();

// ═══════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════
const infoEl = document.getElementById('info');
function updateInfo() {
  const mode = snakeActive ? ` · 🐍 ${snakeScore}` : '';
  infoEl.textContent = `ROT: ${Math.round(state.rotY)}° · TILT: ${Math.round(state.tilt)}° · H: ${state.textH.toFixed(1)} · W: ${WAVE_H.toFixed(1)}${mode}`;
}

function hold(id, fn) {
  const el = document.getElementById(id);
  let iv;
  el.addEventListener('pointerdown', () => { fn(); iv = setInterval(fn, 80); });
  const stop = () => clearInterval(iv);
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
}

hold('btnCW',       () => { state.rotY += 3;                         updateCamera(); updateInfo(); });
hold('btnCCW',      () => { state.rotY -= 3;                         updateCamera(); updateInfo(); });
hold('btnUp',       () => { state.tilt = Math.min(85, state.tilt+2); updateCamera(); updateInfo(); });
hold('btnDown',     () => { state.tilt = Math.max(5,  state.tilt-2); updateCamera(); updateInfo(); });
hold('btnHigher',   () => { state.textH = Math.min(35, state.textH+0.5); updateInfo(); });
hold('btnLower',    () => { state.textH = Math.max(1,  state.textH-0.5); updateInfo(); });
hold('btnWaveUp',   () => { WAVE_H = Math.min(20, +(WAVE_H+0.1).toFixed(1)); updateInfo(); });
hold('btnWaveDown', () => { WAVE_H = Math.max(0,  +(WAVE_H-0.1).toFixed(1)); updateInfo(); });

document.getElementById('btnDenser').addEventListener('click', () => {
  if (state.spacing > 0.9) {
    state.spacing = Math.max(0.9, state.spacing - 0.2);
    buildGrid(); textMap = buildTextMap(state.cols, state.rows, uiMode, uiScore, uiBlinkOn); updateInfo();
  }
});
document.getElementById('btnSparser').addEventListener('click', () => {
  if (state.spacing < 4.0) {
    state.spacing = Math.min(4.0, state.spacing + 0.2);
    buildGrid(); updateInfo();
  }
});

// Canvas click → start/restart snake
document.getElementById('c').addEventListener('click', () => {
  initSnake();
});

// Keyboard
document.addEventListener('keydown', e => {
  if (snakeActive) {
    // Snake controls — prevent default so page doesn't scroll
    const dirs = {
      ArrowUp:    { dc: 0,  dr: -1 },
      ArrowDown:  { dc: 0,  dr:  1 },
      ArrowLeft:  { dc: -1, dr:  0 },
      ArrowRight: { dc: 1,  dr:  0 },
    };
    if (dirs[e.key]) {
      e.preventDefault();
      const d = dirs[e.key];
      // Prevent 180° reversal
      if (d.dc !== -snakeDir.dc || d.dr !== -snakeDir.dr)
        nextDir = d;
      return;
    }
  }

  // Camera controls (only when snake not active)
  if (e.key === 'ArrowLeft')  { state.rotY -= 5; updateCamera(); }
  if (e.key === 'ArrowRight') { state.rotY += 5; updateCamera(); }
  if (e.key === 'ArrowUp')    { state.tilt = Math.min(85, state.tilt+3); updateCamera(); }
  if (e.key === 'ArrowDown')  { state.tilt = Math.max(5,  state.tilt-3); updateCamera(); }
  if (e.key === '+' || e.key === '=') state.textH = Math.min(35, state.textH+1);
  if (e.key === '-')                   state.textH = Math.max(1,  state.textH-1);
  updateInfo();
});

// Mouse for wave direction
document.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth)  * 2 - 1;
  mouseY = (e.clientY / window.innerHeight) * 2 - 1;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>

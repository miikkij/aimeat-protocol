# gitleaks configuration for the full-history secret scan (security/semantic-audit/secrets-scan.mjs).
#
# WHY THIS FILE EXISTS. The scan ran with gitleaks' default rules and no configuration, so the only
# way to forgive a false positive was to append it to gitleaks-baseline.json by hand. A baseline
# entry pins one finding in one commit, and every new test file with a test account password is a
# new finding — so the same class came back as "N new unacknowledged hits" every few weeks. The
# baseline was last topped up on 2026-08-28 with ten of them, and by 2026-09-13 there were
# twenty-nine more, every one a test fixture.
#
# WHAT IS ALLOWED HERE, AND WHAT IS NOT. Each allowlist below names a SHAPE and the place it may
# appear, never a whole directory. `aimeat/test/**` is not exempt: a real AWS key, a real private
# key or a real token pasted into a test file still fires, because none of them looks like these.
# That matters more than the noise does, since a test file is exactly where a real credential gets
# pasted by accident.
#
# HOW TO CHECK IT STILL WORKS. Put a realistic fake credential into a test file, run the scan, and
# see it reported. That was done when this file was written: an AWS-shaped key in
# aimeat/test/e2e-secrets.ts was found while all twenty-nine fixtures stayed quiet.
#
# The baseline file stays for the entries it already holds; this file stops the class from growing.

[extend]
useDefault = true

# 1. Test account passwords. Every E2E suite registers a throwaway owner, and the password is a
#    readable literal next to the name it belongs to: password: 'VaultTest12345'. Letters and
#    digits, in up to five dash-separated groups ('Wrong-pass-1234', the recovery-code shape
#    'EXC80-ABCD-EFGH-JKLM'), which is what makes it recognisable and what a real credential
#    almost never is. Dashes added 2026-10-10, when eleven suites had grown four hits of that shape.
[[allowlists]]
description = "E2E and unit test account passwords (letters, digits and dashes, next to their test owner)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''aimeat/test/.*''']
regexTarget = "match"
regexes = ['''(?i)password\s*[:=]\s*['"][A-Za-z][A-Za-z0-9]{2,40}(-[A-Za-z0-9]{2,12}){0,4}['"]''']

# 2. The fixed test encryption key. One 64-character hex constant, the same in every suite that
#    needs the node to boot with encryption on. It decrypts nothing outside a test database.
[[allowlists]]
description = "The shared 64-hex test encryption key in E2E suites"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''aimeat/test/.*''']
regexTarget = "match"
regexes = ['''AIMEAT_ENCRYPTION_KEY\s*[:=]\s*['"][0-9a-f]{64}['"]''']

# 3. The built SDK bundle. aimeat-auth.js is generated from src/static/sdk-libs/src, and the hits
#    are its own documentation strings describing a `password` parameter. A secret cannot enter a
#    build without entering the source first, and the source is scanned.
[[allowlists]]
description = "Documentation strings in the generated SDK auth bundle"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''aimeat/src/static/sdk-libs/dist/aimeat-auth\.js''']
regexTarget = "match"
regexes = ['''password\.?"?\s*:''']

# 4. Memory keys in the manuals. A curl example writing {"key":"csm.kirpputori.item-001", …} is an
#    address in this product's own store, and the rule reads the word `key` as an API key.
[[allowlists]]
description = "Memory keys in documentation examples"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''docs/.*\.md''']
regexTarget = "match"
# The rule's match begins at the word, not at the quote before it, so the opening quote is optional.
regexes = ['''"?key"?\s*:\s*"[a-z][a-z0-9]*(\.[a-z0-9-]+)+"''']

# 5. Migration file hashes. security/migration-hashes.json holds the SHA-256 of each migration file
#    (pnpm check:migration-hashes), and a migration named after secrets or passwords (0071_owner_
#    secrets.sql) makes the rule read the hash as a key. Every such migration added a hit: fifteen
#    by 2026-10-10. The file holds nothing but file names and their hashes.
[[allowlists]]
description = "SHA-256 of a migration file in the migration hash ledger"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''aimeat/security/migration-hashes\.json''']
regexTarget = "match"
regexes = ['''[0-9a-z_]+\.sql"\s*:\s*"[0-9a-f]{64}"''']

# 6. Canary secrets. The secret sweeps (logger redaction, MCP transport, WebSocket upgrade, Consul
#    export) plant a value and assert it never reaches a log or a response, and each one names itself
#    a canary so a reader knows it is planted. The word is the shape: a real key does not carry it.
[[allowlists]]
description = "Planted canary values in the secret-sweep tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''aimeat/test/.*''']
regexTarget = "secret"
regexes = ['''(?i)canary''']

# 7. Protocol nonces in tests. A fixed Idempotency-Key (a UUID) proves a replay is answered from the
#    cache, and Sec-WebSocket-Key 'dGhlIHNhbXBsZSBub25jZQ==' is the sample nonce printed in RFC 6455
#    section 1.3. Both are request identifiers, not credentials.
[[allowlists]]
description = "Idempotency-Key UUIDs and the RFC 6455 sample nonce in tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''aimeat/test/.*''']
regexTarget = "match"
regexes = [
  '''Idempotency-Key['"]?\s*:\s*['"][0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}['"]''',
  '''Sec-WebSocket-Key['"]?\s*:\s*['"]dGhlIHNhbXBsZSBub25jZQ==['"]''',
]

# 8. The early specification drafts, in history only. The v1.x RFC copies, the numbered chapter
#    files and rfc-parts were removed from the tree on 2026-07-12 and exist only in commits from
#    February to July 2026. Their example tokens and keys sit in several identical files of one
#    commit, and gitleaks reports each duplicate once, under whichever file it happens to read
#    first, so a baseline entry pinned to one file came back as a new hit under another. This is a
#    place, not a shape, because no file there can change any more. Only generic-api-key is
#    forgiven: a private key or a provider key in those files would still be reported.
[[allowlists]]
description = "Example values in the removed v1.x specification drafts (history only)"
targetRules = ["generic-api-key"]
paths = [
  '''docs/AIMEAT-RFC-v1\.[0-9][^/]*\.md''',
  '''docs/0[0-9]-[a-z-]+\.md''',
  '''docs/rfc-parts/[^/]+\.md''',
  '''docs/AIMEAT-001-[^/]+\.md''',
]

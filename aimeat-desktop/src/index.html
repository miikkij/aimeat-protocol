<!DOCTYPE html>
<!-- AIMEAT Desktop: attach this computer's AI tools, then verify the first read in the tool. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIMEAT</title>
  <link rel="stylesheet" href="house.css" />
  <link rel="stylesheet" href="frontdoor.css" />
  <link rel="stylesheet" href="desktop-tools.css" />
</head>
<body>
  <div class="wrap">
    <header class="head">
      <span class="wordmark">AIME<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C5 16 2 12.5 2 8.8 2 6.1 4.1 4 6.8 4c1.7 0 3.3.8 4.2 2.1L12 7.2l1-1.1C13.9 4.8 15.5 4 17.2 4 19.9 4 22 6.1 22 8.8c0 3.7-3 7.2-10 12.2z"/></svg><span class="at">AT</span></span>
      <span class="poster-crumb" id="crumb"></span><span class="spacer"></span>
      <span class="version" id="version"></span>
      <select class="lang" id="lang" aria-label="Language"><option value="en">EN</option><option value="fi">FI</option></select>
    </header>
    <main>
      <div id="update"></div>
      <h1 class="poster-page-title" data-text="title">Your AI tools</h1>
      <p class="lead" data-text="lead"></p>
      <p class="below"><a class="poster-action" href="#desktopTools" data-tools-text="toolsLink"></a></p>
      <div class="environment">
        <div class="field"><label class="poster-label" for="environment" data-text="environment"></label><select id="environment"></select></div>
        <div class="field"><label class="poster-label" for="environmentName" data-text="name"></label><input id="environmentName" type="text" maxlength="80" autocomplete="off" /></div>
        <div class="field"><label class="poster-label" for="addr" data-text="address"></label><input id="addr" type="text" spellcheck="false" autocomplete="off" aria-describedby="addressHint" /><p class="hint" id="addressHint" data-text="addressHint"></p></div>
        <div class="acts below"><button class="poster-action" id="recheck" data-text="check"></button><button class="poster-action" id="newEnvironment" data-text="newEnvironment"></button><button class="poster-action" id="access" data-text="access"></button></div>
        <p class="hint" data-text="environmentHint"></p>
      </div>
      <div id="notice" role="status" aria-live="polite"></div>
      <section class="poster-section" aria-labelledby="listTitle">
        <h2 class="poster-section-title" id="listTitle" data-text="listTitle"></h2><div id="list"></div>
        <p class="below"><button class="poster-slab" id="connectAll" data-text="addAll" hidden></button></p>
      </section>
      <section class="poster-section" aria-labelledby="firstTitle">
        <h2 class="poster-section-title" id="firstTitle" data-text="firstTitle"></h2>
        <p class="lead" data-text="firstHint"></p><pre class="snippet" id="firstPrompt"></pre>
        <button class="poster-action" id="copyPrompt" data-text="copyPrompt"></button><p class="hint" data-text="firstPrivacy"></p>
      </section>
      <div id="desktopTools"></div>
      <div class="foot"><a class="poster-action" href="server.html" data-text="local"></a></div>
    </main>
  </div>
  <script src="frontdoor-state.js"></script><script src="frontdoor.js"></script><script src="updates.js"></script>
  <script src="desktop-tools-strings.js"></script><script src="desktop-tools.js"></script>
</body>
</html>

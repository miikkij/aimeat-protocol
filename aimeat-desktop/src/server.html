<!DOCTYPE html>
<!--
  AIMEAT Desktop — the machine room: an AIMEAT of the person's own, running on this computer.

  This page starts and stops the local server, backs up and restores its data, and shows
  its AI connections, settings and log. The front door (index.html) is where a person
  attaches their AI tools; this page is only for someone who wants their AIMEAT on their own
  machine rather than on aimeat.io.

  IT REPLACES legacy.html (2026-09-29). That window had grown a home screen of prompt cards, a chat
  and a local agent runner that all did, worse, what the AIMEAT's own web pages do, plus a local
  CrewAI path that needed git, uv, Ollama and an npm command on the person's machine: exactly the
  terminal the front door exists to remove. Those went, with their Rust behind them, and what
  remained was small enough to write again cleanly rather than carve out of three thousand lines.

  Runtime status arrives through node-status events. Backup paths come only from native dialogs;
  a restore requires a backend ticket from inspection and the person's explicit confirmation.

  NO INLINE HANDLER AND NO STYLE ATTRIBUTE. Every listener is attached from the script and every
  look comes from house.css or server.css, so the page asks less of the content security
  policy than the one it replaces (src-tauri/src/webview_policy.rs holds the two together).

  The words are English and Finnish, and neither says `node` or `solmu` (skill `aimeat-writing`).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIMEAT</title>
  <link rel="stylesheet" href="house.css" />
  <link rel="stylesheet" href="server.css" />
</head>
<body>
  <div class="wrap">
    <header class="head">
      <a class="wordmark" href="index.html">AIME<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C5 16 2 12.5 2 8.8 2 6.1 4.1 4 6.8 4c1.7 0 3.3.8 4.2 2.1L12 7.2l1-1.1C13.9 4.8 15.5 4 17.2 4 19.9 4 22 6.1 22 8.8c0 3.7-3 7.2-10 12.2z"/></svg><span class="at">AT</span></a>
      <span class="poster-crumb" id="crumb"></span>
      <span class="spacer"></span>
      <span class="version" id="version"></span>
      <select class="lang" id="lang" aria-label="Language">
        <option value="en">EN</option>
        <option value="fi">FI</option>
      </select>
    </header>

    <main>
      <p class="back"><a class="poster-action" href="index.html" id="t-back"></a></p>
      <h1 class="poster-page-title" id="t-title"></h1>
      <p class="lead" id="t-lead"></p>
      <div id="update" aria-live="polite"></div>

      <!-- ── Running it ─────────────────────────────────────────────────── -->
      <section class="poster-section">
        <h2 class="poster-section-title" id="t-stateTitle"></h2>
        <div class="state-line">
          <span class="poster-chip" id="stateChip"></span>
          <span id="stateText"></span>
        </div>
        <p class="poster-aside danger" id="stateError" role="alert" hidden></p>
        <p class="poster-aside" id="restartNote" hidden></p>
        <div class="acts below">
          <button class="poster-slab" id="toggle"></button>
          <button class="poster-action" id="openBrowser" disabled></button>
          <a class="poster-action" id="connectLocal" href="index.html" hidden></a>
        </div>
        <dl class="info below">
          <dt id="t-infoAddress"></dt><dd id="infoAddress">--</dd>
          <dt id="t-infoId"></dt><dd id="infoId">--</dd>
          <dt id="t-infoData"></dt><dd id="infoData">--</dd>
          <dt id="t-infoStorage"></dt><dd id="infoStorage">SQLite</dd>
        </dl>
      </section>

      <section class="poster-section">
        <h2 class="poster-section-title" id="t-backupTitle"></h2>
        <p class="lead" id="t-backupLead"></p>
        <p class="hint" id="t-backupPrivacy"></p>
        <p id="lastBackup" aria-live="polite"></p>
        <p class="hint" id="backupStopHint"></p>
        <div class="acts below">
          <button class="poster-action" id="createBackup"></button>
          <button class="poster-action" id="inspectBackup"></button>
        </div>
        <p class="poster-aside" id="backupResult" aria-live="polite" hidden></p>
      </section>

      <!-- ── The AI on this computer ────────────────────────────────────── -->
      <section class="poster-section">
        <h2 class="poster-section-title" id="t-aiTitle"></h2>
        <p class="lead" id="t-aiLead"></p>

        <div id="signedOut">
          <div class="field">
            <label class="poster-label" for="aiUser" id="t-user"></label>
            <input id="aiUser" type="text" spellcheck="false" autocomplete="off" />
          </div>
          <div class="field">
            <label class="poster-label" for="aiPass" id="t-pass"></label>
            <input id="aiPass" type="password" autocomplete="off" />
            <p class="hint" id="t-signInHint"></p>
          </div>
          <div class="field">
            <label class="poster-label" for="aiCode" id="t-secondFactor"></label>
            <input id="aiCode" type="text" autocomplete="one-time-code" spellcheck="false" />
            <p class="hint" id="t-secondFactorHint"></p>
          </div>
          <p class="below"><button class="poster-action" id="signIn"></button></p>
        </div>

        <div id="signedIn" hidden>
          <div class="state-line">
            <span class="poster-chip poster-chip--on" id="signedInAs"></span>
            <button class="poster-action" id="signOut"></button>
          </div>
          <dl class="info poster-box" id="currentAi" hidden>
            <dt id="t-curService"></dt><dd id="curService">--</dd>
            <dt id="t-curModel"></dt><dd id="curModel">--</dd>
            <dt id="t-curAddress"></dt><dd id="curAddress">--</dd>
            <dt id="t-curHealth"></dt><dd id="curHealth">--</dd>
            <dt id="t-curRouting"></dt><dd id="curRouting">--</dd>
          </dl>
        </div>

        <h3 class="poster-label below" id="t-foundTitle"></h3>
        <div id="services"></div>
        <p class="below"><button class="poster-action" id="scan"></button></p>

        <div class="poster-aside" id="t-ollama"></div>
        <p class="below"><button class="poster-action" id="getOllama"></button></p>

        <h3 class="poster-label below" id="t-customTitle"></h3>
        <div class="field">
          <label class="poster-label" for="customUrl" id="t-customUrl"></label>
          <input id="customUrl" type="url" spellcheck="false" placeholder="http://localhost:1234/v1" />
          <p class="hint" id="t-customUrlHint"></p>
        </div>
        <div class="field">
          <label class="poster-label" for="customModel" id="t-customModel"></label>
          <input id="customModel" type="text" spellcheck="false" placeholder="qwen2.5:7b" />
        </div>
        <p class="below"><button class="poster-action" id="saveCustom"></button></p>
      </section>

      <!-- ── Settings ───────────────────────────────────────────────────── -->
      <section class="poster-section">
        <h2 class="poster-section-title" id="t-setTitle"></h2>
        <div class="field">
          <label class="poster-label" for="setId" id="t-setId"></label>
          <input id="setId" type="text" readonly />
          <p class="hint" id="t-setIdHint"></p>
        </div>
        <div class="field">
          <label class="poster-label" for="setPort" id="t-setPort"></label>
          <input id="setPort" type="number" min="1024" max="65535" />
          <p class="hint" id="t-setPortHint"></p>
        </div>
        <div class="field">
          <label class="poster-label" for="setBind" id="t-setBind"></label>
          <select id="setBind">
            <option value="127.0.0.1" id="t-bindLocal"></option>
            <option value="0.0.0.0" id="t-bindNetwork"></option>
            <option value="" id="t-bindAsBefore"></option>
          </select>
          <p class="hint" id="t-setBindHint"></p>
        </div>
        <div class="field">
          <label class="poster-label" for="setRole" id="t-setRole"></label>
          <select id="setRole">
            <option value="standalone" id="t-roleStandalone"></option>
            <option value="personal" id="t-rolePersonal"></option>
            <option value="contributor" id="t-roleContributor"></option>
            <option value="operator" id="t-roleOperator"></option>
          </select>
          <p class="hint" id="t-setRoleHint"></p>
        </div>
        <div class="field">
          <label class="poster-label" for="setGenesis" id="t-setGenesis"></label>
          <input id="setGenesis" type="url" spellcheck="false" placeholder="https://aimeat.io" />
          <p class="hint" id="t-setGenesisHint"></p>
        </div>
        <dl class="info below">
          <dt id="t-setEnc"></dt><dd id="setEnc">--</dd>
        </dl>
        <div class="acts below">
          <button class="poster-action" id="saveSettings"></button>
          <button class="poster-action" id="resetSettings"></button>
        </div>
      </section>

      <!-- ── Log ────────────────────────────────────────────────────────── -->
      <section class="poster-section">
        <h2 class="poster-section-title" id="t-logTitle"></h2>
        <div class="acts">
          <div class="checks">
            <label><input type="checkbox" id="logFollow" checked /><span id="t-logFollow"></span></label>
            <label><input type="checkbox" id="logRefresh" checked /><span id="t-logRefresh"></span></label>
          </div>
          <span class="spacer"></span>
          <button class="poster-action" id="logReload"></button>
          <button class="poster-action danger" id="logClear"></button>
        </div>
        <div class="log" id="log"></div>
      </section>

      <div class="foot">
        <a class="poster-action" href="index.html" id="t-footBack"></a>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="restoreDialog" aria-labelledby="t-restoreTitle">
    <h2 class="poster-section-title" id="t-restoreTitle"></h2>
    <p id="restoreSummary"></p>
    <p class="poster-aside" id="t-restoreReplaces"></p>
    <p class="hint" id="t-restoreRecovery"></p>
    <div class="acts below">
      <button class="poster-action danger" id="confirmRestore"></button>
      <button class="poster-action" id="cancelRestore"></button>
    </div>
  </dialog>

  <script src="server-strings.js"></script>
  <script src="server.js"></script>
  <script src="updates.js"></script>
</body>
</html>

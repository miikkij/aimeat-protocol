[package]
name = "aimeat-desktop"
version = "0.9.0"
description = "AIMEAT Personal Node — Desktop Application"
authors = ["Overscale Solutions Oy"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: a client's config file is the person's own, and re-serializing it must not
# reorder every key they already had. Without this feature serde_json sorts objects
# alphabetically, which turns a one-line addition into a whole-file diff.
serde_json = { version = "1.0", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
age = { version = "0.12.1", default-features = false }
toml_edit = "0.22"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# Personal startup stays in HKCU even when Desktop is launched with elevation.
auto-launch = "0.6.0"
windows-registry = "0.6"

# Keep the real password work factor in debug reviews and tests without running
# cryptographic inner loops as unoptimized debug code.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

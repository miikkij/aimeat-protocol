[package]
name = "aimeat-desktop"
version = "0.8.0"
description = "AIMEAT Personal Node — Desktop Application"
authors = ["Overscale Solutions Oy"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: a client's config file is the person's own, and re-serializing it must not
# reorder every key they already had. Without this feature serde_json sorts objects
# alphabetically, which turns a one-line addition into a whole-file diff.
serde_json = { version = "1.0", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
toml_edit = "0.22"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Heart shape - centered, larger for icon use -->
  <g transform="translate(256, 256)">
    <path d="M0 80 C0 80 -140 -30 -140 -80 C-140 -140 -80 -155 -40 -140 C-15 -130 0 -110 0 -110 C0 -110 15 -130 40 -140 C80 -155 140 -140 140 -80 C140 -30 0 80 0 80 Z"
          fill="url(#heart)" opacity="0.95"/>
    <!-- Circuit nodes -->
    <circle cx="-50" cy="-75" r="10" fill="#fff" opacity="0.85"/>
    <circle cx="50" cy="-75" r="10" fill="#fff" opacity="0.85"/>
    <circle cx="0" cy="-40" r="12" fill="#fff" opacity="0.9"/>
    <circle cx="0" cy="15" r="8" fill="#fff" opacity="0.7"/>
    <!-- Circuit lines -->
    <line x1="-50" y1="-75" x2="0" y2="-40" stroke="#fff" stroke-width="3" opacity="0.6"/>
    <line x1="50" y1="-75" x2="0" y2="-40" stroke="#fff" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="-40" x2="0" y2="15" stroke="#fff" stroke-width="3" opacity="0.5"/>
    <!-- Outer circuit dots -->
    <circle cx="-85" cy="-45" r="6" fill="#fff" opacity="0.5"/>
    <circle cx="85" cy="-45" r="6" fill="#fff" opacity="0.5"/>
    <line x1="-50" y1="-75" x2="-85" y2="-45" stroke="#fff" stroke-width="2" opacity="0.35"/>
    <line x1="50" y1="-75" x2="85" y2="-45" stroke="#fff" stroke-width="2" opacity="0.35"/>
  </g>
</svg>
